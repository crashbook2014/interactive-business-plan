  *{box-sizing:border-box;margin:0;padding:0}

  /* ---- motion layer (additive) ---- */

  /* Reveal on scroll. JS adds .rv, so content is visible without JS. */

  .rv-d1{transition-delay:60ms} .rv-d2{transition-delay:120ms} .rv-d3{transition-delay:180ms}

  .hero-seq>*:nth-child(5){animation-delay:400ms}

  .posline{padding-top:clamp(26px,4vw,54px)}
  .pos{background:var(--card);border:1px solid var(--line);border-radius:var(--r-2xl);
    padding:clamp(24px,4vw,40px) clamp(20px,3.5vw,34px);box-shadow:var(--e1),var(--edge);text-align:center;
    max-width:760px;margin-inline:auto}
  .pos h2{font-size:clamp(22px,3.1vw,33px)}
  .pos .kicker{margin-bottom:10px}
  .pos-who{margin-top:8px;font-size:13.5px;font-weight:700;letter-spacing:.02em;color:var(--ink-2)}
  html[lang="ar"] .pos-who{font-weight:400;font-size:15px}
  .pos-verbs{margin-top:14px;font-size:clamp(15.5px,1.9vw,19px);color:var(--teal-ink);
    line-height:1.9;max-width:46ch;margin-inline:auto;text-wrap:balance}
  .pos .sec-lede{max-width:58ch;margin-inline:auto}

  /* section furniture */
  .kicker{font-size:12px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;
    color:var(--teal);margin-bottom:12px}
  html[lang="ar"] .kicker{font-weight:400;letter-spacing:.06em;font-size:14px}
  h2{font-size:clamp(25px,3.6vw,38px);color:var(--teal-ink)}
  .sec-lede{margin-top:14px;color:var(--ink-2);font-size:clamp(15px,1.7vw,17px);max-width:60ch}

  /* problem */
  .quotes{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:34px}
  .quote{background:var(--card);border:1px solid var(--line);border-radius:var(--r-xl);padding:22px 20px;
    box-shadow:var(--e1),var(--edge)}
  .quote p{font-size:16px;color:var(--ink);line-height:1.85}
  .quote span{display:block;margin-top:12px;font-size:12.5px;color:var(--ink-2)}
  .quote span.quote-fix{margin-top:8px;color:var(--teal-ink);font-weight:600}

  /* steps */
  .steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;margin-top:38px;counter-reset:s}
  .step{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--r-2xl);
    padding:26px 22px;box-shadow:var(--e1),var(--edge)}
  .step::before{counter-increment:s;content:counter(s);position:absolute;top:-14px;inset-inline-start:22px;
    width:30px;height:30px;border-radius:999px;background:var(--teal);color:var(--on-teal);
    display:flex;align-items:center;justify-content:center;font-family:var(--en);font-weight:800;font-size:14px}
  .step h3{font-size:18px;color:var(--teal-ink);margin:8px 0 8px}
  .step p{font-size:14.5px;color:var(--ink-2)}

  /* features */
  .feats{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px;margin-top:38px}
  .feat{background:var(--card);border:1px solid var(--line);border-radius:var(--r-xl);padding:22px 20px;
    box-shadow:var(--e1),var(--edge)}
  .feat .ic{width:40px;height:40px;border-radius:var(--r-sm);background:var(--teal-soft);
    display:flex;align-items:center;justify-content:center;margin-bottom:14px}
  .feat .ic svg{width:20px;height:20px;color:var(--teal)}
  .feat h3{font-size:16.5px;color:var(--teal-ink);margin-bottom:6px}
  /* The one card in the grid that is a preview rather than a shipped feature.
     Outlined rather than filled — .price .tag is filled teal because it marks
     the plan we want chosen, and this marks the opposite: read me last. The
     h3 itself carries no data-t, because applyLang() sets textContent and
     would wipe the span out of its own heading. */
  .feat h3 .soon-tag{display:inline-block;margin-inline-start:8px;vertical-align:2px;
    font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
    color:var(--teal);border:1px solid var(--teal);border-radius:999px;padding:2px 7px}
  html[lang="ar"] .feat h3 .soon-tag{font-weight:400;font-size:12px;letter-spacing:0;text-transform:none}
  .feat p{font-size:14px;color:var(--ink-2)}

  /* pricing */
  .prices{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-top:38px}
  .price{background:var(--card);border:1px solid var(--line);border-radius:var(--r-2xl);padding:24px 20px;
    box-shadow:var(--e1),var(--edge);position:relative}
  .price.hi{border-color:var(--teal);box-shadow:var(--e2),var(--edge)}
  .price .tag{position:absolute;top:-11px;inset-inline-start:20px;background:var(--teal);color:var(--on-teal);
    font-size:11px;font-weight:700;border-radius:999px;padding:3px 11px}
  html[lang="ar"] .price .tag{font-weight:400;font-size:12.5px}
  .price h3{font-size:17px;color:var(--teal-ink)}
  .price .amt{font-family:var(--en);font-size:32px;font-weight:800;letter-spacing:-.03em;color:var(--ink);margin:10px 0 4px}
  .price .amt small{font-size:13px;font-weight:700;color:var(--ink-2);letter-spacing:0;margin-inline-start:5px}
  .price p{font-size:13.5px;color:var(--ink-2)}
  .price .get{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:13px;color:var(--ink)}
  .vat{margin-top:12px;text-align:center;font-size:13px;color:var(--ink-2)}
  .anchor{margin-top:26px;background:var(--teal-soft);border-radius:var(--r-md);padding:14px 18px;
    font-size:14.5px;color:var(--ink);text-align:center}

  /* trust */
  .trust{background:var(--card);border-block:1px solid var(--line)}
  .trust-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:26px;margin-top:32px}
  .trust-item h3{font-size:16.5px;color:var(--teal-ink);margin-bottom:8px;display:flex;align-items:center;gap:9px}
  .trust-item h3 svg{width:18px;height:18px;color:var(--teal);flex:none}
  .trust-item p{font-size:14.5px;color:var(--ink-2)}

  /* faq */
  .faq{margin-top:32px;display:grid;gap:10px}
  details{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);
    box-shadow:var(--e1),var(--edge);overflow:hidden}
  summary{list-style:none;cursor:pointer;padding:17px 20px;font-size:15.5px;color:var(--ink);
    display:flex;align-items:center;gap:12px}
  summary::-webkit-details-marker{display:none}
  summary .m{margin-inline-start:auto;flex:none;width:16px;height:16px;color:var(--ink-2);transition:transform .2s}
  details[open] summary .m{transform:rotate(45deg)}
  details p{padding:0 20px 18px;font-size:14.5px;color:var(--ink-2);line-height:1.85}

  /* close */
  .close{text-align:center}
  .close h2{margin-bottom:16px}
  .close p{color:var(--ink-2);max-width:52ch;margin:0 auto 26px;font-size:16px}
  footer{border-top:1px solid var(--line);padding:30px 0 46px;text-align:center;font-size:12.5px;color:var(--ink-2)}
  footer .fb{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:10px}
  footer .fb svg{width:18px;height:18px}
  /* WRAPS, because it is a row of links and there is no fixed number of them.
     Without flex-wrap these eight sat on one unwrappable line: 364px of links
     in a 360px viewport before launch, and 392px after, because lifting the
     curtain made a ninth-in-waiting — the .launch-only "open the app" link —
     visible for the first time. The body's overflow-x:hidden meant nobody saw
     it happen; the row was simply cut off at the edge of the screen, and the
     last link in Arabic sat entirely outside it. A hider is not a fix, and a
     defect it conceals gets worse for free every time a link is added. */
  .foot-links{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 20px;margin-top:14px}
  .foot-id{margin-top:14px;font-size:12px;line-height:1.7;color:var(--ink-2);opacity:.9;max-width:78ch;margin-inline:auto}
  .foot-links a{color:var(--teal);font-weight:700;text-decoration:underline;
    text-underline-offset:3px;text-decoration-thickness:1px}
  .foot-links a:hover{color:var(--teal-ink)}
  .price-go{margin-top:26px;text-align:center}
  .free-now{margin:26px auto 0;max-width:62ch;background:var(--teal-soft);border:1px solid var(--teal);
    border-radius:var(--r-xl);padding:16px 20px;text-align:start}
  .free-now b{display:block;font-size:16.5px;color:var(--teal-ink);margin-bottom:4px}
  .free-now p{font-size:14px;color:var(--ink);line-height:1.8}
  /* THE CURTAIN — see the head script. `.launch-only` is everything that only
     makes sense once people can actually use the thing; `.soon-only` is the
     pre-launch framing. Exactly one of the two is visible, never both, and the
     class is on <html> so it is decided before the first paint. */
  .soon-only{display:none}
  html.soon .soon-only{display:revert}
  html.soon .launch-only{display:none}

  /* Contact. Three ways to reach a human, sized for a thumb. WhatsApp leads
     because in this market it is the one people actually use. */
  .contact-acts{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:26px}
  .contact-acts .btn{min-height:52px;display:inline-flex;align-items:center;gap:10px;font-size:16px}
  .contact-acts .btn svg{width:20px;height:20px;flex:none}
  .btn.wa{background:#25D366;color:#06301A;border-color:#25D366}
  .btn.wa:hover{background:#1FBF5B;border-color:#1FBF5B}
  .contact-num{margin-top:18px;font-size:20px;font-weight:700;letter-spacing:.02em;direction:ltr;
    display:block;text-align:center}
  .contact-mail{margin-top:6px;font-size:15px;direction:ltr;display:block;text-align:center}
  /* Scoped under html.soon deliberately. As a bare `.soon-badge` rule it has
     the same specificity as `.soon-only{display:none}` and sits later in the
     sheet, so it won — and the badge stayed on screen after launch. */
  html.soon .soon-badge{display:inline-flex;align-items:center;gap:8px}
  .soon-badge::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--teal);
    animation:soonPulse 2.2s ease-in-out infinite}
  @keyframes soonPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.8)}}
  @media (prefers-reduced-motion:reduce){.soon-badge::before{animation:none}}

  /* ---- design pass, Sep 2026 -------------------------------------------
     Kept together at the end of the sheet so it reads as one change and
     comes out as one change. */

  /* Buttons were underlined: `a{color:inherit}` left the browser's default
     text-decoration on every anchor, including the ones drawn as buttons,
     which made the primary actions read as plain links. */
  .btn,.nav-link,.lang,.contact-num,.contact-mail{text-decoration:none}
  .nav-link{color:var(--ink-2);font-size:14px}
  .contact-num{color:var(--teal-ink)} .contact-mail{color:var(--teal)}
  .contact-num:hover,.contact-mail:hover{text-decoration:underline;text-underline-offset:3px}

  /* ---- Hero: the page is a contract, and Wodouh is reading it with you.
     A sheet of an employment contract carries the three clauses the app's
     own sample flags, with a highlighter pass over each in its severity
     colour and a margin note in the app's own words. The score is a seal
     stamped on the sheet. Under the headline a signature draws itself — the
     moment this page is about, before it happens. The clause text is the
     app's SAMPLES.employment quotes verbatim, so the picture is still a
     promise the first click keeps. */
  .hero h1{font-size:clamp(34px,5.8vw,62px);line-height:1.22}
  .hero h1 .h1-accent{display:block;color:var(--teal)}
  .sig{display:block;width:min(300px,70%);height:38px;margin-top:4px;color:var(--teal);overflow:visible}
  @media (max-width:880px){ .sig{margin-inline:auto} }
  .sig path{fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;
    stroke-dasharray:640;stroke-dashoffset:640;animation:sign 1.6s .9s cubic-bezier(.45,.05,.25,1) forwards}
  html[dir="rtl"] .sig{transform:scaleX(-1)}
  @keyframes sign{to{stroke-dashoffset:0}}

  .kinds{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px;list-style:none}
  @media (max-width:880px){ .kinds{justify-content:center} }
  .kinds li{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;color:var(--ink);
    background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 12px;box-shadow:var(--e1)}
  html[lang="ar"] .kinds li{font-size:14.5px}
  .kinds li::before{content:"";width:7px;height:7px;border-radius:50%;flex:none}
  .kinds li:nth-child(1)::before{background:var(--teal)} .kinds li:nth-child(2)::before{background:var(--amber)}
  .kinds li:nth-child(3)::before{background:var(--green)} .kinds li:nth-child(4)::before{background:var(--red)}

  /* Pricing: four across, and the bundle as one wide card under them.
     auto-fit put four in a row and left the bundle alone on a second row,
     which read as an afterthought — the opposite of "best value". */
  @media (min-width:1000px){
    .prices{grid-template-columns:repeat(4,1fr)}
    .price.bundle{grid-column:1/-1;display:grid;grid-template-columns:1.1fr auto 1.6fr;
      column-gap:28px;align-items:center;padding:28px 26px}
    .price.bundle .amt{margin:0}
    .price.bundle p{margin:0}
    .price.bundle .get{margin:6px 0 0;padding-top:6px}
    .price.bundle > h3{grid-column:1} .price.bundle > .amt{grid-column:2;grid-row:1 / span 2}
    .price.bundle > p:not(.get){grid-column:3;grid-row:1} .price.bundle > .get{grid-column:3;grid-row:2;border-top:0}
  }
  .price.bundle{background:var(--teal-soft);border-color:var(--teal)}
  .price.hi{transform:translateY(-4px)}
  /* "مجاني" is Arabic set in the numeral font; give it an Arabic face. */
  .price .amt{font-family:'Nunito','Noto Naskh Arabic',sans-serif}

  /* the sheet */
  .shot.paper{background:none;border:0;box-shadow:none;padding:0;max-width:470px;position:relative}
  .sheet{position:relative;background:var(--card);border:1px solid var(--line);border-radius:6px;
    padding:26px 24px 22px;box-shadow:0 24px 60px rgba(74,60,40,.16),0 2px 6px rgba(74,60,40,.06);
    background-image:repeating-linear-gradient(to bottom, transparent 0 33px, rgba(190,173,136,.18) 33px 34px);
    background-position:0 58px}
  .sheet::before{content:"";position:absolute;inset:10px -10px -10px 10px;z-index:-1;background:var(--card);
    border:1px solid var(--line);border-radius:6px;transform:rotate(2.2deg);box-shadow:var(--e2)}
  @media (max-width:880px){ .sheet::before{inset:8px 3px -8px 3px;transform:rotate(1deg)} }
  @media (min-width:881px){ .sheet{transform:rotate(-1.4deg)} html[dir="ltr"] .sheet{transform:rotate(1.4deg)} }
  .paper-head{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1.5px solid var(--ink);
    padding-bottom:8px;margin-bottom:16px}
  .paper-head b{font-size:18px;color:var(--ink)}
  .paper-head span{font-family:var(--en);font-size:11px;letter-spacing:.08em;color:var(--ink-2)}
  .clause{position:relative;display:grid;grid-template-columns:22px 1fr;gap:8px;margin-bottom:14px}
  .clause .no{font-family:var(--en);font-weight:800;font-size:12px;color:var(--ink-2);padding-top:6px}
  .clause p{font-size:15px;line-height:2.05;color:var(--ink)}
  html[lang="en"] .clause p{font-size:13.5px;line-height:1.95}
  .clause mark{color:inherit;background-color:transparent;padding:1px 2px;border-radius:3px;background-repeat:no-repeat;
    background-size:0% 100%;background-position:100% 0;animation:hl .9s var(--ease-out) forwards;
    -webkit-box-decoration-break:clone;box-decoration-break:clone}
  html[dir="ltr"] .clause mark{background-position:0 0}
  .clause.red mark{background-image:linear-gradient(rgba(180,84,74,.30),rgba(180,84,74,.30));animation-delay:1.1s}
  .clause.amber mark{background-image:linear-gradient(rgba(168,120,34,.30),rgba(168,120,34,.30));animation-delay:1.7s}
  .clause.green mark{background-image:linear-gradient(rgba(71,131,83,.26),rgba(71,131,83,.26));animation-delay:2.3s}
  @keyframes hl{to{background-size:100% 100%}}
  /* the margin notes: in the margin on a wide screen, under the clause on a phone */
  .note{display:inline-flex;align-items:center;gap:7px;margin-top:4px;grid-column:2;justify-self:start;
    font-size:12.5px;border-radius:8px;padding:4px 10px;opacity:0;transform:translateY(4px);
    animation:note-in .45s var(--ease-out) forwards;box-shadow:var(--e1)}
  .note b{font-weight:700} html[lang="ar"] .note b{font-weight:400}
  .note i{font-style:normal;opacity:.85}
  .note i::before{content:"· "}
  .clause.red .note{background:var(--red-bg);color:var(--red);animation-delay:1.5s}
  .clause.amber .note{background:var(--amber-bg);color:var(--amber-ink);animation-delay:2.1s}
  .clause.green .note{background:var(--green-bg);color:var(--green-ink);animation-delay:2.7s}
  @keyframes note-in{to{opacity:1;transform:none}}
  .paper-foot{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-top:18px}
  .sign-line{flex:1;border-top:1.5px dashed var(--ink-2);padding-top:6px;font-size:12px;color:var(--ink-2)}
  /* the seal */
  .seal{flex:none;width:112px;height:112px;border-radius:50%;display:grid;place-items:center;position:relative;
    border:2.5px solid var(--teal);color:var(--teal);transform:rotate(-9deg) scale(1.6);opacity:0;
    animation:stamp .38s 3s cubic-bezier(.2,1.4,.4,1) forwards;background:color-mix(in srgb,var(--card) 88%,var(--teal-soft))}
  .seal::before{content:"";position:absolute;inset:6px;border-radius:50%;border:1px dashed var(--teal);opacity:.6}
  @keyframes stamp{to{opacity:1;transform:rotate(-9deg) scale(1)}}
  .seal .ring{width:84px;height:84px;margin:0}
  .seal .ring svg{width:100%;height:100%}
  .seal .ring .num b{font-size:27px}
  .seal .ring .num i{font-size:9px}
  .verdict-note{margin-top:12px;font-size:13.5px;color:var(--teal-ink);line-height:1.8}
  .verdict-note::before{content:"✎  ";color:var(--teal)}

  /* Every section heading is a clause of the page's own contract. */
  main{counter-reset:clause}
  main > section:not(.hero) .kicker{counter-increment:clause}
  html[lang="ar"] main > section:not(.hero) .kicker::before{content:"البند " counter(clause) " · ";opacity:.7}
  html[lang="en"] main > section:not(.hero) .kicker::before{content:"Clause " counter(clause) " · ";opacity:.7}

  @media (prefers-reduced-motion: reduce){
    .sig path{animation:none;stroke-dashoffset:0}
    .clause mark{animation:none;background-size:100% 100%}
    .note,.seal{animation:none;opacity:1;transform:none}
    .seal{transform:rotate(-9deg)}
  }

  /* ---- The rest of the page as the same annotated contract ---------------
     One motif carried through: paper, highlighter, margin notes, stamps and a
     signature. Rotations use the independent `rotate` property so they never
     fight the reveal's `transform`, and only on wide screens, where a tilted
     card cannot push past the edge of a phone. */

  /* Every section heading gets a highlighter pass when it scrolls in. */
  h2 .hl{background-image:linear-gradient(color-mix(in srgb,var(--amber) 26%,transparent),color-mix(in srgb,var(--amber) 26%,transparent));
    background-repeat:no-repeat;background-position:100% 88%;background-size:0% 34%;
    -webkit-box-decoration-break:clone;box-decoration-break:clone;padding:0 3px;
    transition:background-size .9s .25s var(--ease-out)}
  html[dir="ltr"] h2 .hl{background-position:0 88%}
  h2.in .hl,h2:not(.rv) .hl{background-size:100% 34%}

  /* 1 · the preamble: a cover page, double rule on top */
  .pos{border-radius:6px;border-top:4px double var(--ink);
    background-image:repeating-linear-gradient(to bottom,transparent 0 33px,rgba(190,173,136,.14) 33px 34px)}

  /* 2 · the problem: the things people tell us, pinned up as notes */
  .quote{border-radius:4px;position:relative;padding-top:30px}
  .quote::before{content:"";position:absolute;top:-9px;left:50%;width:76px;height:20px;margin-left:-38px;
    background:color-mix(in srgb,var(--amber-bg) 80%,transparent);border:1px solid rgba(168,120,34,.18);rotate:-3deg}
  @media (min-width:881px){
    .quote:nth-child(1){rotate:1.2deg} .quote:nth-child(2){rotate:-.8deg} .quote:nth-child(3){rotate:.9deg}
  }

  /* 3 · how it works: numbered sub-clauses on one dotted rule */
  .steps{position:relative}
  @media (min-width:881px){
    .steps::before{content:"";position:absolute;top:0;inset-inline:60px;border-top:2px dashed var(--line)}
  }
  .step{border-radius:6px}
  .step::before{border-radius:6px;rotate:-6deg;box-shadow:0 0 0 4px var(--sand)}

  /* 4 · what you get: each feature a clause on ruled paper, corner folded */
  .feat{border-radius:6px;position:relative;
    background-image:repeating-linear-gradient(to bottom,transparent 0 27px,rgba(190,173,136,.13) 27px 28px);
    background-position:0 70px}
  .feat::after{content:"";position:absolute;top:-1px;inset-inline-end:-1px;width:22px;height:22px;
    background:linear-gradient(225deg,var(--sand) 50%,color-mix(in srgb,var(--line) 55%,var(--card)) 50%);
    border-bottom-left-radius:4px;box-shadow:-1px 1px 2px rgba(74,60,40,.08)}
  html[dir="rtl"] .feat::after{background:linear-gradient(135deg,var(--sand) 50%,color-mix(in srgb,var(--line) 55%,var(--card)) 50%);
    border-bottom-left-radius:0;border-bottom-right-radius:4px;box-shadow:1px 1px 2px rgba(74,60,40,.08)}

  /* 5 · pricing: a schedule of fees — tickets with a perforation, the bundle
     stamped rather than tagged, the free-now line as a memo clipped on top */
  .price{border-radius:6px}
  .price .get{border-top:2px dashed var(--line)}
  .price .tag{background:var(--card);color:var(--teal);border:2px solid var(--teal);border-radius:4px;
    rotate:-5deg;font-weight:800;letter-spacing:.04em;box-shadow:0 0 0 3px var(--card)}
  .free-now{border-style:dashed;border-radius:6px;position:relative}
  .free-now::before{content:"";position:absolute;top:-12px;inset-inline-start:26px;width:14px;height:30px;
    border:2.5px solid var(--ink-2);border-radius:8px;border-bottom-color:transparent;opacity:.55}

  /* 6 · trust: a declaration, signed */
  .attest{display:flex;align-items:flex-end;justify-content:flex-end;gap:14px;margin-top:34px;color:var(--teal)}
  .attest .signed{display:flex;flex-direction:column;align-items:center;min-width:200px}
  .attest .sig{width:180px;height:34px;margin:0 0 2px}
  .attest .by{display:flex;align-items:center;justify-content:center;gap:8px;align-self:stretch;border-top:1.5px dashed var(--ink-2);padding-top:8px;
    font-size:13px;color:var(--ink-2)}
  .attest .by svg{width:18px;height:18px}
  .attest .sig path{animation:none;stroke-dashoffset:640;transition:stroke-dashoffset 1.6s .2s cubic-bezier(.45,.05,.25,1)}
  .attest.in .sig path,.attest:not(.rv) .sig path{stroke-dashoffset:0}

  /* 7 · questions: footnotes, not a stack of cards */
  .faq{counter-reset:fn;gap:0;border-top:1.5px solid var(--ink)}
  details{background:none;border:0;border-bottom:1px solid var(--line);border-radius:0;box-shadow:none}
  summary{padding:18px 4px}
  summary::before{counter-increment:fn;content:counter(fn);font-family:var(--en);font-size:11px;font-weight:800;
    color:var(--teal);border:1.5px solid var(--teal);border-radius:50%;width:22px;height:22px;flex:none;
    display:inline-flex;align-items:center;justify-content:center}
  details p{padding:0 38px 18px 4px}
  html[dir="rtl"] details p{padding:0 4px 18px 38px}

  /* 9 · the close: the signature block the whole page has been leading to */
  .close .wrap{max-width:720px;background:var(--card);border:1px solid var(--line);border-radius:6px;
    padding:clamp(28px,5vw,48px) clamp(20px,4vw,40px);box-shadow:var(--e2),var(--edge);position:relative;
    background-image:repeating-linear-gradient(to bottom,transparent 0 33px,rgba(190,173,136,.14) 33px 34px)}
  .close .btn{position:relative}
  .sign-here{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:22px;color:var(--ink-2)}
  .sign-here::before,.sign-here::after{content:"";height:0;flex:1;max-width:160px;border-top:1.5px dashed var(--ink-2)}
  .sign-here svg{width:22px;height:22px;color:var(--teal)}
</style>
