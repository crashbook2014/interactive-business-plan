  :root{
    --teal:#1E6E64; --teal-ink:#134B44; --teal-soft:#DCE9E6;
    --sand:#F7F1E6; --card:#FDFAF3; --page:#EFE7D8;

    --e1:0 1px 2px rgba(74,60,40,.05), 0 1px 1px rgba(74,60,40,.03);
    --e2:0 2px 6px rgba(74,60,40,.055), 0 10px 24px rgba(74,60,40,.045);
    --e3:0 18px 44px rgba(74,60,40,.11);
    --edge:inset 0 1px 0 rgba(255,255,255,.6);
    --r-sm:10px; --r-md:14px; --r-lg:18px; --r-xl:22px; --r-2xl:28px;
    --en:'Nunito','Avenir Next Rounded','Segoe UI',-apple-system,sans-serif;
    --ar:'Noto Naskh Arabic','Geeza Pro','Amiri',serif;
    /* Same rhythm as the app: entrances decelerate, confirmations overshoot. */
    --t-fast:160ms; --t:240ms; --t-slow:360ms;
    --ease-out:cubic-bezier(.22,.72,.28,1);
    --ease-spring:cubic-bezier(.22,1.2,.36,1);
    --ease-move:cubic-bezier(.4,0,.2,1);
  }
  @media (prefers-color-scheme: dark){

  }

      --green:#6BAE78;--green-bg:#1A2A1E;--green-ink:#87C094;--ink:#EDE6D8;--ink-2:#A3ABA6;
      --line:#2B3633;--on-teal:#0F1614;

      --e3:0 20px 48px rgba(0,0,0,.55);--edge:inset 0 1px 0 rgba(255,255,255,.045)}
  :root[data-theme="light"]{--teal:#1E6E64;--teal-ink:#134B44;--teal-soft:#DCE9E6;--sand:#F7F1E6;
      --card:#FDFAF3;--page:#EFE7D8;--amber:#C9922E;--amber-bg:#F6EAD2;--amber-ink:#8A6114;
      --red:#B4544A;--red-bg:#F3DFDC;--green:#4E8F5B;--green-bg:#E2EEE2;--green-ink:#33663D;
      --ink:#2B3230;--ink-2:#5A625F;--line:#E8DFCE;--on-teal:#F7F1E6;
      --e1:0 1px 2px rgba(74,60,40,.05), 0 1px 1px rgba(74,60,40,.03);
      --e2:0 2px 6px rgba(74,60,40,.055), 0 10px 24px rgba(74,60,40,.045);
      --e3:0 18px 44px rgba(74,60,40,.11);--edge:inset 0 1px 0 rgba(255,255,255,.6)}

  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  html[lang="ar"] body{font-family:var(--ar)} html[lang="en"] body{font-family:var(--en)}
  body{background:var(--sand);color:var(--ink);line-height:1.75;-webkit-font-smoothing:antialiased;
       text-rendering:optimizeLegibility;font-kerning:normal;overflow-x:hidden}
  h1,h2,h3{text-wrap:balance;line-height:1.35}
  html[lang="en"] h1,html[lang="en"] h2{letter-spacing:-.018em}
  a{color:inherit}
  button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
  :focus-visible{outline:2px solid var(--teal);outline-offset:3px;border-radius:8px}
  ::selection{background:color-mix(in srgb, var(--teal) 22%, transparent)}
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important;
      scroll-behavior:auto !important}
  }
  .wrap{max-width:1080px;margin:0 auto;padding:0 22px}
  section{padding:clamp(56px,8vw,104px) 0}

  /* ---- motion layer (additive) ---- */

  /* Reveal on scroll. JS adds .rv, so content is visible without JS. */
  .rv{opacity:0;transform:translateY(22px)}
  .rv.in{opacity:1;transform:none;
    transition:opacity var(--t-slow) var(--ease-out),transform var(--t-slow) var(--ease-out)}
  .rv-d1{transition-delay:60ms} .rv-d2{transition-delay:120ms} .rv-d3{transition-delay:180ms}

  /* Hero arrives in sequence rather than all at once */
  .hero-seq>*{opacity:0;transform:translateY(18px);
    animation:hero-in var(--t-slow) var(--ease-out) forwards}
  .hero-seq>*:nth-child(1){animation-delay:80ms}
  .hero-seq>*:nth-child(2){animation-delay:160ms}
  .hero-seq>*:nth-child(3){animation-delay:240ms}
  .hero-seq>*:nth-child(4){animation-delay:320ms}
  .hero-seq>*:nth-child(5){animation-delay:400ms}
  @keyframes hero-in{to{opacity:1;transform:none}}
  .shot{animation:shot-in 560ms var(--ease-spring) 200ms both}
  @keyframes shot-in{from{opacity:0;transform:translateY(26px) scale(.97)}to{opacity:1;transform:none}}

  /* Nav condenses once you leave the hero */
  .nav{transition:height var(--t) var(--ease-move),box-shadow var(--t) var(--ease-out),
       background var(--t) var(--ease-out)}
  .nav .wrap{transition:height var(--t) var(--ease-move)}
  .nav.tight .wrap{height:56px}
  .nav.tight{box-shadow:var(--e1)}
  .brand svg,.brand .ar{transition:transform var(--t) var(--ease-move)}
  .nav.tight .brand svg{transform:scale(.88)}

  /* Cards lift on hover, compress on press — depth reads as physical */
  .quote,.step,.feat,.price,details{transition:transform var(--t-fast) var(--ease-spring),
    box-shadow var(--t-fast) var(--ease-out),border-color var(--t-fast) var(--ease-out)}
  @media (hover:hover){
    .quote:hover,.step:hover,.feat:hover,.price:hover{transform:translateY(-3px);box-shadow:var(--e2),var(--edge)}
  }
  .btn:active{transform:scale(.97)}
  .price:active,.feat:active{transform:scale(.99)}

  /* FAQ opens smoothly — details does not animate on its own */
  details .ans{display:grid;grid-template-rows:0fr;
    transition:grid-template-rows var(--t) var(--ease-move)}
  details[open] .ans{grid-template-rows:1fr}
  details .ans>div{overflow:hidden}
  summary{transition:color var(--t-fast) var(--ease-out)}
  summary:hover{color:var(--teal)}

  /* Score rows draw their ticks in as the card arrives */
  .shot .row{opacity:0;transform:translateX(calc(var(--dir,1) * -10px));
    animation:row-in var(--t) var(--ease-out) forwards}
  .shot .row:nth-of-type(1){animation-delay:620ms}
  .shot .row:nth-of-type(2){animation-delay:700ms}
  .shot .row:nth-of-type(3){animation-delay:780ms}
  @keyframes row-in{to{opacity:1;transform:none}}

  /* Parallax on the hero card — decorative, capped */
  .shot{will-change:transform}

  @media (prefers-reduced-motion: reduce){
    .rv,.rv.in,.hero-seq>*,.shot,.shot .row{
      opacity:1 !important;transform:none !important;animation:none !important;transition:none !important}
    details .ans{grid-template-rows:1fr !important;transition:none !important}
    .quote:hover,.step:hover,.feat:hover,.price:hover{transform:none !important}
  }

  /* nav */
  .nav{position:sticky;top:0;z-index:20;background:color-mix(in srgb, var(--sand) 86%, transparent);
    backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
  @supports not (backdrop-filter: blur(4px)){ .nav{background:var(--sand)} }
  .nav .wrap{display:flex;align-items:center;justify-content:space-between;height:66px}
  .brand{display:flex;align-items:center;gap:10px}
  .brand svg{width:30px;height:30px}
  .brand .ar{font-family:var(--ar);font-size:21px;color:var(--teal-ink);line-height:1}
  .brand .en{font-family:var(--en);font-size:9.5px;font-weight:800;letter-spacing:.22em;
    text-transform:uppercase;color:var(--teal)}
  .nav-act{display:flex;align-items:center;gap:8px}
  .nav-link{font-size:13.5px;font-weight:700;color:var(--ink-2);padding:7px 6px;border-radius:8px;
    transition:color var(--t-fast) var(--ease-out)}
  .nav-link:hover{color:var(--teal-ink)}
  @media (max-width:520px){ .nav-link{display:none} }
  .lang{font-size:13px;font-weight:700;color:var(--teal);background:var(--teal-soft);
    border-radius:999px;padding:7px 14px}
  html[lang="en"] .lang{font-family:var(--ar);font-weight:400;font-size:15px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--teal);
    color:var(--on-teal);border-radius:var(--r-md);padding:12px 20px;font-size:14.5px;font-weight:700;
    box-shadow:var(--e2);transition:box-shadow .2s,transform .12s;white-space:nowrap}
  html[lang="ar"] .btn{font-weight:400;font-size:16px}
  .btn:hover{box-shadow:var(--e3)} .btn:active{transform:scale(.98)}
  .btn.ghost{background:none;color:var(--teal);border:1.5px solid var(--teal);box-shadow:none}

  /* hero */
  .hero{padding-top:clamp(44px,6vw,80px)}
  .hero .wrap{display:grid;grid-template-columns:1.05fr .95fr;gap:clamp(30px,5vw,64px);align-items:center}
  @media (max-width:880px){ .hero .wrap{grid-template-columns:1fr;text-align:center} }
  .eyebrow{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--teal);
    background:var(--teal-soft);border-radius:999px;padding:6px 14px;margin-bottom:20px}
  .eyebrow svg{width:14px;height:14px}
  .hero h1{font-size:clamp(31px,5.4vw,54px);color:var(--teal-ink)}
  .hero .lede{margin-top:18px;font-size:clamp(16px,2vw,19px);color:var(--ink-2);max-width:52ch}
  @media (max-width:880px){ .hero .lede{margin-inline:auto} }
  .hero-cta{display:flex;gap:11px;margin-top:28px;flex-wrap:wrap}
  @media (max-width:880px){ .hero-cta{justify-content:center} }
  .hero-note{margin-top:16px;font-size:12.5px;color:var(--ink-2);display:flex;align-items:center;gap:7px}
  @media (max-width:880px){ .hero-note{justify-content:center} }
  .hero-note svg{width:14px;height:14px;color:var(--teal)}

  /* the score card as hero object */
  .shot{background:var(--card);border:1px solid var(--line);border-radius:var(--r-2xl);
    padding:26px 22px 20px;box-shadow:var(--e3),var(--edge);max-width:360px;margin-inline:auto;width:100%}
  .shot .mark{display:flex;align-items:center;justify-content:center;gap:8px;padding-bottom:14px;
    margin-bottom:16px;border-bottom:1px solid var(--line)}
  .shot .mark svg{width:16px;height:16px}
  .shot .mark span{font-family:var(--en);font-size:9.5px;font-weight:800;letter-spacing:.22em;
    text-transform:uppercase;color:var(--teal)}
  .ring{width:124px;height:124px;margin:0 auto 12px;position:relative}
  .ring svg{transform:rotate(-90deg);overflow:visible}
  .ring .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .ring .num b{font-family:var(--en);font-size:37px;font-weight:800;letter-spacing:-.03em;color:var(--teal);line-height:1}
  .ring .num i{font-style:normal;font-size:10.5px;color:var(--ink-2);font-family:var(--en);letter-spacing:.06em;margin-top:3px}
  .shot .verdict{text-align:center;font-size:16.5px;color:var(--ink);line-height:1.7}
  .shot .rows{display:grid;gap:8px;margin-top:16px}
  .row{display:flex;align-items:center;gap:10px;border-radius:var(--r-md);padding:11px 13px}
  .row .dot{flex:none;width:23px;height:23px;border-radius:999px;display:flex;align-items:center;justify-content:center}
  .row .dot svg{width:12px;height:12px}
  .row b{font-size:13.5px;color:var(--ink);font-weight:700}
  html[lang="ar"] .row b{font-weight:400;font-size:15px}
  .row.red{background:var(--red-bg)} .row.red .dot{background:var(--red)}
  .row.amber{background:var(--amber-bg)} .row.amber .dot{background:var(--amber)}
  .row.green{background:var(--green-bg)} .row.green .dot{background:var(--green)}

  /* section furniture */
  .kicker{font-size:12px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;
    color:var(--teal);margin-bottom:12px}
  html[lang="ar"] .kicker{font-weight:400;letter-spacing:.06em;font-size:14px}
  h2{font-size:clamp(25px,3.6vw,38px);color:var(--teal-ink)}
  .sec-lede{margin-top:14px;color:var(--ink-2);font-size:clamp(15px,1.7vw,17px);max-width:60ch}

  /* problem */
  .quotes{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:34px}
  .quote{background:var(--card);border:1px solid var(--line);border-radius:var(--r-xl);padding:22px 20px;
    box-shadow:var(--e1),var(--edge)}
  .quote p{font-size:16px;color:var(--ink);line-height:1.85}
  .quote span{display:block;margin-top:12px;font-size:12.5px;color:var(--ink-2)}

  /* steps */
  .steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;margin-top:38px;counter-reset:s}
  .step{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--r-2xl);
    padding:26px 22px;box-shadow:var(--e1),var(--edge)}
  .step::before{counter-increment:s;content:counter(s);position:absolute;top:-14px;inset-inline-start:22px;
    width:30px;height:30px;border-radius:999px;background:var(--teal);color:var(--on-teal);
    display:flex;align-items:center;justify-content:center;font-family:var(--en);font-weight:800;font-size:14px}
  .step h3{font-size:18px;color:var(--teal-ink);margin:8px 0 8px}
  .step p{font-size:14.5px;color:var(--ink-2)}

  /* features */
  .feats{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px;margin-top:38px}
  .feat{background:var(--card);border:1px solid var(--line);border-radius:var(--r-xl);padding:22px 20px;
    box-shadow:var(--e1),var(--edge)}
  .feat .ic{width:40px;height:40px;border-radius:var(--r-sm);background:var(--teal-soft);
    display:flex;align-items:center;justify-content:center;margin-bottom:14px}
  .feat .ic svg{width:20px;height:20px;color:var(--teal)}
  .feat h3{font-size:16.5px;color:var(--teal-ink);margin-bottom:6px}
  .feat p{font-size:14px;color:var(--ink-2)}

  /* pricing */
  .prices{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-top:38px}
  .price{background:var(--card);border:1px solid var(--line);border-radius:var(--r-2xl);padding:24px 20px;
    box-shadow:var(--e1),var(--edge);position:relative}
  .price.hi{border-color:var(--teal);box-shadow:var(--e2),var(--edge)}
  .price .tag{position:absolute;top:-11px;inset-inline-start:20px;background:var(--teal);color:var(--on-teal);
    font-size:11px;font-weight:700;border-radius:999px;padding:3px 11px}
  html[lang="ar"] .price .tag{font-weight:400;font-size:12.5px}
  .price h3{font-size:17px;color:var(--teal-ink)}
  .price .amt{font-family:var(--en);font-size:32px;font-weight:800;letter-spacing:-.03em;color:var(--ink);margin:10px 0 4px}
  .price .amt small{font-size:13px;font-weight:700;color:var(--ink-2);letter-spacing:0;margin-inline-start:5px}
  .price p{font-size:13.5px;color:var(--ink-2)}
  .price .get{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:13px;color:var(--ink)}
  .vat{margin-top:12px;text-align:center;font-size:13px;color:var(--ink-2)}
  .anchor{margin-top:26px;background:var(--teal-soft);border-radius:var(--r-md);padding:14px 18px;
    font-size:14.5px;color:var(--ink);text-align:center}

  /* trust */
  .trust{background:var(--card);border-block:1px solid var(--line)}
  .trust-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:26px;margin-top:32px}
  .trust-item h3{font-size:16.5px;color:var(--teal-ink);margin-bottom:8px;display:flex;align-items:center;gap:9px}
  .trust-item h3 svg{width:18px;height:18px;color:var(--teal);flex:none}
  .trust-item p{font-size:14.5px;color:var(--ink-2)}

  /* faq */
  .faq{margin-top:32px;display:grid;gap:10px}
  details{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);
    box-shadow:var(--e1),var(--edge);overflow:hidden}
  summary{list-style:none;cursor:pointer;padding:17px 20px;font-size:15.5px;color:var(--ink);
    display:flex;align-items:center;gap:12px}
  summary::-webkit-details-marker{display:none}
  summary .m{margin-inline-start:auto;flex:none;width:16px;height:16px;color:var(--ink-2);transition:transform .2s}
  details[open] summary .m{transform:rotate(45deg)}

let lang = "ar";
const t = k => T[k][lang];

function applyLang(){
  document.documentElement.lang = lang;
  if (typeof setDir === "function") setDir();
  document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  document.title = lang === "ar" ? "وضوح — اقرأ عقدك قبل ما توقّع" : "Wodouh — read your contract before you sign";
  document.getElementById("langBtn").textContent = lang === "ar" ? "English" : "عربي";
  document.querySelectorAll("[data-t]").forEach(el => { el.textContent = t(el.dataset.t); });
  const sar = lang === "ar" ? "ر.س" : "SAR";
  document.getElementById("p2a").innerHTML = (lang==="ar" ? "٦٥" : "65") + `<small>${sar}</small>`;
  document.getElementById("p4a").innerHTML = (lang==="ar" ? "١٣٠" : "130") + `<small>${sar}</small>`;
  document.getElementById("p3a").innerHTML = (lang==="ar" ? "٣٢٥" : "325") + `<small>${sar}</small>`;
  document.getElementById("faq").innerHTML = T.faq[lang].map(([q,a]) =>
    `<details><summary>${q}<svg class="m" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg></summary><div class="ans"><div><p>${a}</p></div></div></details>`
  ).join("");
}
function toggleLang(){ lang = lang === "ar" ? "en" : "ar"; applyLang(); }

/* ---- motion layer: additive, and never a prerequisite for content ---- */
const REDUCED = window.matchMedia("(prefers-reduced-motion: reduce)");

/* Reveal on scroll. Elements are visible in markup; JS opts them in, so a
   failure here can never hide a section. */
let revealIO = null;
function armReveals(){
  if (REDUCED.matches || !("IntersectionObserver" in window)) return;
  revealIO = new IntersectionObserver(es=>es.forEach(e=>{
    if (e.isIntersecting){ e.target.classList.add("in"); revealIO.unobserve(e.target); }
  }), { threshold:.12, rootMargin:"0px 0px -8% 0px" });
  document.querySelectorAll("section:not(.hero) .kicker, section:not(.hero) h2, .sec-lede, .quote, .step, .feat, .price, .anchor, .vat, .trust-item, details, .close h2, .close p, .close .btn")
    .forEach((el,i)=>{
      if (el.getBoundingClientRect().top < window.innerHeight * 0.9){ el.classList.add("rv","in"); return; }
      el.classList.add("rv");
      const within = i % 3;
      if (within) el.classList.add("rv-d" + within);
      revealIO.observe(el);
    });
}

/* Safety net: on a very short viewport, or under fast or programmatic
   scrolling, the observer can coalesce past an element taller than the screen
   and leave it invisible for good. Content visibility must never depend on how
   quickly someone scrolls, so anything whose top has reached the viewport is
   revealed regardless of observer timing. */
let sweepQueued = false;
function sweepReveals(){
  sweepQueued = false;
  document.querySelectorAll(".rv:not(.in)").forEach(el=>{
    if (el.getBoundingClientRect().top < window.innerHeight){
      el.classList.add("in");
      if (revealIO) revealIO.unobserve(el);
    }
  });
}
function queueSweep(){
  if (sweepQueued) return;
  sweepQueued = true;
  requestAnimationFrame(sweepReveals);
}

/* Nav condensation and a capped parallax drift on the hero card. */
function onScroll(){
  const nav = document.querySelector(".nav");
  if (nav) nav.classList.toggle("tight", window.scrollY > 90);
  if (REDUCED.matches) return;
  const shot = document.querySelector(".shot");
  if (shot && window.scrollY < 900){
    const d = Math.max(-14, Math.min(14, window.scrollY * -0.045));
    shot.style.transform = "translateY(" + d + "px)";
  }
}

/* Direction token so the score rows slide in from the reading edge. */
function setDir(){
  document.documentElement.style.setProperty("--dir", lang === "ar" ? "-1" : "1");
}

/* the hero score counts up once, when it first comes into view */
function animateScore(){
  const arc = document.getElementById("arc"), num = document.getElementById("num"), target = 68;
  arc.style.strokeDashoffset = String(333 * (1 - target/100));
  const t0 = performance.now();
  (function tick(now){
    const k = Math.min(1, (now - t0) / 1300);
    num.textContent = String(Math.round(target * (1 - Math.pow(1 - k, 3))));
    if (k < 1) requestAnimationFrame(tick);
  })(t0);
}

applyLang();
armReveals();
window.addEventListener("scroll", onScroll, { passive:true });
window.addEventListener("scroll", queueSweep, { passive:true });
window.addEventListener("resize", queueSweep, { passive:true });
window.addEventListener("load", sweepReveals);
onScroll();
const shot = document.querySelector(".shot");
if (window.matchMedia("(prefers-reduced-motion: reduce)").matches){
  document.getElementById("arc").style.strokeDashoffset = String(333 * 0.32);
  document.getElementById("num").textContent = "68";
} else if ("IntersectionObserver" in window){
  const io = new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting){ animateScore(); io.disconnect(); }
  }), { threshold:.4 });
  io.observe(shot);
} else animateScore();
</script>
