# Nothing stood between a broken commit and the live app before this: Pages
# deploys whatever lands on main. This runs every suite on every push, so a
# regression fails here rather than in front of a reader.
name: tests

# Narrowed from every branch to main and pull requests. Pages deploys what
# lands on main, so that is the branch a failure has to stop; a push to a
# working branch is already gated locally by .githooks/pre-push, which is the
# only gate that runs at all while Actions is blocked. The old setting fired
# twice per change and mailed two failures for one piece of work.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push makes an older run pointless.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Full history, not the default shallow clone. Two things need it: the
      # secret scan just below walks the actual commit range being pushed or
      # reviewed, and admin.test.js runs `git log -- admin/` to catch a stale
      # build stamp — a depth-1 clone can't walk back to the commit that
      # actually last touched the directory, and reports the checkout's own
      # tip commit instead, which is wrong on every push that doesn't itself
      # touch admin/.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Scans the commits in this push or PR for committed secrets — an API
      # key, a service-role JWT, a token pasted into a debug line and
      # forgotten. Runs before the suites so a leak is caught even if the
      # rest of the job would otherwise pass.
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      # Playwright needs its browser and the system libraries behind it. The
      # sandbox this was written in has both preinstalled; a runner does not.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Starts its own server on a free port and tears it down after.
      - name: Run the suites
        run: npm test

      # The Edge Function is deployed by hand, so nothing else would catch a
      # type error in it until it was already live.
      #
      # This was a long inline tsc invocation carrying `--types ""`, which
      # TypeScript 6 rejects outright (TS6044) — so the step was broken and
      # nobody could tell, because Actions has never run it. It is now the same
      # one command a person runs on their own machine, configured in
      # tsconfig.check.json, and the pre-push hook runs it too.
      - name: Type-check the Claude proxy
        run: npm run typecheck

      # The app has two dependencies (playwright, typescript), both dev-only
      # and never shipped to a reader — but "dev-only" is not "harmless": a
      # compromised dev dependency still runs in this CI environment.
      # audit-level=high rather than npm's default of "low", so a
      # low-severity advisory nobody can act on quickly does not start
      # blocking merges.
      - name: Audit dependencies
        run: npm audit --audit-level=high
