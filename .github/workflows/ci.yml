# Nothing stood between a broken commit and the live app before this: Pages
# deploys whatever lands on main. This runs every suite on every push, so a
# regression fails here rather than in front of a reader.
name: tests

# Narrowed from every branch to main and pull requests. Pages deploys what
# lands on main, so that is the branch a failure has to stop; a push to a
# working branch is already gated locally by .githooks/pre-push, which is the
# only gate that runs at all while Actions is blocked. The old setting fired
# twice per change and mailed two failures for one piece of work.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push makes an older run pointless.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      # Playwright needs its browser and the system libraries behind it. The
      # sandbox this was written in has both preinstalled; a runner does not.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Starts its own server on a free port and tears it down after.
      - name: Run the suites
        run: npm test

      # The Edge Function is deployed by hand, so nothing else would catch a
      # type error in it until it was already live.
      #
      # This was a long inline tsc invocation carrying `--types ""`, which
      # TypeScript 6 rejects outright (TS6044) — so the step was broken and
      # nobody could tell, because Actions has never run it. It is now the same
      # one command a person runs on their own machine, configured in
      # tsconfig.check.json, and the pre-push hook runs it too.
      - name: Type-check the Claude proxy
        run: npm run typecheck
