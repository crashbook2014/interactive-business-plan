# Walks the deployed app every six hours and opens an issue if it is broken.
#
# The suites prove the code is right. This proves the deployment is — a build
# that never published, an asset that 404s, a stale page, or a change that
# quietly started calling out to the network. None of those show up in a test
# run against localhost.
name: watchdog

on:
  schedule:
    - cron: "17 */6 * * *"   # not on the hour: the hour is when everyone else runs
  workflow_dispatch:
    inputs:
      url:
        description: "Site to check"
        required: false

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci || npm install
      - run: npx playwright install --with-deps chromium

      - name: Walk the live site
        id: watch
        continue-on-error: true
        run: |
          URL="${{ github.event.inputs.url }}"
          if [ -z "$URL" ]; then
            URL="https://crashbook2014.github.io/interactive-business-plan"
          fi
          node test/watchdog.js "$URL" 2>&1 | tee watchdog.log
          echo "status=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      # One issue, reopened and updated rather than a new one every six hours —
      # a watchdog that floods the inbox stops being read, which is the same as
      # not having one.
      - name: Open or update the issue
        if: steps.watch.outputs.status != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const log = fs.readFileSync('watchdog.log', 'utf8').slice(-5000);
            const title = 'Watchdog: the live app is failing checks';
            const body = [
              'The scheduled watchdog found problems on the deployed site.',
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `Checked at: ${new Date().toISOString()}`,
              '',
              '```',
              log.trim(),
              '```',
              '',
              'This issue closes itself when the next run passes.',
            ].join('\n');

            const { data: open } = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: 'watchdog',
            });
            if (open.length) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: open[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                ...context.repo, title, body, labels: ['watchdog'],
              });
            }

      - name: Close the issue on recovery
        if: steps.watch.outputs.status == '0'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: open } = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: 'watchdog',
            });
            for (const issue of open) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: issue.number,
                body: `Recovered — the watchdog passed at ${new Date().toISOString()}.`,
              });
              await github.rest.issues.update({
                ...context.repo, issue_number: issue.number,
                state: 'closed', state_reason: 'completed',
              });
            }

      - name: Fail the run if the site is unhealthy
        if: steps.watch.outputs.status != '0'
        run: exit 1
