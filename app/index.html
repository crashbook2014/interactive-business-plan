    position:absolute;top:-9px;inset-inline-start:14px;
    background:var(--nx-bg);color:var(--nx-ink);
    border:1px solid color-mix(in srgb, var(--nx-ink) 35%, transparent);
    border-radius:999px;padding:2px 9px;font-size:10.5px;font-weight:800;
    letter-spacing:.02em;white-space:nowrap;line-height:1.6}
  @media (prefers-reduced-motion:no-preference){
    .is-next{transition:box-shadow var(--t) var(--ease-out)}
    .demoted{transition:opacity var(--t-fast) var(--ease-out),filter var(--t-fast) var(--ease-out)}
  }
  .home-plans{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:4px;
      color:var(--ink-2);font-size:12.5px;padding:10px;border-radius:var(--r-sm);opacity:.85}
  .home-plans:hover{color:var(--teal)}
  /* Secondary utilities sit quietly below the primary act, in one rhythm. */
  .home-reminders{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:10px;width:100%;
      color:var(--ink-2);font-size:13.5px;font-weight:700;background:none;border:1px solid var(--line);
      border-radius:var(--r-md);padding:12px;transition:color .15s,border-color .15s}
  .home-reminders:hover{color:var(--teal);border-color:var(--teal)}
  html[lang="ar"] .home-reminders{font-weight:400;font-size:15px}

  .timeline{position:relative;margin:6px 0 20px;padding-inline-start:26px}
  .timeline::before{content:"";position:absolute;inset-block:10px;inset-inline-start:8px;width:2px;background:var(--line);border-radius:2px}
  .tl-item{position:relative;margin-bottom:14px}
  .tl-item .node{position:absolute;inset-inline-start:-26px;top:14px;width:18px;height:18px;border-radius:99px;border:3px solid var(--sand);display:flex;align-items:center;justify-content:center}
  .tl-item.info .node{background:var(--teal)} .tl-item.action .node{background:var(--amber)} .tl-item.deadline .node{background:var(--red)}
  .tl-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 16px;box-shadow:var(--e1),var(--edge)}
  .tl-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .tl-date{font-size:12.5px;font-weight:700;color:var(--teal-ink);background:var(--sand);border:1px solid var(--line);border-radius:999px;padding:2px 10px;white-space:nowrap}
  html[lang="ar"] .tl-date{font-weight:400}
  .tl-rel{font-size:11.5px;color:var(--ink-2)}
  .tl-doc{margin-inline-start:auto;font-size:11px;font-weight:700;color:var(--teal);background:var(--teal-soft);border-radius:999px;padding:2px 9px;white-space:nowrap}
  html[lang="ar"] .tl-doc{font-weight:400;font-size:12px}
  .tl-card h4{font-size:14.5px;color:var(--ink);margin-top:6px}
  .tl-card p{font-size:12.5px;color:var(--ink-2);line-height:1.6;margin-top:2px}
  .tl-empty{text-align:center;color:var(--ink-2);font-size:14px;padding:34px 12px;background:var(--card);border:1px dashed var(--line);border-radius:18px}
  .tl-note{display:flex;align-items:center;justify-content:center;gap:8px;font-size:12px;color:var(--ink-2);margin-bottom:16px}
  .tl-export{margin-top:22px;padding:18px;background:var(--card);border:1px solid var(--line);
    border-radius:18px;box-shadow:var(--e1);text-align:center}
  .tl-export[hidden]{display:none}
  .tl-export-h{font-size:14.5px;font-weight:700;color:var(--ink);margin-bottom:12px}
  .tl-export-b{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .tl-export-b button{flex:1 1 140px;min-height:44px;padding:11px 16px;border-radius:var(--r-md);
    border:1px solid var(--line);background:var(--bg);color:var(--teal-ink);
    font-size:14px;font-weight:700;
    transition:transform var(--t-fast) var(--ease-out),background var(--t-fast) var(--ease-out)}
  .tl-export-b button:hover{background:var(--teal-soft)}
  .tl-export-b button:active{transform:scale(.97)}
  .tl-export-n{margin-top:12px;font-size:11.5px;color:var(--ink-2);line-height:1.5}
  .tl-note .dot-on{width:30px;height:18px;border-radius:99px;background:var(--teal);position:relative}
  .tl-note .dot-on::after{content:"";position:absolute;top:2.5px;inset-inline-end:2.5px;width:13px;height:13px;border-radius:99px;background:var(--on-teal)}

  /* feedback */
  .feedback{background:none;border-top:1px solid var(--line);border-radius:0;padding:16px 10px 4px;margin-top:18px;text-align:center}
  .fb-q{font-size:13.5px;color:var(--ink-2)}
  .fb-btns{display:flex;justify-content:center;gap:14px;margin-top:12px}
  .fb-btns button{width:46px;height:46px;border-radius:999px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;transition:border-color .15s,background .15s}
  .fb-btns button:hover{border-color:var(--teal)}
  .fb-btns svg{width:22px;height:22px}
  .fb-comment{margin-top:14px}
  .fb-comment textarea{min-height:72px;font-size:13.5px}
  .fb-comment .primary{margin-top:10px;padding:12px;font-size:14.5px}
  .fb-thanks{display:flex;align-items:center;justify-content:center;gap:10px;color:var(--ink);font-size:15px;padding:6px 0}
  .fb-thanks .tick{flex:none;width:28px;height:28px;border-radius:999px;background:var(--green);display:flex;align-items:center;justify-content:center}
  .fb-thanks .tick svg{width:14px;height:14px}

  /* clauses */
  .clause{background:var(--card);border:1px solid var(--line);border-radius:var(--r-xl);margin-bottom:12px;overflow:hidden;box-shadow:var(--e1),var(--edge)}
  .clause .head{display:flex;align-items:center;gap:10px;padding:13px 16px}
  .clause .stripe{flex:none;width:10px;height:10px;border-radius:99px}
  .clause h4{font-size:15px;color:var(--ink);flex:1}
  /* The reader's OWN sentence is marked apart from an authored sample quote:
     teal edge and a label. That difference is the whole point — a quote from
     their document turns an opinion into a pointer. */
  .quote[data-own]{border-inline-start-color:var(--teal)}
  .quote[data-own]::before{content:attr(data-label);display:block;font-style:normal;
    font-size:10.5px;letter-spacing:.04em;color:var(--teal-ink);
    font-weight:700;margin-bottom:4px}
  .flag .quote{margin:0 0 10px;padding:10px 14px;background:var(--sand);
    border-inline-start:3px solid var(--line);border-radius:8px;font-size:12.5px;
    color:var(--ink-2);line-height:1.7;font-style:italic}
  .clause .quote{margin:0 16px;padding:10px 14px;background:var(--sand);border-inline-start:3px solid var(--line);border-radius:8px;font-size:12.5px;color:var(--ink-2);line-height:1.7;font-style:italic}
  .clause .plain{padding:10px 16px 4px;font-size:14px;color:var(--ink);line-height:1.75}
  .clause .act{margin:8px 16px 14px;display:inline-block;font-size:12.5px;font-weight:700;border-radius:999px;padding:4px 12px}
  .clause.red .stripe{background:var(--red)} .clause.red .act{background:var(--red-bg);color:var(--red)}
  .clause.amber .stripe{background:var(--amber)} .clause.amber .act{background:var(--amber-bg);color:var(--amber-ink)}
  .clause.green .stripe{background:var(--green)} .clause.green .act{background:var(--green-bg);color:var(--green-ink)}
  .section-title{font-size:19px;color:var(--teal-ink);margin:6px 2px 14px}
  /* The situation chooser. Cards, not a dashboard: each one names a moment a
     reader is actually in, and goes straight to the flow for it. */
  .sit{margin:18px 0 22px}
  .sit-h{font-size:19px;font-weight:800;margin-bottom:12px}
  html[lang="ar"] .sit-h{font-weight:700}
  .sit-grid{display:flex;flex-direction:column;gap:9px}
  .sit-card{display:flex;align-items:center;gap:12px;width:100%;background:var(--card);
    border:1px solid var(--line);border-radius:var(--r-md);padding:13px 14px;text-align:start;
    box-shadow:var(--e1);cursor:pointer;min-height:60px}
  .sit-card .ic{flex:none;width:34px;height:34px;border-radius:var(--r-sm);background:var(--teal-bg);
    display:flex;align-items:center;justify-content:center}
  .sit-card .ic svg{width:19px;height:19px}
  .sit-card b{display:block;font-size:14.5px;color:var(--ink)}
  .sit-card span span{font-size:12.5px;color:var(--ink-2);line-height:1.5}
  .sit-card .go{margin-inline-start:auto;color:var(--teal);display:flex}
  .sit-card:active{transform:scale(.985);box-shadow:var(--e1)}
  .sit-u{margin-top:12px;border:1px solid var(--line);border-radius:var(--r-md);
    background:var(--card);padding:13px 14px}
  .sit-u p{font-size:14px;font-weight:700;margin-bottom:10px}
  html[lang="ar"] .sit-u p{font-weight:400}
  .sit-u-acts{display:flex;gap:9px;flex-wrap:wrap}
  .sit-u-acts .ghost{flex:1 1 auto;min-height:46px;font-size:13.5px}
  @media (min-width:600px){ .sit-grid{display:grid;grid-template-columns:1fr 1fr} }
  /* Accounts. Two buttons, brand-styled, nothing else competing. */
  .au-acts{display:flex;flex-direction:column;gap:11px;margin:20px 0 14px}
  .au-btn{display:flex;align-items:center;justify-content:center;gap:11px;width:100%;
    min-height:54px;border-radius:var(--r-md);border:1px solid var(--line);
    background:var(--card);color:var(--ink);font:inherit;font-size:15.5px;font-weight:700;
    box-shadow:var(--e1);cursor:pointer}
  html[lang="ar"] .au-btn{font-weight:400}
  .au-btn svg{width:19px;height:19px;flex:none}
  .au-btn:active{transform:scale(.985)}
  .au-btn.apple{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .au-skip{text-align:center;cursor:pointer;text-decoration:underline;margin-top:4px}
  .au-what{margin-top:18px}
  .au-err{margin-top:12px;font-size:13px;color:var(--red-ink)}
  .ph-l{display:block;font-size:13px;font-weight:700;margin-bottom:7px}
  html[lang="ar"] .ph-l{font-weight:400}
  .ph-in{min-height:52px;direction:ltr;text-align:start;font-size:16px}
  /* ---------------------------------------------------------- [hidden]
   *
   * THE FLOOR. `hidden` is how this app turns features off — an unconfigured
   * AI, a dark paywall, a lawyer desk with no lawyer — and it did not work.
   *
   * The attribute's display:none comes from the USER AGENT stylesheet, and any
   * author rule that sets display on a class beats it. `.fld{display:block}`
   * alone defeated it on six elements, three of which were promises the app
   * cannot keep: a refund guarantee while payments are dark, a lawyer desk
   * with no lawyer, and two doors to an AI that is not deployed. Every test
   * passed throughout, because they all read el.hidden — the attribute, which
   * was set correctly — rather than what the reader actually sees.
   *
   * !important is load-bearing, not laziness: the whole failure is an author
   * rule winning, so the fix has to outrank one. Ten one-off
   * `.x[hidden]{display:none}` patches already exist above, added one at a
   * time as someone noticed each symptom. This is the rule that makes an
   * eleventh unnecessary. */
  [hidden]{display:none !important}
</style>
<script>
/* ============================================================ THE CURTAIN
 *
 * ONE FLAG, matching the one in the site root. False means the product is
 * finished but not open: a visitor is sent to the pre-launch page instead.
 *
 * NOTHING HERE IS DELETED OR DISABLED. Every screen, every calculation, every
 * paywall and every test is exactly as it was. Twelve suites still run against
 * this file on every push — they run THROUGH this lock using the same key
 * below, so the lock itself is proven not to break the app.
 *
 * THE KEY: alwodouh.com/app/#preview opens the full working app. Use it to
 * demo to a lawyer, a partner, a buyer. It is a door the public will not find,
 * not a security control — anyone told the URL can use it, and that is fine,
 * because what is behind it is an unfinished product rather than anyone's
 * data. A fragment rather than a query string on purpose: fragments are never
 * sent to the server, so the link leaves no trace in any access log.
 *
 * TO LAUNCH: set this to true here and in the root index.html. Two lines.
 * See docs/launch-checklist.md.
 */
window.WODOUH_LAUNCHED = false;
if (!window.WODOUH_LAUNCHED && !/(^|[#&])preview\b/.test(location.hash)) {
  /* replace(), not assign(): the back button should not bounce a visitor
     into a locked door they just left. */
  location.replace("../");
}
</script>

<!-- Accounts. Same-origin, so the CSP stays `script-src 'self'` — the reason
     this file talks to Supabase over plain fetch instead of importing an SDK
     from a CDN. It does nothing at all until SUPABASE_URL is configured. -->
<script src="./auth.js"></script>
<script>
/* ============================================ RUNTIME CONFIGURATION
 *
 * THE OFF SWITCH FOR EVERYTHING THAT LEAVES THE DEVICE.
 *
 * Empty is the shipping state and the only state in which Wodouh's
 * "nothing leaves your device" promise is true without qualification.
 * With ANALYZE_URL unset, analyzeUrl() returns null, every AI surface
 * renders nothing at all, and the app makes zero off-origin requests —
 * asserted by watching the network in claude-path.test.js and
 * ask.test.js, not by reading this comment.
 *
 * It lives inline, in this file, on purpose. An external config.js would
 * make turning the AI on a one-file change that nobody reviews; here it
 * sits three lines from the CSP that must be edited in the same breath,
 * and both edits show up in the same diff.
 *
 * TO ENABLE — both steps, or neither works:
 *
 *   1. Set ANALYZE_URL to your deployed Edge Function:
 *        ANALYZE_URL: "https://<your-project-ref>.supabase.co/functions/v1/analyze"
 *
 *   2. Edit the Content-Security-Policy meta tag at the top of this file:
 *        connect-src 'none'   ->   connect-src https://<your-project-ref>.supabase.co
 *
 *      Name that one host. NEVER the *.supabase.co wildcard — it is a
 *      shared multi-tenant domain that anyone can register a project
 *      inside, and this policy is the only thing standing between a
 *      future script injection and a reader's contract text. GitHub
 *      Pages sets no response headers, so there is no second line.
 *
 * Step 1 without step 2 is the confusing failure: the buttons appear and
 * every request is blocked by the browser. Do both.
 *
 * Nothing secret goes here. This file is served to every visitor. The
 * Anthropic key lives only in Supabase Edge Function secrets — see
 * docs/claude-analysis.md.
 */
window.WODOUH_CONFIG = Object.assign({
  ANALYZE_URL: ""
}, window.WODOUH_CONFIG || {});

/* ------------------------------------------------------------------ i18n */
const T = {

  /* Arabic counted nouns inflect: one is singular, two takes the dual, 3–10
     takes a broken plural, 11+ returns to the singular accusative. Rendering
     "2 بند أصفر" would read as broken Arabic in an Arabic-first product. */
  /* Arabic inflects a counted noun by its count, and "٢ بنود" is wrong the way
     "2 clause" is wrong in English — the dual has its own form. The same four
     shapes the red and amber counts already use. */
  /* Genitive, because every use site reads "تعرّفنا على {n}" and a noun after
     a preposition is majrūr. The accusative "بندًا واحدًا" was wrong there, and
     wrong in the most-read sentence on the result screen. */
  dc_cl_1:{ar:"بندٍ واحدٍ",en:"1 clause"},
  dc_cl_2:{ar:"بندين",en:"2 clauses"},
  dc_cl_p:{ar:"{n} بنود",en:"{n} clauses"},
  dc_cl_m:{ar:"{n} بندًا",en:"{n} clauses"},
  dc_red_1:{ar:"بند أحمر",en:"1 red"},
  dc_red_2:{ar:"بندان أحمران",en:"2 red"},
  dc_red_p:{ar:"{n} بنود حمراء",en:"{n} red"},
  dc_red_m:{ar:"{n} بندًا أحمر",en:"{n} red"},
  dc_amber_1:{ar:"بند أصفر",en:"1 amber"},
  dc_amber_2:{ar:"بندان أصفران",en:"2 amber"},
  dc_amber_p:{ar:"{n} بنود صفراء",en:"{n} amber"},
  dc_amber_m:{ar:"{n} بندًا أصفر",en:"{n} amber"},
  dc_join:{ar:" و",en:" and "},
  dc_conf_high:{ar:"نموذج معروف — فحصنا {n}.",
                en:"A known sample — {n} checked."},
  dc_conf_med:{ar:"تعرّفنا على {n} في نصّك. قد توجد بنود أخرى ما التقطناها.",
               en:"We recognised {n} in your text. There may be others we didn't catch."},
  /* Says what the number MEANS, not just what it is. "We recognised 3" leaves

  dc_conf_low:{ar:"تعرّفنا على {n} فقط من عقدك، والدرجة فوق محسوبة على ما تعرّفنا عليه وحده — مو على العقد كامل. اقرأ الباقي بنفسك أو أرسله لمحامٍ.",

  /* This sentence used to promise, without qualification, that we never show
     an unverified article number. The AI contract read makes that untrue: it
     may cite an article it is confident about but that nobody here has
     checked. Rather than quietly leave the old wording standing, the promise
     is stated where it still holds and the exception is named — and the
     exception is always labelled on screen, in amber, beside the number. */
  src_caveat:{ar:"في قراءتنا نحن، نذكر رقم المادة فقط حين نكون تحققنا منها، وإلا نذكر النظام باسمه دون رقم. أما الاستشهادات اللي يستخرجها التحليل الذكي من عقدك، فنعرضها كما هي ونوسمها «غير محققة» إذا ما كانت في سجلنا — تعرف بالضبط وش تحقّقنا منه ووش لا.",
              en:"In our own readings we name an article number only where we've verified it, and otherwise name the law without one. Citations the AI read pulls from your contract are shown as given and marked \u201Cunverified\u201D when they aren't in our register — so you know exactly what we checked and what we didn't."},
  govern_by:{ar:"ما ينظّم هذا البند",en:"What governs this"},

  acc_pay_paid:{ar:"مدفوع: المخرجات فقط — خطاب التفاوض، ملف القضية، أسئلة المساعد بلا حدود، ومراجعة المحامي.",

  acc_privacy:{ar:"الخصوصية",en:"Privacy"},
  acc_privacy_b:{ar:"يُحلَّل عقدك داخل التطبيق على جهازك. لا نرفعه لخادم، ولا نخزّنه، ولا نشاركه مع أحد. لو حذفت التطبيق راح معه كل شيء.",
                 en:"Your contract is analyzed inside the app on your device. We don't upload it, store it, or share it. Delete the app and it all goes with it."},
  acc_privacy_b_ai:{ar:"يُحلَّل عقدك داخل التطبيق على جهازك، وكل مبلغ يُحسب هنا ويبقى هنا.\n\nفيه ثلاثة استثناءات، كلها اختيارية وكلها تحتاج موافقتك الصريحة. وهي منفصلة عن بعض، لأن كل واحد يرسل شيئًا مختلفًا:\n\n1 — «قراءة أعمق لعقدك»: يُرسل نص العقد وحده، بدون أرقامك ولا إجاباتك.\n\n2 — «مراجعة ثانية بالذكاء الاصطناعي»: ترسل أكثر — تواريخك وراتبك ونوع عقدك وطريقة الإنهاء وكل مبلغ في تقييمك والأوراق اللي علّمتها، ومنها ما كتبته بنفسك في خانة سبب الإنهاء.\n\n3 — «اسأل سؤالك»: يُرسل سؤالك كما كتبته. وفيه خانة ثانية منفصلة داخل الشاشة نفسها، إذا علّمتها أرسلنا معه تواريخك وأجرك ونوع عقدك وطريقة الإنهاء عشان يكون الجواب على حالتك أنت — وإذا ما علّمتها ما يطلع غير السؤال.\n\n4 — «اقرأ عقدًا ممسوحًا ضوئيًا»: هذا الوحيد اللي يرفع الملف نفسه، مو نصه. نلجأ له فقط إذا كان عقدك صورة أو مسحًا ضوئيًا وما فيه نص نقدر نقرأه على جهازك. يتطلب تسجيل دخول، ويُحذف الملف من خوادم Anthropic فور انتهاء التحليل، وفي كل الأحوال خلال ساعة. وما نعرض عليك أي مبلغ من عقد ممسوح — لأننا ما نقدر نتحقق منه.\n\nالأربعة يمرّون بخادم وضوح إلى نموذج Claude من Anthropic. الثلاثة الأولى ما يُحفظ منها شيء في أي مرحلة؛ الرابع يُحفظ الملف مؤقتًا ثم يُحذف. ولا واحد منها يقدر يغيّر أي مبلغ — الحساب كله على جهازك. وإذا رفضتها كلها، التقييم يشتغل كامل.",
                    en:"Your contract is analyzed inside the app on your device, and every amount is calculated here and stays here.\n\nThere are three exceptions. All are optional, all need your explicit agreement, and they are kept separate from each other because they send different things:\n\n1 — \"A closer read of your contract\": sends the contract text alone, not your figures or your answers.\n\n2 — \"AI second-pass review\": sends more — your dates, your wage, your contract type, how the job ended, every amount in your assessment, the documents you ticked, and what you typed yourself in the reason field.\n\n3 — \"Ask a question\": sends your question as you typed it. A second, separate tick box on that same screen adds your dates, your wage, your contract type and how the job ended, so the answer can be about your situation — leave it unticked and only the question goes.\n\n4 — \"Read a scanned contract\": the only one that uploads the FILE rather than its text. It is used only when your contract is a photo or a scan with no text we can read on your device. It requires signing in, the file is deleted from Anthropic's servers as soon as the analysis returns and within an hour in every case, and we show you no amount at all from a scan — because we cannot check one.\n\nAll four go through Wodouh's server to Anthropic's Claude model. Nothing is stored at any point for the first three; the fourth stores the file briefly and then deletes it. None of them can change any amount — all the arithmetic stays on your device. Decline all four and the assessment works in full."},

  acc_how_b:{ar:"نقارن كل بند بالممارسة الشائعة وبالأنظمة السعودية: أحمر يعني انتبه، أصفر يعني يستحق النقاش، أخضر يعني ضمن المعتاد. البنود التي نذكر رقم مادتها تحققنا منها في النص الرسمي؛ وما عداها نذكر النظام باسمه فقط.",

  tm_s_eos_81:{ar:"لو كان تركك للعمل بسبب إخلال من صاحب العمل، فالنظام يبقي لك كامل حقوقك النظامية — ومنها المكافأة كاملة، لا المخفّضة. هذي نقطة تستاهل مراجعة جادة.",

  tm_n5:{ar:"الطريق النظامي",en:"The formal route"},
  /* «لا تُسمع»، not «عادة ما تُسمع». The negation was missing, and «عادة ما»
     is a standard idiom for "usually" — so the sentence read as "a labour
     claim is usually heard after twelve months", the exact inverse of the bar
     in Article 222. A reader taking the natural reading waits a year and loses
     the claim. The same fact is stated correctly twice elsewhere in this file
     (tr_clock and the rights entry); this was the third copy, and the one on
     the screen a terminated reader actually lands on. */
  tm_n5_b:{ar:"لو ما وصلت لحل، الطريق يبدأ بالتسوية الودية عبر منصة وزارة الموارد البشرية قبل المحكمة العمالية. وانتبه للمدة: الدعوى العمالية لا تُسمع عادةً بعد مضي اثني عشر شهرًا من نهاية العلاقة. وضوح ما يرفع الدعوى نيابة عنك.",
           en:"If nothing is resolved, the route begins with amicable settlement through the Ministry of Human Resources platform, before the labour court. Watch the clock: a labour claim is generally not heard after twelve months from the end of the relationship. Wodouh does not file anything on your behalf."},

  tm_d_questions_b:{ar:"— أساس احتساب المخالصة النهائية وتاريخ صرفها\n— سبب الإنهاء كما هو موثّق لدى صاحب العمل\n— رصيد الإجازة المعتمد في سجلات الشركة\n— أي إنذارات أو جزاءات سابقة وتواريخها",
                    en:"— The basis on which the final settlement was calculated, and the date it was paid\n— The reason for termination as documented by the employer\n— The leave balance recorded in the company's own records\n— Any prior warnings or disciplinary notices, and their dates"},
  tm_d_next_b:{ar:"— مطالبة مكتوبة لصاحب العمل بالمبالغ أعلاه\n— استكمال الأوراق الناقصة\n— التسوية الودية عبر منصة وزارة الموارد البشرية إذا لم يصل الطرفان لحل\n\nأُعد هذا الملف من معلومات قدّمها العامل. المبالغ تقديرية ولا تمثل مطالبة نهائية.",
               en:"— A written request to the employer for the amounts above\n— Obtaining the outstanding documents\n— Amicable settlement through the Ministry of Human Resources platform if no resolution is reached\n\nThis file was prepared from information provided by the employee. The amounts are estimates and do not constitute a final claim."},

  tm_l_title:{ar:"خطاب لصاحب العمل",en:"Letter to your employer"},
  tm_l_sub:{ar:"نفس الوقائع ونفس المبالغ في كل نبرة — اللي يتغيّر هو الأسلوب فقط.",
            en:"The same facts and the same amounts in every tone — only the register changes."},
  tm_l_to:{ar:"إلى: قسم الموارد البشرية",en:"To: The HR department"},
  tm_tone_friendly:{ar:"ودّي",en:"Friendly"},
  tm_tone_professional:{ar:"مهني",en:"Professional"},
  tm_tone_firm:{ar:"حازم",en:"Firm"},
  tm_tone_formal:{ar:"رسمي",en:"Formal"},
  tm_l_open_friendly:{ar:"السلام عليكم ورحمة الله،\n\nأشكركم على المدة اللي قضيتها معكم. بعد انتهاء عملي، حابب أتأكد من بعض المستحقات، وأتمنى نوصل لتوضيح بيني وبينكم مباشرة.",
                      en:"Dear colleagues,\n\nThank you for the time I spent with the company. Now that my employment has ended, I'd like to check a few entitlements, and I hope we can clear this up between us directly."},
  tm_l_open_professional:{ar:"السلام عليكم ورحمة الله،\n\nبالإشارة إلى انتهاء علاقتي الوظيفية بالشركة، أود مراجعة مستحقاتي النهائية بناءً على الوقائع التالية.",
                          en:"Dear Sir or Madam,\n\nFollowing the end of my employment with the company, I would like to review my final entitlements on the basis of the following."},
  tm_l_open_firm:{ar:"السلام عليكم ورحمة الله،\n\nبالإشارة إلى انتهاء علاقتي الوظيفية، لم تُسوَّ حتى تاريخه مستحقات أراها قائمة. أدرج أدناه الوقائع والمبالغ، وأطلب مراجعتها.",
                  en:"Dear Sir or Madam,\n\nFollowing the end of my employment, entitlements that I believe remain outstanding have not yet been settled. I set out the facts and the amounts below and ask that they be reviewed."},
  tm_l_open_formal:{ar:"إلى إدارة الموارد البشرية المحترمة،\n\nبالإشارة إلى انتهاء علاقتي الوظيفية بالشركة، أتقدّم بهذا الطلب لمراجعة المستحقات النهائية، وفق الوقائع والمبالغ الموضحة أدناه.",
                    en:"To the Human Resources Department,\n\nFurther to the termination of my employment with the company, I submit this request for a review of my final entitlements, on the basis of the facts and amounts set out below."},
  tm_l_items:{ar:"المبالغ محل المراجعة:",en:"Amounts for review:"},
  tm_l_noitems:{ar:"أطلب توضيح أساس احتساب المخالصة النهائية.",
                en:"I would like clarification of the basis on which the final settlement was calculated."},
  tm_l_ask_friendly:{ar:"لو فيه شيء فهمته غلط، أنا حاضر أسمع وأصحّح. وإذا كان في محله، أتمنى نرتّب الصرف في أقرب وقت يناسبكم.",
                     en:"If I've misunderstood anything, I'm happy to hear it and stand corrected. If it's right, I'd be grateful if we could arrange payment at a time that suits you."},
  tm_l_ask_professional:{ar:"أرجو مراجعة الأرقام أعلاه وموافاتي بأساس احتسابها، وتزويدي بنسخة من المخالصة النهائية وسجل الإجازات.",
                         en:"I would be grateful if you could review the figures above, share the basis on which they were calculated, and provide a copy of the final settlement and the leave record."},
  tm_l_ask_firm:{ar:"أرجو موافاتي بردّ مكتوب خلال خمسة عشر يومًا يتضمن أساس الاحتساب وموعد الصرف.",
                 en:"I would ask for a written response within fifteen days setting out the basis of calculation and the date of payment."},
  tm_l_ask_formal:{ar:"أرجو التكرم بالإفادة كتابيًا بأساس احتساب المستحقات وموعد صرفها، مع تزويدي بصورة من المخالصة النهائية وسجل الإجازات.",
                   en:"I should be grateful for a written response setting out the basis on which the entitlements were calculated and the date of payment, together with a copy of the final settlement and the leave record."},
  tm_l_close_friendly:{ar:"شاكر لكم، وتحياتي للزملاء.",en:"Thank you, and my regards to the team."},
  tm_l_close_professional:{ar:"شاكرًا لكم حسن تعاونكم.",en:"Thank you for your cooperation."},
  tm_l_close_firm:{ar:"شاكرًا لكم، وفي انتظار ردّكم.",en:"Thank you — I look forward to your response."},
  tm_l_close_formal:{ar:"وتفضلوا بقبول فائق الاحترام،",en:"Yours faithfully,"},
  tm_l_sign:{ar:"[اسمك]",en:"[Your name]"},

  /* ---- ask: a question the app was not built to answer.
     Every line here is written to make one distinction impossible to miss —
     an answer we verified against a source, and an answer we did not. The
     second is still offered, because "we can't help you" is worse than a
     labelled best effort. It is never dressed as the first. */
  ask_title:{ar:"اسأل سؤالك",en:"Ask a question"},
  ask_sub:{ar:"نجاوبك من نظام العمل السعودي على قدر ما تحققنا منه — ونقول لك بصراحة متى ما تحققنا.",
           en:"We answer from the Saudi Labor Law as far as we have verified it — and we say plainly when we haven't."},
  ask_ph:{ar:"مثال: متى المفروض توصلني مستحقاتي بعد ما طلعت من الشركة؟",
          en:"Example: when should my final settlement reach me after I leave?"},
  ask_go:{ar:"اسأل",en:"Ask"},
  ask_again:{ar:"اسأل سؤالًا ثانيًا",en:"Ask another question"},
  ask_consent_h:{ar:"وش يطلع من جهازك؟",en:"What leaves your device"},
  ask_consent_b:{ar:"سؤالك كما كتبته، ولا شيء غيره. يُرسل لخادم وضوح ومنه لنموذج Claude من Anthropic، ولا يُحفظ في أي مرحلة. ما نرسل اسمك ولا راتبك ولا تواريخك ولا إجاباتك إلا إذا علّمت الخيار الثاني تحت.",
                 en:"Your question, exactly as you typed it, and nothing else. It goes to Wodouh's server and from there to Anthropic's Claude model, and is not stored at any stage. Your name, wage, dates and answers do not go unless you tick the second box below."},
  ask_agree:{ar:"فاهم، وأوافق على إرسال سؤالي",en:"I understand, and I agree to send my question"},
  ask_ctx_h:{ar:"تبي الجواب يكون على حالتك أنت؟",en:"Want the answer to be about your case?"},
  ask_ctx_b:{ar:"لو علّمت هنا، نرسل معه إجاباتك في حاسبة نهاية الخدمة: تواريخ عملك، أجرك، نوع عقدك، وكيف انتهت العلاقة. هذا أكثر بكثير من السؤال وحده، وقرارك أنت. الجواب يصير مرتبط بوضعك، لكن الأرقام تظل محسوبة على جهازك — النموذج ما يحسب لك ريالًا واحدًا.",
             en:"Tick this and we also send your answers from the end-of-service calculator: your dates, your wage, your contract type, and how the relationship ended. That is materially more than the question alone, and it is your call. The answer becomes about your situation — but the figures stay computed on your device. The model never calculates a riyal for you."},
  ask_ctx_agree:{ar:"أرسل تفاصيل حالتي مع السؤال",en:"Send my case details with the question"},
  ask_ctx_none:{ar:"ما عندك تفاصيل محفوظة بعد — ابدأ من «تم إنهاء عقدي» في الصفحة الرئيسية، وبعدها يصير فيه شي نرسله.",
                en:"You have no saved details yet — start from \"My contract was terminated\" on the home screen, and then there will be something to send."},
  ask_left_one:{ar:"باقي لك سؤال واحد اليوم",en:"One question left today"},
  ask_left_two:{ar:"باقي لك سؤالان اليوم",en:"Two questions left today"},
  ask_left_n:{ar:"باقي لك {n} أسئلة اليوم",en:"{n} questions left today"},
  ask_none_left:{ar:"خلصت أسئلة اليوم. ترجع بكرة — وكل شي ثاني في وضوح شغّال زي ما هو.",
                 en:"That's today's questions. Come back tomorrow — everything else in Wodouh still works as normal."},
  ask_busy:{ar:"نقرأ سؤالك…",en:"Reading your question…"},

  /* The two tiers, named on screen in the reader's own terms. */
  ask_tier_v:{ar:"جواب مبني على مصدر تحققنا منه",en:"Answered from a source we verified"},
  ask_tier_u:{ar:"⚠ معلومة عامة — ما تحققنا منها",en:"⚠ General knowledge — not verified by us"},
  ask_unv_b:{ar:"هذا السؤال ما يغطيه أي مصدر تحققنا منه، فالجواب فوق معرفة عامة عن نظام العمل السعودي، وضوح ما راجعها ولا تحمل رقم مادة. لا تبني عليها قرارًا نهائيًا — استخدمها عشان تعرف وش تسأل عنه بعدين.",
             en:"No source we have verified covers this question, so the answer above is general knowledge about Saudi labour law. Wodouh has not checked it, and it carries no article number. Don't make a final decision on it — use it to know what to ask about next."},
  ask_src_h:{ar:"المصادر اللي بنينا عليها",en:"What this is built on"},
  ask_ref:{ar:"ما نقدر نجاوب على هذا السؤال بثقة، وما راح نخمّن. جرّب تصيغه بشكل ثاني، أو ارفعه لمكتب محاماة.",
           en:"We can't answer this one with confidence, and we won't guess. Try rephrasing it, or take it to a lawyer."},
  ask_ref_citation:{ar:"الجواب اللي رجع ذكر رقم مادة ما نقدر نأكده، فحجبناه بالكامل. حذف الرقم وحده كان بيخلي الجملة تبين كأنها ما ادّعت شي — وهذي كذبة أكبر.",
                    en:"The answer that came back named an article we cannot confirm, so we withheld all of it. Removing just the number would have left a sentence that looks like it never made a legal claim — a bigger lie than the one we removed."},
  ask_ref_money:{ar:"الجواب اللي رجع ذكر مبلغًا بالريال، والنموذج عندنا ما يحسب فلوس أبدًا. الأرقام كلها تطلع من حاسبتك على جهازك.",
                 en:"The answer that came back stated a riyal amount. The model here never computes money — every figure in Wodouh comes from your own calculator, on your device."},
  ask_err:{ar:"ما قدرنا نوصل للخدمة. جرّب بعد شوي.",en:"We couldn't reach the service. Try again shortly."},
  /* Its own string. The analysis screen's version reassures the reader that
     "your score above" is unaffected — there is no score above here, and a
     sentence about something that is not on screen reads as carelessness at
     the exact moment the reader needs a clear one. */
  ask_offline:{ar:"ما فيه اتصال، وما وصل سؤالك. باقي وضوح كله شغّال على جهازك.",
               en:"No connection, and your question didn't get through. The rest of Wodouh still works on your device."},
  /* And say plainly that the attempt counted. It is deliberate — a cap that
     only counts successes is a cap a retry loop walks straight through — but
     a meter that moves without explanation reads as rigged. */
  ask_spent:{ar:"احتُسبت هذي المحاولة من رصيد اليوم.",en:"That attempt counted against today's allowance."},
  ask_empty:{ar:"اكتب سؤالك أول.",en:"Type your question first."},
  ask_disc:{ar:"وضوح ما هو مكتب محاماة، وهذا الجواب ما هو استشارة قانونية.",
            en:"Wodouh is not a law firm and this answer is not legal advice."},

  ai_title:{ar:"قراءة أعمق لعقدك",en:"A closer read of your contract"},
  ai_tag:{ar:"اختياري",en:"Optional"},
  ai_offer:{ar:"بقية وضوح يشتغل على جهازك بالكامل. هذي الخطوة الوحيدة اللي ما تشتغل كذا: عشان نقرأ نص عقدك قراءة أعمق، لازم النص يطلع من جهازك.",
            en:"The rest of Wodouh runs entirely on your device. This is the one step that doesn't: to read your contract more closely, the text has to leave your device."},
  ai_consent_h:{ar:"وش يطلع بالضبط؟",en:"Exactly what leaves"},
  ai_consent_b:{ar:"نص العقد اللي لصقته، ولا شيء غيره — لا اسمك ولا أرقامك ولا إجاباتك ولا الأوراق اللي علّمتها. يُرسل لخادم وضوح ومنه لنموذج Claude من Anthropic، ولا يُحفظ في أي مرحلة. الردّ اللي يرجع قراءة مساعدة، مو نصًا نظاميًا، وما يدخل في حساب أي مبلغ فوق.",
                en:"The contract text you pasted, and nothing else — not your name, your figures, your answers, or the documents you ticked. It goes to Wodouh's server and from there to Anthropic's Claude model, and is not stored at any point. What comes back is a helping read, not a statement of law, and it does not feed into any amount above."},
  ai_agree:{ar:"فاهم، وأوافق على إرسال نص العقد",en:"I understand, and I agree to send the contract text"},
  ai_go:{ar:"اقرأ عقدي",en:"Read my contract"},
  ai_decline:{ar:"لو ما وافقت، ما ينقص من تقييمك شيء — التقييم كله محسوب على جهازك أصلًا.",
              en:"If you decline, nothing is missing from your assessment — all of it was calculated on your device anyway."},
  ai_working:{ar:"نقرأ العقد… يمكن تاخذ نص دقيقة.",en:"Reading the contract… this can take up to half a minute."},
  ai_nothing:{ar:"ما طلع شيء إضافي يستاهل الوقوف عنده في نص العقد.",
              en:"Nothing further in the contract text stood out."},
  ai_src:{ar:"قراءة آلية لنص عقدك — تساعد على الفهم ولا تُغني عن المصادر أعلاه.",
          en:"An automated read of your contract text — a help to understanding, not a substitute for the sources above."},
  ai_retry:{ar:"حاول مرة ثانية",en:"Try again"},
  ai_notext:{ar:"ما لقينا نص عقد. الصق عقدك في الشاشة الرئيسية أول.",
             en:"We don't have contract text. Paste your contract on the home screen first."},
  ai_busy:{ar:"الخدمة مزدحمة حاليًا. جرّب بعد دقيقة.",en:"The service is busy right now. Try again in a minute."},
  ai_failed:{ar:"ما قدرنا نكمل القراءة. تقييمك أعلاه ما تأثر.",
             en:"We couldn't complete the read. Your assessment above is unaffected."},
  ai_offline:{ar:"ما فيه اتصال. تقييمك أعلاه محسوب على جهازك وما تأثر.",
              en:"No connection. Your assessment above was calculated on your device and is unaffected."},
  /* --- Article 87 exceptions */
  tm_f_exc:{ar:"هل كانت استقالتك لأحد هذي الأسباب؟",en:"Was your resignation for any of these reasons?"},
  tm_exc_none:{ar:"لا، استقالة عادية",en:"No, an ordinary resignation"},
  tm_exc_force:{ar:"ظرف قاهر خارج عن إرادتي",en:"A force majeure beyond my control"},
  /* The register's verified row for Article 87 scopes these two to a FEMALE
     WORKER — "a female worker is entitled to the full award if she ends her
     contract within six months of marriage or three months of giving birth".
     The labels carried no such condition, so any reader could select them and
     be shown the full award: an 18,333 SAR overstatement on the test case, in
     the direction that costs a reader credibility in front of the authority
     rather than only money. Force majeure is unscoped and stays unscoped. */
  tm_exc_marriage:{ar:"عاملة، وأنهيت العقد خلال 6 أشهر من زواجي",
                   en:"I am a female worker and ended it within 6 months of my marriage"},
  tm_exc_birth:{ar:"عاملة، وأنهيت العقد خلال 3 أشهر من ولادتي",
                en:"I am a female worker and ended it within 3 months of giving birth"},

  /* --- rules in plain language */
  tm_rule_eos:{ar:"مكافأة نهاية الخدمة: نصف شهر عن كل سنة من أول خمس سنوات، وشهر كامل عن كل سنة بعدها، على آخر أجر.",
               en:"End-of-service award: half a month for each of the first five years, a full month for each year after that, on your last wage."},
  tm_rule_notice:{ar:"الطرف اللي ما التزم بمدة الإشعار يدفع للطرف الثاني أجر تلك المدة أو ما تبقى منها. تخص العقود غير محددة المدة.",
                  en:"A party who doesn't observe the notice period pays the other the wage for that period, or what remains of it. Indefinite contracts only."},
  tm_rule_leave:{ar:"رصيد الإجازة السنوية غير المستخدم يُدفع نقدًا عند ترك العمل، وبنسبة ما قضيته من السنة. حق لا يسقط بالاتفاق.",
                 en:"Unused annual leave is paid in cash when you leave, pro-rata for the part of the year you worked. It cannot be waived by agreement."},
  tm_rule_comp:{ar:"الإنهاء بغير سبب مشروع يستوجب تعويضًا: أجر 15 يومًا عن كل سنة في العقد غير محدد المدة، أو أجر المدة الباقية في العقد محدد المدة، وبحد أدنى أجر شهرين.",
                en:"Termination without a valid reason attracts compensation: 15 days' wages per year on an indefinite contract, or the wages for the remaining term on a fixed-term one, with a floor of two months."},
  tm_rule_unpaid:{ar:"الأجر المستحق دين قائم بذاته. ما فيه مادة تحسب لك عدد الشهور — الرقم من إجابتك.",
                  en:"Wages owed are a debt in their own right. No article computes the number of months for you — that figure is your answer."},
  tm_rule_other:{ar:"العمولات والبدلات يحكمها نص عقدك لا النظام. الرقم من إدخالك.",
                 en:"Commissions and allowances are governed by your contract's wording, not the statute. The figure is the one you entered."},

  /* --- how it applies to you */
  appl_eos_full:{ar:"خدمتك {s}، وطريقة انتهاء عملك تُبقي المكافأة كاملة.",
                 en:"Your service is {s}, and the way your job ended keeps the award whole."},
  appl_eos_resign:{ar:"خدمتك {s}، والاستقالة العادية تُبقي {f}٪ من المكافأة عند هذي المدة.",
                   en:"Your service is {s}, and an ordinary resignation keeps {f}% of the award at that length."},
  appl_eos_81:{ar:"خدمتك {s}. ذكرت إنك طُلب منك تستقيل — إذا كان السبب إخلالًا من صاحب العمل، فقراءتنا إن حقوقك النظامية تبقى كاملة، ومنها المكافأة كاملة لا المخفّضة.",
               en:"Your service is {s}. You said you were asked to resign — if the cause was an employer breach, our reading is that your statutory rights survive intact, including the full award rather than the reduced one."},
  appl_eos_87:{ar:"خدمتك {s}، وذكرت: {e}. النظام يستثني هذي الحالة من تخفيض الاستقالة، فالمكافأة كاملة.",
               en:"Your service is {s}, and you told us: {e}. The law excepts that case from the resignation reduction, so the award is the full one."},
  appl_notice:{ar:"عقدك يذكر {d} يومًا إشعارًا، وأُعطيت {g}. الفرق {n} يومًا، وعليه حُسب المبلغ.",
               en:"Your contract states {d} days' notice and you were given {g}. The gap is {n} days, and the amount is calculated on it."},
  appl_leave:{ar:"ذكرت {d} يومًا رصيدًا، على أجر يومي مشتق من {w} ريال شهريًا.",
              en:"You reported {d} days of balance, at a daily rate derived from {w} SAR a month."},
  appl_unpaid:{ar:"ذكرت {m} شهرًا غير مدفوع، على راتب {w} ريال.",
               en:"You reported {m} months unpaid, at {w} SAR a month."},

/* A record with no `nat` applies to everyone; one that names a track applies
   only there. Used identically by the analyzer, the assistant and the
   library, so the three can never disagree about who sees what. */
function forTrack(x){ return !x.nat || x.nat === nat; }

/* ---------------------------------------------- Arabic, as people write it
 *
 * THE BUG THIS EXISTS TO FIX, IN ONE EXAMPLE.
 *
 * A real contract says "الإجازة السنوية إحدى وعشرون يوماً". The rule looks for
 * /إجازة\s*سنوية/. It does not match — because the definite article ال is
 * attached to the FRONT of the second word, so after "إجازة" the text reads
 * "السنوية" and the pattern expects "سنوية". The clause is right there, in the
 * contract, written normally, and we walked straight past it.
 *
 * That is not a gap in one rule. Arabic attaches ال, and the conjunctions و ف
 * ب ك ل, as prefixes rather than separate words, so EVERY multi-word Arabic
 * pattern in the rule set had the same hole. A realistic contract matched 2 of
 * 17 rules, and one of the 15 it missed was written verbatim in the text.
 *
 * So rather than patch seventeen regexes and hope the next one remembers, the
 * TEXT is normalised for matching: tashkeel and tatweel removed, alef and ya
 * forms unified, and the ال prefix stripped from the front of words. Matching
 * runs against both the original and the normalised form, so a rule written
 * either way still fires and nothing that matched before can stop matching.
 *
 * This normalisation is for MATCHING ONLY. Nothing the reader sees passes
 * through it — their contract is displayed exactly as they wrote it.
 */
function normAr(text){
  return String(text)
    /* Tashkeel (harakat) and tatweel: decoration that changes no word. */
    .replace(/[ً-ْٰـ]/g, "")
    /* أ إ آ ٱ are all alef in practice, and contracts mix them freely. */
    .replace(/[أإآٱ]/g, "ا")
    .replace(/ى/g, "ي")          /* ى -> ي */
    .replace(/ة/g, "ه")          /* ة -> ه */
    /* The definite article, with or without a leading conjunction/preposition.
       Only stripped when at least three letters follow, so short words that
       merely begin with those letters are left alone. */
    .replace(/(^|[\s(«"'،.:;-])(?:[وفبكل])?ال(?=[ء-ي]{3,})/g, "$1");
}

/* ------------------------------------------- is this a contract at all?
 *
 * THE BUG THIS EXISTS TO CLOSE, AND WHO CAUSED IT.
 *
 * Paste "أنا أحب القطط والقهوة… راتبي الشهري ثمانية آلاف ريال والعمل الإضافي
 * والإجازة السنوية وفترة التجربة كلها كلمات موجودة هنا لكن بلا سياق عقدي" and
 * the app returned 84/100 with four flagged clauses — probation, annual leave,
 * overtime, salary. Not one of them exists in that text. The reader is told
 * their contract scored 84 when they pasted a paragraph about cats.
 *
 * The matcher was asking "does this text MENTION probation?" when the only
 * question that matters is "does this document IMPOSE a probation term?" A
 * topic word is not a clause. That gap was always there and the rule
 * broadening in the previous change widened it: more vocabulary meant more
 * ways for ordinary prose to trip a rule, and the test that was supposed to
 * catch it used an English string with no contract vocabulary in it, so it
 * proved nothing about this case at all.
 *
 * THE FIX IS A GATE, NOT MORE PATTERNS. Before any clause rule runs, the text
 * has to look like a legal instrument: named parties, numbered clauses,
 * obligation language, a document title. These are STRUCTURE, and structure is
 * what prose about a contract does not have, however many of its words it
 * borrows. Measured across real contracts and adversarial prose, the two
 * separate cleanly — a formal contract shows all four signals, a plainly
 * worded one shows three, a single pasted clause shows two, and prose that
 * merely talks about work shows none. The bar is two.
 *
 * Note that the adversarial text contains the words "عقد" and "بند". That is
 * why the signals require them in STRUCTURAL position — "البند الأول",
 * "عقد عمل" — rather than anywhere at all.
 */
const DOC_SIGNALS = {
  /* Named parties. A contract has sides; a paragraph does not. */
  parties: /الطرف\s*(?:ال)?(?:أول|اول|ثاني|ثانى)|(?:أحد|احد|كلا|لأي\s*من|أي\s*من)\s*(?:ال)?طرفين|(?:ال)?طرفين\b|صاحب\s*(?:ال)?عمل|رب\s*(?:ال)?عمل|first\s*party|second\s*party|the\s*employer|the\s*employee|either\s*party|both\s*parties/i,
  /* Numbered clauses, in either language. */
  structure: /(?:البند|المادة|بند|مادة)\s*(?:ال)?(?:أول|اول|ثاني|ثالث|رابع|خامس|سادس|سابع|ثامن|تاسع|عاشر|\d+)|(?:^|\n)\s*\d+\s*[.)\-–]\s*\S|clause\s*\d+|article\s*\d+|section\s*\d+/i,
  /* Obligation language: the verbs that create duties rather than describe. */
  /* Obligation and contract-body language: the verbs that CREATE a duty or
     state a term, rather than describe one. "بوظيفة" and "يتقاضى" earn their
     place because a contract assigns a position and a wage, while prose about
     a job talks around them — measured against the adversarial and chatty
     samples, neither trips any of these. */
  obligation: /يلتزم|يتعهد|يحق\s*ل|يستحق|تنص|اتفق\s*الطرفان|أبرم|ابرم|بموجب\s*هذا|يعمل\s*(?:ال)?طرف|بوظيفة|يتقاضى|تبدأ\s*مدة|مدة\s*(?:ال)?عقد|shall\b|agrees?\s+to\b|undertakes?\b|hereby\b|position\s*of\b/i,
  /* The document naming itself. */
  title: /عقد\s*(?:عمل|توظيف|العمل)|اتفاقي(?:ة|ه)\s*(?:عمل|توظيف)|employment\s*(?:contract|agreement)|offer\s*letter|contract\s*of\s*employment/i,
};

/* Two of four. Deliberately low: the cost of turning away a real contract is
   far higher than the cost of analysing an unusual one, and the measured gap
   between a real contract (3-4) and prose about work (0) is wide enough that
   two is not a close call. Both the raw text and the normalised form are
   tested, for the same reason the clause rules are. */
function looksLikeContract(text){
  const raw = String(text || ""), alt = normAr(raw);
  const hit = Object.keys(DOC_SIGNALS).filter(k =>
    DOC_SIGNALS[k].test(raw) || DOC_SIGNALS[k].test(alt));
  return { ok: hit.length >= 2, signals: hit };
}

/* The same rule, compiled against normalised Arabic. Built once per rule and
   cached on the rule itself, because rebuilding seventeen RegExps on every
   analysis is work with a known answer. */
function ruleN(rule){
  if (!rule._reN) rule._reN = new RegExp(normAr(rule.re.source), rule.re.flags);
  return rule._reN;
}

/* Global variants, so every match can be walked rather than only the first.
   Built once per rule and cached, like the normalised patterns. */
function withG(re){ return new RegExp(re.source, re.flags.includes("g") ? re.flags : re.flags + "g"); }
function ruleG(rule){  if (!rule._reG)  rule._reG  = withG(rule.re);        return rule._reG; }
function ruleGN(rule){ if (!rule._reGN) rule._reGN = withG(ruleN(rule));    return rule._reGN; }

/* The disqualifier, in the form matching the text being scanned. */
function ruleUnlessN(rule, normalised){
  if (!rule.unless) return null;
  if (!normalised) return rule.unless;
  if (!rule._unN) rule._unN = new RegExp(normAr(rule.unless.source), rule.unless.flags);
  return rule._unN;
}

/* A rule fires when its pattern matches AND its disqualifier does not appear
   NEAR the match.
 *
 * The window matters. Checking `unless` against the whole document would let
 * one mutual clause anywhere silence a genuinely one-sided clause elsewhere;
 * checking only the matched span would miss the qualifier sitting three words
 * to the left, which is exactly where "لأي من الطرفين" sits. 160 characters
 * either side is about one clause in a Saudi contract.
 *
 * WHY THIS EXISTS. A contract read "فترة التجربة تسعون يوماً، يجوز خلالها لأي
 * من الطرفين إنهاء العقد دون إشعار أو مكافأة" — an ordinary, lawful, EXPLICITLY
 * MUTUAL probation clause. The app raised a red flag saying one party appeared
 * able to end the contract unilaterally, cited Article 80 at it, scored the
 * contract 44/100, told the reader to see a lawyer, and offered to sell them a
 * letter demanding the clause be changed. The pattern had matched "إنهاء … دون"
 * and could not see the four words in front of it.
 *
 * A false red flag is the most expensive thing this product can produce. It
 * frightens someone about a term that is fine, and it does it in the same
 * breath as asking for money. */
/* Only used when a clause boundary cannot be found — see clauseAround(). */
const GUARD_WINDOW = 160;

/* The text of the CLAUSE the match sits in, bounded by the nearest sentence or
   line break on each side.
 *
 * A fixed character window was the first attempt and it was wrong in a way
 * that mattered: 160 characters reaches comfortably into the previous clause,
 * so a contract reading "clause 3: either party may terminate on notice /
 * clause 9: however the Company may terminate at any time without cause" let
 * clause 3's mutuality excuse clause 9 — hiding the single worst term in the
 * document. A qualifier governs the sentence it is in. */
function clauseAround(src, at, end){
  /* A full stop between two digits is a decimal point, not the end of a
     sentence. Without this, "الراتب 10.500 ريال" gets cut in half and the
     quote we show the reader starts mid-number — which reads as a bug in the
     one place the product is asking to be trusted. */
  const isBreak = (i) => {
    const ch = src[i];
    if (ch === "\n" || ch === "؟" || ch === "!" || ch === "؛") return true;
    if (ch !== ".") return false;
    return !(/\d/.test(src[i-1] || "") && /\d/.test(src[i+1] || ""));
  };
  let from = 0;
  for (let i = at - 1; i >= 0 && at - i <= 600; i--){
    if (isBreak(i)){ from = i + 1; break; }
  }
  let to = src.length;
  for (let i = end; i < src.length && i - end <= 600; i++){
    if (isBreak(i)){ to = i; break; }
  }
  /* One unbroken run of text with no punctuation at all: fall back to the
     fixed window rather than handing the guard the whole document. */
  if (to - from > 900){
    from = Math.max(0, at - GUARD_WINDOW);
    to = Math.min(src.length, end + GUARD_WINDOW);
  }
  return src.slice(from, to);
}

function ruleFires(rule, text, alt){
  /* The guard is normalised for the normalised pass, for exactly the reason
     the pattern is: "لأي" becomes "لاي" once the alef forms are unified, so a
     guard written in un-normalised Arabic silently never matches there. That
     is the same asymmetry that broke the clause patterns, and it costs more
     here — a guard that quietly fails does not miss a clause, it raises a
     false alarm.

     EVERY match is examined, not just the first. A contract can say "either
     party may terminate on notice" in clause 3 and "the Company may terminate
     at any time without cause" in clause 9. Stopping at the first match let
     the mutual clause vouch for the one-sided one, which is a worse failure
     than the false positive this guard was written to fix: it hides the
     clause the reader most needs to see. */
  /* The RAW text is scanned first and its clause is the one quoted back, so the
     reader sees their own words rather than the normalised form — which has had
     its hamzas flattened and its ال stripped and would look like a typo. */
  const pairs = [[text, ruleG(rule), rule.unless ? ruleUnlessN(rule, false) : null, true],
                 [alt,  ruleGN(rule), rule.unless ? ruleUnlessN(rule, true)  : null, false]];
  for (const [src, pat, guard, verbatim] of pairs){
    pat.lastIndex = 0;
    let m;
    while ((m = pat.exec(src))){
      const clause = clauseAround(src, m.index, m.index + m[0].length);
      if (!guard || !guard.test(clause)){
        /* Only the un-normalised pass can be quoted. A match found only in the
           normalised text still fires the rule — it is the same clause — but
           quoting the mangled form would look like we misread the contract. */
        return { hit: true, quote: verbatim ? clause : null };
      }
      /* A zero-length match would spin forever. */
      if (m.index === pat.lastIndex) pat.lastIndex++;
    }
  }
  return { hit: false, quote: null };
}

/* THE SENTENCE FROM THEIR OWN CONTRACT, TIDIED FOR DISPLAY.
 *
 * Wodouh's whole proposition is "never take our word for it", and the result
 * screen was the one place a reader could not check: every flag on a pasted
 * contract showed a generic paragraph, and the matched text was shown only for
 * the built-in samples. That is also how a red flag came to fire on a clause
 * that said the opposite of what the flag claimed — shown the sentence, a
 * reader would have said "but it says either party".
 *
 * Capped rather than truncated mid-word, because a quote that ends in the
 * middle of a word reads as a rendering bug and undermines the thing it is
 * there to establish. */
const QUOTE_MAX = 260;

/* Samples carry an authored {ar,en} quote; a pasted contract carries the
   reader's own sentence as a plain string. Both render the same way, and BOTH
   are escaped — the pasted one is text out of a document, and a document is
   not something this app gets to hand to innerHTML. */
function quoteHtml(c){
  const raw = typeof c.q === "string" ? c.q : (c.q && c.q[lang]);
  if (!raw) return "";
  const m = lang === "ar" ? ["\u00AB","\u00BB"] : ["\u201C","\u201D"];
  /* Marked when it is the reader's own text, so "from your contract" can be
     said rather than implied. */
  const own = typeof c.q === "string" ? ` data-own="1" data-label="${esc(t("q_own"))}"` : "";
  return `<div class="quote"${own}>${m[0]}${esc(raw)}${m[1]}</div>`;
}

function tidyQuote(sc){
  let q = String(sc || "").replace(/\s+/g, " ").trim();
  /* Drop a leading clause label — "البند الخامس:" — which is scaffolding
     rather than the term itself. */
  q = q.replace(/^(?:ال)?(?:بند|مادة)\s*(?:ال)?\S+\s*[:\-–]\s*/i, "")
       .replace(/^(?:clause|article|section)\s*\d+\s*[:.\-–]\s*/i, "");
  if (q.length <= QUOTE_MAX) return q;
  const cut = q.slice(0, QUOTE_MAX);
  const sp = cut.lastIndexOf(" ");
  return (sp > QUOTE_MAX * 0.6 ? cut.slice(0, sp) : cut).trim() + "…";
}

function analyzePasted(text){
  const clauses = [];
  /* Carry the whole rule through, minus its matcher. Copying a hand-picked
     subset silently dropped `src` (so pasted contracts cited nothing) and
     `r` (so signed-mode readers got negotiation advice instead of their
     rights). A rule gaining a field should not need an edit here. */
  /* THE GATE. Before a single clause rule runs: is this a legal instrument at
     all? Keyword matching on prose that merely talks about work is how a
     paragraph about cats scored 84/100. */
  if (!looksLikeContract(text).ok) return null;

  /* Normalised once, not per rule: seventeen regexes over a 40 KB contract is
     already the hot path here. BOTH sides go through the same transform —
     normalising the text alone was the first attempt and it made things worse,
     because the patterns are written in un-normalised Arabic and stopped
     meeting the text they were built to match. */
  const alt = normAr(text);
  for (const rule of RULES){
    if (!forTrack(rule)) continue;
    const fired = ruleFires(rule, text, alt);
    if (!fired.hit) continue;
    const { re, unless, _reN, _reG, _reGN, _unN, ...rest } = rule;
    /* A plain string, not the bilingual {ar,en} the samples carry: this is the
       reader's own sentence and it exists in exactly one language — theirs. */
    const q = fired.quote ? tidyQuote(fired.quote) : null;
    clauses.push({ ...rest, q: q || null });
  }
  /* Nothing recognised means we cannot honestly score this text. Returning null
     routes to the "couldn't read" screen instead of inventing a verdict. */
  if (!clauses.length) return null;
  clauses.sort((x,y)=>({red:0,amber:1,green:2}[x.s]-{red:0,amber:1,green:2}[y.s]));
  let score = 100;
  for (const c of clauses) score -= c.s==="red" ? 16 : c.s==="amber" ? 8 : 0;
  score = Math.max(25, Math.min(95, score));
  const reds = clauses.filter(c=>c.s==="red").length, ambers = clauses.filter(c=>c.s==="amber").length;
  let verdict;
  if (reds) verdict = {ar:"فيه بنود تحتاج وقفة قبل التوقيع — اقرأ التنبيهات الحمراء أولًا.",
                       en:"Some clauses need a pause before signing — read the red flags first."};
  else if (ambers) verdict = {ar:"لا يوجد ما يقلق — لكن فيه نقاط تستاهل التفاوض.",
                              en:"Nothing alarming — but a few points are worth negotiating."};
  else verdict = {ar:"ما وجدنا مؤشرات خطر في النص المرسل.",en:"We found no risk signals in the submitted text."};
  const vsigned = reds
    ? {ar:"فيه بنود تستحق الاعتراض — ابدأ بالتنبيهات الحمراء.",en:"Some clauses are worth contesting — start with the red flags."}
    : ambers
      ? {ar:"لا يوجد ما يقلق — لكن فيه نقاط تستحق المتابعة.",en:"Nothing alarming — but a few points are worth following up."}
      : {ar:"ما وجدنا مؤشرات خطر في النص المرسل.",en:"We found no risk signals in the submitted text."};
  return { score, doc:"doc_pasted", verdict, vs:vsigned, clauses };
}

/* --------------------------------------------------------------- state */
let lang = "ar";
let current = null;

/* An unknown key used to throw, which took a whole screen down with it.
   Fail visibly but harmlessly instead. */
function t(k){ const e = T[k]; return e ? e[lang] : ""; }

/* For the few places where a dynamic value is interpolated into markup. */
/* DIGITS STAY LATIN, IN BOTH LANGUAGES.
 *
 * Arabic renders numerals as ٠١٢٣ by default, and the app used to follow that
 * — except the score ring, which stayed Latin, so the largest number on the
 * result screen was the one thing that did not match its own page. The product
 * owner's call is Latin everywhere: readers here move between Arabic contracts,
 * bank apps and government portals that mostly use Latin digits, and a figure
 * you have to re-read is a figure you do not trust.
 *
 * The -u-nu-latn extension keeps everything else Arabic — month names, ordering,
 * the grouping separator — and changes only the digits. Swapping wholesale to
 * an English locale would have turned "١٩ فبراير" into "19 February" inside an
 * Arabic sentence. */
const AR_NUM  = "ar-SA-u-nu-latn";
const AR_DATE = "ar-SA-u-ca-gregory-nu-latn";

function esc(s){
  return String(s).replace(/[&<>"']/g, c =>
    ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
}

function applyLang(){
  document.documentElement.lang = lang;
  document.documentElement.dir = lang==="ar" ? "rtl" : "ltr";
  document.title = lang==="ar" ? "وضوح — Wodouh" : "Wodouh — وضوح";
  document.getElementById("langToggle").textContent = lang==="ar" ? "English" : "عربي";
  document.querySelectorAll("[data-t]").forEach(el=>{ el.textContent = t(el.dataset.t); });
  document.getElementById("pasteBox").placeholder = t("paste_ph");
  const h = new Date().getHours();
  document.getElementById("greet").textContent =
    t(h < 12 ? "greet_m" : h < 17 ? "greet_a" : "greet_e");
  document.documentElement.style.setProperty("--dir", lang==="ar" ? "-1" : "1");
  renderNoread();
  document.getElementById("offlineNotice").textContent = t("offline");
  document.getElementById("deskTitle").textContent = t("desk_title");
  document.getElementById("deskSub").textContent = t("desk_sub");
  document.getElementById("deskMeta").textContent = t("desk_meta");
  renderOnboard();
  renderMode();
  renderHomeReminders();
  renderTabs(); renderMyContracts(); renderLib(); renderNat(); renderTimely();
  renderPrivacyCopy();
  if (document.getElementById("accPlan")) renderAccount();
  if (chat.length) renderAssist();
  renderPlans(); renderBiz();
  renderEos(); if (document.getElementById("eosOut").innerHTML) calcEos();
  if (eosData){ renderCase(); renderCaseDoc(); }
  /* Unconditional: the paywall serves three flows, and two of them have no
     `current` contract. It guards its own missing state. */
  renderPaywall();
  renderDesk(); renderLawyerTease();
  renderInstallHint();
  /* Language is a pure re-render, so every live termination screen redraws
     from the same state rather than keeping stale strings. */
  if (term){
    renderTermHow(); renderTermQ(); renderTermEv(); renderAiPanel();
    if (has("term") && aiRvState !== "working"){ renderTermResult(); renderTermDoc(); renderTermLtr(); }
  }
  if (current){
    renderResult(false); renderClauses(); renderFeedback();
    renderLetter(); renderTimeline();
    syncAddButtons(); renderBuilder();
  }
}
/* Language is a pure re-render. It must never re-run boot: doing so re-read
   localStorage into TRACKED and re-bound the scroll, drag-drop and pointer
   listeners once per toggle. */
function toggleLang(){ lang = lang==="ar" ? "en" : "ar"; applyLang(); }

function show(name, back){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active","back","lateral","dragging","settling"));
  const el = document.getElementById("screen-"+name);
  el.classList.add("active");
  if (back) el.classList.add("back");
  if (lateralNav) el.classList.add("lateral");
  el.style.transform = "";
  window.scrollTo(0,0);
  const h = el.querySelector("h1,h2");
  if (h){ h.setAttribute("tabindex","-1"); h.focus({ preventScroll:true }); }
  if (name==="result") animateRing();
  if (typeof renderBuilder === "function") renderBuilder();
  if (typeof renderTabs === "function") renderTabs();
  if (typeof renderAskEntry === "function") renderAskEntry();
  if (typeof renderSituations === "function") renderSituations();
  if (typeof armReveals === "function") requestAnimationFrame(()=>armReveals(el));
}

/* Haptics where a real device would buzz: a decision landed, not every tap. */
function buzz(ms){ if (navigator.vibrate) try { navigator.vibrate(ms); } catch(e){} }

/* ---------------------------------------------------------- onboarding */
let obIndex = 0;
/* The two tracks, as onboarding choices. Rendered into the card rather than
   bolted beside it so the dots, the art and the advance button keep working
   exactly as they did for the three cards that came before. */
/* The nationality question is only meaningful at the moment it changes an
   answer. Asked at the front door it is a toll; asked here it is obviously
   the reason we can be specific.

   Anything that would produce a divergent answer routes through this first,
   so the original guarantee holds in a stronger form: we never render law
   for an unknown track, and the question arrives with its consequence
   visible rather than in the abstract. */
let pendingAfterTrack = null;

function needsTrack(resume){
  if (nat) return false;
  pendingAfterTrack = resume || null;
  obIndex = OB.findIndex(o => o.pick);
  natGate = true;
  renderOnboard();
  show("onboard");
  return true;
}

function resumeAfterTrack(){
  natGate = false;
  const go = pendingAfterTrack;
  pendingAfterTrack = null;
  if (typeof go === "function") go(); else show("home");
}

let natGate = false;

function renderObPick(slide){
  const box = document.getElementById("obPick");
  const next = document.getElementById("obNext");
  if (!slide.pick){
    box.hidden = true;
    next.disabled = false;
    return;
  }
  box.hidden = false;
  box.innerHTML = "";
  [["sa","nat_sa","nat_sa_d"],["nonsa","nat_nonsa","nat_nonsa_d"]].forEach(([id,label,desc])=>{
    const b = document.createElement("button");
    b.type = "button";
    b.className = "ob-choice" + (nat === id ? " on" : "");
    b.setAttribute("aria-pressed", nat === id ? "true" : "false");
    b.innerHTML = `<b></b><span></span>`;
    b.querySelector("b").textContent = t(label);
    b.querySelector("span").textContent = t(desc);
    b.onclick = ()=>{
      /* First choice, so assign directly — setNat() is for changing one. */
      nat = id; buzz(8); saveState();
      renderNat(); renderLib();
      if (natGate){ resumeAfterTrack(); return; }
      renderOnboard();
    };
    box.appendChild(b);
  });
  /* Answering here is welcome but not required. The guarantee that nobody is
     shown the wrong law is enforced where the law actually diverges — see
     needsTrack() — not by blocking the front door before anyone has seen
     what Wodouh does. */
  next.disabled = false;
}

function renderOnboard(){
  const s = OB[obIndex];
  document.getElementById("obArt").innerHTML = s.art;
  document.getElementById("obTitle").textContent = s.title[lang];
  document.getElementById("obSub").textContent = s.sub[lang];
  document.getElementById("obSkip").textContent = t("ob_skip");
  document.getElementById("obNext").textContent = obIndex === OB.length-1 ? t("ob_start") : t("ob_next");
  document.getElementById("obSkip").style.visibility = obIndex === OB.length-1 ? "hidden" : "visible";
  /* Reached as a gate rather than as a tour: the dots and the advance button
     would both be lying about where the reader is, so neither appears. The
     only way on is to answer, which is the whole point of being here. */
  document.getElementById("obDots").hidden = natGate;
  document.getElementById("obNext").hidden = natGate;
  if (natGate){
    document.getElementById("obTitle").textContent = t("nat_gate_h");
    document.getElementById("obSub").textContent = t("nat_gate_b");
  }
  renderObPick(s);
  const dots = document.getElementById("obDots");
  dots.innerHTML = "";
  OB.forEach((_,i)=>{
    const d = document.createElement("button");
    if (i===obIndex) d.className = "on";
    d.setAttribute("aria-label", (i+1)+" / "+OB.length);
    d.onclick = ()=>{ obIndex = i; renderOnboard(); };
    dots.appendChild(d);
  });
}
function obNext(){
  if (obIndex < OB.length-1){ obIndex++; renderOnboard(); }
  else show("home");
}

/* Skipping the tour is fine; skipping the question is not, because the answer
   decides which law we show. Skip therefore jumps to the choice. */
function obSkip(){ show("home"); }

function pasteChanged(){
  /* The button stays live; if the text is too short we say so rather than
     greying out and leaving the user to guess. */
  const short = document.getElementById("pasteBox").value.trim().length < 40;
  document.getElementById("analyzeBtn").classList.toggle("soft", short);
}

/* ------------------------------------------------------------- analyze */
function analyze(kind){
  /* Which rules apply depends on the track, so ask before reading rather
     than after, and come straight back here with the same contract. */
  if (needsTrack(()=>analyze(kind))) return;
  const notice = document.getElementById("offlineNotice");
  if (navigator.onLine === false){ notice.hidden = false; return; }
  notice.hidden = true;
  if (kind === "pasted" && document.getElementById("pasteBox").value.trim().length < 40){
    const hint = document.querySelector("#screen-home .paste-hint");
    hint.classList.remove("nudge"); void hint.offsetWidth; hint.classList.add("nudge");
    document.getElementById("pasteBox").focus();
    return;
  }
  const pastedText = kind==="pasted" ? document.getElementById("pasteBox").value : null;
  const result = kind==="pasted" ? analyzePasted(pastedText) : SAMPLES[kind];
  if (!result){                      /* nothing recognised — never fake a score */
    current = null;
    runLoading(()=>{ buzz(12); show("noread"); });
    return;
  }
  current = result;
  /* Only a pasted contract can be re-analysed: a sample's clauses are
     authored, not matched, so switching track must not rewrite them. */
  current.srcText = pastedText;
  fbState = "ask";
  /* A new contract is a new letter, so the single-letter tier is spent. The
     pack was sold as covering further contracts for six months, so it is the
     one thing that survives this reset — that is what was bought. */
  if (!packLive()) owned.letter = null;
  pwPlan = 0;
  letterSet = new Set();
  runLoading(()=>{
    renderResult(true); renderClauses(); renderFeedback();
    recordContract(); renderMyContracts();
    buzz(negotiables().length ? 12 : [10,60,18]);   /* lighter double-tap when all clear */
    show("result");
  });
}

function runLoading(done){
  const sk = document.getElementById("skel");
  if (sk){ sk.classList.remove("fading"); sk.hidden = false; }
  show("loading");
  const steps = T.load_steps[lang].slice();
  if (current) steps.splice(1, 0, t("load_" + current.doc.replace("doc_","")));
  let i = 0;
  const el = document.getElementById("loadStep"), fill = document.getElementById("loadFill");
  el.textContent = steps[0];
  fill.style.width = "0%";
  requestAnimationFrame(()=>{ fill.style.width = (100/steps.length) + "%"; });
  const iv = setInterval(()=>{
    i++;
    fill.style.width = Math.min(100, ((i+1)/steps.length)*100) + "%";
    if (i < steps.length) el.textContent = steps[i];
    else {
      clearInterval(iv);
      const sk2 = document.getElementById("skel");
      if (sk2 && !REDUCED.matches){ sk2.classList.add("fading"); }
      done();
    }
  }, 380);
}

function retryPaste(){
  show("home", 1);
  const box = document.getElementById("pasteBox");
  box.value = ""; pasteChanged(); box.focus();
}

/* -------------------------------------------------------------- render */
const ICONS = {
  red:'<svg viewBox="0 0 14 14" fill="none"><path d="M7 3v5M7 10.6v.4" stroke="var(--on-teal)" stroke-width="2.2" stroke-linecap="round"/></svg>',
  amber:'<svg viewBox="0 0 14 14" fill="none"><path d="M7 3v4.5M7 10.6v.4" stroke="var(--on-teal)" stroke-width="2.2" stroke-linecap="round"/></svg>',
  green:'<svg viewBox="0 0 14 14" fill="none"><path d="M3.2 7.4l2.6 2.6 5-5.6" stroke="var(--on-teal)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>'
};

/* Escalation is graded by what we actually found: a red flag means this can
   become a dispute, and saying so plainly matters more than any disclaimer. */
function renderEscalate(target){
  const el = document.getElementById(target === "case" ? "caseEscalate" : "escalate");
  if (!el) return;
  const reds = target === "case" ? 1 : (current ? current.clauses.filter(c=>c.s==="red").length : 0);
  el.hidden = !reds;
  if (!reds) return;
  el.innerHTML =
    `<span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="var(--on-teal)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3 19c.9-3 3.2-4.4 6-4.4S14.1 16 15 19"/><path d="M17 8h5M19.5 5.5v5"/></svg></span>
     <div><b>${t("esc_head")}</b><p>${t("esc_body")}</p>
       <button class="esc-cta" onclick="openAssist('${target === "case" ? "case" : "result"}')">${t("esc_cta")}</button>
     </div>`;
}

/* Nothing is shown without saying where it came from. Two kinds, and the
   difference is deliberate and visible: a legal claim cites the article, and
   only articles verified in docs/legal-sources.md are ever cited that way.
   Everything else is Wodouh's own reading and says so, rather than borrowing
   authority it does not have. */
function srcOf(c){
  return c.src
    ? `<div class="src-line law">${t("govern_by")}: ${esc(c.src[lang])}</div>`
    : `<div class="src-line method">${t("src_method")}</div>`;
}

function scoreBand(n){ return n>=80 ? "great" : n>=60 ? "good" : n>=40 ? "fair" : "poor"; }

/* People do not open a contract wanting a number — they want to know whether
   they can sign. The decision is what the card leads with; the score stays
   directly beneath it as the supporting detail.

   Nothing new is computed here. The three states are read off the same
   clause data the flags already render, and the "lawyer" threshold matches
   renderEscalate, so the band and the existing escalation CTA can never
   disagree. */
function decide(a){
  const reds = a.clauses.filter(c=>c.s==="red").length;
  const ambers = a.clauses.filter(c=>c.s==="amber").length;
  if (reds >= 2 || (reds === 1 && a.score < 50)) return "lawyer";
  if (reds || ambers) return "negotiate";
  return "safe";
}

/* Confidence is about how much of the document we actually recognised, and
   it is never a fabricated percentage. A curated sample is a known quantity.
   Pasted text is only as trustworthy as the number of clauses matched, so we
   say what we matched and let the reader judge. */
function confidence(a){
  if (a.doc !== "doc_pasted") return { level:"high", n:a.clauses.length };
  const n = a.clauses.length;
  return { level: n >= 4 ? "med" : "low", n:n };
}

/* Picks the right inflected form for a counted noun. English collapses to a
   single plural, so the same four keys serve both languages. */
/* A service duration, with both nouns inflected. Zero months is dropped
   entirely — "6 سنوات و0 شهر" says nothing that "6 سنوات" does not. */
function svcText(y, m){
  const yr = countNoun("eos_y", y);
  if (!m) return yr;
  return t("eos_yrs_join").replace("{y}", yr).replace("{m}", countNoun("eos_m", m));
}

function countNoun(stem, n){
  const form = n === 1 ? "_1" : n === 2 ? "_2" : n <= 10 ? "_p" : "_m";
  return t(stem + form).replace("{n}", fmtNum(n));
}

const DC_ICON = {
  safe:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg>',
  negotiate:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 7v6M12 16.5v.2"/><circle cx="12" cy="12" r="9"/></svg>',
  lawyer:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 16H3z"/><path d="M12 10v4M12 17v.2"/></svg>'
};

function renderDecision(){
  const d = decide(current);
  const reds = current.clauses.filter(c=>c.s==="red").length;
  const ambers = current.clauses.filter(c=>c.s==="amber").length;
  const box = document.getElementById("decision");
  box.dataset.state = d;
  document.querySelector(".score-card").dataset.decision = d;
  /* Also on the screen, so blocks outside the card (the escalation panel)
     can pick up the same palette. */
  document.getElementById("screen-result").dataset.decision = d;
  document.getElementById("dcIcon").innerHTML = DC_ICON[d];
  /* Already-signed users are not deciding whether to sign, so the same
     finding is framed as what they can still act on. */
  document.getElementById("dcLabel").textContent = t(signedMode ? "dc_"+d+"_s" : "dc_"+d);

  let why;
  if (d === "safe") why = t("dc_why_none");
  else {
    const parts = [];
    if (reds) parts.push(countNoun("dc_red", reds));
    if (ambers) parts.push(countNoun("dc_amber", ambers));
    why = parts.join(t("dc_join"));
  }
  document.getElementById("dcWhy").textContent = why;

  /* The level drives the styling, so "we barely read this" cannot be styled as
     a footnote by a later CSS edit — the class is data, not decoration. */
  const c = confidence(current);
  const conf = document.getElementById("dcConf");
  conf.dataset.level = c.level;
  conf.textContent = "";
  if (c.level === "low"){
    /* An icon, because at a glance the shape of a warning reads before its
       words do — and this is the line a reader is least likely to stop for. */
    const ic = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    ic.setAttribute("viewBox", "0 0 24 24");
    ic.setAttribute("fill", "none");
    ic.setAttribute("stroke", "currentColor");
    ic.setAttribute("stroke-width", "2.2");
    ic.setAttribute("stroke-linecap", "round");
    ic.setAttribute("aria-hidden", "true");
    ic.innerHTML = '<path d="M12 8v5M12 16.5v.2"/><circle cx="12" cy="12" r="9"/>';
    conf.appendChild(ic);
    const sp = document.createElement("span");
    sp.textContent = t("dc_conf_low").replace("{n}", countNoun("dc_cl", c.n));
    conf.appendChild(sp);
  } else {
    conf.textContent = t("dc_conf_" + c.level).replace("{n}", countNoun("dc_cl", c.n));
  }
}

/* Which single action we recommend, given the decision. Everything else
   stays exactly where it is and stays clickable — this decides emphasis, not
   availability. Leading with a decision is hollow if five next steps then
   compete for it. */
const NEXT_OF = { safe:"trackTease", negotiate:"letterTease", lawyer:"escalate" };

function applyNextStep(d){
  const want = NEXT_OF[d];
  ["letterTease","trackTease","assistTease","escalate"].forEach(id=>{
    const el = document.getElementById(id);
    if (!el) return;
    /* A block that is not on screen is neither promoted nor dimmed — marking
       it either way would leave stale classes for the next render. */
    const shown = !el.hidden && el.style.display !== "none";
    const isNext = shown && id === want;
    el.classList.toggle("is-next", isNext);
    el.classList.toggle("demoted", shown && !!want && !isNext);
  });
  const chip = document.getElementById("nextChip");
  const host = document.querySelector(".is-next");
  if (chip){
    chip.remove();
  }
  if (host){
    const c = document.createElement("span");
    c.className = "next-chip";
    c.id = "nextChip";
    c.textContent = t("next_step");
    host.appendChild(c);
  }
}

function renderResult(reset){
  document.querySelector(".score-card").dataset.band = scoreBand(current.score);
  renderDecision();
  document.getElementById("verdict").textContent =
    (signedMode && current.vs ? current.vs : current.verdict)[lang];
  document.getElementById("docLabel").textContent = t(current.doc);
  if (reset){
    document.getElementById("scoreNum").textContent = "0";
    document.getElementById("ringVal").style.strokeDashoffset = "326.7";
  } else {
    setRing(current.score);
  }
  const clear = negotiables().length === 0;
  document.getElementById("letterTease").style.display = clear ? "none" : "flex";
  const ac = document.getElementById("allClear");
  ac.hidden = !clear;
  if (clear){
    document.getElementById("acTitle").textContent = t("ac_title");
    document.getElementById("acBody").textContent = t("ac_body");
  }
  /* With nothing to negotiate, reminders become the one clear next step. */
  document.getElementById("trackTease").classList.toggle("solo", clear);
  renderTrackTease();
  if (!clear) renderTease();
  renderEscalate("result");
  applyNextStep(decide(current));
  const wrap = document.getElementById("flags");
  wrap.innerHTML = "";
  current.clauses.forEach((c,idx)=>{
    const div = document.createElement("div");
    div.className = "flag " + c.s;
    const adv = adviceFor(c);
    const srcLine = srcOf(c) + costLine(c);
    const tip = adv
      ? `<div class="tip"><b>${t(signedMode ? "rights_label" : "what_to_do")}:</b> ${adv[lang]}</div>${srcLine}${addBtnHtml(idx)}`
      : srcLine;
    div.innerHTML =
      `<button aria-expanded="false" onclick="toggleFlag(this)">
         <span class="dot">${ICONS[c.s]}</span>
         <span class="ttl"><h4>${c.t[lang]}</h4></span>
         <span class="chev" aria-hidden="true">
           <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2"
                stroke-linecap="round" stroke-linejoin="round"><path d="M5 3l6 5-6 5"/></svg>
         </span>
       </button>
       <div class="advice">${quoteHtml(c)}<p>${c.p[lang]}</p>${tip}</div>`;
    div.style.setProperty("--d", Math.min(idx,6)*40 + "ms");
    wrap.appendChild(div);
  });
  /* Red flags are the reason the user opened the app — they stay open by
     default; everything else collapses so the verdict reads at a glance. */
  wrap.querySelectorAll(".flag.red").forEach(f=>{
    f.classList.add("open");
    const btn = f.querySelector("button"), panel = f.querySelector(".advice");
    btn.setAttribute("aria-expanded","true");
