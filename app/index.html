    --ar:'Noto Naskh Arabic','Geeza Pro','Amiri','Traditional Arabic',serif;
  }
  /* Warm dark theme — for the app's actual peak moment: reading a contract
     in bed the night before signing. Sand becomes the ink, not a grey invert. */
  @media (prefers-color-scheme: dark){
    :root{
      --teal:#3E9A8B; --teal-ink:#8FCBBE; --teal-soft:#1B2E2B;
      --sand:#141B19; --card:#1B2422;
      --amber:#D9A648; --amber-bg:#2E2618;
      --red:#C86F63; --red-bg:#2E1E1C;
      --green:#6BAE78; --green-bg:#1A2A1E;
      --amber-ink:#E3B865; --green-ink:#87C094;
      --ink:#EDE6D8; --ink-2:#A3ABA6;
      --line:#2B3633;
      --on-teal:#0F1614;
      --page:#0E1412;
      --e1:0 1px 2px rgba(0,0,0,.45);
      --e2:0 3px 10px rgba(0,0,0,.42), 0 12px 28px rgba(0,0,0,.34);
      --e3:0 20px 48px rgba(0,0,0,.55);
      --edge:inset 0 1px 0 rgba(255,255,255,.045);
      --shadow:var(--e1);
      --grain:.02;
    }
  }
  :root[data-theme="dark"]{
    --teal:#3E9A8B; --teal-ink:#8FCBBE; --teal-soft:#1B2E2B;
    --sand:#141B19; --card:#1B2422;
    --amber:#D9A648; --amber-bg:#2E2618;
    --red:#C86F63; --red-bg:#2E1E1C;
    --green:#6BAE78; --green-bg:#1A2A1E;
    --amber-ink:#E3B865; --green-ink:#87C094;
    --ink:#EDE6D8; --ink-2:#A3ABA6;
    --line:#2B3633;
    --on-teal:#0F1614;
    --page:#0E1412;
    --e1:0 1px 2px rgba(0,0,0,.45);
    --e2:0 3px 10px rgba(0,0,0,.42), 0 12px 28px rgba(0,0,0,.34);
    --e3:0 20px 48px rgba(0,0,0,.55);
    --edge:inset 0 1px 0 rgba(255,255,255,.045);
    --shadow:var(--e1);
    --grain:.02;
  }
  :root[data-theme="light"]{
    --teal:#1E6E64; --teal-ink:#134B44; --teal-soft:#DCE9E6;
    --sand:#F7F1E6; --card:#FDFAF3;
    --amber:#C9922E; --amber-bg:#F6EAD2;
    --red:#B4544A; --red-bg:#F3DFDC;
    --green:#4E8F5B; --green-bg:#E2EEE2;
    --amber-ink:#8A6114; --green-ink:#33663D;
    --ink:#2B3230; --ink-2:#5A625F;
    --line:#E8DFCE;
    --on-teal:#F7F1E6;
    --page:#EFE7D8;
    --e1:0 1px 2px rgba(74,60,40,.05), 0 1px 1px rgba(74,60,40,.03);
    --e2:0 2px 6px rgba(74,60,40,.055), 0 10px 24px rgba(74,60,40,.045);
    --e3:0 18px 44px rgba(74,60,40,.11);
    --edge:inset 0 1px 0 rgba(255,255,255,.6);
    --shadow:var(--e1);
    --grain:.035;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html[lang="ar"] body{font-family:var(--ar)}
  html[lang="en"] body{font-family:var(--en)}
  body{background:var(--page);color:var(--ink);line-height:1.7;-webkit-font-smoothing:antialiased;
       min-height:100vh;text-rendering:optimizeLegibility;font-kerning:normal}
  html[lang="en"] h1,html[lang="en"] h2,html[lang="en"] h3{letter-spacing:-.014em}
  h1,h2,h3,.verdict,.hello,.ob-title{text-wrap:balance}
  b,strong{font-weight:700}
  html[lang="ar"] b,html[lang="ar"] strong{font-weight:600}
  .app{max-width:440px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;
       padding:0 18px 28px;background-color:var(--sand);
       background-image:image-set(url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='140' height='140'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3CfeColorMatrix type='saturate' values='0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.5'/%3E%3C/svg%3E"));background-size:140px 140px;background-blend-mode:soft-light}
  @supports not (background-image: image-set(url("x"))){
    .app{background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='140' height='140'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3CfeColorMatrix type='saturate' values='0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.5'/%3E%3C/svg%3E")}
  }
  button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
  :focus-visible{outline:2px solid var(--teal);outline-offset:3px;border-radius:8px}
  ::selection{background:color-mix(in srgb, var(--teal) 22%, transparent);color:var(--ink)}
  .app{scrollbar-width:thin;scrollbar-color:var(--line) transparent}
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;
      transition-duration:.01ms !important;scroll-behavior:auto !important}
  }
  /* Desktop: the phone column becomes a framed device on a warm backdrop,
     with the brand promise alongside, so a laptop demo reads as intentional. */
  .desk-aside{display:none}
  @media (min-width:900px){
    body{display:flex;align-items:center;justify-content:center;gap:56px;padding:40px}
    .app{min-height:auto;height:min(880px,92vh);border-radius:38px;border:1px solid var(--line);
         box-shadow:var(--e3),var(--edge);overflow-y:auto;padding-bottom:20px;flex:none}
    .desk-aside{display:block;max-width:330px}
    .desk-aside .mk{width:58px;height:58px;margin-bottom:18px}
    .desk-aside h1{font-size:34px;color:var(--teal-ink);line-height:1.45;text-wrap:balance}
    .desk-aside p{margin-top:12px;color:var(--ink-2);font-size:15.5px}
    .desk-aside .meta{margin-top:20px;font-size:12.5px;color:var(--ink-2);border-top:1px solid var(--line);padding-top:14px}
  }

  /* top bar */
  .bar{display:flex;align-items:center;justify-content:space-between;padding:18px 2px 10px}
  .brand{display:flex;align-items:center;gap:10px}
  .brand svg{width:34px;height:34px}
  .brand .name-ar{font-family:var(--ar);font-size:22px;color:var(--teal-ink);line-height:1}
  .brand .name-en{font-family:var(--en);font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--teal);text-transform:uppercase}
  .lang-toggle{font-family:var(--en);font-size:13px;font-weight:700;color:var(--teal);background:var(--teal-soft);border-radius:999px;padding:7px 14px}
  html[lang="en"] .lang-toggle{font-family:var(--ar);font-size:15px;padding:5px 14px}

  .screen{display:none;flex:1;flex-direction:column}
  .screen.active{display:flex}

  /* home */
  .hello{margin:18px 2px 6px;font-size:24px;color:var(--teal-ink);line-height:1.5}
  .sub{color:var(--ink-2);font-size:15px;margin:0 2px 22px}
  .samples{display:grid;gap:10px}
  .sample{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:15px 16px;text-align:start;box-shadow:var(--e1),var(--edge);transition:border-color .18s,box-shadow .18s,transform .12s}
  .sample:hover{border-color:var(--teal);box-shadow:var(--e2),var(--edge)}
  .sample .ic{flex:none;width:42px;height:42px;border-radius:12px;background:var(--teal-soft);display:flex;align-items:center;justify-content:center}
  .sample .ic svg{width:22px;height:22px}
  .sample b{display:block;font-size:15.5px;color:var(--ink)}
  .sample span{font-size:12.5px;color:var(--ink-2)}
  .sample .go{margin-inline-start:auto;color:var(--teal);display:flex}
  .go svg{width:16px;height:16px}
  html[dir="rtl"] .go{transform:scaleX(-1)}
  .or{display:flex;align-items:center;gap:12px;color:var(--ink-2);font-size:13px;margin:20px 0 12px}
  .or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
  textarea{width:100%;min-height:120px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 16px;font:inherit;font-size:14px;color:var(--ink);resize:vertical;line-height:1.8}
  textarea:focus{outline:2px solid var(--teal);outline-offset:0;border-color:transparent}
  textarea::placeholder{color:var(--ink-2);opacity:.7}
  .paste-hint{font-size:12px;color:var(--ink-2);margin-top:7px;text-align:center}
  .primary{margin-top:14px;width:100%;background:var(--teal);color:var(--on-teal);font-weight:700;font-size:16px;
      border-radius:var(--r-lg);padding:16px;transition:opacity .15s,box-shadow .18s;box-shadow:var(--e2)}
  html[lang="en"] .primary{letter-spacing:.005em}
  .primary:hover{box-shadow:var(--e3)}
  .primary:disabled{opacity:.45;cursor:default}
  .disclaimer{margin-top:auto;padding-top:26px;text-align:center;font-size:12px;color:var(--ink-2)}

  /* onboarding */
  #screen-onboard{justify-content:flex-end;min-height:calc(100vh - 90px)}
  .ob-skip{align-self:flex-end;color:var(--ink-2);font-size:13.5px;font-weight:700;padding:8px 4px}
  html[lang="ar"] .ob-skip{font-size:15px;font-weight:400}
  .ob-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10px 8px}
  .ob-art{width:190px;height:190px;margin-bottom:28px;position:relative;display:flex;align-items:center;justify-content:center}
  .ob-art::before{content:"";position:absolute;inset:-14%;border-radius:50%;
      background:radial-gradient(circle at 50% 45%, var(--teal-soft) 0%, transparent 68%);opacity:.75}
  .ob-art svg{position:relative}
  .ob-title{font-size:24px;color:var(--teal-ink);line-height:1.5;max-width:320px}
  .ob-sub{font-size:15px;color:var(--ink-2);margin-top:10px;max-width:320px}
  .dots{display:flex;justify-content:center;gap:8px;margin:18px 0 16px}
  .dots button{width:8px;height:8px;border-radius:99px;background:var(--line);padding:0;transition:all .25s;
    box-sizing:content-box;border:18px solid transparent;background-clip:padding-box;margin:-18px}
  /* background-color, not the shorthand — the shorthand would reset the
     background-clip that keeps the 44px touch border invisible. */
  .dots button.on{width:22px;background-color:var(--teal)}

  /* loading */
  #screen-loading{align-items:center;justify-content:center;text-align:center}
  .lens-anim{width:84px;height:84px;margin-bottom:22px;animation:sway 1.6s ease-in-out infinite}
  @keyframes sway{0%,100%{transform:translateX(-9px) rotate(-4deg)}50%{transform:translateX(9px) rotate(4deg)}}
  .load-step{font-size:17px;color:var(--teal-ink);min-height:1.8em}
  .load-track{width:150px;height:2px;border-radius:2px;background:var(--line);margin:16px auto 0;overflow:hidden}
  .load-track span{display:block;height:100%;width:0;border-radius:2px;background:var(--teal);
      transition:width .62s cubic-bezier(.4,0,.2,1)}
  .load-sub{font-size:13px;color:var(--ink-2);margin-top:12px}

  /* result */
  .back{display:flex;align-items:center;gap:6px;color:var(--teal);font-size:14px;font-weight:700;padding:8px 2px;align-self:flex-start}
  html[dir="ltr"] .back .bk{transform:scaleX(-1)}
  .score-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-2xl);padding:26px 20px 20px;text-align:center;box-shadow:var(--e2),var(--edge);--band:var(--teal)}
  /* The score is the emotional centre of the app, so it carries the verdict's
     colour rather than a constant brand teal. */
  .score-card[data-band="great"]{--band:var(--green)}
  .score-card[data-band="good"]{--band:var(--teal)}
  .score-card[data-band="fair"]{--band:var(--amber)}
  .score-card[data-band="poor"]{--band:var(--red)}
  .score-card .share-mark{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:16px;
      padding-bottom:14px;border-bottom:1px solid var(--line)}
  .score-card .share-mark svg{width:17px;height:17px}
  .score-card .share-mark span{font-family:var(--en);font-size:10px;font-weight:800;letter-spacing:.22em;
      text-transform:uppercase;color:var(--teal);opacity:.9}
  .ring{width:120px;height:120px;margin:2px auto 12px;position:relative}
  .ring svg{transform:rotate(-90deg);overflow:visible}
  .ring circle.track{stroke:var(--line)}
  .ring circle.bezel{stroke:var(--line);opacity:.55}
  /* the arc carries a whisper of its own colour as light, never a gradient sweep */
  .ring circle.val{transition:stroke-dashoffset 1.15s cubic-bezier(.32,.72,.28,1);
      filter:drop-shadow(0 0 6px color-mix(in srgb, var(--band) 30%, transparent))}
  @supports not (color: color-mix(in srgb, red, blue)){ .ring circle.val{filter:none} }
  .ring .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .ring .num b{font-family:var(--en);font-size:36px;font-weight:800;letter-spacing:-.03em;
      color:var(--band);line-height:1;font-variant-numeric:tabular-nums}
  .ring .num i{font-style:normal;font-size:10.5px;color:var(--ink-2);direction:ltr;margin-top:3px;
      font-family:var(--en);letter-spacing:.06em}
  .verdict{font-size:18.5px;color:var(--ink);line-height:1.75;text-wrap:balance;margin-top:2px}
  .doc-label{display:inline-block;margin-top:12px;font-size:12.5px;color:var(--teal);background:var(--teal-soft);border-radius:999px;padding:4px 14px;font-weight:700}
  .legend{display:flex;justify-content:center;gap:14px;margin-top:14px;font-size:11.5px;color:var(--ink-2);flex-wrap:wrap}
  .legend i{font-style:normal;display:inline-block;width:9px;height:9px;border-radius:99px;margin-inline-end:5px}
  .flags{margin-top:16px;display:grid;gap:10px}
  /* One scannable line per clause; detail is one tap away (and always in full
     on the clause-by-clause screen), so the result reads at a glance. */
  .flag{border-radius:var(--r-lg);padding:0;text-align:start;overflow:hidden}
  .flag>button{display:flex;gap:12px;align-items:center;width:100%;padding:13px 15px;text-align:start}
  .flag .dot{flex:none;width:26px;height:26px;border-radius:999px;display:flex;align-items:center;justify-content:center}
  .flag .dot svg{width:13px;height:13px}
  .flag .ttl{flex:1;min-width:0}
  .flag h4{font-size:15px;color:var(--ink);line-height:1.45}
  .flag .chev{flex:none;color:var(--ink-2);display:flex;transition:transform .2s ease}
  .flag .chev svg{width:15px;height:15px}
  html[dir="rtl"] .flag .chev{transform:scaleX(-1)}
  .flag.open .chev{transform:rotate(90deg)}
  html[dir="rtl"] .flag.open .chev{transform:scaleX(-1) rotate(90deg)}
  .flag .advice{max-height:0;overflow:hidden;transition:max-height .28s ease}
  .flag .advice>*{margin:0 15px 12px;margin-inline-start:53px}
  .flag .advice p{font-size:13px;color:var(--ink-2);line-height:1.7}
  .advice .tip{background:var(--card);border-radius:12px;padding:10px 13px;font-size:13px;color:var(--ink);line-height:1.7}
  .advice .tip b{color:var(--teal-ink)}
  .flag.red{background:var(--red-bg)} .flag.red .dot{background:var(--red)}
  .flag.amber{background:var(--amber-bg)} .flag.amber .dot{background:var(--amber)}
  .flag.green{background:var(--green-bg)} .flag.green .dot{background:var(--green)}

  /* negotiation letter upsell + paywall */
  .letter-tease{display:flex;align-items:center;gap:12px;width:100%;background:var(--amber-bg);border:1px solid var(--amber);border-radius:var(--r-lg);padding:14px 16px;margin-top:14px;text-align:start;box-shadow:var(--shadow)}
  .letter-tease .lock{flex:none;width:38px;height:38px;border-radius:12px;background:var(--amber);display:flex;align-items:center;justify-content:center}
  .letter-tease .lock svg{width:19px;height:19px}
  .letter-tease b{display:block;font-size:14.5px;color:var(--ink)}
  .letter-tease span{font-size:12.5px;color:var(--ink-2)}
  .letter-tease .go{margin-inline-start:auto;color:var(--amber);display:flex}

  .pw-note{text-align:center;font-size:12.5px;color:var(--green);font-weight:700;margin:2px 0 12px}
  html[lang="ar"] .pw-note{font-weight:400;font-size:14px}
  .preview{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--r-xl);padding:22px;overflow:hidden;box-shadow:var(--e2),var(--edge)}
  .preview .ltr-head{font-size:13px;color:var(--ink-2);margin-bottom:10px}
  .preview .body{font-size:14px;line-height:1.9;color:var(--ink)}
  .preview .fog{filter:blur(5px);user-select:none;pointer-events:none}
  .preview .veil{position:absolute;inset:0;background:linear-gradient(to bottom,transparent 18%,var(--card) 82%)}
  .preview .veil-lock{position:absolute;inset-inline:0;bottom:18px;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--ink-2);font-size:13px}
  .preview .veil-lock .lk{width:40px;height:40px;border-radius:999px;background:var(--teal);display:flex;align-items:center;justify-content:center}
  .preview .veil-lock .lk svg{width:19px;height:19px}
  .plans{display:grid;gap:10px;margin-top:14px}
  .plan{display:flex;align-items:center;gap:12px;background:var(--card);border:2px solid var(--line);border-radius:var(--r-lg);padding:13px 15px;text-align:start;transition:border-color .15s}
  .plan.sel{border-color:var(--teal);background:var(--teal-soft)}
  .plan .radio{flex:none;width:20px;height:20px;border-radius:99px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center}
  .plan.sel .radio{border-color:var(--teal)}
  .plan.sel .radio::after{content:"";width:10px;height:10px;border-radius:99px;background:var(--teal)}
  .plan b{display:block;font-size:14.5px;color:var(--ink)}
  .plan span{font-size:12px;color:var(--ink-2);line-height:1.5;display:block}
  .plan .price{margin-inline-start:auto;font-family:var(--en);font-weight:800;font-size:16px;color:var(--teal-ink);white-space:nowrap}
  .plan .badge{display:inline-block;font-size:10.5px;font-weight:700;color:var(--amber-ink);background:var(--amber-bg);border-radius:99px;padding:1px 8px;margin-inline-start:6px;vertical-align:middle}
  .pay-methods{display:flex;justify-content:center;gap:8px;margin-top:10px;font-size:11.5px;color:var(--ink-2)}
  .pay-methods i{font-style:normal;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:2px 10px;font-family:var(--en);font-weight:700}
  .demo-tag{text-align:center;font-size:11.5px;color:var(--ink-2);margin-top:8px}

  /* unlocked letter */
  /* The letter is the artifact the user actually sends, so it is presented as
     stationery: letterhead, hairline rules, generous margins. The letterhead
     lives outside #letterBody so copying still yields clean text. */
  .letter{background:var(--card);border:1px solid var(--line);border-radius:var(--r-xl);padding:26px 24px 22px;box-shadow:var(--e2),var(--edge)}
  .letterhead{display:flex;align-items:center;justify-content:center;gap:8px;padding-bottom:16px;
      margin-bottom:20px;border-bottom:1px solid var(--line)}
  .letterhead svg{width:18px;height:18px}
  .letterhead span{font-family:var(--en);font-size:10px;font-weight:800;letter-spacing:.24em;
      text-transform:uppercase;color:var(--teal)}
  .letter .body{font-size:14.5px;line-height:2.05;color:var(--ink);white-space:pre-line}
  .letterfoot{margin-top:20px;padding-top:14px;border-top:1px solid var(--line);
      font-size:11px;color:var(--ink-2);text-align:center}
  .letter-actions{display:flex;gap:10px;margin-top:14px}
  .letter-actions .primary{margin-top:0;flex:1}
  .ghost{flex:1;border:2px solid var(--teal);color:var(--teal);border-radius:var(--r-lg);padding:13px;font-weight:700;font-size:15px}

  /* greeting + notices */
  .greet{font-size:14px;color:var(--teal);font-weight:700;margin:16px 2px -2px}
  html[lang="ar"] .greet{font-weight:400;font-size:15.5px}
  .notice[hidden]{display:none}
  .notice{background:var(--amber-bg);border:1px solid var(--amber);border-radius:var(--r-md);
          padding:11px 14px;margin-top:12px;font-size:13.5px;color:var(--ink)}

  /* all-clear celebration — the reward for a contract that needed no fight */
  .all-clear[hidden]{display:none}
  .all-clear{background:var(--green-bg);border-radius:var(--r-xl);padding:20px 18px;margin-top:16px;text-align:center}
  .all-clear .ac-tick{width:46px;height:46px;border-radius:999px;background:var(--green);
       display:flex;align-items:center;justify-content:center;margin:0 auto 12px;
       animation:pop .5s cubic-bezier(.2,1.4,.4,1) both}
  .all-clear .ac-tick svg{width:24px;height:24px}
  .all-clear b{display:block;font-size:17px;color:var(--ink)}
  .all-clear span{display:block;font-size:13.5px;color:var(--ink-2);margin-top:5px;line-height:1.7}
  @keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}

  /* could-not-read state — no score, by design */
  #screen-noread{justify-content:center;text-align:center}
  .nr-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px 6px}
  .nr-mark{width:64px;height:64px;opacity:.5;margin-bottom:18px}
  #screen-noread h2{font-size:22px;color:var(--teal-ink);line-height:1.5}
  #screen-noread p{font-size:15px;color:var(--ink-2);margin-top:8px;max-width:320px}
  .nr-tips{list-style:none;margin-top:20px;display:grid;gap:8px;text-align:start;width:100%;max-width:330px}
  .nr-tips li{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);
              padding:11px 14px;font-size:13.5px;color:var(--ink);display:flex;gap:9px;align-items:flex-start;box-shadow:var(--e1),var(--edge)}
  .nr-tips li::before{content:"";flex:none;width:6px;height:6px;border-radius:99px;background:var(--teal);margin-top:9px}
  .ghost.wide{width:100%;margin-top:10px;flex:none}

  /* motion: screens enter along the reading direction */
  .screen.active{animation:screen-in .3s cubic-bezier(.22,.7,.3,1) both}
  @keyframes screen-in{from{opacity:0;transform:translateX(calc(var(--dir,1) * 14px))}
                       to{opacity:1;transform:none}}
  .screen.active.back{animation-name:screen-back}
  @keyframes screen-back{from{opacity:0;transform:translateX(calc(var(--dir,1) * -14px))}
                         to{opacity:1;transform:none}}
  .flag,.tl-item{animation:settle .32s ease both;animation-delay:var(--d,0ms)}
  @keyframes settle{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .primary:active,.sample:active,.plan:active,.letter-tease:active,.track-tease:active,
  .ghost:active,.fb-btns button:active{transform:scale(.978)}
  .primary,.sample,.plan,.letter-tease,.track-tease,.ghost,.fb-btns button{transition:transform .12s ease}

  /* letter builder — reading the contract is how the letter gets written */
  .add-btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--teal);
      color:var(--teal);background:none;border-radius:999px;padding:7px 13px;font-size:12.5px;
      font-weight:700;transition:background .15s,color .15s,border-color .15s}
  html[lang="ar"] .add-btn{font-weight:400;font-size:14px}
  .add-btn svg{width:13px;height:13px}
  .add-btn.on{background:var(--teal);border-color:var(--teal);color:var(--on-teal)}
  .clause .add-btn{margin:2px 16px 14px}
  .advice .add-btn{margin-top:10px}

  .builder[hidden]{display:none}
  .builder{position:sticky;bottom:14px;z-index:5;display:flex;align-items:center;gap:12px;
      background:var(--teal);color:var(--on-teal);border-radius:var(--r-xl);padding:13px 15px;
      margin-top:14px;box-shadow:var(--e3);animation:rise .3s cubic-bezier(.2,1.2,.4,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .builder .bcount{flex:1;font-size:14px;font-weight:700}
  html[lang="ar"] .builder .bcount{font-weight:400;font-size:15.5px}
  .builder .bview{background:var(--on-teal);color:var(--teal);border-radius:12px;
      padding:9px 15px;font-size:13.5px;font-weight:700;white-space:nowrap}
  html[lang="ar"] .builder .bview{font-weight:400;font-size:15px}
  .builder.bump{animation:bump .32s ease}
  @keyframes bump{0%{transform:none}35%{transform:scale(1.035)}100%{transform:none}}

  .letter-tease.building .lock{background:var(--teal)}
  .letter-tease.building{background:var(--teal-soft);border-color:var(--teal)}
  .letter-tease.building .go{color:var(--teal)}

  /* end-of-service calculator */
  .form{display:grid;gap:12px;margin-bottom:16px}
  .fld{display:block}
  .fld>span{display:block;font-size:13px;color:var(--ink-2);margin-bottom:6px}
  .fld em{display:block;font-style:normal;font-size:11.5px;color:var(--ink-2);margin-top:5px;opacity:.85}
  .fld input{width:100%;background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);
      padding:13px 15px;font:inherit;font-size:15px;color:var(--ink);box-shadow:var(--e1),var(--edge)}
  .fld input:focus{outline:2px solid var(--teal);border-color:transparent}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .opts button{border:1px solid var(--line);background:var(--card);border-radius:var(--r-md);
      padding:11px 10px;font-size:13px;color:var(--ink);box-shadow:var(--e1),var(--edge);transition:border-color .15s}
  .opts button.on{border-color:var(--teal);background:var(--teal-soft);color:var(--teal);font-weight:700}
  html[lang="ar"] .opts button.on{font-weight:400}
  .opts button:first-child{grid-column:1/-1}

  .eos-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-2xl);
      padding:24px 20px 18px;margin-top:16px;text-align:center;box-shadow:var(--e2),var(--edge)}
  .eos-card .lbl{font-size:12.5px;color:var(--ink-2)}
  .eos-card .amt{font-family:var(--en);font-size:38px;font-weight:800;letter-spacing:-.03em;
      color:var(--teal-ink);line-height:1.15;margin-top:6px;font-variant-numeric:tabular-nums;direction:ltr}
  html[lang="ar"] .eos-card .amt{font-family:var(--ar);font-weight:600;direction:rtl}
  .eos-card .amt small{font-family:var(--en);font-size:15px;font-weight:700;letter-spacing:0;margin-inline-start:6px;color:var(--ink-2)}
  .eos-card .svc{font-size:13px;color:var(--ink-2);margin-top:8px;padding-bottom:16px;border-bottom:1px solid var(--line)}
  .rows{display:grid;gap:9px;margin-top:16px;text-align:start}
  .rows .r{display:flex;align-items:baseline;gap:10px;font-size:13.5px;color:var(--ink-2)}
  .rows .r span{flex:1;min-width:0}
  .rows .r b{font-family:var(--en);color:var(--ink);font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
  html[lang="ar"] .rows .r b{font-family:var(--ar);font-weight:600}
  .rows .r.tot{border-top:1px solid var(--line);padding-top:10px;margin-top:2px;color:var(--ink);font-size:14.5px}
  .rows .r.tot b{color:var(--teal-ink);font-size:16px}
  .eos-note{font-size:11.5px;color:var(--ink-2);margin-top:14px;line-height:1.65;text-align:start}

  /* termination triage */
  .triage{background:var(--card);border:1px solid var(--line);border-radius:var(--r-xl);
      padding:18px;margin-top:14px;box-shadow:var(--e1),var(--edge)}
  .triage h4{font-size:15px;color:var(--teal-ink);margin-bottom:12px}
  .tq{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .tq span{flex:1;font-size:13.5px;color:var(--ink)}
  .tq .yn{display:flex;gap:6px}
  .tq .yn button{border:1px solid var(--line);background:var(--sand);border-radius:999px;
      padding:6px 14px;font-size:12.5px;color:var(--ink-2);min-width:52px}
  .tq .yn button.on{background:var(--teal);border-color:var(--teal);color:var(--on-teal)}
  .verdict-box{border-radius:var(--r-lg);padding:14px 15px;margin-top:6px}
  .verdict-box.ok{background:var(--green-bg)} .verdict-box.warn{background:var(--amber-bg)}
  .verdict-box.act{background:var(--red-bg)}
  .verdict-box b{display:block;font-size:14.5px;color:var(--ink);margin-bottom:4px}
  .verdict-box p{font-size:13px;color:var(--ink-2);line-height:1.7}
  .clock{display:flex;gap:9px;align-items:flex-start;font-size:12.5px;color:var(--ink);
      background:var(--amber-bg);border-radius:var(--r-md);padding:11px 13px;margin-top:10px;line-height:1.65}
  .clock svg{flex:none;width:15px;height:15px;margin-top:3px;color:var(--amber)}

  /* plans */
  .seg{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px;margin-bottom:16px}
  .seg button{flex:1;border-radius:999px;padding:9px;font-size:13.5px;color:var(--ink-2);font-weight:700}
  html[lang="ar"] .seg button{font-weight:400;font-size:15px}
  .seg button.on{background:var(--teal);color:var(--on-teal)}
  .seg .save{font-size:10.5px;background:var(--amber-bg);color:var(--amber-ink);border-radius:999px;padding:1px 7px;margin-inline-start:6px}
  .plan-cards{display:grid;gap:12px}
  .pcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r-2xl);padding:20px 18px 17px;position:relative;box-shadow:var(--e1),var(--edge);transition:box-shadow .2s}
  .pcard.hi{border-color:var(--teal);box-shadow:var(--e2),var(--edge)}
  .pcard.biz{border-color:var(--amber)}
  .pcard .tag{position:absolute;top:-9px;inset-inline-start:18px;font-size:10.5px;font-weight:700;
      background:var(--teal);color:var(--on-teal);border-radius:999px;padding:2px 10px}
  html[lang="ar"] .pcard .tag{font-weight:400;font-size:11.5px}
  .pcard.biz .tag{background:var(--amber);color:var(--on-teal)}
  .pcard h3{font-size:17px;color:var(--teal-ink)}
  .pcard .d{font-size:12.5px;color:var(--ink-2);margin-top:2px}
  .pcard .price{margin-top:12px;display:flex;align-items:baseline;gap:5px;flex-wrap:wrap}
  .pcard .price b{font-family:var(--en);font-size:27px;color:var(--ink);font-variant-numeric:tabular-nums}
  .pcard .price i{font-style:normal;font-size:12.5px;color:var(--ink-2)}
  .pcard ul{list-style:none;margin-top:14px;display:grid;gap:7px}
  .pcard li{font-size:13px;color:var(--ink);display:flex;gap:9px;align-items:flex-start;line-height:1.55}
  .pcard li svg{flex:none;width:15px;height:15px;margin-top:3px;color:var(--green)}
  .pcard li.off{color:var(--ink-2);opacity:.65}
  .pcard li.off svg{color:var(--ink-2)}
  .pcard .cta{margin-top:15px;width:100%;border-radius:14px;padding:12px;font-weight:700;font-size:14.5px;
      background:var(--teal);color:var(--on-teal)}
  html[lang="ar"] .pcard .cta{font-weight:400;font-size:15.5px}
  .pcard.biz .cta{background:var(--amber)}
  .pcard .cta.owned{background:var(--teal-soft);color:var(--teal)}

  /* business workspace */
  .biz-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
  .trial-chip{display:inline-block;margin-top:5px;font-size:11.5px;color:var(--amber-ink);
      background:var(--amber-bg);border-radius:999px;padding:2px 10px}
  .biz-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:20px}
  .biz-stats .st{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:15px 8px;text-align:center;box-shadow:var(--e1),var(--edge)}
  .biz-stats .st b{display:block;font-family:var(--en);font-size:22px;color:var(--teal-ink);font-variant-numeric:tabular-nums}
  .biz-stats .st.warn b{color:var(--amber)}
  .biz-stats .st span{font-size:11px;color:var(--ink-2);line-height:1.4;display:block;margin-top:2px}
  .biz-h{font-size:15.5px;color:var(--teal-ink);margin:4px 2px 9px}
  .biz-note{font-size:12.5px;color:var(--ink-2);margin:-4px 2px 10px;line-height:1.6}
  .biz-list{display:grid;gap:9px;margin-bottom:20px}
  .brow{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);
      border-radius:var(--r-lg);padding:13px 14px;text-align:start;width:100%;box-shadow:var(--e1),var(--edge)}
  .brow .sc{flex:none;width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;
      font-family:var(--en);font-weight:800;font-size:15px;font-variant-numeric:tabular-nums}
  .brow .sc.great{background:var(--green-bg);color:var(--green)}
  .brow .sc.good{background:var(--teal-soft);color:var(--teal)}
  .brow .sc.fair{background:var(--amber-bg);color:var(--amber-ink)}
  .brow .sc.poor{background:var(--red-bg);color:var(--red)}
  .brow .tx{flex:1;min-width:0}
  .brow b{display:block;font-size:14px;color:var(--ink)}
  .brow span{font-size:11.5px;color:var(--ink-2)}
  .brow .status{font-size:10.5px;border-radius:999px;padding:2px 9px;white-space:nowrap;
      background:var(--teal-soft);color:var(--teal)}
  .brow .status.redline{background:var(--amber-bg);color:var(--amber-ink)}
  .seats{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
  .seat{width:38px;height:38px;border-radius:999px;background:var(--teal-soft);color:var(--teal);
      display:flex;align-items:center;justify-content:center;font-family:var(--en);font-weight:800;font-size:13px}
  .seat.add{background:none;border:1px dashed var(--line);color:var(--ink-2);font-weight:400;font-size:18px}
  .seats .n{font-size:12.5px;color:var(--ink-2);margin-inline-start:auto}

  /* AI legal assistant */
  .assist-entry{display:flex;align-items:center;gap:12px;width:100%;background:var(--card);
      border:1px solid var(--line);border-radius:var(--r-lg);padding:13px 15px;margin-top:14px;text-align:start;box-shadow:var(--shadow)}
  .assist-entry .ic{flex:none;width:38px;height:38px;border-radius:var(--r-sm);background:var(--teal);box-shadow:var(--e1);
      display:flex;align-items:center;justify-content:center}
  .assist-entry .ic svg{width:20px;height:20px}
  .assist-entry b{display:block;font-size:14.5px;color:var(--ink)}
  .assist-entry span span{font-size:12.5px;color:var(--ink-2)}
  .assist-entry .go{margin-inline-start:auto;color:var(--teal);display:flex}

  .caps{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
  .caps::-webkit-scrollbar{display:none}
  .caps button{flex:none;font-size:12.5px;color:var(--teal);background:var(--teal-soft);
      border:1px solid transparent;border-radius:999px;padding:7px 13px;white-space:nowrap}
  .caps button:hover{border-color:var(--teal)}

  .chat{flex:1;display:flex;flex-direction:column;gap:10px;padding:4px 0 12px;min-height:220px}
  .msg{max-width:86%;border-radius:var(--r-lg);padding:12px 14px;font-size:14px;line-height:1.75;white-space:pre-line}
  .msg.bot{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-start-start-radius:6px;color:var(--ink);box-shadow:var(--e1),var(--edge)}
  .msg.user{align-self:flex-end;background:var(--teal);color:var(--on-teal);border-start-end-radius:6px;box-shadow:var(--e1)}
  .msg .refs{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .msg .ref{font-size:11px;color:var(--teal);background:var(--teal-soft);border-radius:999px;padding:3px 10px}
  .msg .inline-cta{margin-top:11px;width:100%;background:var(--teal);color:var(--on-teal);
      border-radius:12px;padding:10px;font-size:13.5px;font-weight:700}
  html[lang="ar"] .msg .inline-cta{font-weight:400;font-size:14.5px}
  .typing{display:flex;gap:4px;align-items:center}
  .typing i{width:6px;height:6px;border-radius:99px;background:var(--ink-2);animation:blink 1s infinite}
  .typing i:nth-child(2){animation-delay:.15s} .typing i:nth-child(3){animation-delay:.3s}
  @keyframes blink{0%,60%,100%{opacity:.25}30%{opacity:1}}

  .quota{font-size:11.5px;color:var(--ink-2);text-align:center;padding:2px 0 8px}
  .quota.gate{background:var(--amber-bg);border:1px solid var(--amber);border-radius:14px;
      padding:14px;color:var(--ink);font-size:13.5px;text-align:center}
  .quota.gate b{display:block;font-size:15px;margin-bottom:4px}
  .quota.gate button{margin-top:10px;width:100%;background:var(--teal);color:var(--on-teal);
      border-radius:12px;padding:11px;font-weight:700;font-size:14px}
  html[lang="ar"] .quota.gate button{font-weight:400;font-size:15px}

  .ask-bar{display:flex;gap:8px;align-items:center}
  .ask-bar input{flex:1;background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);
      padding:13px 15px;font:inherit;font-size:14px;color:var(--ink);min-width:0}
  .ask-bar input:focus{outline:2px solid var(--teal);border-color:transparent}
  .ask-send{flex:none;width:46px;height:46px;border-radius:var(--r-md);background:var(--teal);
      display:flex;align-items:center;justify-content:center}
  .ask-send svg{width:20px;height:20px}
  html[dir="rtl"] .ask-send svg{transform:scaleX(-1)}
  .ask-bar input:disabled,.ask-send:disabled{opacity:.45}

  /* reminder timeline */
  /* Reminders are a quiet utility, not a second offer — flatter than the
     paid letter card so the two never compete for the same attention. */
  .track-tease{display:flex;align-items:center;gap:11px;width:100%;background:none;border:1px solid var(--line);border-radius:var(--r-md);padding:11px 14px;margin-top:8px;text-align:start}
  .track-tease .bell{flex:none;width:30px;height:30px;border-radius:9px;background:var(--teal-soft);display:flex;align-items:center;justify-content:center}
  .track-tease .bell svg{width:16px;height:16px;stroke:var(--teal)}
  .track-tease b{display:block;font-size:13.5px;color:var(--ink)}
  .track-tease span{font-size:11.5px;color:var(--ink-2)}
  .track-tease .go{margin-inline-start:auto;color:var(--teal);display:flex}
  .track-tease.solo{background:var(--teal-soft);border-color:var(--teal);padding:14px 16px;box-shadow:var(--shadow)}
  .track-tease.solo b{font-size:14.5px}
  .track-tease.solo .bell{background:var(--teal);width:36px;height:36px}
  .track-tease.solo .bell svg{stroke:var(--on-teal)}
  .home-plans{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:4px;
      color:var(--ink-2);font-size:12.5px;padding:10px;border-radius:var(--r-sm);opacity:.85}
  .home-plans:hover{color:var(--teal)}
  /* Secondary utilities sit quietly below the primary act, in one rhythm. */
  .home-reminders{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:10px;width:100%;
      color:var(--ink-2);font-size:13.5px;font-weight:700;background:none;border:1px solid var(--line);
      border-radius:var(--r-md);padding:12px;transition:color .15s,border-color .15s}
  .home-reminders:hover{color:var(--teal);border-color:var(--teal)}
  html[lang="ar"] .home-reminders{font-weight:400;font-size:15px}

  .timeline{position:relative;margin:6px 0 20px;padding-inline-start:26px}
  .timeline::before{content:"";position:absolute;inset-block:10px;inset-inline-start:8px;width:2px;background:var(--line);border-radius:2px}
  .tl-item{position:relative;margin-bottom:14px}
  .tl-item .node{position:absolute;inset-inline-start:-26px;top:14px;width:18px;height:18px;border-radius:99px;border:3px solid var(--sand);display:flex;align-items:center;justify-content:center}
  .tl-item.info .node{background:var(--teal)} .tl-item.action .node{background:var(--amber)} .tl-item.deadline .node{background:var(--red)}
  .tl-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 16px;box-shadow:var(--e1),var(--edge)}
  .tl-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .tl-date{font-size:12.5px;font-weight:700;color:var(--teal-ink);background:var(--sand);border:1px solid var(--line);border-radius:999px;padding:2px 10px;white-space:nowrap}
  html[lang="ar"] .tl-date{font-weight:400}
  .tl-rel{font-size:11.5px;color:var(--ink-2)}
  .tl-doc{margin-inline-start:auto;font-size:11px;font-weight:700;color:var(--teal);background:var(--teal-soft);border-radius:999px;padding:2px 9px;white-space:nowrap}
  html[lang="ar"] .tl-doc{font-weight:400;font-size:12px}
  .tl-card h4{font-size:14.5px;color:var(--ink);margin-top:6px}
  .tl-card p{font-size:12.5px;color:var(--ink-2);line-height:1.6;margin-top:2px}
  .tl-empty{text-align:center;color:var(--ink-2);font-size:14px;padding:34px 12px;background:var(--card);border:1px dashed var(--line);border-radius:18px}
  .tl-note{display:flex;align-items:center;justify-content:center;gap:8px;font-size:12px;color:var(--ink-2);margin-bottom:16px}
  .tl-note .dot-on{width:30px;height:18px;border-radius:99px;background:var(--teal);position:relative}
  .tl-note .dot-on::after{content:"";position:absolute;top:2.5px;inset-inline-end:2.5px;width:13px;height:13px;border-radius:99px;background:var(--on-teal)}

  /* feedback */
  .feedback{background:none;border-top:1px solid var(--line);border-radius:0;padding:16px 10px 4px;margin-top:18px;text-align:center}
  .fb-q{font-size:13.5px;color:var(--ink-2)}
  .fb-btns{display:flex;justify-content:center;gap:14px;margin-top:12px}
  .fb-btns button{width:46px;height:46px;border-radius:999px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;transition:border-color .15s,background .15s}
  .fb-btns button:hover{border-color:var(--teal)}
  .fb-btns svg{width:22px;height:22px}
  .fb-comment{margin-top:14px}
  .fb-comment textarea{min-height:72px;font-size:13.5px}
  .fb-comment .primary{margin-top:10px;padding:12px;font-size:14.5px}
  .fb-thanks{display:flex;align-items:center;justify-content:center;gap:10px;color:var(--ink);font-size:15px;padding:6px 0}
  .fb-thanks .tick{flex:none;width:28px;height:28px;border-radius:999px;background:var(--green);display:flex;align-items:center;justify-content:center}
  .fb-thanks .tick svg{width:14px;height:14px}

  /* clauses */
  .clause{background:var(--card);border:1px solid var(--line);border-radius:var(--r-xl);margin-bottom:12px;overflow:hidden;box-shadow:var(--e1),var(--edge)}
  .clause .head{display:flex;align-items:center;gap:10px;padding:13px 16px}
  .clause .stripe{flex:none;width:10px;height:10px;border-radius:99px}
  .clause h4{font-size:15px;color:var(--ink);flex:1}
  .clause .quote{margin:0 16px;padding:10px 14px;background:var(--sand);border-inline-start:3px solid var(--line);border-radius:8px;font-size:12.5px;color:var(--ink-2);line-height:1.7;font-style:italic}
  .clause .plain{padding:10px 16px 4px;font-size:14px;color:var(--ink);line-height:1.75}
  .clause .act{margin:8px 16px 14px;display:inline-block;font-size:12.5px;font-weight:700;border-radius:999px;padding:4px 12px}
  .clause.red .stripe{background:var(--red)} .clause.red .act{background:var(--red-bg);color:var(--red)}
  .clause.amber .stripe{background:var(--amber)} .clause.amber .act{background:var(--amber-bg);color:var(--amber-ink)}
  .clause.green .stripe{background:var(--green)} .clause.green .act{background:var(--green-bg);color:var(--green-ink)}
  .section-title{font-size:19px;color:var(--teal-ink);margin:6px 2px 14px}
</style>
</head>

function analyzePasted(text){
  const clauses = [];
  for (const r of RULES) if (r.re.test(text)) clauses.push({ s:r.s, t:r.t, p:r.p, a:r.a, q:null });
  /* Nothing recognised means we cannot honestly score this text. Returning null
     routes to the "couldn't read" screen instead of inventing a verdict. */
  if (!clauses.length) return null;
  clauses.sort((x,y)=>({red:0,amber:1,green:2}[x.s]-{red:0,amber:1,green:2}[y.s]));
  let score = 100;
  for (const c of clauses) score -= c.s==="red" ? 16 : c.s==="amber" ? 8 : 0;
  score = Math.max(25, Math.min(95, score));
  const reds = clauses.filter(c=>c.s==="red").length, ambers = clauses.filter(c=>c.s==="amber").length;
  let verdict;
  if (reds) verdict = {ar:"فيه بنود تحتاج وقفة قبل التوقيع — اقرأ التنبيهات الحمراء أولًا.",
                       en:"Some clauses need a pause before signing — read the red flags first."};
  else if (ambers) verdict = {ar:"لا يوجد ما يقلق — لكن فيه نقاط تستاهل التفاوض.",
                              en:"Nothing alarming — but a few points are worth negotiating."};
  else verdict = {ar:"ما وجدنا مؤشرات خطر في النص المرسل.",en:"We found no risk signals in the submitted text."};
  return { score, doc:"doc_pasted", verdict, clauses };
}

/* --------------------------------------- end of service + termination ----
   Deterministic arithmetic, not inference: the award follows the standard
   formula (half a month per year for the first five years, a full month per
   year thereafter, on the last wage), then a resignation factor. Every step
   is shown so the user can check the maths rather than trust a black box.
   Figures must be verified against the current statutory text before use. */
let eosHow = "term", triage = { reason:null, notice:null, probation:null }, claimAdded = false;

const EOS_HOW = [
  { id:"term",   label:"eos_h_term" },
  { id:"resign", label:"eos_h_resign" },
  { id:"expiry", label:"eos_h_expiry" }
];

function openEos(){ renderEos(); show("eos"); }

function renderEos(){
  const wrap = document.getElementById("eosHow");
  wrap.innerHTML = "";
  EOS_HOW.forEach(o=>{
    const b = document.createElement("button");
    b.type = "button";
    b.className = eosHow===o.id ? "on" : "";
    b.textContent = t(o.label);
    b.onclick = ()=>{ eosHow = o.id; renderEos(); if (document.getElementById("eosOut").innerHTML) calcEos(); };
    wrap.appendChild(b);
  });
}

/* Calendar arithmetic, not averaged days: an exact three-year span must come
   out as 3.000, or the award is short by a few riyals for no good reason. */
function serviceParts(a, b){
  let y = b.getFullYear() - a.getFullYear();
  let m = b.getMonth() - a.getMonth();
  let d = b.getDate() - a.getDate();
  if (d < 0){ m--; d += new Date(b.getFullYear(), b.getMonth(), 0).getDate(); }
  if (m < 0){ y--; m += 12; }
  return { y, m, d };
}

function serviceYears(a, b){
  if (b <= a) return 0;
  const { y, m, d } = serviceParts(a, b);
  return y + m/12 + d/365;
}

function resignFactor(y){
  if (y < 2) return 0;
  if (y < 5) return 1/3;
  if (y < 10) return 2/3;
  return 1;
}

function money(n){
  return new Intl.NumberFormat(lang==="ar" ? "ar-SA" : "en-US",
    { maximumFractionDigits:0 }).format(Math.round(n));
}

function calcEos(){
  const sd = document.getElementById("eosStart").value;
  const ed = document.getElementById("eosEnd").value;
  const wage = parseFloat(document.getElementById("eosWage").value);
  const out = document.getElementById("eosOut");
  if (!sd || !ed || !wage || wage <= 0){ out.innerHTML = ""; return; }
  const a = new Date(sd), bDate = new Date(ed);
  const y = serviceYears(a, bDate);
  if (y <= 0){ out.innerHTML = ""; return; }
  const parts = serviceParts(a, bDate);

  const first = Math.min(y, 5), after = Math.max(0, y - 5);
  const firstAmt = first * 0.5 * wage, afterAmt = after * wage;
  const sub = firstAmt + afterAmt;
  const factor = eosHow === "resign" ? resignFactor(y) : 1;
  const total = sub * factor;

  const svc = t("eos_yrs").replace("{y}", fmtNum(parts.y)).replace("{m}", fmtNum(parts.m));
  const cur = t("eos_sar");
  const row = (label, val, cls) =>
    `<div class="r${cls?" "+cls:""}"><span>${label}</span><b>${val}</b></div>`;

  out.innerHTML =
    `<div class="eos-card">
       <div class="lbl">${t("eos_result")}</div>
       <div class="amt">${money(total)}<small>${cur}</small></div>
       <div class="svc">${t("eos_service")}: ${svc}</div>
       <div class="rows">
         ${row(t("eos_b_first"), money(firstAmt)+" "+cur)}
         ${after > 0 ? row(t("eos_b_after"), money(afterAmt)+" "+cur) : ""}
         ${row(t("eos_b_sub"), money(sub)+" "+cur)}
         ${eosHow==="resign" ? row(t("eos_b_factor"), factor===0 ? "0" : (factor===1 ? "1" : (factor<0.5?"1/3":"2/3"))) : ""}
         ${row(t("eos_b_total"), money(total)+" "+cur, "tot")}
       </div>
       ${eosHow==="resign" && factor===0 ? `<p class="eos-note">${t("eos_none")}</p>` : ""}
       <p class="eos-note">${t("eos_note")}</p>
     </div>` +
    (eosHow === "term" ? triageHtml(ed) : "");
  buzz(8);
  if (eosHow === "term") bindTriage(ed);
}

function triageHtml(){
  const q = (key, id) =>
    `<div class="tq"><span>${t(key)}</span><div class="yn" data-q="${id}">
       <button type="button" data-v="1">${t("tr_yes")}</button>
       <button type="button" data-v="0">${t("tr_no")}</button>
     </div></div>`;
  return `<div class="triage">
      <h4>${t("tr_head")}</h4>
      ${q("tr_q1","reason")}${q("tr_q2","notice")}${q("tr_q3","probation")}
      <div id="triageOut"></div>
    </div>`;
}

function bindTriage(endDate){
  triage = { reason:null, notice:null, probation:null }; claimAdded = false;
  document.querySelectorAll("#eosOut .yn").forEach(g=>{
    g.querySelectorAll("button").forEach(b=>{
      b.onclick = ()=>{
        triage[g.dataset.q] = b.dataset.v === "1";
        g.querySelectorAll("button").forEach(x=>x.classList.remove("on"));
        b.classList.add("on");
        renderTriage(endDate);
      };
    });
  });
}

function renderTriage(endDate){
  const { reason, notice, probation } = triage;
  if (reason === null || notice === null || probation === null) return;
  const out = document.getElementById("triageOut");
  let cls, head, body;
  if (probation){ cls="warn"; head=t("tr_out_probation"); body=t("tr_out_probation_b"); }
  else if (reason && notice){ cls="ok"; head=t("tr_out_ok"); body=t("tr_out_ok_b"); }
  else { cls="act"; head=t("tr_out_claim"); body=t("tr_out_claim_b"); }
  out.innerHTML =
    `<div class="verdict-box ${cls}"><b>${head}</b><p>${body}</p></div>
     <div class="clock">
       <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
       <span>${t("tr_clock")}</span>
     </div>
     <button class="primary" id="clockBtn">${t(claimAdded ? "tr_added" : "tr_addclock")}</button>`;
  document.getElementById("clockBtn").onclick = ()=>addClaimClock(endDate);
  buzz(6);
}

/* The claim window is the one deadline that can cost someone everything, so
   it goes straight into the same reminder timeline as contract dates. */
function addClaimClock(endDate){
  if (claimAdded) { openTimeline("home"); return; }
  const base = new Date(endDate).getTime();
  TRACKED.push({ doc:"doc_claim", events:[
    { d:30, k:"action", when: base + 30*86400000,
      t:{ar:"ابدأ التسوية الودية",en:"Start amicable settlement"},
      n:{ar:"الطريق النظامي يبدأ بالتسوية الودية قبل المحكمة العمالية — بكّر فيها.",
         en:"The formal route begins with amicable settlement before the labour court — start early."} },
    { d:365, k:"deadline", when: base + 365*86400000,
      t:{ar:"آخر موعد لسماع الدعوى",en:"Claim deadline"},
      n:{ar:"بعد اثني عشر شهرًا من انتهاء العلاقة لا تُسمع الدعوى عادةً.",
         en:"After twelve months from the end of the relationship a claim is generally not heard."} }
  ]});
  claimAdded = true; buzz(10);
  renderHomeReminders();
  document.getElementById("clockBtn").textContent = t("tr_added");
}

/* ---------------------------------------------- assistant: UI + state */
let asOrigin = "home";

function openAssist(origin){
  asOrigin = origin;
  if (!chat.length){
    chat.push({ who:"bot", text:t("as_intro") });
    chat.push({ who:"bot", text:t("as_not_lawyer") });
  }
  renderAssist();
  show("assist");
  setTimeout(()=>document.getElementById("askInput").focus(), 120);
}
function assistBack(){ show(asOrigin === "result" ? "result" : "home", 1); }

function renderCaps(){
  const wrap = document.getElementById("caps");
  wrap.innerHTML = "";
  CAPS.forEach(c=>{
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = t(c.label);
    b.onclick = ()=>ask(CAP_Q[c.id][lang]);
    wrap.appendChild(b);
  });
}

function renderAssist(){
  document.getElementById("asBackLabel").textContent = t(asOrigin==="result" ? "back_score" : "back_home");
  document.getElementById("askInput").placeholder = t("as_ph");
  renderCaps();
  const box = document.getElementById("chat");
  box.innerHTML = "";
  chat.forEach(m=>box.appendChild(msgEl(m)));
  renderQuota();
  box.scrollTop = box.scrollHeight;
}

function msgEl(m){
  const d = document.createElement("div");
  d.className = "msg " + m.who;
  if (m.typing){ d.innerHTML = '<span class="typing"><i></i><i></i><i></i></span>'; return d; }
  d.textContent = m.text;
  if (m.extra){ d.textContent += "\n\n" + m.extra; }
  if (m.refs && m.refs.length){
    const r = document.createElement("div");
    r.className = "refs";
    m.refs.forEach(x=>{
      const c = document.createElement("span");
      c.className = "ref";
      c.textContent = t("as_refs") + ": " + x[lang];
      r.appendChild(c);
    });
    d.appendChild(r);
  }
  if (m.draft){
    const b = document.createElement("button");
    b.className = "inline-cta";
    b.textContent = t("as_draft_cta");
    b.onclick = ()=>{ if (current && negotiables().length) openLetterFlow(); else show("home",1); };
    d.appendChild(b);
  }
  return d;
}

function renderQuota(){
  const q = document.getElementById("quota");
  const bar = document.getElementById("askBar");
  const left = FREE_QUESTIONS - asked;
  if (left > 0){
    q.className = "quota";
    q.textContent = left === 1 ? t("as_left1") : t("as_left").replace("{n}", fmtNum(left));
    document.getElementById("askInput").disabled = false;
    document.getElementById("askSend").disabled = false;
    bar.style.display = "flex";
    return;
  }
  /* The gate is the product's first honest paywall moment: the score and the
     flags stay free, but open-ended legal Q&A is metered. */
  q.className = "quota gate";
  q.innerHTML = "";
  const b = document.createElement("b"); b.textContent = t("as_quota_t");
  const p = document.createElement("span"); p.textContent = t("as_quota_b");
  const cta = document.createElement("button");
  cta.textContent = t("as_quota_cta");
  cta.onclick = ()=>{ buzz(10); openPlans("assist"); };
  q.append(b, p, cta);
  bar.style.display = "none";
}

function submitAsk(e){
  e.preventDefault();
  const el = document.getElementById("askInput");
  const v = el.value.trim();
  if (!v) return;
  el.value = "";
  ask(v);
}

function ask(text){
  if (asked >= FREE_QUESTIONS) return;
  asked++;
  chat.push({ who:"user", text });
  const box = document.getElementById("chat");
  box.appendChild(msgEl({ who:"user", text }));
  const typing = msgEl({ who:"bot", typing:true });
  box.appendChild(typing);
  box.scrollTop = box.scrollHeight;
  document.getElementById("askInput").disabled = true;
  setTimeout(()=>{
    const a = answer(text);
    typing.remove();
    const m = { who:"bot", ...a };
    chat.push(m);
    box.appendChild(msgEl(m));
    buzz(6);
    document.getElementById("askInput").disabled = false;
    renderQuota();
    box.scrollTop = box.scrollHeight;
  }, 700);
}

const FREE_QUESTIONS = 3;

/* Contract-aware answers: summarize, risks, and applicable laws all read the
   analysis already in `current` rather than inventing new content. */
function answerSummary(){
  if (!current) return { text:t("as_nocontract") };
  const red = current.clauses.filter(c=>c.s==="red").length;
  const amb = current.clauses.filter(c=>c.s==="amber").length;
  const grn = current.clauses.filter(c=>c.s==="green").length;
  const head = lang==="ar"
    ? `${t(current.doc)} — التقييم ${fmtNum(current.score)} من ١٠٠.\n${current.verdict.ar}\n\nراجعت ${fmtNum(current.clauses.length)} بنود: ${fmtNum(red)} تحتاج وقفة، ${fmtNum(amb)} تستاهل التفاوض، ${fmtNum(grn)} مطمئنة.`
    : `${t(current.doc)} — scored ${current.score} out of 100.\n${current.verdict.en}\n\nI read ${current.clauses.length} clauses: ${red} need a pause, ${amb} are worth negotiating, ${grn} are fine.`;
  const lines = current.clauses.map(c=>`• ${c.t[lang]} — ${c.p[lang]}`).join("\n");
  return { text: head + "\n\n" + lines };
}

function answerRisks(){
  if (!current) return { text:t("as_nocontract") };
  const risky = current.clauses.filter(c=>c.s!=="green");
  if (!risky.length)
    return { text: lang==="ar"
      ? "ما لقيت مخاطر تستدعي القلق في هذا العقد — كل البنود ضمن المعتاد."
      : "I found no risks worth worrying about in this one — every clause sits within the norm." };
  const body = risky.map((c,i)=>{
    const n = lang==="ar" ? AR_NUM[i] : String(i+1);
    const tag = c.s==="red" ? t("act_red") : t("act_amber");
    return `${n}. ${c.t[lang]} (${tag})\n   ${c.p[lang]}\n   ${c.a ? c.a[lang] : ""}`;
  }).join("\n\n");
  return { text: body, draft: true };
}

function answerLaws(){
  if (!current) return { text:t("as_nocontract") };
  const map = { doc_emp:["فترة التجربة","الإشعار","عدم المنافسة"], doc_clean:["فترة التجربة","الإجازة","عمل إضافي"],
                doc_rent:["إيجار"], doc_free:["عمل حر","شرط جزائي"], doc_pasted:["الإشعار"] };
  const keys = map[current.doc] || [];
  const hits = KB.filter(e=>keys.some(k=>e.k.test(k)));
  const text = lang==="ar"
    ? `بالنسبة لـ${t(current.doc)}، الأنظمة التي تهمك:` : `For your ${t(current.doc).toLowerCase()}, the provisions that matter:`;
  return { text, refs: hits.map(h=>h.r).filter(Boolean), extra: hits.map(h=>"• "+h.a[lang]).join("\n\n") };
}

function answer(q){
  const low = q.toLowerCase();
  if (/(لخّص|لخص|ملخص|summar)/i.test(low)) return answerSummary();
  if (/(مخاطر|خطر|risk)/i.test(low))       return answerRisks();
  if (/(أنظمة|نظام ينطبق|which law|relevant law|applicable)/i.test(low)) return answerLaws();
  if (/(اكتب|صياغة|مستند|خطاب|draft|write|letter)/i.test(low))
    return { text: lang==="ar"
      ? "أقدر أصيغ لك خطاب تفاوض مبني على بنود عقدك، أو خطاب استقالة، أو إشعار عدم تجديد. الأشهر هو خطاب التفاوض:"
      : "I can draft a negotiation letter built from your contract's clauses, a resignation letter, or a non-renewal notice. The negotiation letter is the common one:", draft:true };
  const hit = KB.find(e=>e.k.test(q));
  if (hit) return { text: hit.a[lang], refs: hit.r ? [hit.r] : [] };
  return { text: lang==="ar"
    ? "ما فهمت السؤال تمامًا. جرّب تسأل عن بند معيّن — مثل «فترة التجربة» أو «مدة الإشعار» أو «مكافأة نهاية الخدمة» — أو اطلب مني ألخّص عقدك."
    : "I didn't quite catch that. Try asking about a specific topic — probation, notice period, end-of-service pay — or ask me to summarize your contract." };
}

const TRACKED = [];
let tlOrigin = "result";

function isTracked(){ return current && TRACKED.some(x=>x.doc===current.doc); }

function trackOrView(){
  if (!current) return;
  if (!isTracked()){
    buzz(10);
    const base = Date.now();
    TRACKED.push({ doc: current.doc,
      events: EVENTS[current.doc].map(e=>({ ...e, when: base + e.d*86400000 })) });
    TRACKED.sortStamp = Date.now();
  }
  renderTrackTease(); renderHomeReminders();
  openTimeline("result");
}

function openTimeline(origin){
  tlOrigin = origin;
  renderTimeline();
  show("timeline");
}
function tlBack(){ show(tlOrigin === "home" ? "home" : "result", 1); }

function fmtDate(ts){
  return new Intl.DateTimeFormat(lang==="ar" ? "ar-SA-u-ca-gregory" : "en-GB",
    { day:"numeric", month:"long", year:"numeric" }).format(ts);
}
function fmtNum(n){ return new Intl.NumberFormat(lang==="ar" ? "ar-SA" : "en").format(n); }

function renderTrackTease(){
  document.getElementById("trackTitle").textContent = t(isTracked() ? "tr_on_title" : "tr_title");
  document.getElementById("trackSub").textContent = t(isTracked() ? "tr_on_sub" : "tr_sub");
}
function renderHomeReminders(){
  /* Always present, so the feature (and its empty state) is discoverable
     before the first contract is ever tracked. */
  document.getElementById("homeReminders").style.display = "flex";
  document.getElementById("homeRemindersLabel").textContent =
    TRACKED.length ? `${t("tl_reminders")} (${fmtNum(TRACKED.length)})` : t("tl_reminders");
}

function renderTimeline(){
  document.getElementById("tlBackLabel").textContent = t(tlOrigin==="home" ? "back_home" : "back_score");
  const wrap = document.getElementById("tlList");
  wrap.innerHTML = "";
  const all = TRACKED.flatMap(c => c.events.map(e => ({ ...e, doc: c.doc })))
                     .sort((a,b) => a.when - b.when);
  if (!all.length){
    wrap.innerHTML = `<div class="tl-empty">${t("tl_empty")}</div>`;
    return;
  }
  all.forEach((e,i)=>{
    const days = Math.max(0, Math.round((e.when - Date.now())/86400000));
    const item = document.createElement("div");
    item.className = "tl-item " + e.k;
    item.style.setProperty("--d", Math.min(i,6)*40 + "ms");
    item.innerHTML =
      `<span class="node"></span>
       <div class="tl-card">
         <div class="tl-top">
           <span class="tl-date">${fmtDate(e.when)}</span>
           <span class="tl-rel">${t("tl_in").replace("{n}", fmtNum(days))}</span>
           <span class="tl-doc">${t(e.doc)}</span>
         </div>
         <h4>${e.t[lang]}</h4><p>${e.n[lang]}</p>
       </div>`;
    wrap.appendChild(item);
  });
}

/* -------------------------------------------------- letter builder ----
   Wodouh's signature: the negotiation letter is assembled while you read,
   not generated after the fact. Each negotiable clause can be added as you
   go, and the letter contains exactly what you chose — in contract order. */
let letterSet = new Set();

function selected(){
  if (!current) return [];
  return current.clauses.filter((c,i)=>c.a && letterSet.has(i));
}

function toggleLetterItem(i, el){
  if (letterSet.has(i)) letterSet.delete(i);
  else { letterSet.add(i); buzz(8); }
  syncAddButtons();
  renderBuilder(true);
  renderTease();
}

function addAllPoints(){
  current.clauses.forEach((c,i)=>{ if (c.a) letterSet.add(i); });
  buzz(10);
  syncAddButtons(); renderBuilder(true); renderTease();
}

function addBtnHtml(i){
  const on = letterSet.has(i);
  const icon = on
    ? '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.5 3.5L13 4.5"/></svg>'
    : '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg>';
  return `<button class="add-btn${on?" on":""}" data-add="${i}" aria-pressed="${on}">${icon}<span>${t(on?"lb_added":"lb_add")}</span></button>`;
}

/* Both the result flags and the clause screen show the same control, so
   whichever screen the user reads on, the letter grows the same way. */
function syncAddButtons(){
  document.querySelectorAll("[data-add]").forEach(b=>{
    const i = +b.dataset.add, on = letterSet.has(i);
    b.classList.toggle("on", on);
    b.setAttribute("aria-pressed", String(on));
    b.querySelector("span").textContent = t(on ? "lb_added" : "lb_add");
  });
}

function renderBuilder(bump){
  const bar = document.getElementById("builder");
  const n = selected().length;
  const onScreen = document.querySelector("#screen-result.active, #screen-clauses.active");
  bar.hidden = !(n && onScreen);
  if (bar.hidden) return;
  document.getElementById("bCount").textContent =
    n === 1 ? t("lb_count1") : t("lb_count").replace("{n}", fmtNum(n));
  document.getElementById("bView").textContent = t("lb_view");
  if (bump){ bar.classList.remove("bump"); void bar.offsetWidth; bar.classList.add("bump"); }
}

/* The teaser reflects the build: an invitation when empty, a receipt once
   points are in — and when empty it sends you to the clauses to build. */
function renderTease(){
  const tease = document.getElementById("letterTease");
  const n = selected().length;
  const title = tease.querySelector("b"), sub = title.nextElementSibling;
  tease.classList.toggle("building", n > 0);
  if (n === 0){
    title.textContent = t("lb_build");
    sub.textContent = t("lb_build_sub");
  } else {
    title.textContent = n === 1 ? t("lb_ready1") : t("lb_ready").replace("{n}", fmtNum(n));
    sub.textContent = t("lt_sub");
  }
}

function openLetterFlow(){
  if (!selected().length) { show("clauses"); renderBuilder(); return; }
  openPaywall();
}

/* ------------------------------------- negotiation letter + paywall */
let pwPlan = 0, pwPaid = false;
const PLANS = [
  { name:"plan_letter", desc:"plan_letter_d", price:{ar:"٢٩ ر.س",en:"29 SAR"}, pop:false },
  { name:"plan_lawyer", desc:"plan_lawyer_d", price:{ar:"١٤٩ ر.س",en:"149 SAR"}, pop:true }
];
const LETTER_TO = {
  doc_emp:{ar:"إلى: قسم الموارد البشرية",en:"To: The HR department"},
  doc_rent:{ar:"إلى: المؤجّر الكريم",en:"To: The landlord"},
  doc_free:{ar:"إلى: العميل الكريم",en:"To: The client"},
  doc_pasted:{ar:"إلى: الطرف الآخر",en:"To: The other party"}
};
const AR_NUM = ["١","٢","٣","٤","٥","٦","٧","٨","٩"];

function negotiables(){ return current ? current.clauses.filter(c=>c.a) : []; }

function buildLetter(){
  const items = selected();
  const list = items.map((c,i)=>{
    const n = lang==="ar" ? AR_NUM[i] : String(i+1);
    return `${n}. ${c.t[lang]}: ${c.a[lang]}`;
  }).join("\n");
  if (lang==="ar")
    return `السلام عليكم ورحمة الله،\n\nاطلعت على ${t(current.doc)} المعروض، وأشكركم على الثقة. قبل التوقيع، أتمنى مناقشة النقاط التالية:\n\n${list}\n\nواثق أننا نصل لصيغة عادلة للطرفين، وحاضر لأي نقاش.\n\nمع خالص التحية،\n[اسمك]`;
  return `Dear Sir or Madam,\n\nThank you for sending the ${t(current.doc).toLowerCase()}. Before signing, I would like to discuss the following points:\n\n${list}\n\nI'm confident we can reach wording that is fair to both sides, and I'm happy to talk any of this through.\n\nBest regards,\n[Your name]`;
}

function openPaywall(){
  if (pwPaid){ renderLetter(); show("letter"); return; }
  renderPaywall(); show("paywall");
}

function renderPaywall(){
  /* Prototype only: the locked copy is real text behind a CSS blur, which is
     readable via devtools. A production build must render placeholder lines
     and fetch the letter after payment. */
  if (!current || !selected().length) return;
  const full = buildLetter();
  const lines = full.split("\n");
  document.getElementById("pwPreviewHead").textContent = LETTER_TO[current.doc][lang];
  document.getElementById("pwPreviewIntro").textContent = lines.slice(0,3).join("\n");
  document.getElementById("pwPreviewFog").textContent = lines.slice(3).join("\n");
  document.getElementById("pwLockLine").textContent = t("pw_lock");
  const wrap = document.getElementById("plans");
  wrap.innerHTML = "";
  PLANS.forEach((pl,i)=>{
    const b = document.createElement("button");
    b.className = "plan" + (i===pwPlan ? " sel" : "");
    b.innerHTML =
      `<span class="radio"></span>
       <span style="flex:1"><b>${t(pl.name)}${pl.pop?`<span class="badge">${t("plan_pop")}</span>`:""}</b><span>${t(pl.desc)}</span></span>
       <span class="price">${pl.price[lang]}</span>`;
    b.onclick = ()=>{ pwPlan = i; renderPaywall(); };
    wrap.appendChild(b);
  });
  const pay = document.getElementById("payBtn");
  pay.disabled = false;
  pay.textContent = `${t("pw_pay")} ${PLANS[pwPlan].price[lang]}`;
}

function pwPay(){
  const pay = document.getElementById("payBtn");
  pay.disabled = true;
  pay.textContent = t("pw_paying");
  setTimeout(()=>{
    pwPaid = true;
    buzz([12,50,20]);
    renderLetter();
    show("letter");
  }, 900);
}

function renderLetter(){
  if (!current || !selected().length) return;
  document.getElementById("letterBody").textContent =
    LETTER_TO[current.doc][lang] + "\n\n" + buildLetter();
  document.getElementById("copyBtn").textContent = t("copy_btn");
  document.getElementById("letterFoot").textContent = t("lt_foot");
}

function copyLetter(){
  const btn = document.getElementById("copyBtn");
  const done = ()=>{ btn.textContent = t("copied"); setTimeout(()=>{ btn.textContent = t("copy_btn"); }, 1600); };
  if (navigator.clipboard) navigator.clipboard.writeText(document.getElementById("letterBody").textContent).then(done, done);
  else done();
}

/* ------------------------------------------------------------ feedback */
let fbState = "ask";           /* ask | comment | done */
const FEEDBACK = [];

function renderFeedback(){
  const el = document.getElementById("feedback");
  const prevText = document.getElementById("fbText") ? document.getElementById("fbText").value : "";
  if (fbState === "done"){
    el.innerHTML =
      `<div class="fb-thanks">
         <span class="tick"><svg viewBox="0 0 14 14" fill="none"><path d="M3.2 7.4l2.6 2.6 5-5.6" stroke="var(--on-teal)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
         <span>${t("fb_thanks")}</span>
       </div>`;
    return;
  }
  const comment = fbState === "comment"
    ? `<div class="fb-comment">
         <textarea id="fbText" placeholder="${t("fb_comment_ph")}"></textarea>
         <button class="primary" onclick="fbSend()">${t("fb_send")}</button>
       </div>`
    : "";
  el.innerHTML =
    `<div class="fb-q">${t("fb_q")}</div>
     <div class="fb-btns">
       <button aria-label="${t("fb_up")}" title="${t("fb_up")}" onclick="fbVote(true)">
         <svg viewBox="0 0 24 24" fill="none" stroke="var(--teal)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 11v9M7 11l4-7c1.4 0 2.5 1.1 2.5 2.5V9H19a1.8 1.8 0 0 1 1.8 2.1l-1.2 7A1.8 1.8 0 0 1 17.8 20H7"/></svg>
       </button>
       <button aria-label="${t("fb_down")}" title="${t("fb_down")}" onclick="fbVote(false)">
         <svg viewBox="0 0 24 24" fill="none" stroke="var(--red)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 13V4M17 13l-4 7c-1.4 0-2.5-1.1-2.5-2.5V15H5a1.8 1.8 0 0 1-1.8-2.1l1.2-7A1.8 1.8 0 0 1 6.2 4H17"/></svg>
       </button>
     </div>${comment}`;
  if (fbState === "comment" && prevText) document.getElementById("fbText").value = prevText;
}

function fbRecord(vote, comment){
  FEEDBACK.push({ doc: current ? current.doc : null, score: current ? current.score : null, vote, comment: comment || "" });
  console.log("wodouh feedback:", FEEDBACK[FEEDBACK.length-1]);
}

function fbVote(up){
  buzz(8);
  if (up){ fbRecord("up"); fbState = "done"; }
  else fbState = "comment";
  renderFeedback();
}

function fbSend(){
  fbRecord("down", document.getElementById("fbText").value.trim());
  fbState = "done";
  renderFeedback();
}

function renderClauses(){
  const wrap = document.getElementById("clauseList");
  wrap.innerHTML = "";
  current.clauses.forEach((c,i)=>{
    const div = document.createElement("div");
    div.className = "clause " + c.s;
    const q = lang==="ar" ? ["«","»"] : ["\u201C","\u201D"];
    const quote = c.q ? `<div class="quote">${q[0]}${c.q[lang]}${q[1]}</div>` : "";
    const act = t(c.s==="red"?"act_red":c.s==="amber"?"act_amber":"act_green");
    const advice = c.a ? ` ${c.a[lang]}` : "";
    div.innerHTML =
      `<div class="head"><span class="stripe"></span><h4>${c.t[lang]}</h4></div>
       ${quote}
       <div class="plain">${c.p[lang]}${advice}</div>
       <span class="act">${act}</span>
       ${c.a ? addBtnHtml(i) : ""}`;
    wrap.appendChild(div);
  });
}

applyLang();
</script>
