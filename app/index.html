  tm_n_title:{ar:"وش أسوي الحين؟",en:"What should I do next?"},
  tm_n_sub:{ar:"بالترتيب. ما تحتاج تسوي الكل اليوم.",en:"In order. You don't have to do all of it today."},
  tm_n1:{ar:"افهم اللي صار",en:"Review your termination"},
  tm_n1_b:{ar:"ارجع للبنود فوق واقرأ ليش وضوح وقف عند كل وحدة. لو فيه شيء ما ينطبق على حالتك، عدّل إجاباتك — التقييم يتغيّر معها.",
           en:"Go back through the sections above and read why Wodouh flagged each one. If something doesn't fit your situation, change your answers — the assessment moves with them."},
  tm_n2:{ar:"اجمع أوراقك",en:"Collect your evidence"},
  tm_n2_b:{ar:"الأوراق الناقصة هي أسرع شيء يقوّي موقفك، وأغلبها تقدر تطلبه من الموارد البشرية أو من التأمينات وحماية الأجور.",
           en:"The missing documents are the fastest way to strengthen your position, and most can be requested from HR or pulled from GOSI and the wage protection system."},
  tm_n2_cta:{ar:"راجع قائمة الأوراق",en:"Review the document list"},
  tm_n3:{ar:"اطلب حقوقك",en:"Request your rights"},
  tm_n3_b:{ar:"ابدأ بخطاب مكتوب لصاحب العمل. أغلب الحالات تنتهي هنا، وخطاب هادئ موثّق أنفع من نزاع مبكّر.",
           en:"Start with a written request to your employer. Most cases end here, and a calm, documented letter does more than an early dispute."},
  tm_n3_cta:{ar:"جهّز الخطاب",en:"Prepare the letter"},
  tm_n4:{ar:"جهّز ملف حالتك",en:"Prepare your case file"},
  tm_n4_b:{ar:"ملخّص واحد منظّم فيه الوقائع والمبالغ والأوراق وما ينقصك — تاخذه معك لأي جهة أو محامٍ.",
           en:"One structured summary of the facts, the amounts, the documents and the gaps — to take with you to any authority or lawyer."},
  tm_n4_cta:{ar:"ابنِ ملف الحالة",en:"Build my case file"},
  tm_n5:{ar:"الطريق النظامي",en:"The formal route"},
  tm_n5_b:{ar:"لو ما وصلت لحل، الطريق يبدأ بالتسوية الودية عبر منصة وزارة الموارد البشرية قبل المحكمة العمالية. وانتبه للمدة: الدعوى العمالية عادة ما تُسمع بعد اثني عشر شهرًا من نهاية العلاقة. وضوح ما يرفع الدعوى نيابة عنك.",
           en:"If nothing is resolved, the route begins with amicable settlement through the Ministry of Human Resources platform, before the labour court. Watch the clock: a labour claim is generally not heard after twelve months from the end of the relationship. Wodouh does not file anything on your behalf."},

  tm_d_questions_b:{ar:"— أساس احتساب المخالصة النهائية وتاريخ صرفها\n— سبب الإنهاء كما هو موثّق لدى صاحب العمل\n— رصيد الإجازة المعتمد في سجلات الشركة\n— أي إنذارات أو جزاءات سابقة وتواريخها",
                    en:"— The basis on which the final settlement was calculated, and the date it was paid\n— The reason for termination as documented by the employer\n— The leave balance recorded in the company's own records\n— Any prior warnings or disciplinary notices, and their dates"},
  tm_d_next_b:{ar:"— مطالبة مكتوبة لصاحب العمل بالمبالغ أعلاه\n— استكمال الأوراق الناقصة\n— التسوية الودية عبر منصة وزارة الموارد البشرية إذا لم يصل الطرفان لحل\n\nأُعد هذا الملف من معلومات قدّمها العامل. المبالغ تقديرية ولا تمثل مطالبة نهائية.",
               en:"— A written request to the employer for the amounts above\n— Obtaining the outstanding documents\n— Amicable settlement through the Ministry of Human Resources platform if no resolution is reached\n\nThis file was prepared from information provided by the employee. The amounts are estimates and do not constitute a final claim."},

  tm_l_title:{ar:"خطاب لصاحب العمل",en:"Letter to your employer"},
  tm_l_sub:{ar:"نفس الوقائع ونفس المبالغ في كل نبرة — اللي يتغيّر هو الأسلوب فقط.",
            en:"The same facts and the same amounts in every tone — only the register changes."},
  tm_l_to:{ar:"إلى: قسم الموارد البشرية",en:"To: The HR department"},
  tm_tone_friendly:{ar:"ودّي",en:"Friendly"},

  tm_tone_formal:{ar:"رسمي",en:"Formal"},
  tm_l_open_friendly:{ar:"السلام عليكم ورحمة الله،\n\nأشكركم على المدة اللي قضيتها معكم. بعد انتهاء عملي، حابب أتأكد من بعض المستحقات، وأتمنى نوصل لتوضيح بيني وبينكم مباشرة.",
                      en:"Dear colleagues,\n\nThank you for the time I spent with the company. Now that my employment has ended, I'd like to check a few entitlements, and I hope we can clear this up between us directly."},
  tm_l_open_professional:{ar:"السلام عليكم ورحمة الله،\n\nبالإشارة إلى انتهاء علاقتي الوظيفية بالشركة، أود مراجعة مستحقاتي النهائية بناءً على الوقائع التالية.",
                          en:"Dear Sir or Madam,\n\nFollowing the end of my employment with the company, I would like to review my final entitlements on the basis of the following."},
  tm_l_open_firm:{ar:"السلام عليكم ورحمة الله،\n\nبالإشارة إلى انتهاء علاقتي الوظيفية، لم تُسوَّ حتى تاريخه مستحقات أراها قائمة. أدرج أدناه الوقائع والمبالغ، وأطلب مراجعتها.",
                  en:"Dear Sir or Madam,\n\nFollowing the end of my employment, entitlements that I believe remain outstanding have not yet been settled. I set out the facts and the amounts below and ask that they be reviewed."},
  tm_l_open_formal:{ar:"إلى إدارة الموارد البشرية المحترمة،\n\nبالإشارة إلى انتهاء علاقتي الوظيفية بالشركة، أتقدّم بهذا الطلب لمراجعة المستحقات النهائية، وفق الوقائع والمبالغ الموضحة أدناه.",
                    en:"To the Human Resources Department,\n\nFurther to the termination of my employment with the company, I submit this request for a review of my final entitlements, on the basis of the facts and amounts set out below."},
  tm_l_items:{ar:"المبالغ محل المراجعة:",en:"Amounts for review:"},
  tm_l_noitems:{ar:"أطلب توضيح أساس احتساب المخالصة النهائية.",
                en:"I would like clarification of the basis on which the final settlement was calculated."},
  tm_l_ask_friendly:{ar:"لو فيه شيء فهمته غلط، أنا حاضر أسمع وأصحّح. وإذا كان في محله، أتمنى نرتّب الصرف في أقرب وقت يناسبكم.",
                     en:"If I've misunderstood anything, I'm happy to hear it and stand corrected. If it's right, I'd be grateful if we could arrange payment at a time that suits you."},
  tm_l_ask_professional:{ar:"أرجو مراجعة الأرقام أعلاه وموافاتي بأساس احتسابها، وتزويدي بنسخة من المخالصة النهائية وسجل الإجازات.",
                         en:"I would be grateful if you could review the figures above, share the basis on which they were calculated, and provide a copy of the final settlement and the leave record."},
  tm_l_ask_firm:{ar:"أرجو موافاتي بردّ مكتوب خلال خمسة عشر يومًا يتضمن أساس الاحتساب وموعد الصرف.",
                 en:"I would ask for a written response within fifteen days setting out the basis of calculation and the date of payment."},
  tm_l_ask_formal:{ar:"أرجو التكرم بالإفادة كتابيًا بأساس احتساب المستحقات وموعد صرفها، مع تزويدي بصورة من المخالصة النهائية وسجل الإجازات.",
                   en:"I should be grateful for a written response setting out the basis on which the entitlements were calculated and the date of payment, together with a copy of the final settlement and the leave record."},
  tm_l_close_friendly:{ar:"شاكر لكم، وتحياتي للزملاء.",en:"Thank you, and my regards to the team."},

/* A record with no `nat` applies to everyone; one that names a track applies
   only there. Used identically by the analyzer, the assistant and the
   library, so the three can never disagree about who sees what. */
function forTrack(x){ return !x.nat || x.nat === nat; }

function analyzePasted(text){
  const clauses = [];
  /* Carry the whole rule through, minus its matcher. Copying a hand-picked
     subset silently dropped `src` (so pasted contracts cited nothing) and
     `r` (so signed-mode readers got negotiation advice instead of their
     rights). A rule gaining a field should not need an edit here. */
  for (const rule of RULES) if (forTrack(rule) && rule.re.test(text)){
    const { re, ...rest } = rule;
    clauses.push({ ...rest, q:null });
  }
  /* Nothing recognised means we cannot honestly score this text. Returning null
     routes to the "couldn't read" screen instead of inventing a verdict. */
  if (!clauses.length) return null;
  clauses.sort((x,y)=>({red:0,amber:1,green:2}[x.s]-{red:0,amber:1,green:2}[y.s]));
  let score = 100;
  for (const c of clauses) score -= c.s==="red" ? 16 : c.s==="amber" ? 8 : 0;
  score = Math.max(25, Math.min(95, score));
  const reds = clauses.filter(c=>c.s==="red").length, ambers = clauses.filter(c=>c.s==="amber").length;
  let verdict;
  if (reds) verdict = {ar:"فيه بنود تحتاج وقفة قبل التوقيع — اقرأ التنبيهات الحمراء أولًا.",
                       en:"Some clauses need a pause before signing — read the red flags first."};
  else if (ambers) verdict = {ar:"لا يوجد ما يقلق — لكن فيه نقاط تستاهل التفاوض.",
                              en:"Nothing alarming — but a few points are worth negotiating."};
  else verdict = {ar:"ما وجدنا مؤشرات خطر في النص المرسل.",en:"We found no risk signals in the submitted text."};
  const vsigned = reds
    ? {ar:"فيه بنود تستحق الاعتراض — ابدأ بالتنبيهات الحمراء.",en:"Some clauses are worth contesting — start with the red flags."}
    : ambers
      ? {ar:"لا يوجد ما يقلق — لكن فيه نقاط تستحق المتابعة.",en:"Nothing alarming — but a few points are worth following up."}
      : {ar:"ما وجدنا مؤشرات خطر في النص المرسل.",en:"We found no risk signals in the submitted text."};
  return { score, doc:"doc_pasted", verdict, vs:vsigned, clauses };
}

/* For the few places where a dynamic value is interpolated into markup. */
function esc(s){
  return String(s).replace(/[&<>"']/g, c =>
    ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
}

function show(name, back){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active","back","lateral","dragging","settling"));

/* Haptics where a real device would buzz: a decision landed, not every tap. */
function buzz(ms){ if (navigator.vibrate) try { navigator.vibrate(ms); } catch(e){} }

/* ---------------------------------------------------------- onboarding */
let obIndex = 0;
/* The two tracks, as onboarding choices. Rendered into the card rather than
   bolted beside it so the dots, the art and the advance button keep working
   exactly as they did for the three cards that came before. */
/* The nationality question is only meaningful at the moment it changes an
   answer. Asked at the front door it is a toll; asked here it is obviously
   the reason we can be specific.

   Anything that would produce a divergent answer routes through this first,
   so the original guarantee holds in a stronger form: we never render law
   for an unknown track, and the question arrives with its consequence
   visible rather than in the abstract. */
let pendingAfterTrack = null;

function needsTrack(resume){
  if (nat) return false;
  pendingAfterTrack = resume || null;
  obIndex = OB.findIndex(o => o.pick);
  natGate = true;
  renderOnboard();
  show("onboard");
  return true;
}

function resumeAfterTrack(){
  natGate = false;
  const go = pendingAfterTrack;
  pendingAfterTrack = null;
  if (typeof go === "function") go(); else show("home");
}

let natGate = false;

function renderObPick(slide){
  const box = document.getElementById("obPick");
  const next = document.getElementById("obNext");
  if (!slide.pick){
    box.hidden = true;
    next.disabled = false;
    return;
  }
  box.hidden = false;
  box.innerHTML = "";
  [["sa","nat_sa","nat_sa_d"],["nonsa","nat_nonsa","nat_nonsa_d"]].forEach(([id,label,desc])=>{
    const b = document.createElement("button");
    b.type = "button";
    b.className = "ob-choice" + (nat === id ? " on" : "");
    b.setAttribute("aria-pressed", nat === id ? "true" : "false");
    b.innerHTML = `<b></b><span></span>`;
    b.querySelector("b").textContent = t(label);
    b.querySelector("span").textContent = t(desc);
    b.onclick = ()=>{
      /* First choice, so assign directly — setNat() is for changing one. */
      nat = id; buzz(8); saveState();
      renderNat(); renderLib();
      if (natGate){ resumeAfterTrack(); return; }
      renderOnboard();
    };
    box.appendChild(b);
  });
  /* Answering here is welcome but not required. The guarantee that nobody is
     shown the wrong law is enforced where the law actually diverges — see
     needsTrack() — not by blocking the front door before anyone has seen
     what Wodouh does. */
  next.disabled = false;
}

function renderOnboard(){
  const s = OB[obIndex];
  document.getElementById("obArt").innerHTML = s.art;
  document.getElementById("obTitle").textContent = s.title[lang];
  document.getElementById("obSub").textContent = s.sub[lang];
  document.getElementById("obSkip").textContent = t("ob_skip");
  document.getElementById("obNext").textContent = obIndex === OB.length-1 ? t("ob_start") : t("ob_next");
  document.getElementById("obSkip").style.visibility = obIndex === OB.length-1 ? "hidden" : "visible";
  /* Reached as a gate rather than as a tour: the dots and the advance button
     would both be lying about where the reader is, so neither appears. The
     only way on is to answer, which is the whole point of being here. */
  document.getElementById("obDots").hidden = natGate;
  document.getElementById("obNext").hidden = natGate;
  if (natGate){
    document.getElementById("obTitle").textContent = t("nat_gate_h");
    document.getElementById("obSub").textContent = t("nat_gate_b");
  }
  renderObPick(s);
  const dots = document.getElementById("obDots");
  dots.innerHTML = "";
  OB.forEach((_,i)=>{
    const d = document.createElement("button");
    if (i===obIndex) d.className = "on";
    d.setAttribute("aria-label", (i+1)+" / "+OB.length);
    d.onclick = ()=>{ obIndex = i; renderOnboard(); };
    dots.appendChild(d);
  });
}
function obNext(){
  if (obIndex < OB.length-1){ obIndex++; renderOnboard(); }
  else show("home");
}

/* Skipping the tour is fine; skipping the question is not, because the answer
   decides which law we show. Skip therefore jumps to the choice. */
function obSkip(){ show("home"); }

function pasteChanged(){
  /* The button stays live; if the text is too short we say so rather than
     greying out and leaving the user to guess. */
  const short = document.getElementById("pasteBox").value.trim().length < 40;
  document.getElementById("analyzeBtn").classList.toggle("soft", short);
}

/* ------------------------------------------------------------- analyze */
function analyze(kind){
  /* Which rules apply depends on the track, so ask before reading rather
     than after, and come straight back here with the same contract. */
  if (needsTrack(()=>analyze(kind))) return;
  const notice = document.getElementById("offlineNotice");
  if (navigator.onLine === false){ notice.hidden = false; return; }
  notice.hidden = true;
  if (kind === "pasted" && document.getElementById("pasteBox").value.trim().length < 40){
    const hint = document.querySelector("#screen-home .paste-hint");
    hint.classList.remove("nudge"); void hint.offsetWidth; hint.classList.add("nudge");
    document.getElementById("pasteBox").focus();
    return;
  }
  const pastedText = kind==="pasted" ? document.getElementById("pasteBox").value : null;
  const result = kind==="pasted" ? analyzePasted(pastedText) : SAMPLES[kind];
  if (!result){                      /* nothing recognised — never fake a score */
    current = null;
    runLoading(()=>{ buzz(12); show("noread"); });
    return;
  }
  current = result;
  /* Only a pasted contract can be re-analysed: a sample's clauses are
     authored, not matched, so switching track must not rewrite them. */
  current.srcText = pastedText;
  fbState = "ask";
  pwPaid = false; pwPlan = 0;
  letterSet = new Set();
  runLoading(()=>{
    renderResult(true); renderClauses(); renderFeedback();
    recordContract(); renderMyContracts();
    buzz(negotiables().length ? 12 : [10,60,18]);   /* lighter double-tap when all clear */
    show("result");
  });
}

function runLoading(done){
  const sk = document.getElementById("skel");
  if (sk){ sk.classList.remove("fading"); sk.hidden = false; }
  show("loading");
  const steps = T.load_steps[lang].slice();
  if (current) steps.splice(1, 0, t("load_" + current.doc.replace("doc_","")));
  let i = 0;
  const el = document.getElementById("loadStep"), fill = document.getElementById("loadFill");
  el.textContent = steps[0];
  fill.style.width = "0%";
  requestAnimationFrame(()=>{ fill.style.width = (100/steps.length) + "%"; });
  const iv = setInterval(()=>{
    i++;
    fill.style.width = Math.min(100, ((i+1)/steps.length)*100) + "%";
    if (i < steps.length) el.textContent = steps[i];
    else {
      clearInterval(iv);
      const sk2 = document.getElementById("skel");
      if (sk2 && !REDUCED.matches){ sk2.classList.add("fading"); }
      done();
    }
  }, 380);
}

function retryPaste(){

  box.value = ""; pasteChanged(); box.focus();

/* -------------------------------------------------------------- render */
const ICONS = {
  red:'<svg viewBox="0 0 14 14" fill="none"><path d="M7 3v5M7 10.6v.4" stroke="var(--on-teal)" stroke-width="2.2" stroke-linecap="round"/></svg>',
  amber:'<svg viewBox="0 0 14 14" fill="none"><path d="M7 3v4.5M7 10.6v.4" stroke="var(--on-teal)" stroke-width="2.2" stroke-linecap="round"/></svg>',
  green:'<svg viewBox="0 0 14 14" fill="none"><path d="M3.2 7.4l2.6 2.6 5-5.6" stroke="var(--on-teal)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>'
};

/* Escalation is graded by what we actually found: a red flag means this can
   become a dispute, and saying so plainly matters more than any disclaimer. */
function renderEscalate(target){
  const el = document.getElementById(target === "case" ? "caseEscalate" : "escalate");
  if (!el) return;
  const reds = target === "case" ? 1 : (current ? current.clauses.filter(c=>c.s==="red").length : 0);
  el.hidden = !reds;
  if (!reds) return;
  el.innerHTML =
    `<span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="var(--on-teal)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3 19c.9-3 3.2-4.4 6-4.4S14.1 16 15 19"/><path d="M17 8h5M19.5 5.5v5"/></svg></span>
     <div><b>${t("esc_head")}</b><p>${t("esc_body")}</p>
       <button class="esc-cta" onclick="openAssist('${target === "case" ? "case" : "result"}')">${t("esc_cta")}</button>
     </div>`;
}

/* Nothing is shown without saying where it came from. Two kinds, and the
   difference is deliberate and visible: a legal claim cites the article, and
   only articles verified in docs/legal-sources.md are ever cited that way.
   Everything else is Wodouh's own reading and says so, rather than borrowing
   authority it does not have. */
function srcOf(c){
  return c.src
    ? `<div class="src-line law">${t("govern_by")}: ${esc(c.src[lang])}</div>`
    : `<div class="src-line method">${t("src_method")}</div>`;
}

function scoreBand(n){ return n>=80 ? "great" : n>=60 ? "good" : n>=40 ? "fair" : "poor"; }

/* People do not open a contract wanting a number — they want to know whether
   they can sign. The decision is what the card leads with; the score stays
   directly beneath it as the supporting detail.

   Nothing new is computed here. The three states are read off the same
   clause data the flags already render, and the "lawyer" threshold matches
   renderEscalate, so the band and the existing escalation CTA can never
   disagree. */
function decide(a){
  const reds = a.clauses.filter(c=>c.s==="red").length;
  const ambers = a.clauses.filter(c=>c.s==="amber").length;
  if (reds >= 2 || (reds === 1 && a.score < 50)) return "lawyer";
  if (reds || ambers) return "negotiate";
  return "safe";
}

/* Confidence is about how much of the document we actually recognised, and
   it is never a fabricated percentage. A curated sample is a known quantity.
   Pasted text is only as trustworthy as the number of clauses matched, so we
   say what we matched and let the reader judge. */
function confidence(a){
  if (a.doc !== "doc_pasted") return { level:"high", n:a.clauses.length };
  const n = a.clauses.length;
  return { level: n >= 4 ? "med" : "low", n:n };
}

/* Picks the right inflected form for a counted noun. English collapses to a
   single plural, so the same four keys serve both languages. */
function countNoun(stem, n){
  const form = n === 1 ? "_1" : n === 2 ? "_2" : n <= 10 ? "_p" : "_m";
  return t(stem + form).replace("{n}", fmtNum(n));
}

const DC_ICON = {
  safe:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg>',
  negotiate:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 7v6M12 16.5v.2"/><circle cx="12" cy="12" r="9"/></svg>',
  lawyer:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 16H3z"/><path d="M12 10v4M12 17v.2"/></svg>'
};

function renderDecision(){
  const d = decide(current);
  const reds = current.clauses.filter(c=>c.s==="red").length;
  const ambers = current.clauses.filter(c=>c.s==="amber").length;
  const box = document.getElementById("decision");
  box.dataset.state = d;
  document.querySelector(".score-card").dataset.decision = d;
  /* Also on the screen, so blocks outside the card (the escalation panel)
     can pick up the same palette. */
  document.getElementById("screen-result").dataset.decision = d;
  document.getElementById("dcIcon").innerHTML = DC_ICON[d];
  /* Already-signed users are not deciding whether to sign, so the same
     finding is framed as what they can still act on. */
  document.getElementById("dcLabel").textContent = t(signedMode ? "dc_"+d+"_s" : "dc_"+d);

  let why;
  if (d === "safe") why = t("dc_why_none");
  else {
    const parts = [];
    if (reds) parts.push(countNoun("dc_red", reds));
    if (ambers) parts.push(countNoun("dc_amber", ambers));
    why = parts.join(t("dc_join"));
  }
  document.getElementById("dcWhy").textContent = why;

  const c = confidence(current);
  document.getElementById("dcConf").textContent =
    t("dc_conf_" + c.level).replace("{n}", fmtNum(c.n));
}

/* Which single action we recommend, given the decision. Everything else
   stays exactly where it is and stays clickable — this decides emphasis, not
   availability. Leading with a decision is hollow if five next steps then
   compete for it. */
const NEXT_OF = { safe:"trackTease", negotiate:"letterTease", lawyer:"escalate" };

function applyNextStep(d){
  const want = NEXT_OF[d];
  ["letterTease","trackTease","assistTease","escalate"].forEach(id=>{
    const el = document.getElementById(id);
    if (!el) return;
    /* A block that is not on screen is neither promoted nor dimmed — marking
       it either way would leave stale classes for the next render. */
    const shown = !el.hidden && el.style.display !== "none";
    const isNext = shown && id === want;
    el.classList.toggle("is-next", isNext);
    el.classList.toggle("demoted", shown && !!want && !isNext);
  });
  const chip = document.getElementById("nextChip");
  const host = document.querySelector(".is-next");
  if (chip){
    chip.remove();
  }
  if (host){
    const c = document.createElement("span");
    c.className = "next-chip";
    c.id = "nextChip";
    c.textContent = t("next_step");
    host.appendChild(c);
  }
}

function renderResult(reset){
  document.querySelector(".score-card").dataset.band = scoreBand(current.score);
  renderDecision();
  document.getElementById("verdict").textContent =
    (signedMode && current.vs ? current.vs : current.verdict)[lang];
  document.getElementById("docLabel").textContent = t(current.doc);
  if (reset){
    document.getElementById("scoreNum").textContent = "0";
    document.getElementById("ringVal").style.strokeDashoffset = "326.7";
  } else {
    setRing(current.score);
  }
  const clear = negotiables().length === 0;
  document.getElementById("letterTease").style.display = clear ? "none" : "flex";
  const ac = document.getElementById("allClear");
  ac.hidden = !clear;
  if (clear){
    document.getElementById("acTitle").textContent = t("ac_title");
    document.getElementById("acBody").textContent = t("ac_body");
  }
  /* With nothing to negotiate, reminders become the one clear next step. */
  document.getElementById("trackTease").classList.toggle("solo", clear);
  renderTrackTease();
  if (!clear) renderTease();
  renderEscalate("result");
  applyNextStep(decide(current));
  const wrap = document.getElementById("flags");
  wrap.innerHTML = "";
  current.clauses.forEach((c,idx)=>{
    const div = document.createElement("div");
    div.className = "flag " + c.s;
    const adv = adviceFor(c);
    const srcLine = srcOf(c) + costLine(c);
    const tip = adv
      ? `<div class="tip"><b>${t(signedMode ? "rights_label" : "what_to_do")}:</b> ${adv[lang]}</div>${srcLine}${addBtnHtml(idx)}`
      : srcLine;
    div.innerHTML =
      `<button aria-expanded="false" onclick="toggleFlag(this)">
         <span class="dot">${ICONS[c.s]}</span>
         <span class="ttl"><h4>${c.t[lang]}</h4></span>
         <span class="chev" aria-hidden="true">
           <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2"
                stroke-linecap="round" stroke-linejoin="round"><path d="M5 3l6 5-6 5"/></svg>
         </span>
       </button>
       <div class="advice"><p>${c.p[lang]}</p>${tip}</div>`;
    div.style.setProperty("--d", Math.min(idx,6)*40 + "ms");
    wrap.appendChild(div);
  });
  /* Red flags are the reason the user opened the app — they stay open by
     default; everything else collapses so the verdict reads at a glance. */
  wrap.querySelectorAll(".flag.red").forEach(f=>{
    f.classList.add("open");
    const btn = f.querySelector("button"), panel = f.querySelector(".advice");
    btn.setAttribute("aria-expanded","true");
    panel.style.maxHeight = "none";
  });
}

function setRing(score){
  const C = 326.7;
  document.getElementById("ringVal").style.strokeDashoffset = String(C * (1 - score/100));
  document.getElementById("scoreNum").textContent = String(score);
}

function animateRing(){
  const target = current.score;
  /* Under reduced motion the number arrives at once; the value is identical. */
  if (REDUCED.matches){ setRing(target); return; }
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    setRing(target);
    const numEl = document.getElementById("scoreNum");
    const t0 = performance.now();
    (function tick(now){
      const k = Math.min(1,(now-t0)/1100);
      numEl.textContent = String(Math.round(target * (1-Math.pow(1-k,3))));
      if (k<1) requestAnimationFrame(tick);
    })(t0);
  }));
}

function renderLib(){
  const wrap = document.getElementById("rightsLib");
  if (!wrap) return;
  wrap.innerHTML = "";

  /* With no track chosen the library is correct but incomplete — it shows
     only what applies to everyone. Say so and offer the choice, rather than
     letting someone conclude we have nothing on their situation. */
  if (!nat){
    const ask = document.createElement("div");
    ask.className = "lib-ask";
    const p1 = document.createElement("p");
    p1.textContent = t("lib_ask");
    ask.appendChild(p1);
    const row = document.createElement("div");
    row.className = "lib-ask-b";
    [["sa","nat_sa_short"],["nonsa","nat_nonsa_short"]].forEach(([v,lbl])=>{
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = t(lbl);
      b.onclick = ()=>{ nat = v; buzz(8); saveState(); renderNat(); renderLib(); };
      row.appendChild(b);
    });
    ask.appendChild(row);
    wrap.appendChild(ask);
  }
  LIB.forEach(group=>{
    const items = group.items.filter(forTrack);
    if (!items.length) return;      /* never leave a heading with nothing under it */
    const h = document.createElement("h4");
    h.className = "lib-g";
    h.textContent = t(group.g);
    wrap.appendChild(h);

    items.forEach(it=>{
      const d = document.createElement("details");
      d.className = "lib-item";
      if (it.key) d.dataset.key = it.key;
      const sum = document.createElement("summary");
      sum.textContent = it.q[lang];
      d.appendChild(sum);

      const body = document.createElement("div");
      body.className = "lib-a";
      const para = document.createElement("p");
      para.textContent = it.a[lang];
      body.appendChild(para);

      /* Same rule as the rest of the app: an origin, always. */
      const src = document.createElement("div");
      src.className = "src-line " + (it.src ? "law" : "method");
      src.textContent = it.src ? t("govern_by") + ": " + it.src[lang] : t("src_method");
      body.appendChild(src);

      if (it.go && LIB_GO[it.go]){
        const b = document.createElement("button");
        b.type = "button";
        b.className = "lib-go";
        b.textContent = t(it.label);
        b.onclick = LIB_GO[it.go];
        body.appendChild(b);
      }
      d.appendChild(body);
      wrap.appendChild(d);
    });
  });
}

function openEos(){ renderEos(); show("eos"); }

function renderEos(){
  const wrap = document.getElementById("eosHow");
  wrap.innerHTML = "";
  EOS_HOW.forEach(o=>{
    const b = document.createElement("button");
    b.type = "button";
    b.className = eosHow===o.id ? "on" : "";
    b.textContent = t(o.label);
    b.onclick = ()=>{ eosHow = o.id; renderEos(); if (document.getElementById("eosOut").innerHTML) calcEos(); };
    wrap.appendChild(b);
  });
  /* Only the fixed-term branch needs a contract end date, and only a
     termination raises the compensation question at all. */
  const fld = document.getElementById("eosTermFld");
  if (fld) fld.hidden = !(isNonSaudi() && eosHow === "term");
}

/* Calendar arithmetic, not averaged days: an exact three-year span must come
   out as 3.000, or the award is short by a few riyals for no good reason. */
function serviceParts(a, b){
  let y = b.getFullYear() - a.getFullYear();
  let m = b.getMonth() - a.getMonth();
  let d = b.getDate() - a.getDate();
  if (d < 0){ m--; d += new Date(b.getFullYear(), b.getMonth(), 0).getDate(); }
  /* One borrow is not always enough. From 31 Jan to 1 Mar the borrow is a
     28- or 29-day February against a 30-day shortfall, leaving d negative,
     which then subtracts from the award through serviceYears. The span really
     is a completed month with no extra days, so floor it there rather than
     letting a negative leak into money. */
  if (d < 0) d = 0;
  if (m < 0){ y--; m += 12; }
  return { y, m, d };
}

function serviceYears(a, b){
  if (b <= a) return 0;
  const { y, m, d } = serviceParts(a, b);
  return y + m/12 + d/365;
}

function resignFactor(y){
  if (y < 2) return 0;
  if (y < 5) return 1/3;
  if (y < 10) return 2/3;
  return 1;
}

/* ------------------------------------------------- shared money core
   The end-of-service calculator and the termination assessment are separate
   journeys, deliberately. Their arithmetic is not: two copies of a money
   formula drift, and the one that drifts is the one nobody is looking at.
   Everything below is pure — no globals, no DOM — so both flows call it and
   the fuzzer can hit it directly. */

/* Article 84: half a month per year for the first five, a full month per year
   after that, on the last wage, pro-rata. */
function awardBase(y, wage){
  const first = Math.min(y, 5), after = Math.max(0, y - 5);
  return first * 0.5 * wage + after * wage;
}

/* Months from one date to another, part-months as thirtieths. Null when we
   were not told; never negative — a contract already past its term owes
   nothing for time remaining. */
function monthsBetween(fromMs, toMs){
  if (fromMs == null || toMs == null) return null;
  const a = new Date(fromMs), b = new Date(toMs);
  if (isNaN(a) || isNaN(b)) return null;
  const months = (b.getFullYear() - a.getFullYear()) * 12
               + (b.getMonth() - a.getMonth())
               + (b.getDate() - a.getDate()) / 30;
  return Math.max(0, months);
}

/* Article 77, both branches, floored at two months' wages.
   `branch` is "fixed" or "indef". Getting this wrong understated a resident's
   figure by about five months' wages once already — see the corrections log. */
function compFor(wage, years, branch, remainingMonths){
  if (!(wage > 0)) return 0;
  const floor = wage * 2;
  if (branch === "fixed"){
    /* Without the contract's end date the remaining term is unknown. Return
       the floor and say so, rather than quietly using the wrong branch. */
    if (remainingMonths == null) return floor;
    return Math.max(floor, remainingMonths * wage);
  }
  return Math.max(floor, (years > 0 ? years : 0) * 15 * (wage / 30));
}

/* Article 111: accrued leave not taken, paid on the last wage. */
function leaveFor(days, wage){
  if (!(wage > 0) || !(days > 0)) return 0;
  return days * (wage / 30);
}

/* Article 76: the party who ignored the notice period pays the wage for it,
   or for the balance of it. Indefinite contracts only — it is the remedy for
   breaching Article 75, which does not reach an always-fixed-term contract. */
function noticeFor(dueDays, givenDays, wage){
  if (!(wage > 0) || !(dueDays > 0)) return 0;
  const short = Math.max(0, dueDays - Math.max(0, givenDays || 0));
  return short * (wage / 30);
}

function money(n){
  return new Intl.NumberFormat(lang==="ar" ? "ar-SA" : "en-US",
    { maximumFractionDigits:0 }).format(Math.round(n));
}

function calcEos(){
  const sd = document.getElementById("eosStart").value;
  const ed = document.getElementById("eosEnd").value;
  const wage = parseFloat(document.getElementById("eosWage").value);
  const out = document.getElementById("eosOut");
  const eosSrc = document.getElementById("eosSrc");
  /* The citation belongs to a result, so it appears and disappears with one. */
  if (!sd || !ed || !wage || wage <= 0){ out.innerHTML = ""; eosSrc.hidden = true; return; }
  const a = new Date(sd), bDate = new Date(ed);
  const y = serviceYears(a, bDate);
  /* Written as !(y > 0) rather than y <= 0: NaN fails every comparison, so
     the old guard let an unparseable date through to the arithmetic and the
     reader saw "not a number" where a figure should be. */
  if (!(y > 0)){ out.innerHTML = ""; eosSrc.hidden = true; return; }
  const parts = serviceParts(a, bDate);

  const first = Math.min(y, 5), after = Math.max(0, y - 5);
  const firstAmt = first * 0.5 * wage, afterAmt = after * wage;
  const sub = awardBase(y, wage);
  const factor = eosHow === "resign" ? resignFactor(y) : 1;
  const total = sub * factor;

  const svc = t("eos_yrs").replace("{y}", fmtNum(parts.y)).replace("{m}", fmtNum(parts.m));
  const cur = t("eos_sar");
  const row = (label, val, cls) =>
    `<div class="r${cls?" "+cls:""}"><span>${label}</span><b>${val}</b></div>`;

  out.innerHTML =
    `<div class="eos-card">
       <div class="lbl">${t("eos_result")}</div>
       <div class="amt">${money(total)}<small>${cur}</small></div>
       <div class="svc">${t("eos_service")}: ${svc}</div>
       <div class="rows">
         ${row(t("eos_b_first"), money(firstAmt)+" "+cur)}
         ${after > 0 ? row(t("eos_b_after"), money(afterAmt)+" "+cur) : ""}
         ${row(t("eos_b_sub"), money(sub)+" "+cur)}
         ${eosHow==="resign" ? row(t("eos_b_factor"), factor===0 ? "0" : (factor===1 ? "1" : (factor<0.5?"1/3":"2/3"))) : ""}
         ${row(t("eos_b_total"), money(total)+" "+cur, "tot")}
       </div>
       ${eosHow==="resign" && factor===0 ? `<p class="eos-note">${t("eos_none")}</p>` : ""}
       <p class="eos-note">${t("eos_note")}</p>
     </div>` +
    (eosHow === "term" ? triageHtml(ed) : "");
  eosSrc.hidden = false;
  eosData = { start:sd, end:ed, wage, years:y, parts, total, how:eosHow };
  /* The figure counts up to exactly the computed total; the value and its
     formatting are unchanged, only its arrival. */
  { const amtEl = document.querySelector("#eosOut .amt"), cur = t("eos_sar");
    if (amtEl) rollTo(
      { set textContent(v){ amtEl.innerHTML = v + "<small>" + cur + "</small>"; } },
      total, money); }
  buzz(8);
  if (eosHow === "term") bindTriage(ed);
}

function triageHtml(){
  const q = (key, id) =>
    `<div class="tq"><span>${t(key)}</span><div class="yn" data-q="${id}">
       <button type="button" data-v="1">${t("tr_yes")}</button>
       <button type="button" data-v="0">${t("tr_no")}</button>
     </div></div>`;
  return `<div class="triage">
      <h4>${t("tr_head")}</h4>
      ${q("tr_q1","reason")}${q("tr_q2","notice")}${q("tr_q3","probation")}
      <div id="triageOut"></div>
    </div>`;
}

function bindTriage(endDate){
  triage = { reason:null, notice:null, probation:null }; claimAdded = false;
  document.querySelectorAll("#eosOut .yn").forEach(g=>{
    g.querySelectorAll("button").forEach(b=>{
      b.onclick = ()=>{
        triage[g.dataset.q] = b.dataset.v === "1";
        g.querySelectorAll("button").forEach(x=>x.classList.remove("on"));
        b.classList.add("on");
        renderTriage(endDate);
      };
    });
  });
}

function renderTriage(endDate){
  const { reason, notice, probation } = triage;
  if (reason === null || notice === null || probation === null) return;
  const out = document.getElementById("triageOut");
  let cls, head, body;
  if (probation){ cls="warn"; head=t("tr_out_probation"); body=t("tr_out_probation_b"); }
  else if (reason && notice){ cls="ok"; head=t("tr_out_ok"); body=t("tr_out_ok_b"); }
  else { cls="act"; head=t("tr_out_claim"); body=t("tr_out_claim_b"); }
  out.innerHTML =
    `<div class="verdict-box ${cls}"><b>${head}</b><p>${body}</p></div>
     <div class="clock">
       <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
       <span>${t("tr_clock")}</span>
     </div>
     <button class="primary" id="clockBtn">${t(claimAdded ? "tr_added" : "tr_addclock")}</button>
     ${cls==="act" ? `<button class="ghost wide" id="caseBtn">${t("cf_cta")}</button>` : ""}`;
  document.getElementById("clockBtn").onclick = ()=>addClaimClock(endDate);
  const cb = document.getElementById("caseBtn");
  if (cb) cb.onclick = ()=>openCase();
  buzz(6);
}

/* The claim window is the one deadline that can cost someone everything, so
   it goes straight into the same reminder timeline as contract dates. */
function addClaimClock(endDate){
  if (claimAdded) { openTimeline("home"); return; }
  const base = new Date(endDate).getTime();
  TRACKED.push({ doc:"doc_claim", events:[
    { d:30, k:"action", when: base + 30*86400000,
      t:{ar:"ابدأ التسوية الودية",en:"Start amicable settlement"},
      n:{ar:"الطريق النظامي يبدأ بالتسوية الودية قبل المحكمة العمالية — بكّر فيها.",
         en:"The formal route begins with amicable settlement before the labour court — start early."} },
    { d:365, k:"deadline", when: base + 365*86400000,
      t:{ar:"آخر موعد لسماع الدعوى",en:"Claim deadline"},
      n:{ar:"بعد اثني عشر شهرًا من انتهاء العلاقة لا تُسمع الدعوى عادةً.",
         en:"After twelve months from the end of the relationship a claim is generally not heard."} }
  ]});
  claimAdded = true; buzz(10);
  saveState();
  document.getElementById("clockBtn").textContent = t("tr_added");
}

/* ------------------------------------------------------- case file ----
   The post-signing counterpart to the negotiation letter: the same
   build-as-you-go mechanic, aimed at recovery instead of negotiation. */
let eosData = null, caseDocs = new Set(), leaveDays = 0;

const CASE_DOCS = ["d_contract","d_letter","d_pay","d_wps","d_msgs","d_leave"];

function openCase(){
  /* The compensation figure uses a different Article 77 branch per track,
     and getting it wrong is what this whole distinction exists to prevent. */
  if (needsTrack(openCase)) return;
  renderCase(); show("case");
}

/* Article 77 has two branches, and which one applies is decided by the
   contract's type, not by preference.

   An indefinite contract pays 15 days' wages per year of service. A
   fixed-term contract pays the wages for the REMAINING TERM instead — and
   under Article 37 a non-Saudi's contract is always fixed-term. Applying the
   indefinite formula to them, as this once did, understates the figure badly:
   six years' service with eight months left came out at roughly three months'
   wages instead of eight.

   Both branches floor at two months' wages. */
function compEstimate(){
  if (!eosData) return 0;
  return compFor(eosData.wage, eosData.years,
                 isNonSaudi() ? "fixed" : "indef", remainingTermMonths());
}

/* The calculator's binding to the shared core: read the contract end date off
   the form, measure from the date they actually left. */
function remainingTermMonths(){
  const el = document.getElementById("eosTermEnd");
  if (!el || !el.value || !eosData) return null;
  return monthsBetween(eosData.end, new Date(el.value).getTime());
}

/* A fixed-term contract with decades left is almost always a mistyped year:
   2099 instead of 2029 turned a 480,000 claim into 8,880,000 in testing, with
   nothing on screen to suggest anything was wrong. We do not cap it — capping
   would invent a number for someone with a genuinely long term — we ask them
   to check the date. */
const TERM_SANITY_MONTHS = 60;

function termLooksImplausible(){
  const m = remainingTermMonths();
  return m != null && m > TERM_SANITY_MONTHS;
}

/* Which of the two Article 77 branches produced the number on screen. */
function compBasisKey(){
  if (!isNonSaudi()) return "cf_comp_note";
  return remainingTermMonths() == null ? "cf_comp_note_need" : "cf_comp_note_term";
}
function leaveAmount(){ return eosData ? leaveFor(leaveDays, eosData.wage) : 0; }
function claimTotal(){ return (eosData ? eosData.total : 0) + compEstimate() + leaveAmount(); }

function renderCase(){
  if (!eosData) return;
  const cur = t("eos_sar");
  const row = (l,v,cls)=>`<div class="r${cls?" "+cls:""}"><span>${l}</span><b>${money(v)} ${cur}</b></div>`;
  document.getElementById("caseClaim").innerHTML =
    `<div class="claim-card">
       <h4>${t("cf_claim")}</h4>
       ${row(t("cf_eos"), eosData.total)}
       ${row(t("cf_comp"), compEstimate())}
       <p class="mini">${t(compBasisKey())}</p>
       ${termLooksImplausible() ? `<p class="mini warn">${t("cf_term_odd")}</p>` : ""}
       <div class="leave-in">
         <span>${t("cf_leave_q")}</span>
         <input type="number" min="0" max="365" id="leaveDays" value="${leaveDays}"/>
       </div>
       ${row(t("cf_leave"), leaveAmount())}
       ${row(t("cf_total"), claimTotal(), "tot")}
     </div>`;
  const termEl = document.getElementById("eosTermEnd");
  if (termEl) termEl.onchange = ()=>renderCase();
  document.getElementById("leaveDays").oninput = e=>{
    leaveDays = Math.max(0, Math.min(365, parseInt(e.target.value||"0",10)));
    renderCase();
    document.getElementById("leaveDays").focus();
  };

  document.getElementById("caseDocs").innerHTML = CASE_DOCS.map(d=>
    `<button class="doc${caseDocs.has(d)?" on":""}" data-doc="${d}">
       <span class="box"><svg class="draw" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.5 3.5L13 4.5"/></svg></span>
       <span>${t(d)}</span>
     </button>`).join("");
  document.querySelectorAll("[data-doc]").forEach(b=>{
    b.onclick = ()=>{
      const k = b.dataset.doc;
      caseDocs.has(k) ? caseDocs.delete(k) : (caseDocs.add(k), buzz(8));
      renderCase();
    };
  });

  const pct = Math.round(caseDocs.size / CASE_DOCS.length * 100);
  document.getElementById("caseReady").innerHTML =
    `<div class="lbl"><span>${t("cf_ready")}</span>
       <span>${t("cf_ready_n").replace("{a}",fmtNum(caseDocs.size)).replace("{b}",fmtNum(CASE_DOCS.length))}</span></div>
     <div class="meter"><i style="width:${pct}%"></i></div>`;
}

function buildCaseDoc(){
  const cur = t("eos_sar"), d = eosData;
  const fmtD = ts => fmtDate(new Date(ts).getTime());
  const docs = CASE_DOCS.filter(x=>caseDocs.has(x)).map(x=>"• "+t(x)).join("\n") || "—";
  if (lang==="ar")
    return `${t("cf_facts")}\n`+
      `• بداية العمل: ${fmtD(d.start)}\n• نهاية العمل: ${fmtD(d.end)}\n`+
      `• مدة الخدمة: ${t("eos_yrs").replace("{y}",fmtNum(d.parts.y)).replace("{m}",fmtNum(d.parts.m))}\n`+
      `• آخر أجر شهري: ${money(d.wage)} ${cur}\n• طريقة الإنهاء: ${t("eos_h_term")}\n\n`+
      `${t("cf_claim")}\n`+
      `• ${t("cf_eos")}: ${money(d.total)} ${cur}\n`+
      `• ${t("cf_comp")}: ${money(compEstimate())} ${cur}\n`+
      `• ${t("cf_leave")}: ${money(leaveAmount())} ${cur}\n`+
      `• ${t("cf_total")}: ${money(claimTotal())} ${cur}\n\n`+
      `${t("cf_ev")}\n${docs}\n\n${t("cf_ask")}\n${t("cf_ask_b")}`;
  return `${t("cf_facts")}\n`+
    `• Start date: ${fmtD(d.start)}\n• End date: ${fmtD(d.end)}\n`+
    `• Length of service: ${t("eos_yrs").replace("{y}",d.parts.y).replace("{m}",d.parts.m)}\n`+
    `• Last monthly wage: ${money(d.wage)} ${cur}\n• How it ended: ${t("eos_h_term")}\n\n`+
    `${t("cf_claim")}\n`+
    `• ${t("cf_eos")}: ${money(d.total)} ${cur}\n`+
    `• ${t("cf_comp")}: ${money(compEstimate())} ${cur}\n`+
    `• ${t("cf_leave")}: ${money(leaveAmount())} ${cur}\n`+
    `• ${t("cf_total")}: ${money(claimTotal())} ${cur}\n\n`+
    `${t("cf_ev")}\n${docs}\n\n${t("cf_ask")}\n${t("cf_ask_b")}`;
}

function renderCaseDoc(){
  if (!eosData) return;
  document.getElementById("caseBody").textContent = buildCaseDoc();
  document.getElementById("caseFoot").textContent = t("lt_foot");
  document.getElementById("caseCopyBtn").textContent = t("cf_copy");
  renderEscalate("case");
}

function copyCase(){
  const btn = document.getElementById("caseCopyBtn");
  const done = ()=>{ btn.textContent = t("copied"); toast(t("copied")); setTimeout(()=>{ btn.textContent = t("cf_copy"); }, 1600); };
  if (navigator.clipboard) navigator.clipboard.writeText(document.getElementById("caseBody").textContent).then(done,done);
  else done();
}

function openCasePaywall(){
  if (casePaid){ renderCaseDoc(); show("casedoc"); return; }
  pwMode = "case"; pwPlan = 0; renderPaywall(); show("paywall");
}

/* ================================================ termination assessment
   The post-employment counterpart to the contract review. Someone arrives here
   because their job ended and they think it was handled wrongly.

   Two rules govern every line below:

   1. It never states a legal outcome. "Potential", "may", "appears",
      "based on what you told us" — never "illegal", never "you will win".
      A wrong promise to someone who has just lost their income is the worst
      thing this product could do.
   2. Every figure carries its origin, law or Wodouh's reading, exactly as the
      rest of the app does. The money here shares the arithmetic core with the
      calculator rather than reimplementing it. */

let term = null;              /* the answers; null until the flow starts */
let termStep = 0;
let termPaid = false;
let termTone = "professional";

/* What happened, and what each answer means legally. The seven options are not
   cosmetic: `award` decides whether the end-of-service figure is the full
   Article 84 amount, the reduced Article 85 tiers, or nothing at all, and that
   is the difference between showing someone their full award and showing them
   zero. See the Article 81 entry in the corrections log. */
const TERM_HOW = [
  { id:"employer",  label:"th_employer",  award:"full",   comp:true,  notice:true },
  { id:"forced",    label:"th_forced",    award:"full",   comp:true,  notice:true,  art81:true },
  { id:"resigned",  label:"th_resigned",  award:"resign", comp:false, notice:false },
  { id:"expired",   label:"th_expired",   award:"full",   comp:false, notice:false },
  { id:"probation", label:"th_probation", award:"none",   comp:false, notice:false, prob:true },
  { id:"noreason",  label:"th_noreason",  award:"full",   comp:true,  notice:true,  art80:true },
  { id:"other",     label:"th_other",     award:"full",   comp:false, notice:false, cautious:true }
];
function termHow(){ return TERM_HOW.find(x => x.id === (term && term.how)) || null; }

/* The evidence list. Wider than the case file's six because a termination
   dispute turns on different paper — warnings and settlement especially. */
const TERM_DOCS = ["d_contract","d_letter","d_pay","d_wps","d_msgs","d_leave",
                   "d_warn","d_settle","d_hr","d_comm"];

function blankTerm(){
  return { how:null, start:"", end:"", wage:0, basic:0, ctype:null, termEnd:"",
           probation:null, reason:"", noticeDue:null, noticeGiven:null,
           gotSettle:null, gotEos:null, leaveDays:0, unpaidMonths:0, otherAmt:0,
           docs:[] };
}

function openTerm(){
  /* Article 77 and Article 76 both branch on nationality, and getting that
     wrong is what this whole distinction exists to prevent. Ask before any
     money is computed, not after. */
  if (needsTrack(openTerm)) return;
  if (!term) term = blankTerm();
  termStep = 0;
  renderTermHow();
  show("term");
}

function renderTermHow(){
  const wrap = document.getElementById("termHow");
  wrap.innerHTML = "";
  TERM_HOW.forEach(o => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = term && term.how === o.id ? "on" : "";
    b.textContent = t(o.label);
    b.onclick = () => {
      term.how = o.id;
      /* Probation is answered by the choice itself; don't ask again. */
      if (o.prob) term.probation = true;
      saveState();
      buzz(8);
      renderTermHow();
      termStep = 0;
      renderTermQ();
      show("termq");
    };
    wrap.appendChild(b);
  });
}

/* ------------------------------------------------------ the questions
   Three short screens rather than one wall of fields. Only the first three
   values are required; everything else refines the picture, and a blank
   answer is reported as missing rather than guessed. */
const TERM_STEPS = [
  { title:"tm_q1_t", sub:"tm_q1_s", fields:["start","end","wage","basic"] },
  { title:"tm_q2_t", sub:"tm_q2_s", fields:["ctype","termEnd","noticeDue","noticeGiven","reason"] },
  { title:"tm_q3_t", sub:"tm_q3_s", fields:["gotSettle","gotEos","unpaidMonths","leaveDays","otherAmt"] }
];

function termQBack(){
  if (termStep > 0){ termStep--; renderTermQ(); return; }
  show("term", 1);
}

function termQNext(){
  saveState();
  if (termStep < TERM_STEPS.length - 1){ termStep++; renderTermQ(); buzz(6); return; }
  renderTermEv();
  show("termev");
}

/* A non-Saudi's contract is always fixed-term under Article 37, so asking them
   to choose is offering a wrong answer. */
function termCtype(){
  if (isNonSaudi()) return "fixed";
  return term && term.ctype ? term.ctype : null;
}

function renderTermQ(){
  const st = TERM_STEPS[termStep];
  document.getElementById("tqTitle").textContent = t(st.title);
  document.getElementById("tqSub").textContent = t(st.sub);
  document.getElementById("tqBackLabel").textContent =
    t(termStep === 0 ? "tm_h_title" : "tm_q_back");
  document.getElementById("tqSteps").innerHTML =
    TERM_STEPS.map((x, i) => `<i class="${i <= termStep ? "on" : ""}"></i>`).join("");
  document.getElementById("tqNext").textContent =
    t(termStep === TERM_STEPS.length - 1 ? "tm_q_done" : "tm_q_next");

  const F = {
    start:   () => dateFld("tmStart", "tm_f_start", term.start),
    end:     () => dateFld("tmEnd", "tm_f_end", term.end),
    wage:    () => numFld("tmWage", "tm_f_wage", term.wage, "tm_f_wage_h"),
    basic:   () => numFld("tmBasic", "tm_f_basic", term.basic, "tm_f_basic_h"),
    ctype:   () => isNonSaudi()
      ? note("tm_f_ctype_fixed")
      : segFld("tmCtype", "tm_f_ctype",
               [["indef","tm_f_indef"],["fixed","tm_f_fixed"]], term.ctype),
    termEnd: () => termCtype() === "fixed"
      ? dateFld("tmTermEnd", "tm_f_termend", term.termEnd, "tm_f_termend_h") : "",
    noticeDue:   () => numFld("tmNoticeDue", "tm_f_ndue", term.noticeDue, "tm_f_ndue_h"),
    noticeGiven: () => numFld("tmNoticeGiven", "tm_f_ngiven", term.noticeGiven, "tm_f_ngiven_h"),
    reason:      () => textFld("tmReason", "tm_f_reason", term.reason, "tm_f_reason_h"),
    gotSettle: () => ynFld("tmSettle", "tm_f_settle", term.gotSettle),
    gotEos:    () => ynFld("tmEos", "tm_f_eos", term.gotEos),
    unpaidMonths: () => numFld("tmUnpaid", "tm_f_unpaid", term.unpaidMonths, "tm_f_unpaid_h"),
    leaveDays:    () => numFld("tmLeave", "tm_f_leave", term.leaveDays, "tm_f_leave_h"),
    otherAmt:     () => numFld("tmOther", "tm_f_other", term.otherAmt, "tm_f_other_h")
  };
  document.getElementById("tqForm").innerHTML = st.fields.map(f => F[f]()).join("");
  bindTermQ();
}

function dateFld(id, label, val, hint){
  return `<label class="fld" for="${id}"><span>${t(label)}</span>
    <input type="date" id="${id}" value="${esc(val || "")}"/>
    ${hint ? `<em>${t(hint)}</em>` : ""}</label>`;
}
function numFld(id, label, val, hint){
  const v = (val === null || val === undefined || val === 0) ? "" : val;
  return `<label class="fld" for="${id}"><span>${t(label)}</span>
    <input type="number" inputmode="numeric" min="0" id="${id}" value="${esc(String(v))}"/>
    ${hint ? `<em>${t(hint)}</em>` : ""}</label>`;
}
function textFld(id, label, val, hint){
  return `<label class="fld" for="${id}"><span>${t(label)}</span>
    <input type="text" id="${id}" value="${esc(val || "")}" maxlength="140"/>
    ${hint ? `<em>${t(hint)}</em>` : ""}</label>`;
}
function segFld(id, label, opts, val){
  return `<div class="fld"><span>${t(label)}</span><div class="opts" id="${id}">
    ${opts.map(([v, k]) => `<button type="button" data-v="${v}" class="${val === v ? "on" : ""}">${t(k)}</button>`).join("")}
  </div></div>`;
}
function ynFld(id, label, val){
  return segFld(id, label, [["yes","tr_yes"],["no","tr_no"]],
                val === true ? "yes" : val === false ? "no" : null);
}
function note(key){ return `<p class="tq-skip">${t(key)}</p>`; }

function bindTermQ(){
  const num = (id, key, max) => {
    const el = document.getElementById(id);
    if (!el) return;
    el.oninput = () => {
      const n = parseFloat(el.value);
      term[key] = isFinite(n) && n > 0 ? Math.min(n, max) : 0;
    };
  };
  const txt = (id, key) => {
    const el = document.getElementById(id);
    if (el) el.oninput = () => { term[key] = el.value; };
  };
  txt("tmStart", "start"); txt("tmEnd", "end");
  txt("tmTermEnd", "termEnd"); txt("tmReason", "reason");
  /* Ceilings are sanity bounds, not legal ones: they stop a typo becoming a
     number nobody questions. The remaining-term check does the same job for
     the one figure where a typo is worth millions. */
  num("tmWage", "wage", 1e7); num("tmBasic", "basic", 1e7);
  num("tmNoticeDue", "noticeDue", 365); num("tmNoticeGiven", "noticeGiven", 365);
  num("tmUnpaid", "unpaidMonths", 60); num("tmLeave", "leaveDays", 365);
  num("tmOther", "otherAmt", 1e7);

  const seg = (id, apply) => {
    const w = document.getElementById(id);
    if (!w) return;
    w.querySelectorAll("button").forEach(b => {
      b.onclick = () => { apply(b.dataset.v); renderTermQ(); };
    });
  };
  seg("tmCtype", v => { term.ctype = v; });
  seg("tmSettle", v => { term.gotSettle = v === "yes"; });
  seg("tmEos", v => { term.gotEos = v === "yes"; });
}

/* --------------------------------------------------------- evidence
   Declared, not uploaded. Wodouh cannot read a payslip photo or a WhatsApp
   thread, so it asks what you have rather than pretending to analyse it —
   and says so on the screen instead of implying otherwise. */
function renderTermEv(){
  document.getElementById("termDocs").innerHTML = TERM_DOCS.map(d =>
    `<button class="doc${term.docs.indexOf(d) !== -1 ? " on" : ""}" data-tdoc="${d}">
       <span class="box"><svg class="draw" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.5 3.5L13 4.5"/></svg></span>
       <span>${t(d)}</span>
     </button>`).join("");
  document.querySelectorAll("[data-tdoc]").forEach(b => {
    b.onclick = () => {
      const k = b.dataset.tdoc, i = term.docs.indexOf(k);
      i === -1 ? (term.docs.push(k), buzz(8)) : term.docs.splice(i, 1);
      saveState();
      renderTermEv();
    };
  });

  const pct = Math.round(term.docs.length / TERM_DOCS.length * 100);
  document.getElementById("termReady").innerHTML =
    `<div class="lbl"><span>${t("cf_ready")}</span>
       <span>${t("cf_ready_n").replace("{a}", fmtNum(term.docs.length)).replace("{b}", fmtNum(TERM_DOCS.length))}</span></div>
     <div class="meter"><i style="width:${pct}%"></i></div>`;

  const ev = evidenceStrength();
  const missing = TERM_DOCS.filter(d => term.docs.indexOf(d) === -1);
  document.getElementById("termEvOut").innerHTML =
    `<div class="tm-sec">
       <div class="hd"><b>${t("tm_ev_strength")}</b><span class="tm-tag ${ev.cls}">${t(ev.key)}</span></div>
       <p>${t(ev.why)}</p>
       ${missing.length ? `<p><b>${t("tm_ev_missing")}</b><br>${missing.map(m => "• " + t(m)).join("<br>")}</p>` : ""}
     </div>`;
}

/* Weighted, not counted: the contract and the termination letter carry the
   dispute, and ten payslips do not replace either. */
const EV_KEY = { d_contract:3, d_letter:3, d_settle:2, d_pay:2, d_warn:2, d_msgs:1,
                 d_wps:1, d_leave:1, d_hr:1, d_comm:1 };

function evidenceScore(){
  return (term ? term.docs : []).reduce((n, d) => n + (EV_KEY[d] || 0), 0);
}
function evidenceStrength(){
  const s = evidenceScore();
  if (s >= 9)  return { cls:"ok",     key:"tm_ev_strong",  why:"tm_ev_strong_w" };
  if (s >= 4)  return { cls:"review", key:"tm_ev_mod",     why:"tm_ev_mod_w" };
  return { cls:"issue", key:"tm_ev_limited", why:"tm_ev_limited_w" };
}

/* ------------------------------------------------------------ the money
   Every function here delegates to the shared pure core. The figures are
   estimates of what may be owed, never a determination that anything is. */

function termServiceYears(){
  if (!term || !term.start || !term.end) return 0;
  const a = new Date(term.start), b = new Date(term.end);
  if (isNaN(a) || isNaN(b)) return 0;
  const y = serviceYears(a, b);
  return y > 0 ? y : 0;
}
function termParts(){
  if (!term || !term.start || !term.end) return { y:0, m:0, d:0 };
  const a = new Date(term.start), b = new Date(term.end);
  if (isNaN(a) || isNaN(b) || b <= a) return { y:0, m:0, d:0 };
  return serviceParts(a, b);
}
function termWage(){ return term && term.wage > 0 ? term.wage : 0; }

/* Article 84, then Article 85 only where the departure was an ordinary
   resignation. A departure under Article 81 keeps the full award — that
   distinction is the whole reason "asked to resign" is its own option. */
function termAward(){
  const h = termHow();
  if (!h || h.award === "none") return 0;
  const y = termServiceYears(), base = awardBase(y, termWage());
  return h.award === "resign" ? base * resignFactor(y) : base;
}

function termRemainingMonths(){
  if (!term || !term.termEnd || !term.end) return null;
  return monthsBetween(new Date(term.end).getTime(), new Date(term.termEnd).getTime());
}
function termTermOdd(){
  const m = termRemainingMonths();
  return m != null && m > TERM_SANITY_MONTHS;
}

/* Article 77, only where the ending could put it in play at all. */
function termComp(){
  const h = termHow();
  if (!h || !h.comp) return 0;
  return compFor(termWage(), termServiceYears(),
                 termCtype() === "fixed" ? "fixed" : "indef", termRemainingMonths());
}

/* Article 76. Indefinite contracts only — it is the remedy for breaching
   Article 75, which never reaches a non-Saudi's always-fixed-term contract.
   Showing it to the wrong person is the same error the log already records
   once, so it is refused here rather than filtered later. */
function termNoticeOwed(){
  const h = termHow();
  if (!h || !h.notice) return 0;
  if (isNonSaudi() || termCtype() === "fixed") return 0;
  return noticeFor(term.noticeDue, term.noticeGiven, termWage());
}

function termLeaveOwed(){ return leaveFor(term ? term.leaveDays : 0, termWage()); }
function termUnpaidOwed(){
  const m = term && term.unpaidMonths > 0 ? term.unpaidMonths : 0;
  return m * termWage();
}
function termOtherOwed(){ return term && term.otherAmt > 0 ? term.otherAmt : 0; }

/* The end-of-service award is only outstanding if it has not been paid. */
function termAwardOwed(){ return term && term.gotEos === true ? 0 : termAward(); }

function termLines(){
  return [
    { key:"tm_m_unpaid",  amt:termUnpaidOwed(), src:"tm_src_wage",   kind:"method" },
    { key:"tm_m_leave",   amt:termLeaveOwed(),  src:"tm_src_111",    kind:"law" },
    { key:"tm_m_eos",     amt:termAwardOwed(),  src:termHow() && termHow().award === "resign" ? "tm_src_8485" : "tm_src_84", kind:"law" },
    { key:"tm_m_notice",  amt:termNoticeOwed(), src:"tm_src_76",     kind:"law" },
    { key:"tm_m_comp",    amt:termComp(),       src:"tm_src_77",     kind:"law" },
    { key:"tm_m_other",   amt:termOtherOwed(),  src:"tm_src_other",  kind:"method" }
  ].filter(l => l.amt > 0);
}
function termTotal(){ return termLines().reduce((n, l) => n + l.amt, 0); }

/* ---------------------------------------------------- the assessment
   Three states only, and none of them is a verdict. "Potential issue" is the
   strongest thing this screen is allowed to say. */
function termSections(){
  const h = termHow(), out = [];
  const S = (k, state, why) => out.push({ k, state, why });

  S("tm_s_contract",
    h && h.art80 ? "issue" : h && h.prob ? "ok" : "review",
    h && h.art80 ? "tm_s_contract_issue" : h && h.prob ? "tm_s_contract_prob" : "tm_s_contract_review");

  if (h && h.notice && !isNonSaudi() && termCtype() !== "fixed"){
    const owed = termNoticeOwed();
    S("tm_s_notice", owed > 0 ? "issue" : term.noticeDue > 0 ? "ok" : "review",
      owed > 0 ? "tm_s_notice_issue" : term.noticeDue > 0 ? "tm_s_notice_ok" : "tm_s_notice_review");
  } else {
    S("tm_s_notice", "ok",
      isNonSaudi() || termCtype() === "fixed" ? "tm_s_notice_fixed" : "tm_s_notice_na");
  }

  S("tm_s_eos",
    term.gotEos === true ? "ok" : termAward() > 0 ? "issue" : "review",
    term.gotEos === true ? "tm_s_eos_paid"
      : h && h.art81 ? "tm_s_eos_81"
      : h && h.award === "resign" ? "tm_s_eos_resign"
      : h && h.award === "none" ? "tm_s_eos_prob" : "tm_s_eos_due");

  S("tm_s_unpaid", termUnpaidOwed() > 0 ? "issue" : "ok",
    termUnpaidOwed() > 0 ? "tm_s_unpaid_issue" : "tm_s_unpaid_ok");
  S("tm_s_leave", termLeaveOwed() > 0 ? "issue" : "review",
    termLeaveOwed() > 0 ? "tm_s_leave_issue" : "tm_s_leave_review");
  S("tm_s_other", termOtherOwed() > 0 ? "review" : "ok",
    termOtherOwed() > 0 ? "tm_s_other_review" : "tm_s_other_ok");
  if (termComp() > 0) S("tm_s_comp", "review", "tm_s_comp_review");
  S("tm_s_settle", term.gotSettle === false ? "issue" : "ok",
    term.gotSettle === false ? "tm_s_settle_issue" : "tm_s_settle_ok");
  return out;
}

/* Overall strength: what is on the table, how much paper backs it, and how
   much we were told. Never a prediction of the outcome. */
function termStrength(){
  const issues = termSections().filter(s => s.state === "issue").length;
  const ev = evidenceScore();
  if (issues >= 2 && ev >= 6) return { cls:"ok",     key:"tm_cs_strong",  why:"tm_cs_strong_w" };
  if (issues >= 1)            return { cls:"review", key:"tm_cs_possible",why:"tm_cs_possible_w" };
  return { cls:"issue", key:"tm_cs_limited", why:"tm_cs_limited_w" };
}

function termConfidence(){
  const known = ["start","end","wage"].every(k => term[k]) ? 1 : 0;
  const detail = [term.noticeDue, term.gotSettle, term.gotEos, term.reason]
    .filter(x => x !== null && x !== "" && x !== undefined).length;
  const ev = evidenceScore();
  if (!known) return "tm_conf_low";
  if (detail >= 3 && ev >= 6) return "tm_conf_high";
  if (detail >= 2 || ev >= 4) return "tm_conf_mod";
  return "tm_conf_low";
}

function openTermResult(){
  if (!termPaid){ pwMode = "term"; pwPlan = 0; renderPaywall(); show("paywall"); return; }
  renderTermResult();
  show("termres");
}

function renderTermResult(){
  if (!term) return;
  const st = termStrength();
  document.getElementById("termVerdict").innerHTML =
    `<div class="tm-sec">
       <div class="hd"><b>${t(st.key)}</b><span class="tm-tag ${st.cls}">${t("tm_cs_label")}</span></div>
       <p>${t(st.why)}</p>
       <p>${t("tm_r_notfinal")}</p>
     </div>`;

  document.getElementById("termSections").innerHTML = termSections().map(s =>
    `<div class="tm-sec">
       <div class="hd"><b>${t(s.k)}</b><span class="tm-tag ${s.state}">${t("tm_st_" + s.state)}</span></div>
       <p>${t(s.why)}</p>
     </div>`).join("");

  const cur = t("eos_sar"), lines = termLines();
  document.getElementById("termMoney").innerHTML =
    `<div class="tm-money">
       ${lines.length ? lines.map(l =>
         `<div class="r"><span>${t(l.key)}</span><b>${money(l.amt)} ${cur}</b></div>
          <p class="src-line ${l.kind}">${l.kind === "law" ? t(l.src) : t("src_method") + " — " + t(l.src)}</p>`).join("")
        : `<p class="cap">${t("tm_m_none")}</p>`}
       ${lines.length ? `<div class="r tot"><span>${t("tm_m_total")}</span><b>${money(termTotal())} ${cur}</b></div>` : ""}
       ${termTermOdd() ? `<p class="cap">${t("cf_term_odd")}</p>` : ""}
       <p class="cap">${t("tm_m_caveat")}</p>
     </div>`;

  document.getElementById("termClaims").innerHTML = lines.length
    ? lines.map(l =>
        `<div class="tm-claim">
           <b>${t(l.key)}</b>
           <dl>
             <dt>${t("tm_c_why")}</dt><dd>${t(l.key + "_why")}</dd>
             <dt>${t("tm_c_amt")}</dt><dd>${money(l.amt)} ${cur}</dd>
             <dt>${t("tm_c_ev")}</dt><dd>${t(l.key + "_ev")}</dd>
             <dt>${t("tm_c_conf")}</dt><dd>${t(termConfidence())}</dd>
           </dl>
           <p class="src-line ${l.kind}">${l.kind === "law" ? t(l.src) : t("src_method") + " — " + t(l.src)}</p>
         </div>`).join("")
    : `<p class="tq-skip">${t("tm_c_none")}</p>`;

  const ev = evidenceStrength();
  document.getElementById("termHowFactors").innerHTML = [
    ["tm_hw_answers", t("tm_hw_answers_b").replace("{h}", t(termHow() ? termHow().label : "th_other"))],
    ["tm_hw_service", t("tm_hw_service_b")
      .replace("{y}", fmtNum(termParts().y)).replace("{m}", fmtNum(termParts().m))],
    ["tm_hw_track", t(isNonSaudi() ? "tm_hw_track_nonsa" : "tm_hw_track_sa")],
    ["tm_hw_docs", t("tm_hw_docs_b")
      .replace("{n}", fmtNum(term.docs.length)).replace("{s}", t(ev.key))],
    ["tm_hw_rules", t("tm_hw_rules_b")]
  ].map(([k, body]) =>
    `<details><summary>${t(k)}</summary><p>${body}</p></details>`).join("");

  renderTermSteps();
}

function renderTermSteps(){
  const steps = [
    ["tm_n1", "tm_n1_b", null],
    ["tm_n2", "tm_n2_b", ["tm_n2_cta", () => { renderTermEv(); show("termev"); }]],
    ["tm_n3", "tm_n3_b", ["tm_n3_cta", () => { renderTermLtr(); show("termltr"); }]],
    ["tm_n4", "tm_n4_b", ["tm_n4_cta", () => { renderTermDoc(); show("termdoc"); }]],
    ["tm_n5", "tm_n5_b", null]
  ];
  const host = document.getElementById("termSteps");
  host.innerHTML = steps.map(([k, b, cta], i) =>
    `<div class="tm-step">
       <span class="n">${pointNum(i)}</span>
       <b>${t(k)}</b><p>${t(b)}</p>
       ${cta ? `<button class="ghost wide" data-step="${i}">${t(cta[0])}</button>` : ""}
     </div>`).join("");
  host.querySelectorAll("[data-step]").forEach(btn => {
    btn.onclick = steps[+btn.dataset.step][2][1];
  });
}

/* ------------------------------------------------------- the documents
   Both are factual and neutral on purpose. A case file that reads as an
   accusation is worth less to the person carrying it into a settlement
   meeting, not more. */

function termFacts(){
  const cur = t("eos_sar"), p = termParts();
  const d = v => v ? fmtDate(new Date(v).getTime()) : t("tm_d_unknown");
  return [
    `${t("tm_d_start")}: ${d(term.start)}`,
    `${t("tm_d_end")}: ${d(term.end)}`,
    `${t("tm_d_service")}: ${t("eos_yrs").replace("{y}", fmtNum(p.y)).replace("{m}", fmtNum(p.m))}`,
    `${t("tm_d_wage")}: ${termWage() ? money(termWage()) + " " + cur : t("tm_d_unknown")}`,
    `${t("tm_d_how")}: ${t(termHow() ? termHow().label : "th_other")}`,
    `${t("tm_d_ctype")}: ${t(termCtype() === "fixed" ? "tm_f_fixed" : termCtype() === "indef" ? "tm_f_indef" : "tm_d_unknown")}`,
    `${t("tm_d_reason")}: ${term.reason || t("tm_d_none_given")}`
  ];
}

function buildTermDoc(){
  const cur = t("eos_sar"), lines = termLines();
  const have = TERM_DOCS.filter(d => term.docs.indexOf(d) !== -1).map(d => "• " + t(d));
  const missing = TERM_DOCS.filter(d => term.docs.indexOf(d) === -1).map(d => "• " + t(d));
  const secs = termSections()
    .filter(s => s.state !== "ok")
    .map(s => `• ${t(s.k)} — ${t("tm_st_" + s.state)}: ${t(s.why)}`);
  const money$ = lines.map(l => `• ${t(l.key)}: ${money(l.amt)} ${cur}`);

  return [
    t("tm_doc_title"),
    "",
    t("tm_d_h_facts"),
    ...termFacts(),
    "",
    t("tm_d_h_issues"),
    ...(secs.length ? secs : [t("tm_d_none")]),
    "",
    t("tm_d_h_money"),
    ...(money$.length ? money$ : [t("tm_d_none")]),
    ...(money$.length ? [`• ${t("tm_m_total")}: ${money(termTotal())} ${cur}`] : []),
    t("tm_m_caveat"),
    "",
    t("tm_d_h_have"),
    ...(have.length ? have : [t("tm_d_none")]),
    "",
    t("tm_d_h_missing"),
    ...(missing.length ? missing : [t("tm_d_none")]),
    "",
    t("tm_d_h_questions"),
    t("tm_d_questions_b"),
    "",
    t("tm_d_h_next"),
    t("tm_d_next_b")
  ].join("\n");
}

/* What the paywall may show: the reader's own answers back to them, and
   nothing computed. No amount, no section state, no strength rating. */
function buildTermPreview(){
  return [t("tm_d_h_facts"), ...termFacts()].join("\n");
}

function renderTermDoc(){
  if (!term) return;
  document.getElementById("termDocBody").textContent = buildTermDoc();
  document.getElementById("termDocFoot").textContent = t("lt_foot");
  document.getElementById("termDocCopy").textContent = t("cf_copy");
}
function copyTermDoc(){ copyInto("termDocCopy", "termDocBody", "cf_copy"); }
function copyTermLtr(){ copyInto("termLtrCopy", "termLtrBody", "copy_btn"); }

/* One clipboard path for both, so the "copied" feedback cannot drift. */
function copyInto(btnId, bodyId, restoreKey){
  const btn = document.getElementById(btnId);
  const done = () => {
    btn.textContent = t("copied"); toast(t("copied"));
    setTimeout(() => { btn.textContent = t(restoreKey); }, 1600);
  };
  const text = document.getElementById(bodyId).textContent;
  if (navigator.clipboard) navigator.clipboard.writeText(text).then(done, done);
  else done();
}

/* Four registers of the same letter. Only the framing moves — the facts, the
   amounts and the citations are identical in all four, and none of them
   threatens anything. A letter that makes a threat the reader cannot back is
   worse than no letter. */
const TERM_TONES = ["friendly","professional","firm","formal"];

function renderTermTone(){
  const wrap = document.getElementById("termTone");
  wrap.innerHTML = "";
  TERM_TONES.forEach(id => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = termTone === id ? "on" : "";
    b.textContent = t("tm_tone_" + id);
    b.onclick = () => { termTone = id; renderTermLtr(); };
    wrap.appendChild(b);
  });
}

function buildTermLtr(){
  const cur = t("eos_sar"), lines = termLines();
  const items = lines.map((l, i) => `${pointNum(i)}. ${t(l.key)}: ${money(l.amt)} ${cur}`);
  const body = [
    t("tm_l_open_" + termTone),
    "",
    ...termFacts(),
    "",
    items.length ? t("tm_l_items") : t("tm_l_noitems"),
    ...items,
    ...(items.length ? [`${t("tm_m_total")}: ${money(termTotal())} ${cur}`] : []),
    "",
    t("tm_l_ask_" + termTone),
    "",
    t("tm_l_close_" + termTone),
    t("tm_l_sign")
  ];
  return body.join("\n");
}

function renderTermLtr(){
  if (!term) return;
  renderTermTone();
  document.getElementById("termLtrBody").textContent =
    t("tm_l_to") + "\n\n" + buildTermLtr();
  document.getElementById("termLtrFoot").textContent = t("lt_foot");
  document.getElementById("termLtrCopy").textContent = t("copy_btn");
}

/* ------------------------------------------------ plans & business tier */
let billing = "month", planBack = "home", plan = "free";

const TICK = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.5 3.5L13 4.5"/></svg>';
const DASH = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 8h8"/></svg>';

function openPlans(from){ planBack = from || "home"; renderPlans(); show("plans"); }

function renderPlans(){
  document.getElementById("plBackLabel").textContent = t(planBack==="assist" ? "as_title" : "back_home");
  const seg = document.getElementById("billSeg");
  seg.innerHTML = "";
  [["month","pl_month"],["year","pl_year"]].forEach(([k,lbl])=>{
    const b = document.createElement("button");
    b.type = "button";
    b.className = billing===k ? "on" : "";
    b.innerHTML = t(lbl) + (k==="year" ? `<span class="save">${t("pl_save")}</span>` : "");
    b.onclick = ()=>{ billing = k; renderPlans(); };
    seg.appendChild(b);
  });
  const wrap = document.getElementById("planCards");
  wrap.innerHTML = "";
  PLANS_T.forEach(pl=>{
    const card = document.createElement("div");
    card.className = "pcard" + (pl.hi?" hi":"") + (pl.biz?" biz":"");
    const amount = billing==="month" ? pl.m : pl.y;
    const unit = billing==="month" ? t("pl_permo") : t("pl_peryr");
    const price = amount === 0
      ? `<b>${t("pl_free")}</b>`
      : `<b>${fmtNum(amount)}</b><i>${lang==="ar"?"ر.س":"SAR"}${unit}</i>` +
        (pl.seat ? `<i>· ${t("pl_seat")}</i>` : "");
    const feats = pl.on.map(f=>`<li>${TICK}<span>${t(f)}</span></li>`).join("") +
                  pl.off.map(f=>`<li class="off">${DASH}<span>${t(f)}</span></li>`).join("");
    const owned = plan === pl.id;
    const cta = pl.id==="free" ? t("pl_cta_free") : pl.id==="plus" ? t("pl_cta_plus") : t("pl_cta_biz");
    card.innerHTML =
      (pl.tag ? `<span class="tag">${t(pl.tag)}</span>` : "") +
      `<h3>${t(pl.name)}</h3><div class="d">${t(pl.desc)}</div>
       <div class="price">${price}</div>
       <ul>${feats}</ul>
       <button class="cta${owned?" owned":""}">${owned ? t("pl_cta_free") : cta}</button>`;
    card.querySelector(".cta").onclick = ()=>choosePlan(pl.id);
    wrap.appendChild(card);
  });
}

function choosePlan(id){
  if (id === "free") return;
  buzz(10);
  plan = id;
  if (id === "biz"){ renderBiz(); show("biz"); return; }
  renderPlans();
}

let asOrigin = "home";

function openAssist(origin){
  asOrigin = origin;
  if (!chat.length){
    chat.push({ who:"bot", text:t("as_intro") });
    chat.push({ who:"bot", text:t("as_not_lawyer") });
  }
  renderAssist();
  show("assist");
  setTimeout(()=>document.getElementById("askInput").focus(), 120);
}
function assistBack(){
  /* The library is a tab root, so returning there is a tab move, not a pop. */
  if (asOrigin === "rights") return goTab("rights");
  show(["result","case","casedoc"].includes(asOrigin) ? (asOrigin==="case"?"case":"result") : "home", 1);
}

function renderCaps(){
  const wrap = document.getElementById("caps");
  wrap.innerHTML = "";
  CAPS.forEach(c=>{
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = t(c.label);
    b.onclick = ()=>ask(CAP_Q[c.id][lang]);
    wrap.appendChild(b);
  });
}

function renderAssist(){
  document.getElementById("asBackLabel").textContent = t(asOrigin==="result" ? "back_score" : "back_home");
  document.getElementById("askInput").placeholder = t("as_ph");
  renderCaps();
  const box = document.getElementById("chat");
  box.innerHTML = "";
  chat.forEach(m=>box.appendChild(msgEl(m)));
  renderQuota();
  box.scrollTop = box.scrollHeight;
}

function msgEl(m){
  const d = document.createElement("div");
  d.className = "msg " + m.who;
  if (m.typing){ d.innerHTML = '<span class="typing"><i></i><i></i><i></i></span>'; return d; }
  d.textContent = m.text;
  if (m.extra){ d.textContent += "\n\n" + m.extra; }
  if (m.refs && m.refs.length){
    const r = document.createElement("div");
    r.className = "refs";
    m.refs.forEach(x=>{
      const c = document.createElement("span");
      c.className = "ref";
      c.textContent = t("as_refs") + ": " + x[lang];
      r.appendChild(c);
    });
    d.appendChild(r);
  }
  if (m.draft){
    const b = document.createElement("button");
    b.className = "inline-cta";
    b.textContent = t("as_draft_cta");
    b.onclick = ()=>{ if (current && negotiables().length) openLetterFlow(); else show("home",1); };
    d.appendChild(b);
  }
  return d;
}

function renderQuota(){
  const q = document.getElementById("quota");
  const bar = document.getElementById("askBar");
  const left = FREE_QUESTIONS - asked;
  if (left > 0){
    q.className = "quota";
    q.textContent = left === 1 ? t("as_left1") : t("as_left").replace("{n}", fmtNum(left));
    document.getElementById("askInput").disabled = false;
    document.getElementById("askSend").disabled = false;
    bar.style.display = "flex";
    return;
  }
  /* The gate is the product's first honest paywall moment: the score and the
     flags stay free, but open-ended legal Q&A is metered. */
  q.className = "quota gate";
  q.innerHTML = "";
  const b = document.createElement("b"); b.textContent = t("as_quota_t");
  const p = document.createElement("span"); p.textContent = t("as_quota_b");
  const cta = document.createElement("button");
  cta.textContent = t("as_quota_cta");
  cta.onclick = ()=>{ buzz(10); openPlans("assist"); };
  q.append(b, p, cta);
  bar.style.display = "none";
}

function submitAsk(e){
  e.preventDefault();
  const el = document.getElementById("askInput");
  const v = el.value.trim();
  if (!v) return;
  el.value = "";
  ask(v);
}

function ask(text){
  if (asked >= FREE_QUESTIONS) return;
  asked++;
  chat.push({ who:"user", text });
  const box = document.getElementById("chat");
  box.appendChild(msgEl({ who:"user", text }));
  const typing = msgEl({ who:"bot", typing:true });
  box.appendChild(typing);
  box.scrollTop = box.scrollHeight;
  document.getElementById("askInput").disabled = true;
  setTimeout(()=>{
    const a = answer(text);
    typing.remove();
    const m = { who:"bot", ...a };
    chat.push(m);
    box.appendChild(msgEl(m));
    buzz(6);
    document.getElementById("askInput").disabled = false;
    renderQuota();
    box.scrollTop = box.scrollHeight;
  }, 700);
}
