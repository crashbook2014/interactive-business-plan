    /* Arriving from "we couldn't read that" — the reader has already tried
       their own text, so open the samples rather than the empty box again. */
    const w = document.getElementById("samplesWrap");
    if (w && w.hidden) toggleSamples();
    return;
  }
  /* AFTER the entry animation, never during. Focusing raises the iOS keyboard,
     which resizes the visual viewport and forces a full relayout — landing
     that inside a running transform animation is a guaranteed dropped frame at
     the worst possible moment. This was a hardcoded 260ms against a 360ms
     (--t-slow) entry, so it fired 100ms early every time. */
  const box = document.getElementById("pasteBox");
  if (!box) return;
  const el = document.getElementById("screen-intake");
  if (!el || REDUCED.matches) return box.focus({ preventScroll:true });
  let done = false;
  const go = ev => {
    /* animationend bubbles: rows and cards inside the screen fire it too. */
    if (done || (ev && ev.target !== el)) return;
    done = true;
    el.removeEventListener("animationend", go);
    box.focus({ preventScroll:true });
  };
  el.addEventListener("animationend", go);
  /* The animation may never run — reduced motion, or a browser that skips it
     on a hidden tab. Focus must not depend on an event that might not fire. */
  setTimeout(go, 480);
}

/* ------------------------------------------------- saved contracts ----
   A tool you use once needs no memory; a companion does. */
const STORE = "wodouh.v1";
let myContracts = [];

function saveState(){
  try {
    localStorage.setItem(STORE, JSON.stringify({
      nat,
      timelyOff, installOff,
      obDone,
      migAsked,
      usedCodes,
      owned, packUntil, packLeft, scanUsed,
      askUsed,
      term,
      contracts: myContracts.slice(0,8),
      tracked: TRACKED.map(x=>({ doc:x.doc, events:x.events.map(e=>({ ...e })) }))
    }));
  } catch(e){}
}
/* Anything read back from localStorage is untrusted: it survives across
   versions and can be edited by hand. Validate rather than assume shape, and
   replace TRACKED in place instead of appending so a second call is a no-op. */
function loadState(){
  try {
    const raw = localStorage.getItem(STORE);
    if (!raw) return;
    const d = JSON.parse(raw);

    /* Anything that isn't one of the two known tracks — including the absent
       field in payloads written by earlier versions — means "not chosen yet",
       so the reader is asked rather than assumed. */
    nat = (d.nat === "sa" || d.nat === "nonsa") ? d.nat : null;
    timelyOff = d.timelyOff === true;
    installOff = d.installOff === true;
    /* Only an explicit true suppresses the sync question. Anything else —
       missing, corrupt, written by an older version — means "not asked yet",
       so the failure mode is being asked once more rather than silently never
       being offered the thing an account is for. */
    migAsked = d.migAsked === true;
    /* Only an explicit true skips the tour. Anything else — missing, corrupt,
       written by an older version — runs it, which is the harmless direction. */
    obDone = d.obDone === true;
    usedCodes = Array.isArray(d.usedCodes)
      ? d.usedCodes.filter(x => typeof x === "string").slice(0, 200) : [];

    /* The daily question cap. Rebuilt with the same suspicion as everything
       else read back from storage — a hand-edited count is the obvious way to
       walk through it, and a NaN would make askLeft() return NaN and disable
       the button forever, which is a worse failure than a free question. */
    askUsed = { day:"", n:0 };
    if (d.askUsed && typeof d.askUsed === "object"){
      const day = typeof d.askUsed.day === "string" && /^\d{4}-\d{2}-\d{2}$/.test(d.askUsed.day)
        ? d.askUsed.day : "";
      const n = Number(d.askUsed.n);
      if (day) askUsed = { day, n: Number.isFinite(n) ? Math.min(Math.max(0, Math.floor(n)), 999) : 0 };
    }

    /* Entitlement read back from storage is untrusted like everything else
       here. A value survives only if it names a plan that exists in that
       flow's own list, so a hand-edited payload cannot mint a tier the code
       has never heard of. It can still grant itself a real one — that is the
       documented client-side limitation, unchanged by this. */
    owned = { review:null, letter:null, case:null };
    if (d.owned && typeof d.owned === "object"){
      Object.keys(owned).forEach(mode => {
        const id = d.owned[mode];
        if (typeof id === "string" && planIndex(mode, id) >= 0) owned[mode] = id;
      });
    }
    packUntil = (typeof d.packUntil === "number" && isFinite(d.packUntil) && d.packUntil > 0)
      ? Math.min(d.packUntil, Date.now() + PACK_DAYS * 86400000) : 0;
    /* Clamped to the pack size for the same reason packUntil is clamped to the
       window: a hand-edited payload may not mint credits that were never
       sold. It can still grant itself a real product — the documented
       client-side limitation, unchanged by this. */
    packLeft = 0;
    if (typeof d.packLeft === "number" && isFinite(d.packLeft))
      packLeft = Math.min(Math.max(0, Math.floor(d.packLeft)), PACK_CREDITS * 4);
    /* An expired pack holds nothing, whatever the stored count says. */
    if (packUntil <= Date.now()) packLeft = 0;

    /* The free scan's monthly counter. Same shape as askUsed above, and the
       same suspicion: a NaN here would make scansLeft() return NaN and lock
       the reader out of the free tier entirely, which is a worse failure than
       an extra free scan. */
    scanUsed = { month:"", n:0 };
    if (d.scanUsed && typeof d.scanUsed === "object"){
      const mo = typeof d.scanUsed.month === "string" && /^\d{4}-\d{2}$/.test(d.scanUsed.month)
        ? d.scanUsed.month : "";
      const n = Number(d.scanUsed.n);
      if (mo) scanUsed = { month: mo, n: Number.isFinite(n) ? Math.min(Math.max(0, Math.floor(n)), 999) : 0 };
    }

    /* A stored answer set is untrusted like everything else here: it outlives
       versions and can be hand-edited. Rebuild it field by field onto a blank
       shape so a payload missing half its keys cannot reach the money. */
    term = null;
    if (d.term && typeof d.term === "object"){
      const b = blankTerm(), src = d.term;
      const str = k => typeof src[k] === "string" ? src[k].slice(0, 200) : b[k];
      const num = (k, max) => (typeof src[k] === "number" && isFinite(src[k]) && src[k] > 0)
        ? Math.min(src[k], max) : b[k];
      const tri = k => src[k] === true || src[k] === false ? src[k] : null;
      b.how = TERM_HOW.some(x => x.id === src.how) ? src.how : null;
      b.start = str("start"); b.end = str("end"); b.termEnd = str("termEnd");
      b.reason = str("reason");
      b.ctype = (src.ctype === "fixed" || src.ctype === "indef") ? src.ctype : null;
      b.wage = num("wage", 1e7); b.basic = num("basic", 1e7);
      b.noticeDue = num("noticeDue", 365); b.noticeGiven = num("noticeGiven", 365);
      b.unpaidMonths = num("unpaidMonths", 60); b.leaveDays = num("leaveDays", 365);
      b.otherAmt = num("otherAmt", 1e7);
      b.probation = tri("probation"); b.gotSettle = tri("gotSettle"); b.gotEos = tri("gotEos");
      /* exc87 was saved and then dropped on the way back in — every other field
         is rebuilt here and this one was missed when it became a required
         input. A woman who answered "within three months of giving birth" saw
         55,000 SAR, reopened the app, and was shown 36,667 and told she had
         never answered. Reload, PWA relaunch and tab eviction all reach it.
         Whitelisted rather than string-copied: an unrecognised value would read
         as answered and restore the false confidence this input exists to end. */
      b.exc87 = ["none","force","marriage","birth"].indexOf(src.exc87) >= 0 ? src.exc87 : null;
      b.docs = Array.isArray(src.docs)
        ? src.docs.filter(x => TERM_DOCS.indexOf(x) !== -1).slice(0, TERM_DOCS.length) : [];
      if (b.how) term = b;
    }

    myContracts = (Array.isArray(d.contracts) ? d.contracts : [])
      .filter(c => c && typeof c === "object"
                && Object.prototype.hasOwnProperty.call(T, c.doc)
                && Number.isFinite(+c.score) && Number.isFinite(+c.at))
      .map(c => ({ doc:c.doc, score:Math.max(0, Math.min(100, +c.score)),
                   at:+c.at, signed:!!c.signed }))
      .slice(0, 8);

    const tracked = (Array.isArray(d.tracked) ? d.tracked : [])
      .filter(x => x && typeof x === "object"
                && Object.prototype.hasOwnProperty.call(T, x.doc)
                && Array.isArray(x.events))
      /* Events are rebuilt field by field like every other stored value, rather
         than spread wholesale. They were the one exception, and it showed in
         two ways: HTML written into e.t/e.n rendered as live markup through
         renderTimeline's innerHTML, and an event missing those fields threw and
         blanked the reminder screen with no way back. Note that
         reminderEvents() already defends the same array — `(e.t && e.t[lang])`
         — so the two readers of it disagreed about whether it could be
         trusted. Now neither has to. */
      .map(x => ({ doc:x.doc, events:x.events
        .filter(e => e && typeof e === "object")
        .map(e => {
          const str = v => typeof v === "string" ? v.slice(0, 200) : "";
          const pair = o => (o && typeof o === "object")
            ? { ar: str(o.ar), en: str(o.en) } : { ar:"", en:"" };
          return { when: (typeof e.when === "number" && isFinite(e.when)) ? e.when : 0,
                   d: (typeof e.d === "number" && isFinite(e.d)) ? e.d : 0,
                   k: str(e.k), t: pair(e.t), n: pair(e.n) };
        })
        .slice(0, 40) }));
    TRACKED.length = 0;
    tracked.forEach(x => TRACKED.push(x));
  } catch(e){
    /* Corrupt or foreign payload: start clean rather than render partial state. */
    myContracts = []; TRACKED.length = 0; nat = null; timelyOff = false; installOff = false; usedCodes = [];
  }
}

function fmtDate(ts){
  /* Intl throws RangeError on an unparseable date, and a throw inside a
     document builder blanks the whole screen. loadState() rebuilds numbers and
     enum values field by field but takes DATE strings as-is, so a stored
     term.start of "hello" reaches here as NaN — and the case file and employer
     letter are exactly where that would land, with no way back.
     Say we do not know, which is what the copy already provides for. */
  const n = typeof ts === "number" ? ts : new Date(ts).getTime();
  if (!Number.isFinite(n)) return t("tm_d_unknown") || "—";
  return new Intl.DateTimeFormat(lang==="ar" ? AR_DATE : "en-GB",
    { day:"numeric", month:"long", year:"numeric" }).format(n);
}

/* ------------------------------------------------- calendar export
   Apple Calendar, Outlook and the stock Android calendar all import RFC 5545
   .ics files, so one generated file covers them without asking for calendar
   permission, an entitlement, or a backend. Google Calendar has no bulk
   import URL: a single event opens its prefilled template, several fall back
   to the same .ics, which Google imports from settings.

   Because we never request calendar access there is no permission to be
   denied. What can fail is the download itself, so both paths report back
   and the UI says so rather than appearing to do nothing. */

/* RFC 5545 §3.3.11 */
function icsEsc(s){
  return String(s == null ? "" : s)
    .replace(/\\/g, "\\\\").replace(/;/g, "\\;")
    .replace(/,/g, "\\,").replace(/\r?\n/g, "\\n");
}
function icsPad(n){ return n < 10 ? "0" + n : String(n); }
function icsUTC(d){
  return d.getUTCFullYear() + icsPad(d.getUTCMonth()+1) + icsPad(d.getUTCDate()) +
    "T" + icsPad(d.getUTCHours()) + icsPad(d.getUTCMinutes()) + icsPad(d.getUTCSeconds()) + "Z";
}
function icsDay(d){ return d.getFullYear() + icsPad(d.getMonth()+1) + icsPad(d.getDate()); }

/* §3.1 limits a line to 75 octets. Arabic is multi-byte, so fold on encoded
   length and never split a surrogate pair. */
function icsFold(line){
  let out = "", cur = "", len = 0;
  for (let i = 0; i < line.length; i++){
    let ch = line[i];
    if (ch >= "\uD800" && ch <= "\uDBFF" && i + 1 < line.length) ch += line[++i];
    const w = unescape(encodeURIComponent(ch)).length;
    if (len + w > 74){ out += cur + "\r\n "; cur = ""; len = 1; }
    cur += ch; len += w;
  }
  return out + cur;
}

/* The reminders, as calendar events. All-day, because these are dates the
   user acts on, not appointments. */
function reminderEvents(){
  return TRACKED.flatMap(c => c.events.map(e => ({
    start: e.when,
    title: (e.t && e.t[lang]) || t(c.doc),
    description: ((e.n && e.n[lang]) || "") + "\n\n" + t(c.doc) + " — Wodouh"
  }))).filter(e => Number.isFinite(+e.start)).sort((a,b) => a.start - b.start);
}

function buildICS(events){
  let lines = ["BEGIN:VCALENDAR","VERSION:2.0",
    "PRODID:-//Wodouh//Contract reminders//EN","CALSCALE:GREGORIAN","METHOD:PUBLISH",
    "X-WR-CALNAME:" + icsEsc(t("tl_title"))];
  let n = 0;
  events.forEach((ev, i) => {
    const start = new Date(ev.start);
    if (isNaN(start.getTime())) return;
    lines = lines.concat([
      "BEGIN:VEVENT",
      "UID:wodouh-" + i + "-" + Math.random().toString(36).slice(2,10) + "@wodouh.app",
      "DTSTAMP:" + icsUTC(new Date()),
      "DTSTART;VALUE=DATE:" + icsDay(start),
      "DTEND;VALUE=DATE:" + icsDay(new Date(start.getTime() + 86400000)),
      "SUMMARY:" + icsEsc(ev.title),
      "DESCRIPTION:" + icsEsc(ev.description),
      /* Matches the two-weeks-and-one-day promise in tl_note. */
      "BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:" + icsEsc(ev.title),
      "TRIGGER:-P14D","END:VALARM",
      "BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:" + icsEsc(ev.title),
      "TRIGGER:-P1D","END:VALARM",
      "END:VEVENT"
    ]);
    n++;
  });
  lines.push("END:VCALENDAR");
  return n ? lines.map(icsFold).join("\r\n") + "\r\n" : null;
}

function downloadICS(events){
  const ics = buildICS(events);
  if (!ics) return false;
  try {
    const url = URL.createObjectURL(new Blob([ics], { type:"text/calendar;charset=utf-8" }));
    const a = document.createElement("a");
    a.href = url; a.download = "wodouh-reminders.ics"; a.rel = "noopener";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 30000);
    return true;
  } catch(e){ return false; }
}

function googleCalUrl(ev){
  const start = new Date(ev.start);
  if (isNaN(start.getTime())) return null;
  return "https://calendar.google.com/calendar/render?action=TEMPLATE" +
    "&text=" + encodeURIComponent(ev.title) +
    "&dates=" + icsDay(start) + "/" + icsDay(new Date(start.getTime() + 86400000)) +
    "&details=" + encodeURIComponent(ev.description);
}

function exportReminders(target){
  const events = reminderEvents();
  if (!events.length) return;
  buzz(8);
  if (target === "google" && events.length === 1){
    const url = googleCalUrl(events[0]);
    if (url && window.open(url, "_blank", "noopener,noreferrer")) return;
  }
  toast(t(downloadICS(events) ? "cal_done" : "cal_fail"));
}

function renderTimeline(){

  const all = TRACKED.flatMap(c => c.events.map(e => ({ ...e, doc: c.doc })))

  document.getElementById("tlExport").hidden = !all.length;
  if (!all.length){
    wrap.innerHTML = `<div class="tl-empty">${t("tl_empty")}</div>`;
    return;

const SCANS_FREE = 1;

   counted, and a scan at 22:00 local on the last day fell after it and was
   charged to the month that had not started yet.

function monthStartISO(){

/* Asked once when a session appears, and after each scan is recorded. */
function loadScanCount(){
  if (!authOn() || !WodouhAuth.user()) { scanServer = null; return Promise.resolve(null); }

    .catch(() => { scanServer = null; return null; });

function thisMonth(){

function useScan(){
  const mo = thisMonth();
  if (scanUsed.month !== mo) scanUsed = { month:mo, n:0 };
  scanUsed.n += 1;
  /* Recorded against the account as well, where there is one. The row is a
     user id and a timestamp — nothing about the document. Optimistically
     counted locally first, so the limit holds even if the write fails and the
     reader is not handed a second scan by a dropped request. */
  if (authOn() && WodouhAuth.user()){
    if (scanServer !== null) scanServer += 1;
    WodouhAuth.api("/rest/v1/scan_events", { method:"POST", body:{ user_id: WodouhAuth.user().id } })
      .then(loadScanCount).catch(() => {});
  }
}

/* THE GATE, INSIDE analyze() RATHER THAN AT ITS FOUR CALLERS.
   Four buttons reach a scan today and a fifth will exist eventually. A guard
   repeated at each call site is a guard the next route forgets — the same
   argument the entitlement grant makes about downgrades.

   An UNCONFIGURED build is untouched: with no project there is no account to
   count against, so gating would lock the reader out of a product that has
   nothing to sell them. */
function scanGate(kind){
  if (!authOn()) return true;
  if (reviewUnlocked()) return true;
  if (!WodouhAuth.user()){
    pendingNav = { kind: "scan", payload: kind };
    authWant = "scan";
    openSignin("home");
    return false;
  }
  if (scansLeft() <= 0){
    /* REMEMBER WHAT THEY WERE TRYING TO READ. The branch above already does
       this for sign-in; this one did not, and the asymmetry cost the reader
       the thing they paid for. They hit the limit on contract B, paid 199, and
       were shown contract A's result — because nothing had recorded that B was
       what they came for. Five pieces of paywall state were set here and the
       only one that mattered to the reader was missing. */
    pendingNav = { kind: "scan", payload: kind };
    pwMode = "review"; pwOrigin = "review"; pwPlan = 0;
    pwUpgrade = null; pwUpBack = null;
    if (renderPaywall()) show("paywall");
    return false;
  }
  return true;
}

/* Does this reader get the WHOLE review, or the scan?
   Business is unlimited. The pack is unlimited until its credits or its year
   run out. A single review is what it says on the card: one contract.

   HONEST LIMITATION, STATED RATHER THAN HIDDEN: none of this is enforced
   anywhere but this browser. A reader who edits localStorage grants
   themselves a product. That was already true of every tier here and is not
   made worse by this; it is fixed by entitlements living server-side, which
   belongs with real payments and does not exist yet. */
function reviewUnlocked(){
  if (owned.review === "plan_biz") return true;
  if (owned.review === "plan_reviews5") return packLive();
  return owned.review === "plan_review";
}
/* Twelve months. It was 182 — the old pack promised six. */
const PACK_DAYS = 365;
const PACK_CREDITS = 5;

/* Where the paywall's back button goes. An upgrade is entered from wherever the
   reader already was, so it returns there rather than to the flow's start. */
/* pwOrigin exists because `case` is now entered from TWO flows — the case
   builder and the termination assessment, which used to have a mode of its
   own. Without it, buying the case file from a termination would drop the
   reader into the case builder they never opened. */
let pwOrigin = null;
function pwBack(){
  if (pwUpgrade && pwUpBack) return pwUpBack;
  if (pwOrigin === "term") return "termev";
  return pwMode === "case" ? "case" : pwMode === "review" ? "result" : "result";
}

function openPaywall(){
  /* First surface that a flag governs, so this is where the one request is
     made. Not awaited: the paywall renders now from the compiled default and
     applyFlags() re-renders it if the answer differs. A reader never waits on
     the network to see a screen. */
  ensureFlags();
  /* pwOrigin BELONGS TO WHOEVER OPENS THE PAYWALL, and this was one of the two
     entry points that did not set it. renderPaywall() derives isTerm from it,
     so a reader who merely looked at the termination paywall and backed out
     arrived here to a screen titled "Your termination assessment", a preview
     of their employment facts, a shape block counting their entitlements — and
     a pay button reading "Show my full assessment 149 SAR". One tap recorded
     the 149 letter and rendered the 349 assessment. Every commercial guard in
     this file is downstream of pwOrigin; the guards were right and their input
     was stale. */
  pwMode = "letter"; pwOrigin = "letter"; pwUpgrade = null; pwUpBack = null;
  if (has("letter")){ renderLetter(); show("letter"); return; }
  pwPlan = Math.max(0, activePlans().findIndex(p => p.pop));   /* the intended choice */
  if (renderPaywall()) show("paywall");
}

/* Opening the paywall to sell a step up. The reader is shown the difference,
   not the full price a second time, and only the tier they do not yet hold. */
function openUpgrade(mode, tier, back, origin){
  /* Same reason as openPaywall(): an upgrade opened after a termination visit
     inherited "term" and was rendered — and priced, and gated — as one. The
     origin defaults to the mode, which is true of every caller today; a
     termination upgrade passes "term" explicitly rather than relying on
     whatever the last screen happened to leave behind. */
  pwMode = mode; pwOrigin = origin || mode; pwUpgrade = tier; pwPlan = 0;
  if (back) pwUpBack = back;
  if (renderPaywall()) show("paywall");
}
let pwUpBack = null;

function renderPaywall(){
  /* Only the revealed portion is rendered; the withheld points never enter
     the DOM before payment. */
  const isCase = pwMode === "case", isTerm = pwOrigin === "term",
        isReview = pwMode === "review";
  /* The two modes have different plan lists — three for the letter, two for the
     case file — so an index carried across a mode switch can point past the end
     and leave the pay button reading "Pay undefined". Every entry point happens
     to reset it today; clamping here, above the guard, makes that a property of
     the paywall rather than of the callers remembering. */
  pwPlan = Math.max(0, Math.min(pwPlan, activePlans().length - 1));
  /* The review branch is separate because its precondition is different, and
     omitting it rendered an EMPTY PAYWALL: the letter guard requires chosen
     negotiation points, and a reader buying the full read of their contract
     has not chosen any. The screen appeared with no plans and no price.
     Caught by opening it, not by reading it. */
  /* RETURNS FALSE RATHER THAN JUST RETURNING, and the difference is money.
     Every caller used to pair `renderPaywall(); show("paywall")` unconditionally,
     so on the paths this guard refuses the reader was navigated to a paywall
     that had not been re-rendered — showing whatever offer was last built
     there. Reached from the letter with no points chosen, after a look at the
     termination paywall, that was a 349 SAR assessment offer sitting above the
     letter's state. A screen that cannot be built must not be shown. */
  if (isTerm ? !term : isCase ? !eosData : isReview ? !current
      : (!current || !selected().length)) return false;
  const titleKey = pwUpgrade ? "pw_up_title" : isTerm ? "pw_term_title"
                 : isCase ? "pw_case_title" : isReview ? "pw_rev_title" : "pw_title";
  const freeKey  = isTerm ? "pw_term_free"  : isCase ? "pw_case_free"
                 : isReview ? "pw_rev_free" : "pw_free_note";
  document.querySelector('#screen-paywall [data-t="pw_title"]').textContent = t(titleKey);
  document.querySelector('#screen-paywall [data-t="pw_free_note"]').textContent = t(freeKey);
  /* "Back to score" sat here regardless of where the button actually went. */
  document.getElementById("pwBackLabel").textContent =
    t(isTerm ? "back_ev" : isCase ? "back_case" : "back_score");
  /* A refund promise and "no real payment happens" were rendering four lines
     apart. One flag, so only the true one can appear. */
  document.getElementById("pwGuarantee").hidden = !PAYMENT_LIVE;
  document.getElementById("pwDemo").hidden = PAYMENT_LIVE;
  /* Show one complete point rather than blurring everything: concealment reads
     as evasion, while real withheld value reads as value. It also means no
     unpaid text is sitting in the DOM behind a CSS filter. */
  const full = isTerm ? buildTermPreview() : isCase ? buildCaseDoc() : buildLetter();
  const lines = full.split("\n");
  document.getElementById("pwPreviewHead").textContent =
    isTerm ? t("tm_r_title") : isCase ? t("cf_title") : LETTER_TO[current.doc][lang];
  let shown, rest;
  if (isTerm){
    /* The facts they gave us are theirs to see. Not one riyal figure and not
       one assessment reaches the DOM before payment. */
    shown = lines.join("\n");
    rest = t("pw_term_more");
  } else if (isCase){
    shown = lines.slice(0, 5).join("\n");
    rest = t("pw_more_case");
  } else {
    const firstPoint = lines.findIndex(l=>/^\s*[123451-5]\./.test(l));
    const cut = firstPoint >= 0 ? firstPoint + 1 : 4;
    shown = lines.slice(0, cut).join("\n");
    /* With a single point chosen there is no "+0 more" to promise; the value
       withheld is the finished document itself. */
    const remaining = Math.max(0, selected().length - 1);
    rest = remaining === 0 ? t("pw_more0")
         : remaining === 1 ? t("pw_more1")
         : t("pw_more").replace("{n}", fmtNum(remaining));
  }
  /* THE PREVIEW IS THE LETTER'S, and only the letter's. On the review paywall
     it rendered "To: The HR department" above a locked row promising "the
     complete letter, formatted and ready to send" — a preview of a different
     product entirely, on the screen selling the contract read. Nothing in the
     tests could see it; it took opening the screen and looking.

     Hidden rather than replaced: what the review withholds is already stated
     twice on this screen, in the note under the title and on the card itself,
     and a third telling would be filler. */
  const prev = document.getElementById("pwPreview");
  if (prev) prev.hidden = isReview;
  document.getElementById("pwPreviewIntro").textContent = shown;
  document.getElementById("pwLockLine").textContent = rest;
  renderPwShape(isTerm, isCase);
  const wrap = document.getElementById("plans");
  wrap.innerHTML = "";
  activePlans().forEach((pl,i)=>{
    const b = document.createElement("button");
    b.className = "plan" + (i===pwPlan ? " sel" : "");
    const soon = !!pl.soon;
    b.innerHTML =
      `<span class="radio"></span>
       <span style="flex:1"><b>${t(pl.name)}${soon?`<span class="badge">${t("plan_soon")}</span>`:pl.pop?`<span class="badge">${t(pl.tag||"plan_pop")}</span>`:""}</b><span>${t(soon ? "plan_soon_d" : pl.desc)}</span></span>
       <span class="price">${priceLabel(pl.amt, pl.monthly)}</span>`;
    /* An unbuyable card is inert rather than absent: it can be read and not
       selected, so its price informs without becoming a dead control that
       looks like it should work. */
    if (soon){ b.disabled = true; b.classList.add("soon"); }
    else b.onclick = ()=>{ pwPlan = i; renderPaywall(); };
    wrap.appendChild(b);
  });
  /* A tertiary text link, deliberately: the business reader recognises
     themselves and taps it, and the consumer reads past it. It sits below the
     plans rather than among them so it can never be mistaken for one of the
     things being chosen between. */
  if (isReview){
    const biz = document.createElement("button");
    biz.className = "pw-biz";
    biz.id = "pwBiz";
    biz.textContent = t("pw_biz_link");
    biz.onclick = ()=>{ renderBiz(); show("biz"); };
    wrap.appendChild(biz);
  }
  renderRedeem();
  const pay = document.getElementById("payBtn");
  const chosen = activePlans()[pwPlan];
  /* Last line of defence. Both routes into a termination paywall now check
     first, but a route added later must not be able to sell an assessment that
     found nothing — so the button itself refuses. */
  pay.disabled = !chosen || !buyable(chosen) || (isTerm && assessmentEmpty());
  /* One key here read "Get my letter" on a 245 SAR case file and on a
     termination assessment. The button now names what it sells. */
  /* isTerm is tested BEFORE isCase, and the order is the point. Both are true
     when the case file is bought from a termination — it is one product now —
     but the reader arrived asking what they are owed, not asking for a file.
     Naming it "case file" there answers a question they did not ask. */
  pay.textContent = t(pwUpgrade ? "pw_pay_up" : isTerm ? "pw_pay_term"
                    : isCase ? "pw_pay_case" : isReview ? "pw_pay_rev" : "pw_pay")
    + " " + priceLabel(chosen ? chosen.amt : 0);
  return true;
}

/* WHAT THE READER IS BUYING, BEFORE THEY BUY IT.
   The termination paywall used to show the reader their own answers read back
   and ask 145 SAR for it. The rule it was protecting is right and survives —
   no riyal figure and no assessment reaches the DOM before payment — but the
   shape of the work is not the work. Counts and names only. */
function renderPwShape(isTerm, isCase){
  const host = document.getElementById("pwShape");
  if (!host) return;
  if (!isTerm && !isCase){ host.hidden = true; host.innerHTML = ""; return; }
  const items = [];
  if (isTerm){
    const lines = termLines(), gaps = termUnassessed();
    const law = lines.filter(l => l.kind === "law").length;
    const method = lines.length - law;
    const sep = lang === "ar" ? "، " : ", ";
    /* "0 entitlements we found in your case:" — a count, a colon and no list.
       Nothing found means there is nothing to describe, so the shape is empty
       and the pay button beside it is disabled. */
    if (!lines.length){ host.hidden = true; host.innerHTML = ""; return; }
    items.push([fmtNum(lines.length), t("pw_sh_found")
      .replace("{n}", countNoun("cnt_ent", lines.length))
      .replace("{list}", lines.map(l => t(l.key)).join(sep)), false]);
    /* "1 are Wodouh's own reading" — the verb agreed with nothing. */
    items.push([fmtNum(law), t("pw_sh_law").replace("{n}", fmtNum(law))
      .replace("{m}", fmtNum(method)).replace("{v}", t(method === 1 ? "is_1" : "is_p")), false]);
    if (gaps.length)
      items.push([fmtNum(gaps.length), t("pw_sh_gaps")
        .replace("{n}", countNoun("cnt_item", gaps.length))
        .replace("{list}", gaps.map(g => t(g.key)).join(sep)), true]);
    items.push(["✓", t("pw_sh_each"), false]);
  } else {
    items.push(["✓", t("pw_sh_case_claim"), false]);
    items.push(["✓", t("pw_sh_case_docs"), false]);
    items.push(["✓", t("pw_sh_each"), false]);
  }
  host.hidden = false;
  host.innerHTML = `<h4>${t("pw_sh_head")}</h4><ul>` +
    items.map(([n, text, dim]) =>
      `<li class="${dim ? "dim" : ""}"><span>${n}</span><span>${text}</span></li>`).join("") +
    `</ul>`;
}

/* ---------------------------------------------- redemption codes
   A bridge for selling through Zid without a backend: the buyer pays on Zid,
   receives a code, and enters it here.

   WHAT THIS IS NOT: security. Every check below happens in the reader's own
   browser, so anyone willing to open the developer tools can set `owned`
   themselves and skip the paywall entirely. Storing hashes rather than
   plaintext only means the page does not simply list working codes; it does
   not make the gate hold. That is an acceptable trade for a test of tens of
   buyers and unacceptable as a launch mechanism — see
   docs/zid-test-runbook.md.

   Ships EMPTY on purpose. The feature stays invisible and inert until real
   hashes are pasted in from test/make-codes.mjs, so no placeholder code can
   ever unlock anything. */
const REDEEM_HASHES = [];

let usedCodes = [];

function redeemArmed(){ return REDEEM_HASHES.length > 0; }

function normaliseCode(v){
  return String(v || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
}

async function hashCode(norm){
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(norm));
  return Array.from(new Uint8Array(buf))
    .map(b => b.toString(16).padStart(2, "0")).join("").slice(0, 16);
}

function renderRedeem(){
  const box = document.getElementById("redeem");
  if (!box) return;
  box.hidden = !redeemArmed() || has(pwMode);
  const open = document.getElementById("rdOpen");
  if (open) open.textContent = t("rd_have");
}

function toggleRedeem(){
  const f = document.getElementById("rdForm");
  f.hidden = !f.hidden;
  if (!f.hidden) document.getElementById("rdCode").focus();
}

function rdSay(key, ok){
  const m = document.getElementById("rdMsg");
  m.hidden = false;
  m.textContent = t(key);
  m.classList.toggle("bad", !ok);
}

async function redeem(){
  const raw = document.getElementById("rdCode").value;
  const norm = normaliseCode(raw);
  if (norm.length < 6) return rdSay("rd_bad", false);

  let h;
  try { h = await hashCode(norm); }
  catch(e){ return rdSay("rd_bad", false); }

  if (REDEEM_HASHES.indexOf(h) === -1) return rdSay("rd_bad", false);
  /* One redemption per code on this device. It cannot stop the same code being
     used on another phone — that needs a server. */
  if (usedCodes.indexOf(h) !== -1) return rdSay("rd_used", false);

  usedCodes.push(h);
  saveState();
  rdSay("rd_ok", true);
  buzz([12,50,20]);
  /* Land in exactly the same place a payment does, so there is one route to
     the paid state rather than two that can drift apart. */
  setTimeout(grantAndGo, 600);
}

/* The single route to the paid state. Both the payment button and the code
   redemption land here, so entitlement cannot be granted two different ways
   that drift apart — which is how the tier came to be recorded in one place
   and never read in another. */
/* THE PACK TOP-UP, GATED ON WHAT WAS BOUGHT.
   This used to sit further down grantAndGo() reading `owned.review` — what the
   reader HOLDS — with no reference to what they had just purchased. So every
   purchase of anything topped up a pack the reader already had: hold the 699
   pack, buy a 149 letter, receive five more reviews. Measured at 5 → 10 → 15
   before this changed. It was the only defect in the catalogue that scaled with
   how much a customer spent, which meant it rewarded the best customers most.

   `want` is the product actually bought. The bundle grants plan_review and
   never plan_reviews5, so a bundle purchase correctly does not credit a pack
   either — the old test read owned.review AFTER the grant and could not tell
   the two apart.

   `< Date.now()`, not `!packUntil`: the original guard protected an ACTIVE
   window from being extended on a re-render and did that, but also refused to
   refresh an EXPIRED one, so a repeat buyer paid for a window that had already
   lapsed. Comparing to now keeps the protection and fixes the case it never
   considered. Credits are ADDED rather than reset, so buying a second pack
   while the first is live does not destroy what is left of it. */
function creditPack(bought){
  if (bought !== "plan_reviews5") return;
  if (packUntil < Date.now()){
    packUntil = Date.now() + PACK_DAYS * 86400000;
    packLeft = PACK_CREDITS;
  } else {
    packLeft += PACK_CREDITS;
  }
}

function grantAndGo(){
  /* THE SINGLE ROUTE INTO THE PAID STATE, so the refusal belongs here too.
     "Do not sell an assessment that found nothing" was enforced on the pay
     button, and redemption codes do not go through the pay button — they call
     this directly. No code can reach it today (REDEEM_HASHES is empty), which
     is exactly the moment to put the guard on the path rather than on one of
     the controls that happens to lead to it. */
  if (pwOrigin === "term" && assessmentEmpty()) return;
  const chosen = activePlans()[pwPlan];
  /* Monotonic: a grant may only ever move a reader up. Writing unconditionally
     meant granting a cheaper tier silently revoked a dearer one — a reader who
     paid 295 could end up holding 145. No route in the shipped UI reaches that
     today (all three paywall entries are guarded), but the guard was at three
     call sites and the write was in one place. It belongs here, so a fourth
     route — a payment provider's return URL, say — cannot downgrade someone
     who has paid. */
  if (chosen){
    const want = chosen.up ? pwUpgrade : chosen.name;
    const plan = offeredPlans(pwMode).find(p => p.name === want);
    /* THE BUNDLE CROSSES MODES, which nothing before it did. Writing
       owned[pwMode] alone would have set owned.bundle — a mode no flow ever
       asks about — and granted the buyer nothing they paid for. */
    if (plan && plan.grants){
      Object.keys(plan.grants).forEach(mode => {
        const id = plan.grants[mode], held = owned[mode];
        if (!held || planIndex(mode, id) >= planIndex(mode, held)) owned[mode] = id;
      });
    } else {
      const held = owned[pwMode];
      if (!held || planIndex(pwMode, want) >= planIndex(pwMode, held)) owned[pwMode] = want;
    }
    creditPack(want);
  }
  const wasUpgrade = !!pwUpgrade, backTo = pwUpBack;
  pwUpgrade = null; pwUpBack = null;
  saveState();
  /* THE SCAN THEY PAID FOR RUNS NOW, and deliberately after saveState() rather
     than before it. analyze() re-enters scanGate(), which asks reviewUnlocked()
     — so the entitlement has to be written first or the reader is bounced
     straight back to the paywall they have just paid at. resumeAfterAuth() is
     reused rather than re-implemented: it already clears the pending intent and
     already does nothing when there is none. */
  if (pendingNav && pendingNav.kind === "scan"){ resumeAfterAuth(); return; }
  /* An upgrade returns the reader to the step they were on, now unlocked,
     rather than dropping them back at the top of a result they have read. */
  if (wasUpgrade && backTo){
    if (pwOrigin === "term") renderTermResult();
    show(backTo);
    return;
  }
  if (pwOrigin === "term"){ pwOrigin = null; renderTermResult(); show("termres"); return; }
  if (pwMode === "review"){ renderResult(); show("result"); return; }
  if (pwMode === "case"){ renderCaseDoc(); show("casedoc"); return; }
  renderLetter();
  show("letter");
}

function pwPay(){
  const pay = document.getElementById("payBtn");
  pay.disabled = true;
  pay.textContent = t("pw_paying");
  setTimeout(()=>{ buzz([12,50,20]); grantAndGo(); }, 900);
}

function renderLetter(){
  if (!current || !selected().length) return;
  document.getElementById("letterBody").textContent =
    LETTER_TO[current.doc][lang] + "\n\n" + buildLetter();
  document.getElementById("copyBtn").textContent = t("copy_btn");
  document.getElementById("letterFoot").textContent = t("lt_foot");
  renderLawyerTease();
}

/* ------------------------------------------------ lawyer review desk
   A handoff, not a service. It assembles a complete request the reader sends
   themselves, which keeps the zero-dependency architecture and the privacy
   promise intact: nothing is transmitted from here. */
let deskBack = "letter";
function holdsLawyerTier(mode){
  const id = owned[mode];
  if (!id) return false;
  const p = (PLAN_SETS[mode] || PLANS).find(x => x.name === id);
  return !!(p && p.lawyer);
}
function renderLawyerTease(){
  const el = document.getElementById("lawyerTease");
  if (el) el.hidden = !(LAWYER_DESK.live && holdsLawyerTier("letter"));
}
function openDesk(origin){
  deskBack = origin;
  renderDesk();
  show("lawyerdesk");
}
function renderDesk(){
  document.getElementById("ldBackLabel").textContent =
    t(deskBack === "casedoc" ? "cf_title" : "lt_ready");
  document.getElementById("ldContact").placeholder = t("ld_contact");
  document.getElementById("ldAsk").placeholder = t("ld_ask");
  document.getElementById("ldCopy").textContent = t("ld_copy");
  const turn = document.getElementById("ldTurn");
  /* No turnaround is stated unless one has been set. An unbacked "within 24
     hours" is exactly the promise this build exists to stop making. */
  turn.hidden = !LAWYER_DESK.turnaround;
  if (LAWYER_DESK.turnaround)
    turn.textContent = t("ld_turn").replace("{v}", LAWYER_DESK.turnaround);
}
function buildDeskRequest(){
  const doc = deskBack === "casedoc"
    ? document.getElementById("caseBody").textContent
    : document.getElementById("letterBody").textContent;
  return [
    t("ld_title"),
    t("ld_contact") + ": " + (document.getElementById("ldContact").value || "—"),
    t("ld_ask") + ": " + (document.getElementById("ldAsk").value || "—"),
    "",
    doc
  ].join("\n");
}
function copyDeskRequest(){
  const btn = document.getElementById("ldCopy");
  const done = ()=>{ btn.textContent = t("copied"); toast(t("copied"));
                     setTimeout(()=>{ btn.textContent = t("ld_copy"); }, 1600); };
  if (navigator.clipboard) navigator.clipboard.writeText(buildDeskRequest()).then(done, done);
  else done();
}

function copyLetter(){
  const btn = document.getElementById("copyBtn");
  const done = ()=>{ btn.textContent = t("copied"); toast(t("copied")); setTimeout(()=>{ btn.textContent = t("copy_btn"); }, 1600); };
  if (navigator.clipboard) navigator.clipboard.writeText(document.getElementById("letterBody").textContent).then(done, done);
  else done();
}

/* ------------------------------------------------------------ feedback */

const FEEDBACK = [];

function renderFeedback(){

  el.innerHTML =
    `<div class="fb-q">${t("fb_q")}</div>
     <div class="fb-btns">
       <button aria-label="${t("fb_up")}" title="${t("fb_up")}" onclick="fbVote(true)">
         <svg viewBox="0 0 24 24" fill="none" stroke="var(--teal)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 11v9M7 11l4-7c1.4 0 2.5 1.1 2.5 2.5V9H19a1.8 1.8 0 0 1 1.8 2.1l-1.2 7A1.8 1.8 0 0 1 17.8 20H7"/></svg>
       </button>
       <button aria-label="${t("fb_down")}" title="${t("fb_down")}" onclick="fbVote(false)">
         <svg viewBox="0 0 24 24" fill="none" stroke="var(--red)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 13V4M17 13l-4 7c-1.4 0-2.5-1.1-2.5-2.5V15H5a1.8 1.8 0 0 1-1.8-2.1l1.2-7A1.8 1.8 0 0 1 6.2 4H17"/></svg>
       </button>
     </div>${comment}`;
  if (fbState === "comment" && prevText) document.getElementById("fbText").value = prevText;
}

/* A stable identifier for a heuristic. Derived from the English title, which
   is what the rule is, rather than its position in the array — so reordering
   RULES never silently re-points historical feedback at the wrong rule.
   Matches the rule_ids column in supabase/migrations/0001_init.sql. */
function ruleId(c){
  return String((c.t && c.t.en) || "unknown")
    .toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
}

/* "This was wrong" is only actionable if we know what "this" was. Recording
   the rules that fired, the decision they produced, and the confidence we
   claimed makes an inaccurate verdict traceable to the specific heuristic
   behind it — which is what turns feedback into an accuracy record instead
   of a sentiment score. */
function fbRecord(vote, comment){
  const entry = {
    at: Date.now(),
    doc: current ? current.doc : null,
    score: current ? current.score : null,
    decision: current ? decide(current) : null,
    confidence: current ? confidence(current).level : null,
    ruleIds: current ? current.clauses.map(ruleId) : [],
    signedMode,
    lang,
    vote,
    comment: comment || ""
  };
  FEEDBACK.push(entry);
  console.log("wodouh feedback:", entry);
}

function fbVote(up){
  buzz(8);
  if (up){ fbRecord("up"); fbState = "done"; }
  else fbState = "comment";
  renderFeedback();
}

function fbSend(){
  fbRecord("down", document.getElementById("fbText").value.trim());
  fbState = "done";
  renderFeedback();
}

function renderClauses(){
  if (!current){ show("home"); return; }
  const wrap = document.getElementById("clauseList");
  wrap.innerHTML = "";
  current.clauses.forEach((c,i)=>{
    const div = document.createElement("div");
    div.className = "clause " + c.s;
    const quote = quoteHtml(c);
    const act = actionLabel(c.s);
    const adv = adviceFor(c);
    const advice = adv ? ` ${adv[lang]}` : "";
    div.innerHTML =
      `<div class="head"><span class="stripe"></span><h4>${c.t[lang]}</h4></div>
       ${quote}
       <div class="plain">${c.p[lang]}${advice}</div>
       <span class="act">${act}</span>
       ${srcOf(c)}
       ${c.a ? addBtnHtml(i) : ""}`;
    wrap.appendChild(div);
  });
}

/* ------------------------------------------------ offline shell
   Registered late and failure-tolerant. The app has always worked without it
   and must keep working if registration is refused — private browsing, an
   unsupported browser, a `file://` open. Nothing above this line depends on
   it, which is the point. */
function initOffline(){
  if (!("serviceWorker" in navigator)) return;
  if (location.protocol !== "https:" && location.hostname !== "localhost"
      && location.hostname !== "127.0.0.1") return;
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  });
}

/* Whether we are already running as an installed app. iOS answers with its own
   non-standard property; everyone else with the media query. */
function isStandalone(){
  return window.matchMedia("(display-mode: standalone)").matches
      || navigator.standalone === true;
}

/* The install hint. Shown only where it is actionable and true: an iPhone or
   iPad in Safari, not already installed, and not dismissed. Android and
   desktop Chrome offer their own install affordance and do not need telling.
   Dismissal is remembered, because a banner that returns is an advert. */
function renderInstallHint(){
  const el = document.getElementById("installHint");
  if (!el) return;
  const ua = navigator.userAgent;
  const iOS = /iPad|iPhone|iPod/.test(ua)
    || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  const safari = /Safari/.test(ua) && !/CriOS|FxiOS|EdgiOS|OPiOS/.test(ua);
  el.hidden = !(iOS && safari) || isStandalone() || installOff;
  if (el.hidden) return;
  el.querySelector("b").textContent = t("inst_h");
  el.querySelector(".ih-b").textContent = t("inst_b");
  el.querySelector(".ih-x").textContent = t("tm_dismiss");
}
/* Whichever way the install hint resolved, the timely notice defers to it. */
function renderInstallHintThenTimely(){ renderInstallHint(); renderTimely(); }
function dismissInstall(){ installOff = true; saveState(); renderInstallHint(); }

loadState();
if (typeof initAuth === "function") initAuth();
/* Static and language-independent, so rendered once at boot rather than from
   renderPaywall() — which returns early on several legitimate paths and left
   the marks missing entirely. */
renderPayMarks();
applyLang();
initIntake();
initGestures();
initOffline();
window.addEventListener("scroll", onScroll, { passive:true });
window.addEventListener("resize", moveTabIndicator, { passive:true });
/* The tour is the markup's active screen, so skipping it is an explicit move
   rather than an absence. Done last, once every renderer is initialised.
 *
 * WAITS FOR THE SESSION, AND THAT WAIT IS THE POINT. WodouhAuth.init() re-mints
 * an access token from a stored refresh token, which is a network round trip;
 * routing before it answers means authUser is still null, and every returning
 * reader gets bounced to sign-in on every single reload of an app they are
 * already signed into. authReady starts resolved, so an unconfigured build and
 * a reader with no stored session both route on the very next microtask. */
if (obDone) authReady.then(() => show("home"));
requestAnimationFrame(()=>{ armReveals(); moveTabIndicator(); });
</script>
