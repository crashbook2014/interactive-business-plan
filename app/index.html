  .signed-ask{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;
    padding:10px 12px;margin:0 0 14px;background:var(--card);border:1px solid var(--line);
    border-radius:var(--r-sm);text-align:start;font-size:13.5px;color:var(--ink-2);line-height:1.5}
  .signed-ask .sa-box{flex:none;width:20px;height:20px;border-radius:6px;
    border:1.5px solid var(--line);background:var(--bg);display:flex;align-items:center;
    justify-content:center;color:transparent;transition:background var(--t-fast),border-color var(--t-fast)}
  .signed-ask .sa-box svg{width:12px;height:12px}
  .signed-ask.on{border-color:var(--teal);color:var(--ink)}
  .signed-ask.on .sa-box{background:var(--teal);border-color:var(--teal);color:var(--on-teal)}
  .signed-ask:active{transform:scale(.99)}
  .seg{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px;margin-bottom:16px}
  .seg button{flex:1;border-radius:999px;padding:9px;font-size:13.5px;color:var(--ink-2);font-weight:700;
    min-height:44px;display:inline-flex;align-items:center;justify-content:center}
  html[lang="ar"] .seg button{font-weight:400;font-size:15px}
  .seg button.on{background:var(--teal);color:var(--on-teal)}
  .seg .save{font-size:10.5px;background:var(--amber-bg);color:var(--amber-ink);border-radius:999px;padding:1px 7px;margin-inline-start:6px}
  .plan-cards{display:grid;gap:12px}
  .pcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r-2xl);padding:20px 18px 17px;position:relative;box-shadow:var(--e1),var(--edge);transition:box-shadow .2s}
  .pcard.hi{border-color:var(--teal);box-shadow:var(--e2),var(--edge)}
  .pcard.biz{border-color:var(--amber)}
  .pcard .tag{position:absolute;top:-9px;inset-inline-start:18px;font-size:10.5px;font-weight:700;
      background:var(--teal);color:var(--on-teal);border-radius:999px;padding:2px 10px}
  html[lang="ar"] .pcard .tag{font-weight:400;font-size:11.5px}
  .pcard.biz .tag{background:var(--amber);color:var(--on-teal)}
  .pcard h3{font-size:17px;color:var(--teal-ink)}
  .pcard .d{font-size:12.5px;color:var(--ink-2);margin-top:2px}
  .pcard .price{margin-top:12px;display:flex;align-items:baseline;gap:5px;flex-wrap:wrap}
  .pcard .price b{font-family:var(--en);font-size:27px;color:var(--ink);font-variant-numeric:tabular-nums}
  .pcard .price i{font-style:normal;font-size:12.5px;color:var(--ink-2)}
  /* The scan's edge. Deliberately quiet — it sits under a real finding, and a
     loud upsell directly beneath a genuine warning reads as using the warning
     to sell, which is the thing this whole shape exists to avoid. */
  .scan-lock{border:1px dashed var(--line);border-radius:14px;padding:16px;
             margin-top:12px;background:var(--card)}
  .scan-lock b{display:block;font-size:15px;margin-bottom:6px}
  .scan-lock p{margin:0 0 8px;font-size:13.5px;color:var(--ink-2);line-height:1.6}
  .scan-lock .scan-left{font-size:12.5px;color:var(--ink-2);opacity:.85}
  /* THE BUTTON THAT SELLS THE PRODUCT, and it had no button styling at all.
     `.cta` has no base rule in this stylesheet — it is only ever styled inside
     `.pcard` — so here it inherited nothing: no background, no padding, no
     height. Measured 27px tall with 0 padding, rendering as a line of teal
     text in the middle of the lock panel. The single most important control in
     the funnel did not look like a control.

     Matched to `.primary`, which is what every other primary action in the app
     uses, rather than inventing a fourth button style. */
  .scan-lock .cta{
    margin-top:12px;width:100%;background:var(--teal);color:var(--on-teal);
    font-weight:700;font-size:15.5px;border-radius:var(--r-lg);padding:15px 16px;
    min-height:48px;box-shadow:var(--e2);transition:opacity .15s,box-shadow .18s;
    /* The English label wraps to two lines at 390px and broke as
       "…review — 199" / "SAR", splitting the price across the fold. balance
       moves the break to the em dash instead. Arabic fits on one line and is
       unaffected. */
    text-wrap:balance;
  }
  html[lang="ar"] .scan-lock .cta{font-weight:400;font-size:16.5px}
  .scan-lock .cta:hover{box-shadow:var(--e3)}
  .scan-lock .cta:active{transform:scale(.985)}
  .scan-lock .cta:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
  .au-sep{display:flex;align-items:center;gap:10px;margin:14px 0 2px;
          color:var(--ink-2);font-size:12.5px}
  .au-sep::before,.au-sep::after{content:"";flex:1;height:1px;background:var(--line)}
  .au-mail{display:flex;flex-direction:column;gap:8px;margin-top:10px}
  .au-lab{font-size:13px;color:var(--ink-2)}
  .au-mail input{font:inherit;padding:11px 12px;border-radius:12px;
                 border:1px solid var(--line);background:var(--card);color:var(--ink)}
  .au-btn.mail{justify-content:center}
  .au-again{background:none;border:0;color:var(--teal-ink);font:inherit;
            font-size:12.5px;text-decoration:underline;cursor:pointer;padding:4px}
  .acc-pack{margin:6px 0 0;font-size:12.5px;color:var(--ink-2)}
  .plan.soon{opacity:.62;cursor:default}
  .plan.soon .radio{visibility:hidden}
  .pcard ul{list-style:none;margin-top:14px;display:grid;gap:7px}
  .pcard li{font-size:13px;color:var(--ink);display:flex;gap:9px;align-items:flex-start;line-height:1.55}
  .pcard li svg{flex:none;width:15px;height:15px;margin-top:3px;color:var(--green)}
  .pcard li.off{color:var(--ink-2);opacity:.65}
  .pcard li.off svg{color:var(--ink-2)}
  .pcard .cta{margin-top:15px;width:100%;border-radius:14px;padding:12px;font-weight:700;font-size:14.5px;
      background:var(--teal);color:var(--on-teal)}
  html[lang="ar"] .pcard .cta{font-weight:400;font-size:15.5px}
  .pcard.biz .cta{background:var(--amber)}
  .pcard .cta.owned{background:var(--teal-soft);color:var(--teal)}

  /* business workspace */
  .biz-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
  .trial-chip{display:inline-block;margin-top:5px;font-size:11.5px;color:var(--amber-ink);
      background:var(--amber-bg);border-radius:999px;padding:2px 10px}
  .biz-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:20px}
  .biz-stats .st{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:15px 8px;text-align:center;box-shadow:var(--e1),var(--edge)}
  .biz-stats .st b{display:block;font-family:var(--en);font-size:22px;color:var(--teal-ink);font-variant-numeric:tabular-nums}
  .biz-stats .st.warn b{color:var(--amber)}
  .biz-stats .st span{font-size:11px;color:var(--ink-2);line-height:1.4;display:block;margin-top:2px}
  .biz-h[hidden]{display:none}
  .biz-h{font-size:15.5px;color:var(--teal-ink);margin:4px 2px 9px}
  .biz-note{font-size:12.5px;color:var(--ink-2);margin:-4px 2px 10px;line-height:1.6}
  .biz-list{display:grid;gap:9px;margin-bottom:20px}
  .brow{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);
      border-radius:var(--r-lg);padding:13px 14px;text-align:start;width:100%;box-shadow:var(--e1),var(--edge)}
  .brow .sc{flex:none;width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;
      font-family:var(--en);font-weight:800;font-size:15px;font-variant-numeric:tabular-nums}
  .brow .sc.great{background:var(--green-bg);color:var(--green)}
  .brow .sc.good{background:var(--teal-soft);color:var(--teal)}
  .brow .sc.fair{background:var(--amber-bg);color:var(--amber-ink)}
  .brow .sc.poor{background:var(--red-bg);color:var(--red)}
  .brow .tx{flex:1;min-width:0}
  .brow b{display:block;font-size:14px;color:var(--ink)}
  .brow span{font-size:11.5px;color:var(--ink-2)}
  .brow .status{font-size:10.5px;border-radius:999px;padding:2px 9px;white-space:nowrap;
      background:var(--teal-soft);color:var(--teal)}
  .brow .status.redline{background:var(--amber-bg);color:var(--amber-ink)}
  .seats{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
  .seat{width:38px;height:38px;border-radius:999px;background:var(--teal-soft);color:var(--teal);
      display:flex;align-items:center;justify-content:center;font-family:var(--en);font-weight:800;font-size:13px}
  .seat.add{background:none;border:1px dashed var(--line);color:var(--ink-2);font-weight:400;font-size:18px}
  .seats .n{font-size:12.5px;color:var(--ink-2);margin-inline-start:auto}

  /* AI legal assistant */
  .assist-entry{display:flex;align-items:center;gap:12px;width:100%;background:var(--card);
      border:1px solid var(--line);border-radius:var(--r-lg);padding:13px 15px;margin-top:14px;text-align:start;box-shadow:var(--shadow)}
  .assist-entry .ic{flex:none;width:38px;height:38px;border-radius:var(--r-sm);background:var(--teal);box-shadow:var(--e1);
      display:flex;align-items:center;justify-content:center}
  .assist-entry .ic svg{width:20px;height:20px}
  .assist-entry b{display:block;font-size:14.5px;color:var(--ink)}
  .assist-entry span span{font-size:12.5px;color:var(--ink-2)}
  .assist-entry .go{margin-inline-start:auto;color:var(--teal);display:flex}

  .caps{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
  .caps::-webkit-scrollbar{display:none}
  /* 44px, the same touch minimum the rest of the app holds to. These sat at
     37px — the one control group in the product below it, and the first
     thing a reader taps on the assistant screen. Measured at 390x844 and
     430x932 in both languages. */
  .caps button{flex:none;font-size:12.5px;color:var(--teal);background:var(--teal-soft);
    min-height:44px;display:inline-flex;align-items:center;
      border:1px solid transparent;border-radius:999px;padding:7px 13px;white-space:nowrap}
  .caps button:hover{border-color:var(--teal)}

  .chat{flex:1;display:flex;flex-direction:column;gap:10px;padding:4px 0 12px;min-height:220px}
  .msg{max-width:86%;border-radius:var(--r-lg);padding:12px 14px;font-size:14px;line-height:1.75;white-space:pre-line}
  .msg.bot{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-start-start-radius:6px;color:var(--ink);box-shadow:var(--e1),var(--edge)}
  .msg.user{align-self:flex-end;background:var(--teal);color:var(--on-teal);border-start-end-radius:6px;box-shadow:var(--e1)}
  .msg .refs{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .msg .ref{font-size:11px;color:var(--teal);background:var(--teal-soft);border-radius:999px;padding:3px 10px}
  .msg .inline-cta{margin-top:11px;width:100%;background:var(--teal);color:var(--on-teal);
      border-radius:12px;padding:10px;font-size:13.5px;font-weight:700}
  html[lang="ar"] .msg .inline-cta{font-weight:400;font-size:14.5px}
  .typing{display:flex;gap:4px;align-items:center}
  .typing i{width:6px;height:6px;border-radius:99px;background:var(--ink-2);animation:blink 1s infinite}
  .typing i:nth-child(2){animation-delay:.15s} .typing i:nth-child(3){animation-delay:.3s}
  @keyframes blink{0%,60%,100%{opacity:.25}30%{opacity:1}}

  .quota{font-size:11.5px;color:var(--ink-2);text-align:center;padding:2px 0 8px}
  .quota.gate{background:var(--amber-bg);border:1px solid var(--amber);border-radius:14px;
      padding:14px;color:var(--ink);font-size:13.5px;text-align:center}
  .quota.gate b{display:block;font-size:15px;margin-bottom:4px}
  .quota.gate button{margin-top:10px;width:100%;background:var(--teal);color:var(--on-teal);
      border-radius:12px;padding:11px;font-weight:700;font-size:14px}
  html[lang="ar"] .quota.gate button{font-weight:400;font-size:15px}

  .ask-bar{display:flex;gap:8px;align-items:center}
  .ask-bar input{flex:1;background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);
      padding:13px 15px;font:inherit;font-size:14px;color:var(--ink);min-width:0}
  .ask-bar input:focus{outline:2px solid var(--teal);border-color:transparent}
  .ask-send{flex:none;width:46px;height:46px;border-radius:var(--r-md);background:var(--teal);
      display:flex;align-items:center;justify-content:center}
  .ask-send svg{width:20px;height:20px}
  html[dir="rtl"] .ask-send svg{transform:scaleX(-1)}
  .ask-bar input:disabled,.ask-send:disabled{opacity:.45}

  /* reminder timeline */
  /* Reminders are a quiet utility, not a second offer — flatter than the
     paid letter card so the two never compete for the same attention. */
  .track-tease{display:flex;align-items:center;gap:11px;width:100%;background:none;border:1px solid var(--line);border-radius:var(--r-md);padding:11px 14px;margin-top:8px;text-align:start}
  .track-tease .bell{flex:none;width:30px;height:30px;border-radius:9px;background:var(--teal-soft);display:flex;align-items:center;justify-content:center}
  .track-tease .bell svg{width:16px;height:16px;stroke:var(--teal)}
  .track-tease b{display:block;font-size:13.5px;color:var(--ink)}
  .track-tease span{font-size:11.5px;color:var(--ink-2)}
  .track-tease .go{margin-inline-start:auto;color:var(--teal);display:flex}
  .track-tease.solo{background:var(--teal-soft);border-color:var(--teal);padding:14px 16px;box-shadow:var(--shadow)}
  .track-tease.solo b{font-size:14.5px}
  .track-tease.solo .bell{background:var(--teal);width:36px;height:36px}
  .track-tease.solo .bell svg{stroke:var(--on-teal)}

  /* One recommended next step, and the rest quiet. Demoted blocks keep their
     full hit area and stay perfectly usable — this is emphasis, not a gate. */
  /* Reading the clauses is a drill-down, not a next step. As a solid teal
     button it outweighed the step we actually recommend, which defeats the
     point of recommending one. Same size and hit area, less shout. */
  .primary.detail{background:none;color:var(--teal-ink);
    border:1.5px solid color-mix(in srgb, var(--teal) 42%, transparent);box-shadow:none}
  .primary.detail:hover{background:var(--teal-soft)}

  .is-next{position:relative;box-shadow:0 0 0 2px color-mix(in srgb, var(--band) 45%, transparent), var(--e2)}
  .demoted{opacity:.62;filter:saturate(.55)}
  .demoted:hover,.demoted:focus-within{opacity:1;filter:none}
  .letter-tease.demoted{background:none;border-color:var(--line)}
  .escalate.demoted{background:none;border-color:var(--line)}
  /* The chip lives on blocks both inside and outside the score card, so it
     cannot borrow --band, which is card-scoped. It takes its pair from the
     result screen instead, using the same bg/ink combinations already
     contrast-checked for the decision band. The parent selectors are needed
     to outrank ".track-tease span" and ".letter-tease span". */
  #screen-result{--nx-bg:var(--teal-soft);--nx-ink:var(--teal-ink)}
  #screen-result[data-decision="safe"]{--nx-bg:var(--green-bg);--nx-ink:var(--green-ink)}
  #screen-result[data-decision="negotiate"]{--nx-bg:var(--amber-bg);--nx-ink:var(--amber-ink)}
  #screen-result[data-decision="lawyer"]{--nx-bg:var(--red-bg);--nx-ink:var(--red-ink)}
  .letter-tease .next-chip,.track-tease .next-chip,.escalate .next-chip,.next-chip{
    position:absolute;top:-9px;inset-inline-start:14px;
    background:var(--nx-bg);color:var(--nx-ink);
    border:1px solid color-mix(in srgb, var(--nx-ink) 35%, transparent);
    border-radius:999px;padding:2px 9px;font-size:10.5px;font-weight:800;
    letter-spacing:.02em;white-space:nowrap;line-height:1.6}
  @media (prefers-reduced-motion:no-preference){
    .is-next{transition:box-shadow var(--t) var(--ease-out)}
    .demoted{transition:opacity var(--t-fast) var(--ease-out),filter var(--t-fast) var(--ease-out)}
  }
  .home-plans{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:4px;
      color:var(--ink-2);font-size:12.5px;padding:10px;border-radius:var(--r-sm);opacity:.85}
  .home-plans:hover{color:var(--teal)}
  /* Secondary utilities sit quietly below the primary act, in one rhythm. */
  .home-reminders{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:10px;width:100%;
      color:var(--ink-2);font-size:13.5px;font-weight:700;background:none;border:1px solid var(--line);
      border-radius:var(--r-md);padding:12px;transition:color .15s,border-color .15s}
  .home-reminders:hover{color:var(--teal);border-color:var(--teal)}
  html[lang="ar"] .home-reminders{font-weight:400;font-size:15px}

  .timeline{position:relative;margin:6px 0 20px;padding-inline-start:26px}
  .timeline::before{content:"";position:absolute;inset-block:10px;inset-inline-start:8px;width:2px;background:var(--line);border-radius:2px}
  .tl-item{position:relative;margin-bottom:14px}
  .tl-item .node{position:absolute;inset-inline-start:-26px;top:14px;width:18px;height:18px;border-radius:99px;border:3px solid var(--sand);display:flex;align-items:center;justify-content:center}
  .tl-item.info .node{background:var(--teal)} .tl-item.action .node{background:var(--amber)} .tl-item.deadline .node{background:var(--red)}
  .tl-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 16px;box-shadow:var(--e1),var(--edge)}
  .tl-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .tl-date{font-size:12.5px;font-weight:700;color:var(--teal-ink);background:var(--sand);border:1px solid var(--line);border-radius:999px;padding:2px 10px;white-space:nowrap}

   * THE FLOOR. `hidden` is how this app turns features off — an unconfigured
   * AI, a dark paywall, a lawyer desk with no lawyer — and it did not work.

   * author rule that sets display on a class beats it. `.fld{display:block}`
   * alone defeated it on six elements, three of which were promises the app
   * cannot keep: a refund guarantee while payments are dark, a lawyer desk
   * with no lawyer, and two doors to an AI that is not deployed. Every test
   * passed throughout, because they all read el.hidden — the attribute, which
   * was set correctly — rather than what the reader actually sees.
   *
   * !important is load-bearing, not laziness: the whole failure is an author
   * rule winning, so the fix has to outrank one. Ten one-off
   * `.x[hidden]{display:none}` patches already exist above, added one at a
   * time as someone noticed each symptom. This is the rule that makes an
   * eleventh unnecessary. */
  [hidden]{display:none !important}

<script>
/* ============================================================ THE CURTAIN
 *
 * ONE FLAG, matching the one in the site root. False means the product is
 * finished but not open: a visitor is sent to the pre-launch page instead.
 *
 * NOTHING HERE IS DELETED OR DISABLED. Every screen, every calculation, every
 * paywall and every test is exactly as it was. Twelve suites still run against
 * this file on every push — they run THROUGH this lock using the same key
 * below, so the lock itself is proven not to break the app.
 *
 * THE KEY: alwodouh.com/app/#preview opens the full working app. Use it to
 * demo to a lawyer, a partner, a buyer. It is a door the public will not find,
 * not a security control — anyone told the URL can use it, and that is fine,
 * because what is behind it is an unfinished product rather than anyone's
 * data. A fragment rather than a query string on purpose: fragments are never
 * sent to the server, so the link leaves no trace in any access log.
 *
 * TO LAUNCH: set this to true here and in the root index.html. Two lines.
 * See docs/launch-checklist.md.
 */
window.WODOUH_LAUNCHED = false;
/* AN OAUTH RETURN IS SOMEBODY COMING BACK IN, NOT SOMEBODY ARRIVING.
 *
 * Supabase hands the session back in the URL FRAGMENT, and app/auth.js reads
 * it from there. This script runs first, in the head, so before that fix the
 * curtain saw `#access_token=...` — no `preview` — and replaced the page
 * before auth.js could ever read the token. Signing in was IMPOSSIBLE while
 * the curtain was up, and it failed looking exactly like a redirect-URL
 * misconfiguration, which is the most expensive way for a bug to look.
 *
 * Letting a callback through costs nothing this door was protecting. It is
 * "a door the public will not find, not a security control" — and nobody
 * arrives holding a Supabase access token by accident. `error=` is admitted
 * for the same reason: a sign-in that failed should be able to say so instead
 * of silently vanishing.
 */
const WODOUH_KEY = /(^|[#&])preview\b/.test(location.hash);
const WODOUH_CALLBACK = /(^|[#&])(access_token|error|error_code)=/.test(location.hash);
if (!window.WODOUH_LAUNCHED && !WODOUH_KEY && !WODOUH_CALLBACK) {
  /* replace(), not assign(): the back button should not bounce a visitor
     into a locked door they just left. */
  location.replace("../");
}
</script>

<!-- Accounts. Same-origin, so the CSP stays `script-src 'self'` — the reason
     this file talks to Supabase over plain fetch instead of importing an SDK
     from a CDN. It does nothing at all until SUPABASE_URL is configured. -->
<script src="./auth.js"></script>
<script>
/* ============================================ RUNTIME CONFIGURATION
 *
 * THE OFF SWITCH FOR EVERYTHING THAT LEAVES THE DEVICE.
 *
 * Empty is the shipping state and the only state in which Wodouh's
 * "nothing leaves your device" promise is true without qualification.
 * With ANALYZE_URL unset, analyzeUrl() returns null, every AI surface
 * renders nothing at all, and the app makes zero off-origin requests —
 * asserted by watching the network in claude-path.test.js and
 * ask.test.js, not by reading this comment.
 *
 * It lives inline, in this file, on purpose. An external config.js would
 * make turning the AI on a one-file change that nobody reviews; here it
 * sits three lines from the CSP that must be edited in the same breath,
 * and both edits show up in the same diff.
 *
 * TO ENABLE — both steps, or neither works:
 *
 *   1. Set ANALYZE_URL to your deployed Edge Function:
 *        ANALYZE_URL: "https://<your-project-ref>.supabase.co/functions/v1/analyze"
 *
 *   2. Edit the Content-Security-Policy meta tag at the top of this file:
 *        connect-src 'none'   ->   connect-src https://<your-project-ref>.supabase.co
 *
 *      Name that one host. NEVER the *.supabase.co wildcard — it is a
 *      shared multi-tenant domain that anyone can register a project
 *      inside, and this policy is the only thing standing between a
 *      future script injection and a reader's contract text. GitHub
 *      Pages sets no response headers, so there is no second line.
 *
 * Step 1 without step 2 is the confusing failure: the buttons appear and
 * every request is blocked by the browser. Do both.
 *
 * Nothing secret goes here. This file is served to every visitor. The
 * Anthropic key lives only in Supabase Edge Function secrets — see
 * docs/claude-analysis.md.
 */
window.WODOUH_CONFIG = Object.assign({
  SUPABASE_URL: "https://nkgjgpageqohalerccfu.supabase.co",
  SUPABASE_ANON_KEY: "sb_publishable_RYzk7dHgfpv4ZlFN8sFWrQ_Uz3UhQIX",
  REDIRECT_URL: "https://alwodouh.com/app/index.html",
  /* Deployed and live — see docs/claude-analysis.md for what changed in the
     privacy copy as a result. */
  ANALYZE_URL: "https://nkgjgpageqohalerccfu.supabase.co/functions/v1/analyze"

  /* PHONE_SIGNIN is DELIBERATELY ABSENT, which means off.
   *
   * The code path is built and tested, but every SMS costs money at Twilio and
   * nothing has yet proved a code reaches a real Saudi handset. Turning this on
   * before that is proved puts a form on the sign-in screen that silently
   * delivers nothing — and sign-in is now the only door into the app, so a
   * broken door here is a locked product.
   *
   * TO TURN IT ON, in this order:
   *   1. Twilio account → Messaging Service → note the SID
   *   2. supabase secrets set TWILIO_ACCOUNT_SID=… TWILIO_AUTH_TOKEN=… \
   *        TWILIO_MESSAGE_SERVICE_SID=…
   *   3. Supabase → Authentication → Providers → Phone → enable, provider Twilio
   *   4. send yourself a code on a real handset and sign in with it
   *   5. only then add:  PHONE_SIGNIN: true,  above this comment
   */
}, window.WODOUH_CONFIG || {});

/* ==================================================== RUNTIME FEATURE FLAGS
 *
 * The founder console (/admin/) can turn four features on and off without a
 * deploy: payments, subscriptions, the AI read, and the lawyer desk. This is
 * the half that lives in the reader's browser.
 *
 * WHAT THIS COSTS, STATED FIRST. Before this existed the app made ZERO network
 * requests for a reader with no account, which is what made "nothing leaves
 * your device" true with no qualification at all. Three rules keep that as
 * close to true as a remote switch allows:
 *
 *   1. LAZY, NEVER ON BOOT. Nothing is fetched until a reader first reaches a
 *      surface a flag governs — the paywall, the AI panel, the account screen.
 *      Someone who opens the app, pastes a contract, reads their flags and
 *      closes it has still made no request. That is the common path and it is
 *      unchanged.
 *   2. IT CARRIES NOTHING. A GET of a public table with the anon key. No
 *      account, no cookie, no body, nothing about the reader or the document.
 *   3. IT NEVER BLOCKS. 2-second timeout, and a failure is not an error state
 *      the reader ever sees.
 *
 * FAILURE FALLS TO THE COMPILED DEFAULT, WHICH IS OFF.
 * No config, no network, a timeout, a malformed response, a cache older than
 * MAX_AGE — every one of them lands on the constant compiled into this file.
 * All of those constants are false. So an attacker who could make this table
 * unreachable could turn features OFF; there is no path by which they turn one
 * ON, and that asymmetry is the whole safety argument.
 *
 * A CACHE THAT SAYS "ON" EXPIRES. Without MAX_AGE, turning payments off in the
 * console would leave a reader who has been offline since yesterday still
 * being charged. Twelve hours is the ceiling on how wrong a cached "on" can be.
 *
 * THE LAUNCH CURTAIN IS DELIBERATELY NOT HERE. Making it remote would mean a
 * request from every visitor before they have consented to anything, for a
 * switch that moves twice in a product's life. It stays a two-line deploy;
 * the console shows its state and tells you what to change.
 */
const FLAG_MAX_AGE = 12 * 60 * 60 * 1000;
const FLAG_TIMEOUT = 2000;
const FLAG_CACHE = "wodouh.flags.v1";

/* Loaded flags, or null while nothing has been loaded. Null is not "all off" —
   it is "we know nothing", and every reader of it falls back to the compiled
   constant rather than to false. An unreachable table must not switch off a
   feature the owner enabled in config.js. */
let flagValues = null;
let flagPending = null;

function flagsUrl(){
  const c = window.WODOUH_CONFIG || {};
  return typeof c.SUPABASE_URL === "string" && /^https:\/\//.test(c.SUPABASE_URL)
      && typeof c.SUPABASE_ANON_KEY === "string" && c.SUPABASE_ANON_KEY
    ? c.SUPABASE_URL.replace(/\/$/, "") + "/rest/v1/app_flags?select=key,enabled"
    : null;
}

/* Whatever comes back is data from the network, so it is rebuilt rather than
   trusted: known keys only, booleans only. A flag the app does not know about
   cannot appear, and a string cannot become truthy. */
const FLAG_KEYS = ["payments", "subscriptions", "ai_analysis", "lawyer_desk"];
function flagShape(rows){
  const out = {};
  if (!Array.isArray(rows)) return out;
  for (const r of rows){
    if (r && FLAG_KEYS.includes(r.key) && typeof r.enabled === "boolean") out[r.key] = r.enabled;
  }
  return out;
}

function flagCacheRead(){
  try {
    const raw = JSON.parse(localStorage.getItem(FLAG_CACHE) || "null");
    if (!raw || typeof raw.at !== "number") return null;
    if (Date.now() - raw.at > FLAG_MAX_AGE) return null;
    return flagShape(raw.rows);
  } catch { return null; }
}
function flagCacheWrite(rows){
  try { localStorage.setItem(FLAG_CACHE, JSON.stringify({ at: Date.now(), rows })); } catch {}
}

/* Idempotent. Called from every governed surface; fetches at most once per
   page life, and resolves immediately when there is nothing to fetch. */
function ensureFlags(){
  if (flagPending) return flagPending;
  const url = flagsUrl();
  if (!url){
    /* No project configured — the shipping default. Nothing is fetched, ever,
       and the app behaves exactly as it did before flags existed. */
    flagPending = Promise.resolve(false);
    return flagPending;
  }
  const cached = flagCacheRead();
  if (cached && Object.keys(cached).length){ flagValues = cached; applyFlags(); }

  flagPending = (async () => {
    const ctl = typeof AbortController === "function" ? new AbortController() : null;
    const timer = setTimeout(() => ctl && ctl.abort(), FLAG_TIMEOUT);
    try {
      /* The `apikey` header alone. Supabase resolves it to the anonymous role,
         and that is true of both the legacy JWT keys and the newer opaque
         `sb_publishable_` ones. The Authorization header is for a SIGNED-IN
         reader's access token; sending a project key there as a bearer token
         happened to work for JWT-shaped keys and is not something to rely on
         for a key format that is not a JWT at all. Nobody is signed in on this
         path by definition — it is a public table. */
      const key = (window.WODOUH_CONFIG || {}).SUPABASE_ANON_KEY;
      const res = await fetch(url, {
        headers: { apikey: key },
        signal: ctl ? ctl.signal : undefined,
        cache: "no-store",
      });
      if (!res.ok) return false;
      const rows = await res.json();
      flagValues = flagShape(rows);
      flagCacheWrite(rows);
      applyFlags();
      return true;
    } catch {
      /* Offline, blocked, slow, or a project that no longer exists. The
         compiled default already holds; there is nothing to tell the reader
         and nothing to retry in front of them. */
      return false;
    } finally { clearTimeout(timer); }
  })();
  return flagPending;
}

/* The one place a flag is read. `fallback` is the constant compiled into this
   file, and it wins whenever we have not been told otherwise. */
function flagOn(key, fallback){
  return flagValues && typeof flagValues[key] === "boolean" ? flagValues[key] : fallback;
}

/* Flags arrive after the screen that needs them may already be on-screen, so
   applying them writes the existing globals and re-renders. Writing the
   globals rather than rewriting sixty call sites is deliberate: every
   `SUBSCRIPTIONS_LIVE ? a : b` in this file keeps working untouched, which is
   far less likely to go wrong than editing each one. */
function applyFlags(){
  if (!flagValues) return;
  PAYMENT_LIVE       = flagOn("payments", PAYMENT_COMPILED);
  SUBSCRIPTIONS_LIVE = flagOn("subscriptions", SUBSCRIPTIONS_COMPILED);
  LAWYER_DESK.live   = flagOn("lawyer_desk", LAWYER_COMPILED);
  const cur = document.querySelector(".screen.active");
  const id = cur ? cur.id.replace("screen-", "") : "";
  if (id === "paywall") renderPaywall();
  if (id === "account") renderAccount();
  if (id === "result") renderAiPanel();
}

  /* Arabic counted nouns inflect: one is singular, two takes the dual, 3–10

  /* THE ROADMAP SCREEN.
     Written in Arabic first and then put into English, not translated out of
     it — the Arabic is the product's first language and reads like someone
     wrote it. Every future line is future tense in both. */
  /* The positioning. "System" is a claim, and the screen it sits on is the
     argument for it — which is why it lives here and nowhere else. The four
     supporting verbs are the same four the progression below uses, so the
     statement and the roadmap are visibly the same idea rather than a slogan
     with a list under it. */
  /* Says the number, not "part of it". A reader who knows 40,000 of 46,300
     characters were read can judge what is missing; "some of your contract"
     leaves them guessing, which is the same anxiety the silence caused.
     Names WHERE the cut falls, because in an employment contract the last
     pages are usually the non-compete and the penalties. */
  ai_cut:{ar:"قرأنا أول {n} حرف من عقدك فقط",en:"We read only the first {n} characters of your contract"},
  ai_cut_b:{ar:"عقدك {total} حرف، وهذا أطول من اللي نقدر نرسله للتحليل. اللي تحت مبني على البداية فقط — وآخر العقد، اللي غالبًا فيه عدم المنافسة والشروط الجزائية، ما دخل في هذه القراءة. لو تبي رأيًا على جزء معيّن، الصقه لحاله.",
           en:"Your contract is {total} characters, which is longer than we can send for analysis. What's below is based on the beginning only — the end of the contract, where non-compete and penalty clauses usually sit, was not part of this reading. To get a view on a specific part, paste that part on its own."},

  acc_privacy:{ar:"الخصوصية",en:"Privacy"},
  acc_privacy_more:{ar:"الاستثناءات الأربعة، وش يرسل كل واحد بالضبط",
                    en:"The four exceptions, and exactly what each one sends"},
  acc_privacy_b:{ar:"يُحلَّل عقدك داخل التطبيق على جهازك. لا نرفعه لخادم، ولا نخزّنه، ولا نشاركه مع أحد. لو حذفت التطبيق راح معه كل شيء.",
                 en:"Your contract is analyzed inside the app on your device. We don't upload it, store it, or share it. Delete the app and it all goes with it."},
  acc_privacy_b_ai:{ar:"يُحلَّل عقدك داخل التطبيق على جهازك، وكل مبلغ يُحسب هنا ويبقى هنا.\n\nفيه أربعة استثناءات، كلها اختيارية وكلها تحتاج موافقتك الصريحة. وهي منفصلة عن بعض، لأن كل واحد يرسل شيئًا مختلفًا:\n\n1 — «قراءة أعمق لعقدك»: يُرسل نص العقد وحده، بدون أرقامك ولا إجاباتك.\n\n2 — «مراجعة ثانية بالذكاء الاصطناعي»: ترسل أكثر — تواريخك وراتبك ونوع عقدك وطريقة الإنهاء وكل مبلغ في تقييمك والأوراق اللي علّمتها، ومنها ما كتبته بنفسك في خانة سبب الإنهاء.\n\n3 — «اسأل سؤالك»: يُرسل سؤالك كما كتبته. وفيه خانة ثانية منفصلة داخل الشاشة نفسها، إذا علّمتها أرسلنا معه تواريخك وأجرك ونوع عقدك وطريقة الإنهاء عشان يكون الجواب على حالتك أنت — وإذا ما علّمتها ما يطلع غير السؤال.\n\n4 — «اقرأ عقدًا ممسوحًا ضوئيًا»: هذا الوحيد اللي يرفع الملف نفسه، مو نصه. نلجأ له فقط إذا كان عقدك صورة أو مسحًا ضوئيًا وما فيه نص نقدر نقرأه على جهازك. يتطلب تسجيل دخول، ويُحذف الملف من خوادم Anthropic فور انتهاء التحليل، وفي كل الأحوال خلال ساعة. وما نعرض عليك أي مبلغ من عقد ممسوح — لأننا ما نقدر نتحقق منه.\n\nالأربعة يمرّون بخادم وضوح إلى نموذج Claude من Anthropic. الثلاثة الأولى ما يُحفظ منها شيء في أي مرحلة؛ الرابع يُحفظ الملف مؤقتًا ثم يُحذف. ولا واحد منها يقدر يغيّر أي مبلغ — الحساب كله على جهازك. وإذا رفضتها كلها، التقييم يشتغل كامل.",
                    en:"Your contract is analyzed inside the app on your device, and every amount is calculated here and stays here.\n\nThere are four exceptions. All are optional, all need your explicit agreement, and they are kept separate from each other because they send different things:\n\n1 — \"A closer read of your contract\": sends the contract text alone, not your figures or your answers.\n\n2 — \"AI second-pass review\": sends more — your dates, your wage, your contract type, how the job ended, every amount in your assessment, the documents you ticked, and what you typed yourself in the reason field.\n\n3 — \"Ask a question\": sends your question as you typed it. A second, separate tick box on that same screen adds your dates, your wage, your contract type and how the job ended, so the answer can be about your situation — leave it unticked and only the question goes.\n\n4 — \"Read a scanned contract\": the only one that uploads the FILE rather than its text. It is used only when your contract is a photo or a scan with no text we can read on your device. It requires signing in, the file is deleted from Anthropic's servers as soon as the analysis returns and within an hour in every case, and we show you no amount at all from a scan — because we cannot check one.\n\nAll four go through Wodouh's server to Anthropic's Claude model. Nothing is stored at any point for the first three; the fourth stores the file briefly and then deletes it. None of them can change any amount — all the arithmetic stays on your device. Decline all four and the assessment works in full."},
  /* The flag check, described exactly. It is added to the privacy screen only
     when a project is configured, because until then it never happens — and a
     privacy screen that lists something the build cannot do is as wrong as one
     that omits something it can. */
  acc_privacy_flags:{ar:"شيء أخير، صغير وصريح: لما تفتح شاشة الدفع أو حسابك، يسأل التطبيق خوادمنا سؤالًا واحدًا — أي الميزات مفعّلة الآن. ما يحمل معه شيئًا عنك ولا عن عقدك: لا حسابك، ولا أرقامك، ولا نصّك. وإذا ما وصله جواب، يكمل التطبيق شغله كأن شيئًا لم يكن.",
                      en:"One last thing, small and stated plainly: when you open the payment screen or your account, the app asks our servers a single question — which features are switched on right now. It carries nothing about you or your contract: no account, no figures, no text. If no answer comes back, the app carries on exactly as it would have."},
  /* THIS STRING NOW DESCRIBES A LOCKED FRONT DOOR, and that is a change worth
     naming. It used to be reassurance — no sign-in available, but the app
     works anyway. Since every screen requires an account, no sign-in method
     means nobody can get in at all.
     It is left as an honest apology rather than quietly re-opening the app,
     because a state where the reader is stuck is a MISCONFIGURATION on our
     side (every provider disabled at once) and hiding it would just make it
     take longer to notice. If this string is ever seen by a real reader,
     something on our end is broken and needs fixing, not routing around. */
  au_none:{ar:"ما فيه طريقة تسجيل دخول شغّالة الآن، والخلل من عندنا مو من عندك. جرّب بعد شوي — نعتذر عن التعطيل.",
           en:"No sign-in method is working right now. That's a fault on our side, not yours. Please try again shortly — sorry for the interruption."},

  /* Says only what is true of the operator today. No commercial registration,
     no VAT number, no address, no licence — Wodouh holds none of those, and a
     figure invented to fill the gap is worse than the gap. */
  acc_identity:{ar:"وضوح منصّة تقنية تقدّم معلومات قانونية عامة وأدوات مدعومة بالذكاء الاصطناعي. يراجع محامٍ سعودي مرخّص محتوانا النظامي قبل نشره. ووضوح نفسه ليس مكتب محاماة ولا يقدّم تمثيلًا قانونيًا. يُدار كنشاط سعودي مستقل بموجب وثيقة عمل حر. للتواصل: support@alwodouh.com",
                en:"Wodouh is a technology platform providing general legal information and AI-assisted tools. Our legal content is reviewed by a licensed Saudi lawyer before publication. Wodouh itself is not a law firm and does not provide legal representation. It is operated as an independent Saudi activity under a Freelance Work Certificate. Contact: support@alwodouh.com"},
  acc_how:{ar:"كيف نحكم على البنود؟",en:"How we judge clauses"},
  acc_how_b:{ar:"نقارن كل بند بالممارسة الشائعة وبالأنظمة السعودية: أحمر يعني انتبه، أصفر يعني يستحق النقاش، أخضر يعني ضمن المعتاد. البنود التي نذكر رقم مادتها تحققنا منها في النص الرسمي؛ وما عداها نذكر النظام باسمه فقط.",
              en:"We compare each clause against common practice and Saudi regulations: red means pause, amber means worth discussing, green means within the norm. Where we name an article number we verified it in the official text; everywhere else we name only the law."},
  acc_ai_note:{ar:"القراءة يقوم بها ذكاء اصطناعي، وليس محاميًا. ما نقوله مبني على سجل يراجعه محامٍ سعودي مرخّص — لكنه يشرح النظام، وما يفتي في حالتك.",
               en:"The reading is done by AI, not a lawyer. What it tells you comes from a register a licensed Saudi lawyer reviews — but it explains the law, it doesn't advise on your case."},
  acc_lang:{ar:"اللغة",en:"Language"},
  /* This carried "400–1,000 SAR per consultation" — a specific figure about a
     market we have no source for, on a screen whose whole argument is that we
     cite what we assert. The comparison it was making is still true and still

  anchor_price:{ar:"وقت المحامي أغلى من هذا، وقد تحتاجه بعد ذلك أيضًا — ووضوح يجهّز لك ملفك قبل ما تروح له.",

  /* Wodouh is not registered for VAT, so no VAT is charged and none may be

  vat_line:{ar:"السعر المعروض هو المبلغ النهائي. لا تُضاف ضريبة قيمة مضافة.",en:"The price shown is the total you pay. No VAT is added."},

  /* «لا تُسمع»، not «عادة ما تُسمع». The negation was missing, and «عادة ما»
     is a standard idiom for "usually" — so the sentence read as "a labour
     claim is usually heard after twelve months", the exact inverse of the bar
     in Article 222. A reader taking the natural reading waits a year and loses
     the claim. The same fact is stated correctly twice elsewhere in this file
     (tr_clock and the rights entry); this was the third copy, and the one on
     the screen a terminated reader actually lands on. */
  tm_n5_b:{ar:"لو ما وصلت لحل، الطريق يبدأ بالتسوية الودية عبر منصة وزارة الموارد البشرية قبل المحكمة العمالية. وانتبه للمدة: الدعوى العمالية لا تُسمع عادةً بعد مضي اثني عشر شهرًا من نهاية العلاقة (نظام العمل — المادة 222). وضوح ما يرفع الدعوى نيابة عنك.",
           en:"If nothing is resolved, the route begins with amicable settlement through the Ministry of Human Resources platform, before the labour court. Watch the clock: a labour claim is generally not heard after twelve months from the end of the relationship (Labor Law, Article 222). Wodouh does not file anything on your behalf."},

  /* WODOUH'S VOICE MUST NOT REACH THE EMPLOYER.
     `tm_m_total_split` explains the two figures to the READER — "the first
     rests on facts you gave us" — and it was being pasted verbatim into the
     letter the employee sends HR, so the employee ended up telling HR that
     the figures rest on facts HR had entered. Worse, it volunteered, inside a
     claim letter, that the claimant's own tool rates part of the claim as
     speculative. The letter and the case document now say the same true thing
     in the claimant's own register: these are the amounts I am asking about,
     and this further item turns on a determination I am not making here. */

  ask_consent_h:{ar:"وش يطلع من جهازك؟",en:"What leaves your device"},
  ask_consent_b:{ar:"سؤالك كما كتبته، ولا شيء غيره. يُرسل لخادم وضوح ومنه لنموذج Claude من Anthropic، ولا يُحفظ في أي مرحلة. ما نرسل اسمك ولا راتبك ولا تواريخك ولا إجاباتك إلا إذا علّمت الخيار الثاني تحت.",
                 en:"Your question, exactly as you typed it, and nothing else. It goes to Wodouh's server and from there to Anthropic's Claude model, and is not stored at any stage. Your name, wage, dates and answers do not go unless you tick the second box below."},
  ask_agree:{ar:"فاهم، وأوافق على إرسال سؤالي",en:"I understand, and I agree to send my question"},
  ask_ctx_h:{ar:"تبي الجواب يكون على حالتك أنت؟",en:"Want the answer to be about your case?"},
  ask_ctx_b:{ar:"لو علّمت هنا، نرسل معه إجاباتك في حاسبة نهاية الخدمة: تواريخ عملك، أجرك، نوع عقدك، وكيف انتهت العلاقة. هذا أكثر بكثير من السؤال وحده، وقرارك أنت. الجواب يصير مرتبط بوضعك، لكن الأرقام تظل محسوبة على جهازك — النموذج ما يحسب لك ريالًا واحدًا.",
             en:"Tick this and we also send your answers from the end-of-service calculator: your dates, your wage, your contract type, and how the relationship ended. That is materially more than the question alone, and it is your call. The answer becomes about your situation — but the figures stay computed on your device. The model never calculates a riyal for you."},
  ask_ctx_agree:{ar:"أرسل تفاصيل حالتي مع السؤال",en:"Send my case details with the question"},
  ask_ctx_none:{ar:"ما عندك تفاصيل محفوظة بعد — ابدأ من «تم إنهاء عقدي» في الصفحة الرئيسية، وبعدها يصير فيه شي نرسله.",
                en:"You have no saved details yet — start from \"My contract was terminated\" on the home screen, and then there will be something to send."},
  ask_left_one:{ar:"باقي لك سؤال واحد اليوم",en:"One question left today"},

  ask_unv_b:{ar:"هذا السؤال ما يغطيه أي مصدر تحققنا منه، فالجواب فوق معرفة عامة عن نظام العمل السعودي، وضوح ما راجعها ولا تحمل رقم مادة. لا تبني عليها قرارًا نهائيًا — استخدمها عشان تعرف وش تسأل عنه بعدين.",
             en:"No source we have verified covers this question, so the answer above is general knowledge about Saudi labour law. Wodouh has not checked it, and it carries no article number. Don't make a final decision on it — use it to know what to ask about next."},
  ask_src_h:{ar:"المصادر اللي بنينا عليها",en:"What this is built on"},
  ask_ref:{ar:"ما نقدر نجاوب على هذا السؤال بثقة، وما راح نخمّن. جرّب تصيغه بشكل ثاني، أو ارفعه لمكتب محاماة.",
           en:"We can't answer this one with confidence, and we won't guess. Try rephrasing it, or take it to a lawyer."},
  ask_ref_citation:{ar:"الجواب اللي رجع ذكر رقم مادة ما نقدر نأكده، فحجبناه بالكامل. حذف الرقم وحده كان بيخلي الجملة تبين كأنها ما ادّعت شي — وهذي كذبة أكبر.",
                    en:"The answer that came back named an article we cannot confirm, so we withheld all of it. Removing just the number would have left a sentence that looks like it never made a legal claim — a bigger lie than the one we removed."},
  ask_ref_money:{ar:"الجواب اللي رجع ذكر مبلغًا بالريال، والنموذج عندنا ما يحسب فلوس أبدًا. الأرقام كلها تطلع من حاسبتك على جهازك.",

  ask_err:{ar:"ما قدرنا نوصل للخدمة. جرّب بعد شوي.",en:"We couldn't reach the service. Try again shortly."},

  ask_disc:{ar:"مبني على سجل يراجعه محامٍ سعودي مرخّص. ووضوح ليس مكتب محاماة، وهذا الجواب ليس استشارة قانونية.",
            en:"Drawn from a register a licensed Saudi lawyer reviews. Wodouh is not a law firm, and this answer is not legal advice."},

  ai_offer:{ar:"بقية وضوح يشتغل على جهازك بالكامل. هذي الخطوة الوحيدة اللي ما تشتغل كذا: عشان نقرأ نص عقدك قراءة أعمق، لازم النص يطلع من جهازك.",
            en:"The rest of Wodouh runs entirely on your device. This is the one step that doesn't: to read your contract more closely, the text has to leave your device."},
  ai_consent_h:{ar:"وش يطلع بالضبط؟",en:"Exactly what leaves"},
  ai_consent_b:{ar:"نص العقد اللي لصقته، ولا شيء غيره — لا اسمك ولا أرقامك ولا إجاباتك ولا الأوراق اللي علّمتها. يُرسل لخادم وضوح ومنه لنموذج Claude من Anthropic، ولا يُحفظ في أي مرحلة. الردّ اللي يرجع قراءة مساعدة، مو نصًا نظاميًا، وما يدخل في حساب أي مبلغ فوق.",
                en:"The contract text you pasted, and nothing else — not your name, your figures, your answers, or the documents you ticked. It goes to Wodouh's server and from there to Anthropic's Claude model, and is not stored at any point. What comes back is a helping read, not a statement of law, and it does not feed into any amount above."},
  ai_agree:{ar:"فاهم، وأوافق على إرسال نص العقد",en:"I understand, and I agree to send the contract text"},

  /* The register's verified row for Article 87 scopes these two to a FEMALE
     WORKER — "a female worker is entitled to the full award if she ends her
     contract within six months of marriage or three months of giving birth".
     The labels carried no such condition, so any reader could select them and
     be shown the full award: an 18,333 SAR overstatement on the test case, in
     the direction that costs a reader credibility in front of the authority
     rather than only money. Force majeure is unscoped and stays unscoped. */
  tm_exc_marriage:{ar:"عاملة، وأنهيت العقد خلال 6 أشهر من زواجي",

  tm_exc_birth:{ar:"عاملة، وأنهيت العقد خلال 3 أشهر من ولادتي",

  /* --- rules in plain language */
  tm_rule_eos:{ar:"مكافأة نهاية الخدمة: نصف شهر عن كل سنة من أول خمس سنوات، وشهر كامل عن كل سنة بعدها، على آخر أجر.",
               en:"End-of-service award: half a month for each of the first five years, a full month for each year after that, on your last wage."},
  tm_rule_notice:{ar:"الطرف اللي ما التزم بمدة الإشعار يدفع للطرف الثاني أجر تلك المدة أو ما تبقى منها. تخص العقود غير محددة المدة.",
                  en:"A party who doesn't observe the notice period pays the other the wage for that period, or what remains of it. Indefinite contracts only."},
  tm_rule_leave:{ar:"رصيد الإجازة السنوية غير المستخدم يُدفع نقدًا عند ترك العمل، وبنسبة ما قضيته من السنة. حق لا يسقط بالاتفاق.",
                 en:"Unused annual leave is paid in cash when you leave, pro-rata for the part of the year you worked. It cannot be waived by agreement."},
  tm_rule_comp:{ar:"الإنهاء بغير سبب مشروع يستوجب تعويضًا: أجر 15 يومًا عن كل سنة في العقد غير محدد المدة، أو أجر المدة الباقية في العقد محدد المدة، وبحد أدنى أجر شهرين.",
                en:"Termination without a valid reason attracts compensation: 15 days' wages per year on an indefinite contract, or the wages for the remaining term on a fixed-term one, with a floor of two months."},
  tm_rule_unpaid:{ar:"الأجر المستحق دين قائم بذاته. ما فيه مادة تحسب لك عدد الشهور — الرقم من إجابتك.",
