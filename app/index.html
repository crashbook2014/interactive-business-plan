/* ------------------------------------- negotiation letter + paywall */
let pwPlan = 0;

/* WHAT THE READER HAS ACTUALLY BOUGHT.
   This was three booleans — pwPaid, casePaid, termPaid — and a boolean is
   precisely what allowed three tiers to deliver the same thing. The selected
   tier was drawn on the radio, printed on the pay button, and then never read
   again, so 65 SAR and 195 SAR bought identical output.

   The value stored here is a plan id, checked against the flow's own plan
   list on the way in and on the way out of localStorage. */
let owned = { letter:null, case:null, term:null };
/* The pack's six-month window for further contracts. A timestamp rather than a
   flag, because "for 6 months" is a promise with an end date. */
let packUntil = 0;

/* THE LAWYER TIERS.
   They promise a licensed Saudi lawyer reviewing the output within 24 hours.
   Nothing in this repository can deliver that — the arrangement lives outside
   it and cannot be verified from here. The tiers, the request desk and their
   tests all exist and are exercised; they simply do not render to a reader
   until `live` is true and `turnaround` states something we can meet.

   Shipping the promise dark is the only version of "we built it" that does not
   put an unbacked guarantee in front of someone who has just lost their job. */
const LAWYER_DESK = { live:false, turnaround:null };

/* Payments are not live. One flag drives both the prototype note and the
   refund promise, so the two can never contradict each other on the same
   screen again — which they did, four lines apart. */
const PAYMENT_LIVE = false;

/* Prices are numbers, not two hand-written strings per plan. Two strings drift;
   a number can be checked. See ladderBreaks() below, and the invariant it
   enforces: no bundle may ever cost less than something it contains. */
function priceLabel(amt){ return fmtNum(amt) + " " + t("eos_sar"); }

/* Consumers sign contracts episodically, so a monthly plan fights the usage
   pattern. The middle option is sold at the life event instead, and sits
   between an anchor above and a bare minimum below. */
const PLANS = [
  { name:"plan_letter", desc:"plan_letter_d", amt:65,  pop:false },
  { name:"plan_pack",   desc:"plan_pack_d",   amt:130, pop:true, tag:"plan_best",
    contains:["plan_letter"] },
  { name:"plan_lawyer", desc:"plan_lawyer_d", amt:195, pop:false,
    contains:["plan_letter"], lawyer:true }
];
/* A claim has money on the table, so the file prices well above the letter.
   It was 325, which put it above the 295 termination bundle that contains a
   case file — the cheaper item strictly containing the dearer one. */
const PLANS_CASE = [
  { name:"plan_case", desc:"plan_case_d", amt:245, pop:false },
  { name:"plan_case_lawyer", desc:"plan_case_lawyer_d", amt:395, pop:true,
    contains:["plan_case"], lawyer:true }
];
/* The termination assessment is priced on its own: it is the only paid thing
   in the app that gates a result rather than a document. */
const PLANS_TERM = [
  { name:"plan_term", desc:"plan_term_d", amt:145, pop:false },
  { name:"plan_term_full", desc:"plan_term_full_d", amt:295, pop:true,
    contains:["plan_term"] }
];
const PLAN_SETS = { letter:PLANS, case:PLANS_CASE, term:PLANS_TERM };

/* The containment invariant, in code rather than in a document nobody rereads.
   docs/pricing.md justified each price alone and never checked one against
   another, which is how a 295 bundle came to contain a 325 product. Returns
   the offending pairs; the tests assert it is empty. */
function ladderBreaks(){
  const all = [].concat(PLANS, PLANS_CASE, PLANS_TERM);
  const by = Object.create(null);
  all.forEach(p => { by[p.name] = p; });
  const bad = [];
  all.forEach(p => (p.contains || []).forEach(inner => {
    const c = by[inner];
    if (c && p.amt <= c.amt) bad.push(p.name + " (" + p.amt + ") ≤ " + inner + " (" + c.amt + ")");
  }));
  return bad;
}

/* A tier the reader can never be sold is not offered. */
function sellable(p){ return !p.lawyer || LAWYER_DESK.live; }
function activePlans(){
  const set = (PLAN_SETS[pwMode] || PLANS).filter(sellable);
  if (!pwUpgrade) return set;
  /* An upgrade offers one thing at the difference, never the full price a
     second time and never a tier already held. */
  const want = set.filter(p => p.name === pwUpgrade);
  if (!want.length) return set;
  return [Object.assign({}, want[0], { amt: upgradeCost(pwMode, pwUpgrade), up:true })];
}
/* Entitlement, asked as a question rather than read as a flag.
   `tier` names the least tier that unlocks the thing being asked about. */
function planIndex(mode, id){
  return (PLAN_SETS[mode] || PLANS).findIndex(p => p.name === id);
}
function has(mode, tier){
  const held = owned[mode];
  if (!held) return false;
  if (!tier) return true;
  const i = planIndex(mode, held), need = planIndex(mode, tier);
  return i >= 0 && need >= 0 && i >= need;
}
/* What it costs to move up, so the reader is shown the difference rather than
   the full price a second time. */
function upgradeCost(mode, tier){
  const held = owned[mode] ? (PLAN_SETS[mode] || PLANS)[planIndex(mode, owned[mode])] : null;
  const want = (PLAN_SETS[mode] || PLANS)[planIndex(mode, tier)];
  if (!want) return 0;
  return Math.max(0, want.amt - (held ? held.amt : 0));
}
const LETTER_TO = {
  doc_emp:{ar:"إلى: قسم الموارد البشرية",en:"To: The HR department"},
  doc_rent:{ar:"إلى: المؤجّر الكريم",en:"To: The landlord"},
  doc_free:{ar:"إلى: العميل الكريم",en:"To: The client"},
  doc_pasted:{ar:"إلى: الطرف الآخر",en:"To: The other party"}
};
/* Point numbering for the letter and the risk summary. This was a nine-slot
   table of Arabic-Indic numerals, and it was two rules away from printing
   "undefined." where a point number belonged: the rule set grew from 10 to 17
   this session, and the ceiling on numbered points grew with it — 7 today on
   the Saudi track. Converting is total, so it cannot run out. */
function pointNum(i){
  const n = String(i + 1);
  return lang === "ar" ? n.replace(/[0-9]/g, d => "0123456789"[+d]) : n;
}

function negotiables(){ return current ? current.clauses.filter(c=>c.a) : []; }

function buildLetter(){
  const items = selected();
  const list = items.map((c,i)=>{
    const n = pointNum(i);
    return `${n}. ${c.t[lang]}: ${adviceFor(c)[lang]}`;
  }).join("\n");
  if (lang==="ar"){
    const open = signedMode
      ? `بالإشارة إلى ${t(current.doc)} الموقّع بيننا، أود طرح النقاط التالية:`
      : `اطلعت على ${t(current.doc)} المعروض، وأشكركم على الثقة. قبل التوقيع، أتمنى مناقشة النقاط التالية:`;
    return `السلام عليكم ورحمة الله،\n\n${open}\n\n${list}\n\nواثق أننا نصل لصيغة عادلة للطرفين، وحاضر لأي نقاش.\n\nمع خالص التحية،\n[اسمك]`;
  }
  const openEn = signedMode
    ? `Regarding the ${t(current.doc).toLowerCase()} signed between us, I would like to raise the following points:`
    : `Thank you for sending the ${t(current.doc).toLowerCase()}. Before signing, I would like to discuss the following points:`;
  return `Dear Sir or Madam,\n\n${openEn}\n\n${list}\n\nI'm confident we can reach wording that is fair to both sides, and I'm happy to talk any of this through.\n\nBest regards,\n[Your name]`;
}

/* The pack was sold as "your letter, plus further letters for new contracts for
   six months". That is a promise with an end date, so it is stored as one. */
function packLive(){ return owned.letter === "plan_pack" && Date.now() < packUntil; }
const PACK_DAYS = 182;

/* Where the paywall's back button goes. An upgrade is entered from wherever the
   reader already was, so it returns there rather than to the flow's start. */
function pwBack(){
  if (pwUpgrade && pwUpBack) return pwUpBack;
  return pwMode === "case" ? "case" : pwMode === "term" ? "termev" : "result";
}

function openPaywall(){
  pwMode = "letter"; pwUpgrade = null; pwUpBack = null;
  if (has("letter")){ renderLetter(); show("letter"); return; }
  pwPlan = Math.max(0, activePlans().findIndex(p => p.pop));   /* the intended choice */
  renderPaywall(); show("paywall");
}

/* Opening the paywall to sell a step up. The reader is shown the difference,
   not the full price a second time, and only the tier they do not yet hold. */
function openUpgrade(mode, tier, back){
  pwMode = mode; pwUpgrade = tier; pwPlan = 0;
  if (back) pwUpBack = back;
  renderPaywall(); show("paywall");
}
let pwUpBack = null;

function renderPaywall(){
  /* Only the revealed portion is rendered; the withheld points never enter
     the DOM before payment. */
  const isCase = pwMode === "case", isTerm = pwMode === "term";
  /* The two modes have different plan lists — three for the letter, two for the
     case file — so an index carried across a mode switch can point past the end
     and leave the pay button reading "Pay undefined". Every entry point happens
     to reset it today; clamping here, above the guard, makes that a property of
     the paywall rather than of the callers remembering. */
  pwPlan = Math.max(0, Math.min(pwPlan, activePlans().length - 1));
  if (isTerm ? !term : isCase ? !eosData : (!current || !selected().length)) return;
  const titleKey = pwUpgrade ? "pw_up_title" : isTerm ? "pw_term_title" : isCase ? "pw_case_title" : "pw_title";
  const freeKey  = isTerm ? "pw_term_free"  : isCase ? "pw_case_free"  : "pw_free_note";
  document.querySelector('#screen-paywall [data-t="pw_title"]').textContent = t(titleKey);
  document.querySelector('#screen-paywall [data-t="pw_free_note"]').textContent = t(freeKey);
  /* "Back to score" sat here regardless of where the button actually went. */
  document.getElementById("pwBackLabel").textContent =
    t(isCase ? "back_case" : isTerm ? "back_ev" : "back_score");
  /* A refund promise and "no real payment happens" were rendering four lines
     apart. One flag, so only the true one can appear. */
  document.getElementById("pwGuarantee").hidden = !PAYMENT_LIVE;
  document.getElementById("pwDemo").hidden = PAYMENT_LIVE;
  /* Show one complete point rather than blurring everything: concealment reads
     as evasion, while real withheld value reads as value. It also means no
     unpaid text is sitting in the DOM behind a CSS filter. */
  const full = isTerm ? buildTermPreview() : isCase ? buildCaseDoc() : buildLetter();
  const lines = full.split("\n");
  document.getElementById("pwPreviewHead").textContent =
    isTerm ? t("tm_r_title") : isCase ? t("cf_title") : LETTER_TO[current.doc][lang];
  let shown, rest;
  if (isTerm){
    /* The facts they gave us are theirs to see. Not one riyal figure and not
       one assessment reaches the DOM before payment. */
    shown = lines.join("\n");
    rest = t("pw_term_more");
  } else if (isCase){
    shown = lines.slice(0, 5).join("\n");
    rest = t("pw_more_case");
  } else {
    const firstPoint = lines.findIndex(l=>/^\s*[123451-5]\./.test(l));
    const cut = firstPoint >= 0 ? firstPoint + 1 : 4;
    shown = lines.slice(0, cut).join("\n");
    /* With a single point chosen there is no "+0 more" to promise; the value
       withheld is the finished document itself. */
    const remaining = Math.max(0, selected().length - 1);
    rest = remaining === 0 ? t("pw_more0")
         : remaining === 1 ? t("pw_more1")
         : t("pw_more").replace("{n}", fmtNum(remaining));
  }
  document.getElementById("pwPreviewIntro").textContent = shown;
  document.getElementById("pwLockLine").textContent = rest;
  renderPwShape(isTerm, isCase);
  const wrap = document.getElementById("plans");
  wrap.innerHTML = "";
  activePlans().forEach((pl,i)=>{
    const b = document.createElement("button");
    b.className = "plan" + (i===pwPlan ? " sel" : "");
    b.innerHTML =
      `<span class="radio"></span>
       <span style="flex:1"><b>${t(pl.name)}${pl.pop?`<span class="badge">${t(pl.tag||"plan_pop")}</span>`:""}</b><span>${t(pl.desc)}</span></span>
       <span class="price">${priceLabel(pl.amt)}</span>`;
    b.onclick = ()=>{ pwPlan = i; renderPaywall(); };
    wrap.appendChild(b);
  });
  renderRedeem();
  const pay = document.getElementById("payBtn");
  const chosen = activePlans()[pwPlan];
  pay.disabled = false;
  /* One key here read "Get my letter" on a 245 SAR case file and on a
     termination assessment. The button now names what it sells. */
  pay.textContent = t(pwUpgrade ? "pw_pay_up" : isCase ? "pw_pay_case" : isTerm ? "pw_pay_term" : "pw_pay")
    + " " + priceLabel(chosen ? chosen.amt : 0);
}

/* WHAT THE READER IS BUYING, BEFORE THEY BUY IT.
   The termination paywall used to show the reader their own answers read back
   and ask 145 SAR for it. The rule it was protecting is right and survives —
   no riyal figure and no assessment reaches the DOM before payment — but the
   shape of the work is not the work. Counts and names only. */
function renderPwShape(isTerm, isCase){
  const host = document.getElementById("pwShape");
  if (!host) return;
  if (!isTerm && !isCase){ host.hidden = true; host.innerHTML = ""; return; }
  const items = [];
  if (isTerm){
    const lines = termLines(), gaps = termUnassessed();
    const law = lines.filter(l => l.kind === "law").length;
    const method = lines.length - law;
    const sep = lang === "ar" ? "، " : ", ";
    items.push([fmtNum(lines.length), t("pw_sh_found")
      .replace("{n}", fmtNum(lines.length))
      .replace("{list}", lines.map(l => t(l.key)).join(sep)), false]);
    items.push([fmtNum(law), t("pw_sh_law").replace("{n}", fmtNum(law)).replace("{m}", fmtNum(method)), false]);
    if (gaps.length)
      items.push([fmtNum(gaps.length), t("pw_sh_gaps")
        .replace("{n}", fmtNum(gaps.length))
        .replace("{list}", gaps.map(g => t(g.key)).join(sep)), true]);
    items.push(["✓", t("pw_sh_each"), false]);
  } else {
    items.push(["✓", t("pw_sh_case_claim"), false]);
    items.push(["✓", t("pw_sh_case_docs"), false]);
    items.push(["✓", t("pw_sh_each"), false]);
  }
  host.hidden = false;
  host.innerHTML = `<h4>${t("pw_sh_head")}</h4><ul>` +
    items.map(([n, text, dim]) =>
      `<li class="${dim ? "dim" : ""}"><span>${n}</span><span>${text}</span></li>`).join("") +
    `</ul>`;
}

/* ---------------------------------------------- redemption codes
   A bridge for selling through Zid without a backend: the buyer pays on Zid,
   receives a code, and enters it here.

   WHAT THIS IS NOT: security. Every check below happens in the reader's own
   browser, so anyone willing to open the developer tools can set `owned`
   themselves and skip the paywall entirely. Storing hashes rather than
   plaintext only means the page does not simply list working codes; it does
   not make the gate hold. That is an acceptable trade for a test of tens of
   buyers and unacceptable as a launch mechanism — see
   docs/zid-test-runbook.md.

   Ships EMPTY on purpose. The feature stays invisible and inert until real
   hashes are pasted in from test/make-codes.mjs, so no placeholder code can
   ever unlock anything. */
const REDEEM_HASHES = [];

let usedCodes = [];

function redeemArmed(){ return REDEEM_HASHES.length > 0; }

function normaliseCode(v){
  return String(v || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
}

async function hashCode(norm){
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(norm));
  return Array.from(new Uint8Array(buf))
    .map(b => b.toString(16).padStart(2, "0")).join("").slice(0, 16);
}

function renderRedeem(){
  const box = document.getElementById("redeem");
  if (!box) return;
  box.hidden = !redeemArmed() || has(pwMode);
  const open = document.getElementById("rdOpen");
  if (open) open.textContent = t("rd_have");
}

function toggleRedeem(){
  const f = document.getElementById("rdForm");
  f.hidden = !f.hidden;
  if (!f.hidden) document.getElementById("rdCode").focus();
}

function rdSay(key, ok){
  const m = document.getElementById("rdMsg");
  m.hidden = false;
  m.textContent = t(key);
  m.classList.toggle("bad", !ok);
}

async function redeem(){
  const raw = document.getElementById("rdCode").value;
  const norm = normaliseCode(raw);
  if (norm.length < 6) return rdSay("rd_bad", false);

  let h;
  try { h = await hashCode(norm); }
  catch(e){ return rdSay("rd_bad", false); }

  if (REDEEM_HASHES.indexOf(h) === -1) return rdSay("rd_bad", false);
  /* One redemption per code on this device. It cannot stop the same code being
     used on another phone — that needs a server. */
  if (usedCodes.indexOf(h) !== -1) return rdSay("rd_used", false);

  usedCodes.push(h);
  saveState();
  rdSay("rd_ok", true);
  buzz([12,50,20]);
  /* Land in exactly the same place a payment does, so there is one route to
     the paid state rather than two that can drift apart. */
  setTimeout(grantAndGo, 600);
}

/* The single route to the paid state. Both the payment button and the code
   redemption land here, so entitlement cannot be granted two different ways
   that drift apart — which is how the tier came to be recorded in one place
   and never read in another. */
function grantAndGo(){
  const chosen = activePlans()[pwPlan];
  /* Monotonic: a grant may only ever move a reader up. Writing unconditionally
     meant granting a cheaper tier silently revoked a dearer one — a reader who
     paid 295 could end up holding 145. No route in the shipped UI reaches that
     today (all three paywall entries are guarded), but the guard was at three
     call sites and the write was in one place. It belongs here, so a fourth
     route — a payment provider's return URL, say — cannot downgrade someone
     who has paid. */
  if (chosen){
    const want = chosen.up ? pwUpgrade : chosen.name;
    const held = owned[pwMode];
    if (!held || planIndex(pwMode, want) >= planIndex(pwMode, held)) owned[pwMode] = want;
  }
  /* `< Date.now()`, not `!packUntil`. The original guard was protecting an
     ACTIVE window from being extended on a re-render, and it did that — but it
     also refused to refresh an EXPIRED one, so buying the pack a second time
     granted a window that had already lapsed. The repeat buyer paid 130 SAR
     and received the 65 SAR product, and the only customer who ever repurchases
     the pack is the one it was built for. Comparing to now preserves the
     original protection and fixes the case it never considered. */
  if (owned.letter === "plan_pack" && packUntil < Date.now())
    packUntil = Date.now() + PACK_DAYS * 86400000;
  const wasUpgrade = !!pwUpgrade, backTo = pwUpBack;
  pwUpgrade = null; pwUpBack = null;
  saveState();
  /* An upgrade returns the reader to the step they were on, now unlocked,
     rather than dropping them back at the top of a result they have read. */
  if (wasUpgrade && backTo){
    if (pwMode === "term") renderTermResult();
    show(backTo);
    return;
  }
  if (pwMode === "term"){ renderTermResult(); show("termres"); return; }
  if (pwMode === "case"){ renderCaseDoc(); show("casedoc"); return; }
  renderLetter();
  show("letter");
}

function pwPay(){
  const pay = document.getElementById("payBtn");
  pay.disabled = true;
  pay.textContent = t("pw_paying");
  setTimeout(()=>{ buzz([12,50,20]); grantAndGo(); }, 900);
}

function renderLetter(){
  if (!current || !selected().length) return;
  document.getElementById("letterBody").textContent =
    LETTER_TO[current.doc][lang] + "\n\n" + buildLetter();
  document.getElementById("copyBtn").textContent = t("copy_btn");
  document.getElementById("letterFoot").textContent = t("lt_foot");
  renderLawyerTease();
}

/* ------------------------------------------------ lawyer review desk
   A handoff, not a service. It assembles a complete request the reader sends
   themselves, which keeps the zero-dependency architecture and the privacy
   promise intact: nothing is transmitted from here. */
let deskBack = "letter";
function holdsLawyerTier(mode){
  const id = owned[mode];
  if (!id) return false;
  const p = (PLAN_SETS[mode] || PLANS).find(x => x.name === id);
  return !!(p && p.lawyer);
}
function renderLawyerTease(){
  const el = document.getElementById("lawyerTease");
  if (el) el.hidden = !(LAWYER_DESK.live && holdsLawyerTier("letter"));
}
function openDesk(origin){
  deskBack = origin;
  renderDesk();
  show("lawyerdesk");
}
function renderDesk(){
  document.getElementById("ldBackLabel").textContent =
    t(deskBack === "casedoc" ? "cf_title" : "lt_ready");
  document.getElementById("ldContact").placeholder = t("ld_contact");
  document.getElementById("ldAsk").placeholder = t("ld_ask");
  document.getElementById("ldCopy").textContent = t("ld_copy");
  const turn = document.getElementById("ldTurn");
  /* No turnaround is stated unless one has been set. An unbacked "within 24
     hours" is exactly the promise this build exists to stop making. */
  turn.hidden = !LAWYER_DESK.turnaround;
  if (LAWYER_DESK.turnaround)
    turn.textContent = t("ld_turn").replace("{v}", LAWYER_DESK.turnaround);
}
function buildDeskRequest(){
  const doc = deskBack === "casedoc"
    ? document.getElementById("caseBody").textContent
    : document.getElementById("letterBody").textContent;
  return [
    t("ld_title"),
    t("ld_contact") + ": " + (document.getElementById("ldContact").value || "—"),
    t("ld_ask") + ": " + (document.getElementById("ldAsk").value || "—"),
    "",
    doc
  ].join("\n");
}
function copyDeskRequest(){
  const btn = document.getElementById("ldCopy");
  const done = ()=>{ btn.textContent = t("copied"); toast(t("copied"));
                     setTimeout(()=>{ btn.textContent = t("ld_copy"); }, 1600); };
  if (navigator.clipboard) navigator.clipboard.writeText(buildDeskRequest()).then(done, done);
  else done();
}

function copyLetter(){
  const btn = document.getElementById("copyBtn");
  const done = ()=>{ btn.textContent = t("copied"); toast(t("copied")); setTimeout(()=>{ btn.textContent = t("copy_btn"); }, 1600); };
  if (navigator.clipboard) navigator.clipboard.writeText(document.getElementById("letterBody").textContent).then(done, done);
  else done();
}

/* ------------------------------------------------------------ feedback */
let fbState = "ask";           /* ask | comment | done */
const FEEDBACK = [];

function renderFeedback(){
  const el = document.getElementById("feedback");
  const prevText = document.getElementById("fbText") ? document.getElementById("fbText").value : "";
  if (fbState === "done"){
    el.innerHTML =
      `<div class="fb-thanks">
         <span class="tick"><svg class="draw" viewBox="0 0 14 14" fill="none"><path d="M3.2 7.4l2.6 2.6 5-5.6" stroke="var(--on-teal)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
         <span>${t("fb_thanks")}</span>
       </div>`;
    return;
  }
  const comment = fbState === "comment"
    ? `<div class="fb-comment">
         <textarea id="fbText" placeholder="${t("fb_comment_ph")}"></textarea>
         <button class="primary" onclick="fbSend()">${t("fb_send")}</button>
       </div>`
    : "";
  el.innerHTML =
    `<div class="fb-q">${t("fb_q")}</div>
     <div class="fb-btns">
       <button aria-label="${t("fb_up")}" title="${t("fb_up")}" onclick="fbVote(true)">
         <svg viewBox="0 0 24 24" fill="none" stroke="var(--teal)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 11v9M7 11l4-7c1.4 0 2.5 1.1 2.5 2.5V9H19a1.8 1.8 0 0 1 1.8 2.1l-1.2 7A1.8 1.8 0 0 1 17.8 20H7"/></svg>
       </button>
       <button aria-label="${t("fb_down")}" title="${t("fb_down")}" onclick="fbVote(false)">
         <svg viewBox="0 0 24 24" fill="none" stroke="var(--red)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 13V4M17 13l-4 7c-1.4 0-2.5-1.1-2.5-2.5V15H5a1.8 1.8 0 0 1-1.8-2.1l1.2-7A1.8 1.8 0 0 1 6.2 4H17"/></svg>
       </button>
     </div>${comment}`;
  if (fbState === "comment" && prevText) document.getElementById("fbText").value = prevText;
}

/* A stable identifier for a heuristic. Derived from the English title, which
   is what the rule is, rather than its position in the array — so reordering
   RULES never silently re-points historical feedback at the wrong rule.
   Matches the rule_ids column in supabase/migrations/0001_init.sql. */
function ruleId(c){
  return String((c.t && c.t.en) || "unknown")
    .toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
}

/* "This was wrong" is only actionable if we know what "this" was. Recording
   the rules that fired, the decision they produced, and the confidence we
   claimed makes an inaccurate verdict traceable to the specific heuristic
   behind it — which is what turns feedback into an accuracy record instead
   of a sentiment score. */
function fbRecord(vote, comment){
  const entry = {
    at: Date.now(),
    doc: current ? current.doc : null,
    score: current ? current.score : null,
    decision: current ? decide(current) : null,
    confidence: current ? confidence(current).level : null,
    ruleIds: current ? current.clauses.map(ruleId) : [],
    signedMode,
    lang,
    vote,
    comment: comment || ""
  };
  FEEDBACK.push(entry);
  console.log("wodouh feedback:", entry);
}

function fbVote(up){
  buzz(8);
  if (up){ fbRecord("up"); fbState = "done"; }
  else fbState = "comment";
  renderFeedback();
}

function fbSend(){
  fbRecord("down", document.getElementById("fbText").value.trim());
  fbState = "done";
  renderFeedback();
}

function renderClauses(){
  const wrap = document.getElementById("clauseList");
  wrap.innerHTML = "";
  current.clauses.forEach((c,i)=>{
    const div = document.createElement("div");
    div.className = "clause " + c.s;
    const quote = quoteHtml(c);
    const act = actionLabel(c.s);
    const adv = adviceFor(c);
    const advice = adv ? ` ${adv[lang]}` : "";
    div.innerHTML =
      `<div class="head"><span class="stripe"></span><h4>${c.t[lang]}</h4></div>
       ${quote}
       <div class="plain">${c.p[lang]}${advice}</div>
       <span class="act">${act}</span>
       ${srcOf(c)}
       ${c.a ? addBtnHtml(i) : ""}`;
    wrap.appendChild(div);
  });
}

/* ------------------------------------------------ offline shell
   Registered late and failure-tolerant. The app has always worked without it
   and must keep working if registration is refused — private browsing, an
   unsupported browser, a `file://` open. Nothing above this line depends on
   it, which is the point. */
function initOffline(){
  if (!("serviceWorker" in navigator)) return;
  if (location.protocol !== "https:" && location.hostname !== "localhost"
      && location.hostname !== "127.0.0.1") return;
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  });
}

/* Whether we are already running as an installed app. iOS answers with its own
   non-standard property; everyone else with the media query. */
function isStandalone(){
  return window.matchMedia("(display-mode: standalone)").matches
      || navigator.standalone === true;
}

/* The install hint. Shown only where it is actionable and true: an iPhone or
   iPad in Safari, not already installed, and not dismissed. Android and
   desktop Chrome offer their own install affordance and do not need telling.
   Dismissal is remembered, because a banner that returns is an advert. */
function renderInstallHint(){
  const el = document.getElementById("installHint");
  if (!el) return;
  const ua = navigator.userAgent;
  const iOS = /iPad|iPhone|iPod/.test(ua)
    || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  const safari = /Safari/.test(ua) && !/CriOS|FxiOS|EdgiOS|OPiOS/.test(ua);
  el.hidden = !(iOS && safari) || isStandalone() || installOff;
  if (el.hidden) return;
  el.querySelector("b").textContent = t("inst_h");
  el.querySelector(".ih-b").textContent = t("inst_b");
  el.querySelector(".ih-x").textContent = t("tm_dismiss");
}
function dismissInstall(){ installOff = true; saveState(); renderInstallHint(); }

loadState();
if (typeof initAuth === "function") initAuth();
applyLang();
initIntake();
initGestures();
initOffline();
window.addEventListener("scroll", onScroll, { passive:true });
window.addEventListener("resize", moveTabIndicator, { passive:true });
requestAnimationFrame(()=>{ armReveals(); moveTabIndicator(); });
</script>
