  renderEos(); show("eos");
}

function renderEos(){
  const wrap = document.getElementById("eosHow");
  wrap.innerHTML = "";
  EOS_HOW.forEach(o=>{

    b.onclick = ()=>{ eosHow = o.id; renderEos(); if (document.getElementById("eosOut").innerHTML) calcEos(); };
    wrap.appendChild(b);
  });
  /* The contract-type question, for the one reader whose answer is not settled
     by law. Rendered here rather than in the markup so it tracks eosHow. */
  const ctFld = document.getElementById("eosCtypeFld");
  if (ctFld) ctFld.hidden = !eosNeedsCtype();
  const ctWrap = document.getElementById("eosCtype");
  if (ctWrap && eosNeedsCtype()){
    ctWrap.innerHTML = "";
    [["fixed","eos_ct_fixed"],["indef","eos_ct_indef"]].forEach(([id,label])=>{
      const b = document.createElement("button");
      b.type = "button";
      b.className = eosCtype === id ? "on" : "";
      b.textContent = t(label);
      b.onclick = ()=>{
        eosCtype = id; buzz(8); renderEos();
        if (document.getElementById("eosOut").innerHTML) calcEos();
      };
      ctWrap.appendChild(b);
    });
  }

  /* The contract's end date is only meaningful for a fixed-term contract, and
     only a termination raises the compensation question at all. An unlimited
     contract has no end date to give — asking for one is asking for something
     that does not exist. */
  const fld = document.getElementById("eosTermFld");
  if (fld) fld.hidden = !(contractIsFixed() && eosHow === "term");

  /* Article 87's exceptions, asked the way the assessment asks them. */
  const excFld = document.getElementById("eosExcFld");
  if (excFld) excFld.hidden = eosHow !== "resign";
  const excWrap = document.getElementById("eosExc");
  if (excWrap && eosHow === "resign"){
    excWrap.innerHTML = "";
    [["none","tm_exc_none"],["force","tm_exc_force"],
     ["marriage","tm_exc_marriage"],["birth","tm_exc_birth"]].forEach(([id,label])=>{
      const b = document.createElement("button");
      b.type = "button";
      b.className = eosExc87 === id ? "on" : "";
      b.textContent = t(label);
      b.onclick = ()=>{
        eosExc87 = id; buzz(8); renderEos();
        if (document.getElementById("eosOut").innerHTML) calcEos();
      };
      excWrap.appendChild(b);
    });
  }
}

/* Calendar arithmetic, not averaged days: an exact three-year span must come
   out as 3.000, or the award is short by a few riyals for no good reason. */
function serviceParts(a, b){
  let y = b.getFullYear() - a.getFullYear();
  let m = b.getMonth() - a.getMonth();
  let d = b.getDate() - a.getDate();
  if (d < 0){ m--; d += new Date(b.getFullYear(), b.getMonth(), 0).getDate(); }
  /* One borrow is not always enough. From 31 Jan to 1 Mar the borrow is a
     28- or 29-day February against a 30-day shortfall, leaving d negative,
     which then subtracts from the award through serviceYears. The span really
     is a completed month with no extra days, so floor it there rather than
     letting a negative leak into money. */
  if (d < 0) d = 0;
  if (m < 0){ y--; m += 12; }
  return { y, m, d };
}

function serviceYears(a, b){
  if (b <= a) return 0;
  const { y, m, d } = serviceParts(a, b);
  return y + m/12 + d/365;
}

/* Article 85's boundaries, read exactly as the statute words them:
   "one third ... after service of NOT LESS THAN two consecutive years and NOT
   MORE THAN five years, two thirds if his service is IN EXCESS OF five ...
   but less than ten, and the full award if ... ten years or more."

   So five years exactly takes one third, not two thirds. The scenario suite
   caught this at 5.000 years, where the old `y < 5` handed the reader two
   thirds — 16,667 where 8,333 was due on a 10,000 wage. Unlike the Article 81
   and 87 findings this one OVERSTATED, which is its own kind of harm: a figure
   someone walks into a settlement meeting expecting. */
function resignFactor(y){
  if (y < 2) return 0;
  if (y <= 5) return 1/3;
  if (y < 10) return 2/3;
  return 1;
}

/* ------------------------------------------------- shared money core
   The end-of-service calculator and the termination assessment are separate
   journeys, deliberately. Their arithmetic is not: two copies of a money
   formula drift, and the one that drifts is the one nobody is looking at.
   Everything below is pure — no globals, no DOM — so both flows call it and
   the fuzzer can hit it directly. */

/* Article 84: half a month per year for the first five, a full month per year
   after that, on the last wage, pro-rata. */
function awardBase(y, wage){
  if (!(wage > 0) || !isFinite(wage) || !(y > 0) || !isFinite(y)) return 0;
  const first = Math.min(y, 5), after = Math.max(0, y - 5);
  return first * 0.5 * wage + after * wage;
}

/* Months from one date to another, part-months as thirtieths. Null when we
   were not told; never negative — a contract already past its term owes
   nothing for time remaining. */
function monthsBetween(fromMs, toMs){
  if (fromMs == null || toMs == null) return null;
  const a = new Date(fromMs), b = new Date(toMs);
  if (isNaN(a) || isNaN(b)) return null;
  const months = (b.getFullYear() - a.getFullYear()) * 12
               + (b.getMonth() - a.getMonth())
               + (b.getDate() - a.getDate()) / 30;
  return Math.max(0, months);
}

/* Article 77, both branches, floored at two months' wages.
   `branch` is "fixed" or "indef". Getting this wrong understated a resident's
   figure by about five months' wages once already — see the corrections log. */
function compFor(wage, years, branch, remainingMonths){
  /* Non-finite guards, not just positivity. Infinity passes `> 0` and then
     propagates: the fuzzer found NaN and Infinity reaching the output through
     wage, years and an unparsed remaining term. None of it is reachable
     through the inputs today — every field is clamped — but a money function
     that can return NaN is one refactor away from showing it to someone. */
  if (!(wage > 0) || !isFinite(wage)) return 0;
  const floor = wage * 2;
  if (branch === "fixed"){
    /* Without the contract's end date the remaining term is unknown. Return
       the floor and say so, rather than quietly using the wrong branch. */
    if (remainingMonths == null || !isFinite(remainingMonths)) return floor;
    return Math.max(floor, remainingMonths * wage);
  }
  const y = (isFinite(years) && years > 0) ? years : 0;
  return Math.max(floor, y * 15 * (wage / 30));
}

/* Article 111: accrued leave not taken, paid on the last wage. */
function leaveFor(days, wage){
  if (!(wage > 0) || !isFinite(wage) || !(days > 0) || !isFinite(days)) return 0;
  return days * (wage / 30);
}

/* Article 76: the party who ignored the notice period pays the wage for it,
   or for the balance of it. Indefinite contracts only — it is the remedy for
   breaching Article 75, which does not reach an always-fixed-term contract. */
function noticeFor(dueDays, givenDays, wage){
  if (!(wage > 0) || !isFinite(wage) || !(dueDays > 0) || !isFinite(dueDays)) return 0;
  const given = (isFinite(givenDays) && givenDays > 0) ? givenDays : 0;
  const short = Math.max(0, dueDays - given);
  /* Fully served notice owes nothing. Written as an early return because
     0 * (wage/30) is NaN once wage is non-finite, which the fuzzer caught. */
  if (short <= 0) return 0;
  return short * (wage / 30);
}

function money(n){
  return new Intl.NumberFormat(lang==="ar" ? AR_NUM : "en-US",
    { maximumFractionDigits:0 }).format(Math.round(n));
}

/* DATES THAT CANNOT BE TRUE, on any pair.
 *
 * The termination assessment has always checked these — the copy keys below
 * are its — but the FREE calculator on the front door did not, and it is the
 * one more people reach. Typing 1990 instead of 2019 produced "126 سنة" of
 * service and 1,482,000 SAR with no hesitation whatsoever. The arithmetic was
 * right; the input was impossible, and saying so is the whole character of
 * this product everywhere else. */
function datePlausibility(startStr, endStr){
  const out = [];
  const a = startStr ? new Date(startStr) : null;
  const b = endStr ? new Date(endStr) : null;
  const now = Date.now();
  if (a && !isNaN(a) && a.getTime() > now) out.push("rv_start_future");
  if (a && !isNaN(a) && a.getFullYear() < 1970) out.push("rv_start_ancient");
  if (b && !isNaN(b) && b.getTime() > now + 86400000) out.push("rv_end_future");
  if (a && b && !isNaN(a) && !isNaN(b)){
    const years = (b.getTime() - a.getTime()) / (365.25 * 86400000);
    /* Longer than any working life. Not capped — capping would invent a
       number for someone with a genuinely long record — the reader is asked
       to check the year. */
    if (years > 60) out.push("rv_service_long");
  }
  return out;
}

function calcEos(){
  const sd = document.getElementById("eosStart").value;
  const ed = document.getElementById("eosEnd").value;
  const wage = parseFloat(document.getElementById("eosWage").value);
  const out = document.getElementById("eosOut");
  const eosSrc = document.getElementById("eosSrc");
  /* The citation belongs to a result, so it appears and disappears with one. */
  if (!sd || !ed || !wage || wage <= 0){ out.innerHTML = ""; eosSrc.hidden = true; return; }
  const a = new Date(sd), bDate = new Date(ed);
  const y = serviceYears(a, bDate);
  /* Written as !(y > 0) rather than y <= 0: NaN fails every comparison, so
     the old guard let an unparseable date through to the arithmetic and the
     reader saw "not a number" where a figure should be. */
  if (!(y > 0)){ out.innerHTML = ""; eosSrc.hidden = true; return; }
  const parts = serviceParts(a, bDate);

  const first = Math.min(y, 5), after = Math.max(0, y - 5);
  const firstAmt = first * 0.5 * wage, afterAmt = after * wage;
  const sub = awardBase(y, wage);
  /* Article 87 keeps the FULL award despite Article 85 — force majeure, or a
     female worker within six months of marriage or three months of giving
     birth. Same shape as termAward(), deliberately, so the two paths cannot
     drift into disagreeing about the same reader. */
  const exc = eosHow === "resign" && eosExc87Applies();
  const factor = (eosHow === "resign" && !exc) ? resignFactor(y) : 1;
  const total = sub * factor;
  /* The only case where a subtotal is a different number from the total. */
  const eosAdjusted = factor !== 1;

  const svc = svcText(parts.y, parts.m);
  const cur = t("eos_sar");
  const row = (label, val, cls) =>
    `<div class="r${cls?" "+cls:""}"><span>${label}</span><b>${val}</b></div>`;

  out.innerHTML =
    `<div class="eos-card">
       <div class="lbl">${t("eos_result")}</div>
       <div class="amt">${money(total)}<small>${cur}</small></div>
       <div class="svc">${t("eos_service")}: ${svc}</div>
       <div class="rows">
         ${row(t("eos_b_first"), money(firstAmt)+" "+cur)}
         ${after > 0 ? row(t("eos_b_after"), money(afterAmt)+" "+cur) : ""}
         ${/* "Subtotal before adjustment" sat directly above an identical
              "Estimated total" whenever no adjustment applied — a label that
              raises a question and then never answers it, on the one screen
              whose whole job is showing the arithmetic. The subtotal and the
              factor now appear only when the factor actually moves the
              figure; otherwise the total stands alone, which is the truth. */
           ""}
         ${eosAdjusted ? row(t("eos_b_sub"), money(sub)+" "+cur) : ""}
         ${eosAdjusted ? row(t("eos_b_factor"), factor===0 ? "0" : (factor<0.5?"1/3":"2/3")) : ""}
         ${row(t("eos_b_total"), money(total)+" "+cur, "tot")}
       </div>
       ${exc ? `<p class="eos-note">${t("eos_exc87")}</p>` : ""}
       ${eosHow==="resign" && !exc && factor===0 ? `<p class="eos-note">${t("eos_none")}</p>` : ""}
       <p class="eos-note">${t("eos_note")}</p>
     </div>` +
    (eosHow === "term" ? triageHtml(ed) : "");

  /* Beside the figure, not instead of it: the arithmetic is still shown,
     because the reader may genuinely have meant what they typed. */
  const odd = datePlausibility(sd, ed);
  if (odd.length){
    const warn = document.createElement("p");
    warn.className = "eos-note warn";
    warn.id = "eosOdd";
    warn.textContent = odd.map(k => t(k)).join(" ");
    const card = out.querySelector(".eos-card");
    (card || out).appendChild(warn);
  }
  eosSrc.hidden = false;
  /* applyLang() repaints every [data-t] node and then re-runs calcEos(), so
     this override survives a language toggle rather than being reverted by it. */
  eosSrc.textContent = t(exc ? "src_eos_87" : "src_eos");
  eosData = { start:sd, end:ed, wage, years:y, parts, total, how:eosHow,
              exc87: eosHow === "resign" ? eosExc87 : null };
  /* THE CASE FILE IS PER ASSESSMENT, like the letter is per contract.
     analyze() spends owned.letter and owned.review on a new contract, and
     owned.case was spent nowhere at all — so the 149 letter was metered per use
     while the 349 case file, the dearer product, was bought once and kept for
     life. Nothing sold it that way: it carries neither `credits` nor `monthly`,
     the two markers this catalogue uses for "more than once".

     COMPARED, NOT CLEARED UNCONDITIONALLY. This runs on every recompute,
     including a reader who nudges a date and recalculates the same case, or who
     simply returns to the calculator. Revoking a paid product for that would be
     its own defect. The signature is the four inputs the file is actually built
     from, so only a genuinely different assessment spends the entitlement. */
  const sig = [sd, ed, wage, eosHow].join("|");
  if (owned.case && caseSig && caseSig !== sig){ owned.case = null; saveState(); }
  caseSig = sig;
  /* The figure counts up to exactly the computed total; the value and its
     formatting are unchanged, only its arrival. */
  { const amtEl = document.querySelector("#eosOut .amt"), cur = t("eos_sar");
    if (amtEl) rollTo(
      { set textContent(v){ amtEl.innerHTML = v + "<small>" + cur + "</small>"; } },
      total, money); }
  buzz(8);
  if (eosHow === "term") bindTriage(ed);
}

function triageHtml(){
  const q = (key, id) =>
    `<div class="tq"><span>${t(key)}</span><div class="yn" data-q="${id}">
       <button type="button" data-v="1">${t("tr_yes")}</button>
       <button type="button" data-v="0">${t("tr_no")}</button>
     </div></div>`;
  return `<div class="triage">
      <h4>${t("tr_head")}</h4>
      ${q("tr_q1","reason")}${q("tr_q2","notice")}${q("tr_q3","probation")}
      <div id="triageOut"></div>
    </div>`;
}

function bindTriage(endDate){
  triage = { reason:null, notice:null, probation:null }; claimAdded = false;
  document.querySelectorAll("#eosOut .yn").forEach(g=>{
    g.querySelectorAll("button").forEach(b=>{
      b.onclick = ()=>{
        triage[g.dataset.q] = b.dataset.v === "1";
        g.querySelectorAll("button").forEach(x=>x.classList.remove("on"));
        b.classList.add("on");
        renderTriage(endDate);
      };
    });
  });
}

function renderTriage(endDate){
  const { reason, notice, probation } = triage;
  if (reason === null || notice === null || probation === null) return;
  const out = document.getElementById("triageOut");
  let cls, head, body;
  if (probation){ cls="warn"; head=t("tr_out_probation"); body=t("tr_out_probation_b"); }
  else if (reason && notice){ cls="ok"; head=t("tr_out_ok"); body=t("tr_out_ok_b"); }
  else { cls="act"; head=t("tr_out_claim"); body=t("tr_out_claim_b"); }
  out.innerHTML =
    `<div class="verdict-box ${cls}"><b>${head}</b><p>${body}</p></div>
     <div class="clock">
       <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
       <span>${t("tr_clock")}</span>
     </div>
     <button class="primary" id="clockBtn">${t(claimAdded ? "tr_added" : "tr_addclock")}</button>
     ${cls==="act" ? `<button class="ghost wide" id="caseBtn">${t("cf_cta")}</button>` : ""}`;
  document.getElementById("clockBtn").onclick = ()=>addClaimClock(endDate);
  const cb = document.getElementById("caseBtn");
  if (cb) cb.onclick = ()=>openCase();
  buzz(6);
}

/* The claim window is the one deadline that can cost someone everything, so
   it goes straight into the same reminder timeline as contract dates. */
function addClaimClock(endDate){
  if (claimAdded) { openTimeline("home"); return; }
  const base = new Date(endDate).getTime();
  TRACKED.push({ doc:"doc_claim", events:[
    { d:30, k:"action", when: base + 30*86400000,
      t:{ar:"ابدأ التسوية الودية",en:"Start amicable settlement"},
      n:{ar:"الطريق النظامي يبدأ بالتسوية الودية قبل المحكمة العمالية — بكّر فيها.",
         en:"The formal route begins with amicable settlement before the labour court — start early."} },
    { d:365, k:"deadline", when: base + 365*86400000,
      t:{ar:"آخر موعد لسماع الدعوى",en:"Claim deadline"},
      n:{ar:"بعد اثني عشر شهرًا من انتهاء العلاقة لا تُسمع الدعوى عادةً.",
         en:"After twelve months from the end of the relationship a claim is generally not heard."} }
  ]});
  claimAdded = true; buzz(10);
  saveState();
  document.getElementById("clockBtn").textContent = t("tr_added");
}

/* ------------------------------------------------------- case file ----
   The post-signing counterpart to the negotiation letter: the same
   build-as-you-go mechanic, aimed at recovery instead of negotiation. */
let eosData = null, caseDocs = new Set(), leaveDays = 0;
/* Which assessment the held case file was bought against. Not persisted: it is
   set the moment the calculator runs, and a reader returning after a reload
   recomputes before they can reach the case file at all. */
let caseSig = null;

const CASE_DOCS = ["d_contract","d_letter","d_pay","d_wps","d_msgs","d_leave"];

function openCase(){
  /* The compensation figure uses a different Article 77 branch per track,
     and getting it wrong is what this whole distinction exists to prevent. */
  if (needsTrack(openCase)) return;
  renderCase(); show("case");
}

/* Article 77 has two branches, and which one applies is decided by the
   contract's type, not by preference.

   An indefinite contract pays 15 days' wages per year of service. A
   fixed-term contract pays the wages for the REMAINING TERM instead — and
   under Article 37 a non-Saudi's contract is always fixed-term. Applying the
   indefinite formula to them, as this once did, understates the figure badly:
   six years' service with eight months left came out at roughly three months'
   wages instead of eight.

   Both branches floor at two months' wages. */
function compEstimate(){
  if (!eosData) return 0;
  return compFor(eosData.wage, eosData.years,
                 contractIsFixed() ? "fixed" : "indef", remainingTermMonths());
}

/* The calculator's binding to the shared core: read the contract end date off
   the form, measure from the date they actually left. */
function remainingTermMonths(){
  const el = document.getElementById("eosTermEnd");
  if (!el || !el.value || !eosData) return null;
  return monthsBetween(eosData.end, new Date(el.value).getTime());
}

/* A fixed-term contract with decades left is almost always a mistyped year:
   2099 instead of 2029 turned a 480,000 claim into 8,880,000 in testing, with
   nothing on screen to suggest anything was wrong. We do not cap it — capping
   would invent a number for someone with a genuinely long term — we ask them
   to check the date. */
const TERM_SANITY_MONTHS = 60;

function termLooksImplausible(){
  const m = remainingTermMonths();
  return m != null && m > TERM_SANITY_MONTHS;
}

/* Which of the two Article 77 branches produced the number on screen. */
function compBasisKey(){
  if (!contractIsFixed()) return "cf_comp_note";
  return remainingTermMonths() == null ? "cf_comp_note_need" : "cf_comp_note_term";
}
function leaveAmount(){ return eosData ? leaveFor(leaveDays, eosData.wage) : 0; }
function claimTotal(){ return (eosData ? eosData.total : 0) + compEstimate() + leaveAmount(); }

function renderCase(){
  if (!eosData) return;
  const cur = t("eos_sar");
  const row = (l,v,cls)=>`<div class="r${cls?" "+cls:""}"><span>${l}</span><b>${money(v)} ${cur}</b></div>`;
  document.getElementById("caseClaim").innerHTML =
    `<div class="claim-card">
       <h4>${t("cf_claim")}</h4>
       ${row(t("cf_eos"), eosData.total)}
       ${row(t("cf_comp"), compEstimate())}
       <p class="mini">${t(compBasisKey())}</p>
       ${termLooksImplausible() ? `<p class="mini warn">${t("cf_term_odd")}</p>` : ""}
       <div class="leave-in">
         <span>${t("cf_leave_q")}</span>
         <input type="number" min="0" max="365" id="leaveDays" value="${leaveDays}"/>
       </div>
       ${row(t("cf_leave"), leaveAmount())}
       ${row(t("cf_total"), claimTotal(), "tot")}
     </div>`;
  const termEl = document.getElementById("eosTermEnd");
  if (termEl) termEl.onchange = ()=>renderCase();
  document.getElementById("leaveDays").oninput = e=>{
    leaveDays = Math.max(0, Math.min(365, parseInt(e.target.value||"0",10)));
    renderCase();
    document.getElementById("leaveDays").focus();
  };

  document.getElementById("caseDocs").innerHTML = CASE_DOCS.map(d=>
    `<button class="doc${caseDocs.has(d)?" on":""}" data-doc="${d}">
       <span class="box"><svg class="draw" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.5 3.5L13 4.5"/></svg></span>
       <span>${t(d)}</span>
     </button>`).join("");
  document.querySelectorAll("[data-doc]").forEach(b=>{
    b.onclick = ()=>{
      const k = b.dataset.doc;
      caseDocs.has(k) ? caseDocs.delete(k) : (caseDocs.add(k), buzz(8));
      renderCase();
    };
  });

  const pct = Math.round(caseDocs.size / CASE_DOCS.length * 100);
  document.getElementById("caseReady").innerHTML =
    `<div class="lbl"><span>${t("cf_ready")}</span>
       <span>${t("cf_ready_n").replace("{a}",fmtNum(caseDocs.size)).replace("{b}",fmtNum(CASE_DOCS.length))}</span></div>
     <div class="meter"><i style="width:${pct}%"></i></div>`;
}

function buildCaseDoc(){
  const cur = t("eos_sar"), d = eosData;
  const fmtD = ts => fmtDate(new Date(ts).getTime());
  const docs = CASE_DOCS.filter(x=>caseDocs.has(x)).map(x=>"• "+t(x)).join("\n") || "—";
  if (lang==="ar")
    return `${t("cf_facts")}\n`+
      `• بداية العمل: ${fmtD(d.start)}\n• نهاية العمل: ${fmtD(d.end)}\n`+
      `• مدة الخدمة: ${svcText(d.parts.y, d.parts.m)}\n`+
      `• آخر أجر شهري: ${money(d.wage)} ${cur}\n• طريقة الإنهاء: ${t("eos_h_term")}\n\n`+
      `${t("cf_claim")}\n`+
      `• ${t("cf_eos")}: ${money(d.total)} ${cur}\n`+
      `• ${t("cf_comp")}: ${money(compEstimate())} ${cur}\n`+
      `• ${t("cf_leave")}: ${money(leaveAmount())} ${cur}\n`+
      `• ${t("cf_total")}: ${money(claimTotal())} ${cur}\n\n`+
      `${t("cf_ev")}\n${docs}\n\n${t("cf_ask")}\n${t("cf_ask_b")}`;
  return `${t("cf_facts")}\n`+
    `• Start date: ${fmtD(d.start)}\n• End date: ${fmtD(d.end)}\n`+
    `• Length of service: ${svcText(d.parts.y, d.parts.m)}\n`+
    `• Last monthly wage: ${money(d.wage)} ${cur}\n• How it ended: ${t("eos_h_term")}\n\n`+
    `${t("cf_claim")}\n`+
    `• ${t("cf_eos")}: ${money(d.total)} ${cur}\n`+
    `• ${t("cf_comp")}: ${money(compEstimate())} ${cur}\n`+
    `• ${t("cf_leave")}: ${money(leaveAmount())} ${cur}\n`+
    `• ${t("cf_total")}: ${money(claimTotal())} ${cur}\n\n`+
    `${t("cf_ev")}\n${docs}\n\n${t("cf_ask")}\n${t("cf_ask_b")}`;
}

function renderCaseDoc(){
  if (!eosData) return;
  document.getElementById("caseBody").textContent = buildCaseDoc();
  document.getElementById("caseFoot").textContent = t("lt_foot");
  document.getElementById("caseCopyBtn").textContent = t("cf_copy");
  renderEscalate("case");
}

function copyCase(){
  const btn = document.getElementById("caseCopyBtn");
  const done = ()=>{ btn.textContent = t("copied"); toast(t("copied")); setTimeout(()=>{ btn.textContent = t("cf_copy"); }, 1600); };
  if (navigator.clipboard) navigator.clipboard.writeText(document.getElementById("caseBody").textContent).then(done,done);
  else done();
}

function openCasePaywall(){
  if (has("case")){ renderCaseDoc(); show("casedoc"); return; }
  /* pwUpgrade and pwUpBack cleared, like the other two entry points. Without
     it, a reader who had opened the termination upgrade and backed out arrived
     here to a case-file paywall wearing the upgrade's title, its "pay the
     difference" button, and a back control that said "calculator" while
     pointing at the termination flow. The price and the entitlement were both
     right; every word around them was wrong. */
  pwMode = "case"; pwOrigin = "case"; pwPlan = 0; pwUpgrade = null; pwUpBack = null;
  if (renderPaywall()) show("paywall");
}

/* ================================================ termination assessment
   The post-employment counterpart to the contract review. Someone arrives here
   because their job ended and they think it was handled wrongly.

   Two rules govern every line below:

   1. It never states a legal outcome. "Potential", "may", "appears",
      "based on what you told us" — never "illegal", never "you will win".
      A wrong promise to someone who has just lost their income is the worst
      thing this product could do.
   2. Every figure carries its origin, law or Wodouh's reading, exactly as the
      rest of the app does. The money here shares the arithmetic core with the
      calculator rather than reimplementing it. */

let term = null;              /* the answers; null until the flow starts */
let termStep = 0;
let termTone = "professional";

/* What happened, and what each answer means legally. The seven options are not
   cosmetic: `award` decides whether the end-of-service figure is the full
   Article 84 amount, the reduced Article 85 tiers, or nothing at all, and that
   is the difference between showing someone their full award and showing them
   zero. See the Article 81 entry in the corrections log. */
const TERM_HOW = [
  { id:"employer",  label:"th_employer",  award:"full",   comp:true,  notice:true },
  { id:"forced",    label:"th_forced",    award:"full",   comp:true,  notice:true,  art81:true },
  { id:"resigned",  label:"th_resigned",  award:"resign", comp:false, notice:false },
  { id:"expired",   label:"th_expired",   award:"full",   comp:false, notice:false },
  { id:"probation", label:"th_probation", award:"none",   comp:false, notice:false, prob:true },
  { id:"noreason",  label:"th_noreason",  award:"full",   comp:true,  notice:true,  art80:true },
  { id:"other",     label:"th_other",     award:"full",   comp:false, notice:false, cautious:true }
];
function termHow(){ return TERM_HOW.find(x => x.id === (term && term.how)) || null; }

/* The evidence list. Wider than the case file's six because a termination
   dispute turns on different paper — warnings and settlement especially. */
const TERM_DOCS = ["d_contract","d_letter","d_pay","d_wps","d_msgs","d_leave",
                   "d_warn","d_settle","d_hr","d_comm"];

function blankTerm(){
  return { how:null, start:"", end:"", wage:0, basic:0, ctype:null, termEnd:"",
           probation:null, reason:"", noticeDue:null, noticeGiven:null,
           gotSettle:null, gotEos:null, leaveDays:0, unpaidMonths:0, otherAmt:0,
           /* Article 87 defeats the Article 85 reduction. Asked only on the
              resignation path, because that is the only place it changes
              anything — and not asking cost real money: a woman who resigned
              two months after giving birth was shown a third of her award,
              or nothing at all under two years. */
           exc87:null,
           docs:[] };
}

function openTerm(){
  /* Article 77 and Article 76 both branch on nationality, and getting that
     wrong is what this whole distinction exists to prevent. Ask before any
     money is computed, not after. */
  if (needsTrack(openTerm)) return;
  if (!term) term = blankTerm();
  termStep = 0;
  renderTermHow();
  show("term");
}

function renderTermHow(){
  const wrap = document.getElementById("termHow");
  wrap.innerHTML = "";
  TERM_HOW.forEach(o => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = term && term.how === o.id ? "on" : "";
    b.textContent = t(o.label);
    b.onclick = () => {
      term.how = o.id;
      /* Probation is answered by the choice itself; don't ask again. */
      if (o.prob) term.probation = true;
      saveState();
      buzz(8);
      renderTermHow();
      termStep = 0;
      renderTermQ();
      show("termq");
    };
    wrap.appendChild(b);
  });
}

/* ------------------------------------------------------ the questions
   Three short screens rather than one wall of fields. Only the first three
   values are required; everything else refines the picture, and a blank
   answer is reported as missing rather than guessed. */
const TERM_STEPS = [
  { title:"tm_q1_t", sub:"tm_q1_s", fields:["start","end","wage","basic"] },
  { title:"tm_q2_t", sub:"tm_q2_s", fields:["ctype","termEnd","noticeDue","noticeGiven","reason"] },
  { title:"tm_q3_t", sub:"tm_q3_s", fields:["exc87","gotSettle","gotEos","unpaidMonths","leaveDays","otherAmt"] }
];

function termQBack(){
  if (termStep > 0){ termStep--; renderTermQ(); return; }
  show("term", 1);
}

function termQNext(){
  saveState();
  if (termStep < TERM_STEPS.length - 1){ termStep++; renderTermQ(); buzz(6); return; }
  renderTermEv();
  show("termev");
}

/* A non-Saudi's contract is always fixed-term under Article 37, so asking them
   to choose is offering a wrong answer. */
function termCtype(){
  if (isNonSaudi()) return "fixed";
  return term && term.ctype ? term.ctype : null;
}

function renderTermQ(){
  const st = TERM_STEPS[termStep];
  document.getElementById("tqTitle").textContent = t(st.title);
  document.getElementById("tqSub").textContent = t(st.sub);
  document.getElementById("tqBackLabel").textContent =
    t(termStep === 0 ? "tm_h_title" : "tm_q_back");
  document.getElementById("tqSteps").innerHTML =
    TERM_STEPS.map((x, i) => `<i class="${i <= termStep ? "on" : ""}"></i>`).join("");
  document.getElementById("tqNext").textContent =
    t(termStep === TERM_STEPS.length - 1 ? "tm_q_done" : "tm_q_next");

  const F = {
    start:   () => dateFld("tmStart", "tm_f_start", term.start),
    end:     () => dateFld("tmEnd", "tm_f_end", term.end),
    wage:    () => numFld("tmWage", "tm_f_wage", term.wage, "tm_f_wage_h"),
    basic:   () => numFld("tmBasic", "tm_f_basic", term.basic, "tm_f_basic_h"),
    ctype:   () => isNonSaudi()
      ? note("tm_f_ctype_fixed")
      : segFld("tmCtype", "tm_f_ctype",
               [["indef","tm_f_indef"],["fixed","tm_f_fixed"]], term.ctype),
    termEnd: () => termCtype() === "fixed"
      ? dateFld("tmTermEnd", "tm_f_termend", term.termEnd, "tm_f_termend_h") : "",
    noticeDue:   () => numFld("tmNoticeDue", "tm_f_ndue", term.noticeDue, "tm_f_ndue_h"),
    noticeGiven: () => numFld("tmNoticeGiven", "tm_f_ngiven", term.noticeGiven, "tm_f_ngiven_h"),
    reason:      () => textFld("tmReason", "tm_f_reason", term.reason, "tm_f_reason_h"),
    /* Only on the resignation path: elsewhere the full award is already due
       and the question would be noise. */
    exc87: () => termHow() && termHow().award === "resign"
      ? segFld("tmExc", "tm_f_exc", [["none","tm_exc_none"],["force","tm_exc_force"],
                                     ["marriage","tm_exc_marriage"],["birth","tm_exc_birth"]],
               term.exc87)
      : "",
    gotSettle: () => ynFld("tmSettle", "tm_f_settle", term.gotSettle),
    gotEos:    () => ynFld("tmEos", "tm_f_eos", term.gotEos),
    unpaidMonths: () => numFld("tmUnpaid", "tm_f_unpaid", term.unpaidMonths, "tm_f_unpaid_h"),
    leaveDays:    () => numFld("tmLeave", "tm_f_leave", term.leaveDays, "tm_f_leave_h"),
    otherAmt:     () => numFld("tmOther", "tm_f_other", term.otherAmt, "tm_f_other_h")
  };
  document.getElementById("tqForm").innerHTML = st.fields.map(f => F[f]()).join("");
  bindTermQ();
}

function dateFld(id, label, val, hint){
  return `<label class="fld" for="${id}"><span>${t(label)}</span>
    <input type="date" id="${id}" value="${esc(val || "")}"/>
    ${hint ? `<em>${t(hint)}</em>` : ""}</label>`;
}
function numFld(id, label, val, hint){
  const v = (val === null || val === undefined || val === 0) ? "" : val;
  return `<label class="fld" for="${id}"><span>${t(label)}</span>
    <input type="number" inputmode="numeric" min="0" id="${id}" value="${esc(String(v))}"/>
    ${hint ? `<em>${t(hint)}</em>` : ""}</label>`;
}
function textFld(id, label, val, hint){
  return `<label class="fld" for="${id}"><span>${t(label)}</span>
    <input type="text" id="${id}" value="${esc(val || "")}" maxlength="140"/>
    ${hint ? `<em>${t(hint)}</em>` : ""}</label>`;
}
function segFld(id, label, opts, val){
  return `<div class="fld"><span>${t(label)}</span><div class="opts" id="${id}">
    ${opts.map(([v, k]) => `<button type="button" data-v="${v}" class="${val === v ? "on" : ""}">${t(k)}</button>`).join("")}
  </div></div>`;
}
function ynFld(id, label, val){
  return segFld(id, label, [["yes","tr_yes"],["no","tr_no"]],
                val === true ? "yes" : val === false ? "no" : null);
}
function note(key){ return `<p class="tq-skip">${t(key)}</p>`; }

function bindTermQ(){
  const num = (id, key, max) => {
    const el = document.getElementById(id);
    if (!el) return;
    el.oninput = () => {
      const n = parseFloat(el.value);
      term[key] = isFinite(n) && n > 0 ? Math.min(n, max) : 0;
    };
  };
  const txt = (id, key) => {
    const el = document.getElementById(id);
    if (el) el.oninput = () => { term[key] = el.value; };
  };
  txt("tmStart", "start"); txt("tmEnd", "end");
  txt("tmTermEnd", "termEnd"); txt("tmReason", "reason");
  /* Ceilings are sanity bounds, not legal ones: they stop a typo becoming a
     number nobody questions. The remaining-term check does the same job for
     the one figure where a typo is worth millions. */
  num("tmWage", "wage", 1e7); num("tmBasic", "basic", 1e7);
  num("tmNoticeDue", "noticeDue", 365); num("tmNoticeGiven", "noticeGiven", 365);
  num("tmUnpaid", "unpaidMonths", 60); num("tmLeave", "leaveDays", 365);
  num("tmOther", "otherAmt", 1e7);

  const seg = (id, apply) => {
    const w = document.getElementById(id);
    if (!w) return;
    w.querySelectorAll("button").forEach(b => {
      b.onclick = () => { apply(b.dataset.v); renderTermQ(); };
    });
  };
  seg("tmCtype", v => { term.ctype = v; });
  seg("tmExc", v => { term.exc87 = v; });
  seg("tmSettle", v => { term.gotSettle = v === "yes"; });
  seg("tmEos", v => { term.gotEos = v === "yes"; });
}

/* --------------------------------------------------------- evidence
   Declared, not uploaded. Wodouh cannot read a payslip photo or a WhatsApp
   thread, so it asks what you have rather than pretending to analyse it —
   and says so on the screen instead of implying otherwise. */
function renderTermEv(){
  document.getElementById("termDocs").innerHTML = TERM_DOCS.map(d =>
    `<button class="doc${term.docs.indexOf(d) !== -1 ? " on" : ""}" data-tdoc="${d}">
       <span class="box"><svg class="draw" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.5 3.5L13 4.5"/></svg></span>
       <span>${t(d)}</span>
     </button>`).join("");
  document.querySelectorAll("[data-tdoc]").forEach(b => {
    b.onclick = () => {
      const k = b.dataset.tdoc, i = term.docs.indexOf(k);
      i === -1 ? (term.docs.push(k), buzz(8)) : term.docs.splice(i, 1);
      saveState();
      renderTermEv();
    };
  });

  const pct = Math.round(term.docs.length / TERM_DOCS.length * 100);
  document.getElementById("termReady").innerHTML =
    `<div class="lbl"><span>${t("cf_ready")}</span>
       <span>${t("cf_ready_n").replace("{a}", fmtNum(term.docs.length)).replace("{b}", fmtNum(TERM_DOCS.length))}</span></div>
     <div class="meter"><i style="width:${pct}%"></i></div>`;

  const ev = evidenceStrength();
  const missing = TERM_DOCS.filter(d => term.docs.indexOf(d) === -1);
  document.getElementById("termEvOut").innerHTML =
    `<div class="tm-sec">
       <div class="hd"><b>${t("tm_ev_strength")}</b><span class="tm-tag ${ev.cls}">${t(ev.key)}</span></div>
       <p>${t(ev.why)}</p>
       ${missing.length ? `<p><b>${t("tm_ev_missing")}</b><br>${missing.map(m => "• " + t(m)).join("<br>")}</p>` : ""}
     </div>`;
  renderAiPanel();
}

/* Weighted, not counted: the contract and the termination letter carry the
   dispute, and ten payslips do not replace either. */
const EV_KEY = { d_contract:3, d_letter:3, d_settle:2, d_pay:2, d_warn:2, d_msgs:1,
                 d_wps:1, d_leave:1, d_hr:1, d_comm:1 };

function evidenceScore(){
  return (term ? term.docs : []).reduce((n, d) => n + (EV_KEY[d] || 0), 0);
}
function evidenceStrength(){
  const s = evidenceScore();
  if (s >= 9)  return { cls:"ok",     key:"tm_ev_strong",  why:"tm_ev_strong_w" };
  if (s >= 4)  return { cls:"review", key:"tm_ev_mod",     why:"tm_ev_mod_w" };
  return { cls:"issue", key:"tm_ev_limited", why:"tm_ev_limited_w" };
}

/* ------------------------------------------------------------ the money
   Every function here delegates to the shared pure core. The figures are
   estimates of what may be owed, never a determination that anything is. */

function termServiceYears(){
  if (!term || !term.start || !term.end) return 0;
  const a = new Date(term.start), b = new Date(term.end);
  if (isNaN(a) || isNaN(b)) return 0;
  const y = serviceYears(a, b);
  return y > 0 ? y : 0;
}
function termParts(){
  if (!term || !term.start || !term.end) return { y:0, m:0, d:0 };
  const a = new Date(term.start), b = new Date(term.end);
  if (isNaN(a) || isNaN(b) || b <= a) return { y:0, m:0, d:0 };
  return serviceParts(a, b);
}
function termWage(){ return term && term.wage > 0 ? term.wage : 0; }

/* Article 84, then Article 85 only where the departure was an ordinary
   resignation. A departure under Article 81 keeps the full award — that
   distinction is the whole reason "asked to resign" is its own option. */
/* Unanswered inputs that can only move the total UP. Distinct from
   termUnassessed(), which names what could not be computed at all: these lines
   DID compute, and computed low, because a rule that reduces an entitlement was
   applied without its exception being ruled out. */
function termCouldRise(){
  const h = termHow(), out = [];
  /* The award line has to actually BE in the total. A reader who already
     received their end-of-service award has it filtered out of termLines(),
     and the notice then promised an increase to a total that contains no
     award — an upward arrow over a figure that cannot move. A notice that
     cries rise where no rise is possible spends the credibility the true
     instances need. */
  if (h && h.award === "resign" && term && term.exc87 === null
      && termLines().some(l => l.key === "tm_m_eos")) out.push("rv_exc_unasked");
  return out;
}

function exc87Applies(){
  return !!term && (term.exc87 === "force" || term.exc87 === "marriage" || term.exc87 === "birth");
}

function termAward(){
  const h = termHow();
  if (!h || h.award === "none") return 0;
  const y = termServiceYears(), base = awardBase(y, termWage());
  /* Article 87: force majeure, or a female worker within six months of
     marriage or three months of giving birth, keeps the FULL award despite
     Article 85. A reduction shipped without its exceptions understates
     somebody's entitlement — this is the second time in this feature. */
  if (h.award === "resign" && exc87Applies()) return base;
  return h.award === "resign" ? base * resignFactor(y) : base;
}

function termRemainingMonths(){
  if (!term || !term.termEnd || !term.end) return null;
  return monthsBetween(new Date(term.end).getTime(), new Date(term.termEnd).getTime());
}
function termTermOdd(){
  const m = termRemainingMonths();
  return m != null && m > TERM_SANITY_MONTHS;
}

/* Article 77, only where the ending could put it in play at all. */
function termComp(){
  const h = termHow();
  if (!h || !h.comp) return 0;
  return compFor(termWage(), termServiceYears(),
                 termCtype() === "fixed" ? "fixed" : "indef", termRemainingMonths());
}

/* Article 76. Indefinite contracts only — it is the remedy for breaching
   Article 75, which never reaches a non-Saudi's always-fixed-term contract.
   Showing it to the wrong person is the same error the log already records
   once, so it is refused here rather than filtered later. */
function termNoticeOwed(){
  const h = termHow();
  if (!h || !h.notice) return 0;
  if (isNonSaudi() || termCtype() === "fixed") return 0;
  return noticeFor(term.noticeDue, term.noticeGiven, termWage());
}

function termLeaveOwed(){ return leaveFor(term ? term.leaveDays : 0, termWage()); }
function termUnpaidOwed(){
  const m = term && term.unpaidMonths > 0 ? term.unpaidMonths : 0;
  return m * termWage();
}
function termOtherOwed(){ return term && term.otherAmt > 0 ? term.otherAmt : 0; }

/* The end-of-service award is only outstanding if it has not been paid. */
function termAwardOwed(){ return term && term.gotEos === true ? 0 : termAward(); }

/* Lines we could not assess because the reader did not give us what they
   need. Staying silent about these reads as "nothing is owed here", which is
   an answer we have not earned — so they are named instead. */
function termUnassessed(){
  if (!term) return [];
  const h = termHow();
  const candidates = [
    { key:"tm_m_leave",  needs:["leaveDays"],                applies:true },
    { key:"tm_m_unpaid", needs:["unpaidMonths"],             applies:true },
    { key:"tm_m_other",  needs:["otherAmt"],                 applies:true },
    { key:"tm_m_notice", needs:["noticeDue"],
      applies: !!(h && h.notice) && !isNonSaudi() && termCtype() !== "fixed" },
    { key:"tm_m_comp",   needs:["termEnd"],
      applies: !!(h && h.comp) && termCtype() === "fixed" },
    /* The end-of-service line reaches this list only on the resignation path,
       and only for the Article 87 exception. Everywhere else its inputs are
       dates and a wage, which the flow requires before it will compute at all.
       NOTE: filtered out again below when the line did compute — see the
       return. Its claim card carries its own gap sentence, so the reader is
       still told what is missing.
       Here the missing input silently REDUCES the award — so it has to be named
       rather than assumed away, exactly like every other gap. */
    { key:"tm_m_eos",    needs:["exc87"],
      applies: !!(h && h.award === "resign") }
  ];
  /* A line that DID compute does not belong under "what we could not assess" —
     that section's own premise is "its absence from the list above does not
     mean zero", which is false for something sitting in the list above with a
     figure and an Uncertain tag beside it. Two true statements reading as a
     contradiction costs the section its credibility for the entries that
     genuinely were not assessed. */
  const computed = new Set(termLines().map(l => l.key));
  return candidates
    .filter(c => c.applies && !computed.has(c.key) && c.needs.some(k => !given(k)))
    .map(c => ({ key:c.key, missing:c.needs.filter(k => !given(k)) }));
}

function termLines(){
  return [
    { key:"tm_m_unpaid",  amt:termUnpaidOwed(), src:"tm_src_wage",   kind:"method" },
    { key:"tm_m_leave",   amt:termLeaveOwed(),  src:"tm_src_111",    kind:"law" },
    /* THE ARTICLE 81 UPLIFT IS A READING, AND THE FIGURE HAS TO SAY SO.
       On "I was asked to resign" the section card is scrupulous — sourced
       tm_src_81, "grounds verified; its effect on the award is Wodouh's
       reading", and it tells the reader the point deserves serious review.
       The money line beside it was sourced flat tm_src_84 and sat in the
       certain column. The hedge existed on the card and was stripped off the
       riyals: the full award only stands if the characterisation is accepted,
       and if it is not, Article 85's reduced tiers apply instead. That is the
       same kind of dependency as the Article 77 line below — a finding this
       app cannot make — so it is labelled the same way. docs/legal-sources.md
       line 98 is explicit that the award consequence is a reading, and
       certaintyFor() already refuses to call this line "confirmed". */
    { key:"tm_m_eos",     amt:termAwardOwed(),
      src: termHow() && termHow().art81 ? "tm_src_81"
         : termHow() && termHow().award === "resign" ? "tm_src_8485" : "tm_src_84",
      kind:"law", contested: !!(termHow() && termHow().art81) },
    { key:"tm_m_notice",  amt:termNoticeOwed(), src:"tm_src_76",     kind:"law" },
    /* `contested` is not a certainty level. Every other line is money the
       employer owes on the face of the facts; this one is owed only if a
       body outside this app rules the termination unlawful. Its own copy
       says exactly that — and addition then quietly undid the hedge, folding
       it into a single bolded figure a distressed reader screenshots. */
    { key:"tm_m_comp",    amt:termComp(),       src:"tm_src_77",     kind:"law", contested:true },
    { key:"tm_m_other",   amt:termOtherOwed(),  src:"tm_src_other",  kind:"method" }
  ].filter(l => l.amt > 0);
}
/* Everything, contested included. Kept because the checks, the gate and the
   stored record all mean "the largest figure in play" by it — but it is no
   longer what gets presented as one number. */
function termTotal(){ return termLines().reduce((n, l) => n + l.amt, 0); }
/* The two figures the reader is actually shown. Certain: owed on the face of
   the facts. Contested: owed only if the competent authority agrees. */
function termTotalCertain(){
  return termLines().filter(l => !l.contested).reduce((n, l) => n + l.amt, 0);
}
function termTotalContested(){
  return termLines().filter(l => l.contested).reduce((n, l) => n + l.amt, 0);
}

/* ------------------------------------------- reasoning and certainty
   A figure with no reasoning behind it is a number someone has to take on
   faith, and this product's entire claim is that you should not have to.
   Every conclusion therefore carries four things: the rule, a plain-language
   explanation, the official source, and how it applies to these facts.

   Certainty is stated in four levels rather than hidden:
     confirmed — every input it depends on was given, and a verified article
                 backs it
     likely    — a verified article backs it, but something it depends on was
                 inferred rather than told to us
     uncertain — an input it needs is missing. We say so instead of assuming
                 the reading most favourable to the reader
     na        — the rule does not reach this situation */

const CERT = ["confirmed", "likely", "uncertain", "na"];
const CERT_CLS = { confirmed:"ok", likely:"review", uncertain:"issue", na:"ok" };

/* How the rule reaches THESE facts, in the reader's own numbers. Generic
   sentences are what make a legal explanation feel like boilerplate; this is
   the sentence that makes it theirs. */
function appliesText(l){
  const p = termParts(), cur = t("eos_sar");
  const svc = svcText(p.y, p.m);
  switch (l.key){
    case "tm_m_eos": {
      const h = termHow();
      if (h && h.art81) return t("appl_eos_81").replace("{s}", svc);
      if (exc87Applies()) return t("appl_eos_87").replace("{s}", svc).replace("{e}", t("tm_exc_" + term.exc87));
      if (h && h.award === "resign")
        return t("appl_eos_resign").replace("{s}", svc)
          .replace("{f}", fmtNum(Math.round(resignFactor(termServiceYears()) * 100)));
      return t("appl_eos_full").replace("{s}", svc);
    }
    case "tm_m_notice":
      return t("appl_notice").replace("{d}", countNoun("cnt_d", term.noticeDue))
        .replace("{g}", countNoun("cnt_d", term.noticeGiven || 0))
        .replace("{n}", countNoun("cnt_d", Math.max(0, term.noticeDue - (term.noticeGiven || 0))));
    case "tm_m_leave":
      return t("appl_leave").replace("{d}", countNoun("cnt_d", term.leaveDays))
        .replace("{w}", money(termWage()));
    case "tm_m_unpaid":
      return t("appl_unpaid").replace("{m}", countNoun("eos_m", term.unpaidMonths))
        .replace("{w}", money(termWage()));
    case "tm_m_comp": {
      const m = termRemainingMonths();
      return termCtype() === "fixed"
        ? (m == null ? t("appl_comp_fixed_unknown")
                     : t("appl_comp_fixed").replace("{m}", countNoun("eos_m", Math.round(m))))
        : t("appl_comp_indef").replace("{s}", svc);
    }
    default:
      return t("appl_other").replace("{v}", money(termOtherOwed()) + " " + cur);
  }
}

/* What each money line needs before it can be called confirmed. */
const LINE_NEEDS = {
  tm_m_unpaid: ["wage", "unpaidMonths"],
  tm_m_leave:  ["wage", "leaveDays"],
  tm_m_eos:    ["wage", "start", "end"],
  tm_m_notice: ["wage", "noticeDue", "noticeGiven"],
  tm_m_comp:   ["wage", "start", "end"],
  tm_m_other:  ["otherAmt"]
};

function given(k){
  if (!term) return false;
  const v = term[k];
  if (k === "noticeGiven") return v !== null && v !== undefined;  /* zero is an answer */
  if (typeof v === "number") return v > 0;
  return !!v;
}

function certaintyFor(key){
  const needs = (LINE_NEEDS[key] || []).slice();
  /* On the resignation path the Article 87 exception is a needed input like any
     other, and it was the one input that never counted as missing.

     Why that mattered: Article 85's reduction applies by default and Article 87
     has to be affirmatively claimed. So an unanswered question silently
     produced the LESS favourable figure — and then labelled it "confirmed",
     the product's highest certainty. Same facts, one unanswered segmented
     control, 11,667 SAR apart, with the lower number carrying the more
     confident label.

     This is the third appearance of one pattern here: a rule that reduces an
     entitlement, shipped without its exceptions. The first two were Article 81
     and Article 87 itself. Treating exc87 as an input means the line now says
     "we could not assess this" and names what it needs, which is what every
     other missing input already gets. */
  if (key === "tm_m_eos" && termHow() && termHow().award === "resign") needs.push("exc87");
  const missing = needs.filter(k => !given(k));
  if (missing.length) return { level:"uncertain", missing };
  /* The compensation line depends on a finding nobody has made yet — whether
     the termination was without valid reason. It can never be "confirmed". */
  if (key === "tm_m_comp") return { level:"likely", missing:[] };
  /* An Article 81 award rests on our reading of "without prejudice to all his
     statutory rights", not on an official statement of the consequence. */
  if (key === "tm_m_eos" && termHow() && termHow().art81)
    return { level:"likely", missing:[] };
  if (key === "tm_m_eos" && exc87Applies()) return { level:"likely", missing:[] };
  return { level:"confirmed", missing:[] };
}

/* The official source behind each line, named so the reader can go and read
   it rather than trusting us. */
const LINE_RULE = {
  tm_m_unpaid: { rule:"tm_rule_unpaid", src:"tm_src_wage",  official:null,     kind:"method" },
  tm_m_leave:  { rule:"tm_rule_leave",  src:"tm_src_111",   official:"off_111", kind:"law" },
  tm_m_eos:    { rule:"tm_rule_eos",    src:"tm_src_84",    official:"off_84",  kind:"law" },
  tm_m_notice: { rule:"tm_rule_notice", src:"tm_src_76",    official:"off_76",  kind:"law" },
  tm_m_comp:   { rule:"tm_rule_comp",   src:"tm_src_77",    official:"off_77",  kind:"law" },
  tm_m_other:  { rule:"tm_rule_other",  src:"tm_src_other", official:null,      kind:"method" }
};

/* ============================================ second-pass review
   A critical reviewer, not a repeat of the first answer. It runs on every
   assessment before anything is displayed, it runs offline, and where it finds
   a real error it CORRECTS the assessment rather than annotating it.

   It exists because the first pass is credulous by construction: it takes the
   reader's answers at face value and applies rules to them. This pass asks the
   questions a sceptical reviewer would — are we double-counting, are we
   treating an estimate as an entitlement, do the dates make sense, are we
   claiming more certainty than the inputs support, is the strength rating
   doing more work than the evidence justifies. */
function reviewAssessment(){
  const issues = [];
  const flag = (sev, key, fix) => issues.push({ sev, key, fix: fix || null });
  if (!term) return issues;

  const a = term.start ? new Date(term.start) : null;
  const b = term.end ? new Date(term.end) : null;
  const now = Date.now();

  /* --- dates that cannot be true */
  if (a && isNaN(a)) flag("block", "rv_start_bad");
  if (b && isNaN(b)) flag("block", "rv_end_bad");
  if (a && b && !isNaN(a) && !isNaN(b) && b <= a) flag("block", "rv_reversed");
  if (b && !isNaN(b) && b.getTime() > now + 86400000) flag("warn", "rv_end_future");
  if (a && !isNaN(a) && a.getTime() > now) flag("block", "rv_start_future");
  if (a && !isNaN(a) && a.getFullYear() < 1970) flag("warn", "rv_start_ancient");
  if (termTermOdd()) flag("warn", "rv_term_far");

  /* --- contradictions between answers */
  if (term.gotEos === true && term.gotSettle === false) flag("warn", "rv_eos_no_settle");
  if (term.noticeGiven > 0 && termHow() && termHow().id === "probation")
    flag("warn", "rv_notice_in_probation");
  if (term.noticeDue > 0 && term.noticeGiven > term.noticeDue) flag("info", "rv_notice_over");
  if (termHow() && termHow().award === "resign" && term.exc87 === null)
    flag("info", "rv_exc_unasked");
  if (isNonSaudi() && term.ctype === "indef") flag("warn", "rv_ctype_conflict");
  if (term.unpaidMonths > 0 && term.gotSettle === true) flag("info", "rv_unpaid_vs_settle");

  /* --- double counting: the award may appear once, and only if unpaid */
  const lines = termLines();
  const keys = lines.map(l => l.key);
  if (new Set(keys).size !== keys.length) flag("block", "rv_duplicate");
  if (term.gotEos === true && keys.indexOf("tm_m_eos") !== -1) flag("block", "rv_eos_paid_but_claimed");

  /* --- an estimate must never be presented as an entitlement */
  if (keys.indexOf("tm_m_comp") !== -1 && !termHow().comp) flag("block", "rv_comp_wrong_path");

  /* --- scoping: Article 76 must not reach a fixed-term contract */
  if (keys.indexOf("tm_m_notice") !== -1 && (isNonSaudi() || termCtype() === "fixed"))
    flag("block", "rv_notice_scope");

  /* --- claiming more than the evidence carries */
  const st = termStrength();
  if (st.cls === "ok" && evidenceScore() < 6) flag("warn", "rv_strength_thin");
  if (lines.length && !term.docs.length) flag("warn", "rv_no_docs");

  /* --- certainty honesty */
  const shaky = lines.filter(l => certaintyFor(l.key).level === "uncertain");
  if (shaky.length) flag("info", "rv_uncertain_lines");

  return issues;
}

/* Blocking findings are corrected, not narrated. Anything the reviewer marks
   "block" is something the reader must never see, so the line is withdrawn and
   the withdrawal is shown in its place. */
function reviewBlocks(){
  return reviewAssessment().filter(i => i.sev === "block");
}

/* ---------------------------------------------------- the assessment
   Three states only, and none of them is a verdict. "Potential issue" is the
   strongest thing this screen is allowed to say. */
/* SOURCE DISCIPLINE APPLIES TO REMOVING A CLAIM, NOT ONLY TO GRANTING ONE.
   Every money line carried its article. The cards that take money OFF the
   table — "notice compensation belongs to indefinite contracts and yours is
   fixed-term", "termination during probation carries no award" — carried
   nothing at all. Those are the sentences a reader is most entitled to check,
   because they are the ones that end the conversation.

   Three kinds of source, and the distinction is the point:
     a verified article — the register stands behind it
     src_you            — this rests on what you told us, not on a rule
     src_method         — this is our reading, and the law is unsettled
   Probation is deliberately src_method: docs/legal-sources.md carries Article
   53 as an OPEN DISPUTE, so citing it here would assert what that file says
   we cannot. */
function termSections(){
  const h = termHow(), out = [];
  const S = (k, state, why, src) => out.push({ k, state, why, src });

  S("tm_s_contract",
    h && h.art80 ? "issue" : h && h.prob ? "ok" : "review",
    h && h.art80 ? "tm_s_contract_issue" : h && h.prob ? "tm_s_contract_prob" : "tm_s_contract_review",
    h && h.art80 ? "tm_src_80" : h && h.prob ? "src_method" : "src_you");

  if (h && h.notice && !isNonSaudi() && termCtype() !== "fixed"){
    const owed = termNoticeOwed();
    S("tm_s_notice", owed > 0 ? "issue" : term.noticeDue > 0 ? "ok" : "review",
      owed > 0 ? "tm_s_notice_issue" : term.noticeDue > 0 ? "tm_s_notice_ok" : "tm_s_notice_review",
      "tm_src_76");
  } else {
    S("tm_s_notice", "ok",
      isNonSaudi() || termCtype() === "fixed" ? "tm_s_notice_fixed" : "tm_s_notice_na",
      isNonSaudi() || termCtype() === "fixed" ? "tm_src_76" : "src_you");
  }

  S("tm_s_eos",
    term.gotEos === true ? "ok" : termAward() > 0 ? "issue" : "review",
    term.gotEos === true ? "tm_s_eos_paid"
      : h && h.art81 ? "tm_s_eos_81"
      : h && h.award === "resign" ? "tm_s_eos_resign"
      : h && h.award === "none" ? "tm_s_eos_prob" : "tm_s_eos_due",
    term.gotEos === true ? "src_you"
      : h && h.art81 ? "tm_src_81"
      : h && h.award === "resign" ? "tm_src_8485"
      : h && h.award === "none" ? "src_method" : "tm_src_84");

  S("tm_s_unpaid", termUnpaidOwed() > 0 ? "issue" : "ok",
    termUnpaidOwed() > 0 ? "tm_s_unpaid_issue" : "tm_s_unpaid_ok",
    termUnpaidOwed() > 0 ? "tm_src_wage" : "src_you");
  S("tm_s_leave", termLeaveOwed() > 0 ? "issue" : "review",
    termLeaveOwed() > 0 ? "tm_s_leave_issue" : "tm_s_leave_review",
    "tm_src_111");
  S("tm_s_other", termOtherOwed() > 0 ? "review" : "ok",
    termOtherOwed() > 0 ? "tm_s_other_review" : "tm_s_other_ok",
    "src_you");
  if (termComp() > 0) S("tm_s_comp", "review", "tm_s_comp_review", "tm_src_77");
  S("tm_s_settle", term.gotSettle === false ? "issue" : "ok",
    term.gotSettle === false ? "tm_s_settle_issue" : "tm_s_settle_ok",
    "src_you");
  return out;
}

/* Overall strength: what is on the table, how much paper backs it, and how
   much we were told. Never a prediction of the outcome. */
function termStrength(){
  const issues = termSections().filter(s => s.state === "issue").length;
  const ev = evidenceScore();
  if (issues >= 2 && ev >= 6) return { cls:"ok",     key:"tm_cs_strong",  why:"tm_cs_strong_w" };
  if (issues >= 1)            return { cls:"review", key:"tm_cs_possible",why:"tm_cs_possible_w" };
  return { cls:"issue", key:"tm_cs_limited", why:"tm_cs_limited_w" };
}

function termConfidence(){
  const known = ["start","end","wage"].every(k => term[k]) ? 1 : 0;
  const detail = [term.noticeDue, term.gotSettle, term.gotEos, term.reason]
    .filter(x => x !== null && x !== "" && x !== undefined).length;
  const ev = evidenceScore();
  if (!known) return "tm_conf_low";
  if (detail >= 3 && ev >= 6) return "tm_conf_high";
  if (detail >= 2 || ev >= 4) return "tm_conf_mod";
  return "tm_conf_low";
}

/* ============================================ the verified check
   Runs before anything is displayed. Each item is either satisfied or it is
   not, and an unsatisfied item becomes visible uncertainty rather than a
   silent pass. Two of them are hard gates: a result containing NaN, Infinity,
   undefined or null, or a blocking review finding, is not shown at all. */
const FINAL_CHECKS = [
  ["fc_ctype",    () => !!termCtype()],
  ["fc_dates",    () => !!term.start && !!term.end && termServiceYears() > 0],
  ["fc_endDate",  () => { const b = new Date(term.end);
                          return !isNaN(b) && b.getTime() <= Date.now() + 86400000; }],
  ["fc_reason",   () => !!term.how],
  ["fc_clauses",  () => term.noticeDue > 0 || termCtype() === "fixed" || !!term.termEnd],
  ["fc_rules",    () => termLines().every(l => LINE_RULE[l.key])],
  ["fc_exc",      () => termHow() && termHow().award === "resign" ? term.exc87 !== null : true],
  ["fc_calc",     () => { const t2 = termTotal();
                          return isFinite(t2) && t2 >= 0
                            && Math.abs(termLines().reduce((n,l)=>n+l.amt,0) - t2) < 0.01; }],
  ["fc_dupe",     () => { const k = termLines().map(l=>l.key); return new Set(k).size === k.length; }],
  ["fc_evidence", () => term.docs.length > 0],
  ["fc_missing",  () => termLines().every(l => certaintyFor(l.key).level !== "uncertain")],
  ["fc_supported",() => termLines().every(l => LINE_RULE[l.key] &&
                          (LINE_RULE[l.key].kind === "method" || !!LINE_RULE[l.key].official))],
  ["fc_noguarantee", () => true],   /* structural: no template states an outcome */
  ["fc_nofab",    () => termLines().every(l => l.amt > 0)],
  /* Scoped deliberately: the assessment's own lines cite 84, 85, 111, 76 and 77,
     every one of them verified. It no longer claims that about the whole product
     — Article 53 is DISPUTED in the register, and it is cited elsewhere. */
  ["fc_current",  () => true],      /* every article THIS ASSESSMENT cites is verified */
  ["fc_bilingual",() => true],      /* asserted by test, both languages from one source */
  ["fc_estimates",() => true]       /* every figure is rendered under the estimate heading */
];

function finalChecks(){
  return FINAL_CHECKS.map(([k, fn]) => {
    let pass = false;
    try { pass = !!fn(); } catch(e){ pass = false; }
    return { k, pass };
  });
}

/* Nothing computed from the answers we hold. Kept as its own predicate because
   three places have to agree about it: the gate, the route into the paywall,
   and the steps that would otherwise offer a purchase from the same screen. */
function assessmentEmpty(){
  return !term || termLines().length === 0;
}

/* The hard gate. Numbers that are not numbers must never reach a reader, and
   a blocking review finding means the assessment itself is wrong. */
function assessmentSafe(){
  if (!term) return { ok:false, why:"gate_noterm" };
  /* NOTE: an empty assessment is deliberately NOT gated here. "We found no
     amount, and that does not mean nothing is owed" is a legitimate, useful
     answer — a probation termination and a clean resignation both reach it —
     so it must still be shown. What must never happen is charging for it;
     that is `assessmentEmpty()`, guarding the commerce paths instead. */
  const t2 = termTotal();
  if (!isFinite(t2) || t2 < 0) return { ok:false, why:"gate_calc" };
  const bad = termLines().some(l =>
    !isFinite(l.amt) || l.amt == null || String(money(l.amt)).match(/undefined|null/i));
  if (bad) return { ok:false, why:"gate_calc" };
  const blocks = reviewBlocks();
  if (blocks.length) return { ok:false, why:"gate_review", blocks };
  return { ok:true };
}

async function openTermResult(){
  /* The assessment used to be its own 145 SAR product, gating a RESULT rather
     than a document — the only thing in the app that did. It is now part of
     the case file, so the entitlement asked for here is the case one. */
  /* …but only when there is something to sell. With nothing computed, the
     reader goes to the result screen and is told what is missing. */
  if (!has("case") && !assessmentEmpty()){ pwMode = "case"; pwOrigin = "term"; pwPlan = 0; pwUpgrade = null; if (renderPaywall()) show("paywall"); return; }

  /* The brief asks for the second pass to run before the result is presented,
     so it does — but never at the cost of the reader seeing their assessment.
     Timeout, failure and refusal all land in the same place: render offline. */
  if (aiReviewOn()){
    renderTermChecking();
    show("termres");
    await aiReview();
  } else {
    aiRvState = "idle"; aiRvResult = null;
  }
  renderTermResult();
  show("termres");
}

function renderTermResult(){
  if (!term) return;
  /* Nothing is displayed until it has been checked. A blocking finding or a
     figure that is not a figure stops the result rather than decorating it. */
  const safe = assessmentSafe();
  if (!safe.ok){
    document.getElementById("termVerdict").innerHTML =
      `<div class="tm-sec"><div class="hd"><b>${t("gate_title")}</b>
         <span class="tm-tag issue">${t("gate_tag")}</span></div>
       <p>${t(safe.why)}</p>
       ${(safe.blocks || []).map(x => `<p>• ${t(x.key)}</p>`).join("")}
       <p>${t("gate_fix")}</p></div>`;
    ["termSections","termMoney","termClaims","termHowFactors","termGaps","termReview"]
      .forEach(id => { document.getElementById(id).innerHTML = ""; });
    renderTermSteps();
    return;
  }
  const st = termStrength();
  document.getElementById("termVerdict").innerHTML =
    `<div class="tm-sec">
       <div class="hd"><b>${t(st.key)}</b><span class="tm-tag ${st.cls}">${t("tm_cs_label")}</span></div>
       <p>${t(st.why)}</p>
       <p>${t("tm_r_notfinal")}</p>
     </div>`;

  /* The source line renders on every card, granting or denying, in the same
     grammar the money lines use — `law` for a cited article, `method` for a
     reading or an answer of the reader's own. */
  document.getElementById("termSections").innerHTML = termSections().map(s =>
    `<div class="tm-sec">
       <div class="hd"><b>${t(s.k)}</b><span class="tm-tag ${s.state}">${t("tm_st_" + s.state)}</span></div>
       <p>${t(s.why)}</p>
       ${s.src ? `<p class="src-line ${/^tm_src_\d/.test(s.src) ? "law" : "method"}">${t(s.src)}</p>` : ""}
     </div>`).join("");

  /* WHAT COULD STILL RAISE THIS FIGURE, BESIDE THE FIGURE.
     A reader who skipped the Article 87 question saw 39,333 SAR where 59,000
     was possible — a 19,667 gap — and the only signal was an "Uncertain" pill
     on the card below, rendered in this product's warning colour. In its own
     visual grammar that reads "this claim may not hold, you might get LESS",
     which is the exact inverse of the truth: the figure is a floor.
     The sentence that says so correctly already existed, in both languages, in
     the second-pass review roughly 1,400px further down, under a heading that
     reads as housekeeping. Same sentence, moved to where the money is. */
  const cur = t("eos_sar"), lines = termLines();
  /* THE ANSWER, AT THE SIZE OF AN ANSWER.
     This screen answers one question — "how much am I owed?" — and set the
     figure in the same 15px as every other row on it. The score ring was the
     only thing in the product allowed to be big, and it lives on a different
     screen entirely. The reader who has just lost their income now sees the
     number they came for, and the contested figure stays deliberately smaller
     beside it, because it is a different kind of money. */
  const heroCertain = lines.length ? money(termTotalCertain()) : null;
  const row = ls => ls.map(l =>
    `<div class="r"><span>${t(l.key)}</span><b>${money(l.amt)} ${cur}</b></div>
     <p class="src-line ${l.kind}">${l.kind === "law" ? t(l.src) : t("src_method") + " — " + t(l.src)}</p>`).join("");
  document.getElementById("termMoney").innerHTML =
    (heroCertain ? `<div class="tm-hero">
       <div class="lbl">${t(termTotalContested() > 0 ? "tm_m_total_certain" : "tm_m_total")}</div>
       <div class="amt">${heroCertain}<small>${cur}</small></div>
       ${termTotalContested() > 0
         ? `<div class="alt">${t("tm_m_total_contested")}: <b>${money(termTotalContested())} ${cur}</b></div>`
         : ""}
     </div>` : "") +
    /* The card above splits the two figures; this list used to put all five
       rows back in one column in identical weight, so a phone reader scanning
       them adds the contested one back in — reintroducing, 400px later, the
       exact confusion the card exists to prevent. The rows are grouped the
       way the figures are. */
    `<div class="tm-money">
       ${lines.length ? row(lines.filter(l => !l.contested)) +
           (lines.some(l => l.contested)
             ? `<p class="tm-split-h">${t("tm_m_total_contested")}</p>` + row(lines.filter(l => l.contested))
             : "")
        : `<p class="cap">${t("tm_m_none")}</p>
           <p class="cap">${t("tm_m_none_sale")}</p>
           <button class="ghost wide" id="termFillIn">${t("tm_m_none_cta")}</button>`}
       ${/* The totals moved into the card above, at the size an answer
            deserves. Repeating them here would be the same figure twice,
            400px apart — the defect this file keeps rediscovering. What stays
            is the sentence that explains why there are two of them. */
         lines.length && termTotalContested() > 0 ? `<p class="cap">${t("tm_m_total_split")}</p>` : ""}
       ${lines.length ? termCouldRise().map(k =>
         `<p class="tm-rise"><span class="up" aria-hidden="true"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 13V3"/><path d="M4 7l4-4 4 4"/></svg></span><span>${t(k)}</span></p>`).join("") : ""}

       <p class="cap">${t("tm_m_caveat")}</p>
     </div>`;

  /* "Why did Wodouh say this?" — the rule, in plain language, its official
     source, and how it reaches these particular facts. A figure without this
     is a number the reader has to take on trust, which is the opposite of what
     this product is for. */
  document.getElementById("termClaims").innerHTML = lines.length
    ? lines.map(l => {
        const meta = LINE_RULE[l.key], c = certaintyFor(l.key);
        return `<div class="tm-claim">
           <div class="hd"><b>${t(l.key)}</b><span class="tm-tag ${CERT_CLS[c.level]}">${t("cert_" + c.level)}</span></div>
           <dl>
             <dt>${t("tm_c_rule")}</dt><dd>${t(meta.rule)}</dd>
             <dt>${t("tm_c_why")}</dt><dd>${t(l.key + "_why")}</dd>
             <dt>${t("tm_c_applies")}</dt><dd>${appliesText(l)}</dd>
             <dt>${t("tm_c_amt")}</dt><dd>${money(l.amt)} ${cur}</dd>
             <dt>${t("tm_c_ev")}</dt><dd>${t(l.key + "_ev")}</dd>
           </dl>
           ${c.missing.length
             ? `<p class="tm-gap">${t("tm_c_needmore")} ${c.missing.map(m => t("need_" + m)).join("، ")}</p>`
             : ""}
           <p class="src-line ${l.kind}">${l.kind === "law" ? t(l.src) : t("src_method") + " — " + t(l.src)}</p>
           ${meta.official ? `<p class="tm-off">${t("tm_c_source")}: ${t(meta.official)}</p>` : ""}
         </div>`;
      }).join("")
    : `<p class="tq-skip">${t("tm_c_none")}</p>`;

  /* What we could not assess, named rather than left as silence. */
  const gaps = termUnassessed();
  document.getElementById("termGaps").innerHTML = gaps.length
    ? `<div class="tm-sec">
         <div class="hd"><b>${t("gap_title")}</b><span class="tm-tag issue">${t("cert_uncertain")}</span></div>
         <p>${t("gap_sub")}</p>
         ${gaps.map(g => `<p>• <b>${t(g.key)}</b> — ${t("tm_c_needmore")} ${
           g.missing.map(m => t("need_" + m)).join("، ")}</p>`).join("")}
       </div>`
    : "";

  /* Everything the reviewer raised that was not blocking, shown rather than
     swallowed — including the checks the assessment could not satisfy. */
  const notes = reviewAssessment().filter(i => i.sev !== "block");
  const failed = finalChecks().filter(c => !c.pass);
  document.getElementById("termReview").innerHTML =
    `<div class="tm-sec">
       <div class="hd"><b>${t("rv_title")}</b>
         <span class="tm-tag ${notes.length || failed.length ? "review" : "ok"}">${
           t(notes.length || failed.length ? "rv_notes" : "rv_clean")}</span></div>
       <p>${t("rv_sub")}</p>
       ${notes.map(n => `<p>• ${t(n.key)}</p>`).join("")}
       ${failed.length ? `<p><b>${t("rv_unchecked")}</b><br>${
         failed.map(c => "• " + t(c.k)).join("<br>")}</p>` : ""}
       ${!notes.length && !failed.length ? `<p>${t("rv_clean_b")}</p>` : ""}
     </div>` + aiReviewHtml();

  /* Model output reaches the DOM through textContent only — it read free text
     the reader typed, and before that a contract someone else wrote. */
  const cs = aiReviewConcerns();
  document.querySelectorAll("#termReview .airv-detail").forEach((el, i) => {
    el.textContent = cs[i] ? cs[i].detail : "";
  });

  const ev = evidenceStrength();
  document.getElementById("termHowFactors").innerHTML = [
    ["tm_hw_answers", t("tm_hw_answers_b").replace("{h}", t(termHow() ? termHow().label : "th_other"))],
    ["tm_hw_service", t("tm_hw_service_b")
      .replace("{s}", svcText(termParts().y, termParts().m))],
    ["tm_hw_track", t(isNonSaudi() ? "tm_hw_track_nonsa" : "tm_hw_track_sa")],
    ["tm_hw_docs", t("tm_hw_docs_b")
      .replace("{n}", countNoun("cnt_doc", term.docs.length)).replace("{s}", t(ev.key))],
    ["tm_hw_rules", t("tm_hw_rules_b")]
  ].map(([k, body]) =>
    `<details><summary>${t(k)}</summary><p>${body}</p></details>`).join("");

  /* CSP is script-src 'self' with no 'unsafe-inline', so an inline onclick
     here would be silently inert — bound as a property, like every other
     control this file builds. */
  const fill = document.getElementById("termFillIn");
  if (fill) fill.onclick = () => { termStep = 0; renderTermQ(); show("termq"); };

  renderTermSteps();
}

  const full = has("case");

       <span class="n">${pointNum(i)}</span>

       ${cta ? `<button class="ghost wide" data-step="${i}">${cta[0]}</button>` : ""}
     </div>`).join("");
