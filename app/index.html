/* Contract-aware answers: summarize, risks, and applicable laws all read the
   analysis already in `current` rather than inventing new content. */
function answerSummary(){
  if (!current) return { text:t("as_nocontract") };
  const red = current.clauses.filter(c=>c.s==="red").length;
  const amb = current.clauses.filter(c=>c.s==="amber").length;
  const grn = current.clauses.filter(c=>c.s==="green").length;
  const head = lang==="ar"
    ? `${t(current.doc)} — التقييم ${fmtNum(current.score)} من ١٠٠.\n${(signedMode&&current.vs?current.vs:current.verdict).ar}\n\nراجعت ${fmtNum(current.clauses.length)} بنود: ${fmtNum(red)} تحتاج وقفة، ${fmtNum(amb)} تستاهل التفاوض، ${fmtNum(grn)} مطمئنة.`
    : `${t(current.doc)} — scored ${current.score} out of 100.\n${(signedMode&&current.vs?current.vs:current.verdict).en}\n\nI read ${current.clauses.length} clauses: ${red} need a pause, ${amb} are worth negotiating, ${grn} are fine.`;
  const lines = current.clauses.map(c=>`• ${c.t[lang]} — ${c.p[lang]}`).join("\n");
  return { text: head + "\n\n" + lines };
}

function answerRisks(){
  if (!current) return { text:t("as_nocontract") };
  const risky = current.clauses.filter(c=>c.s!=="green");
  if (!risky.length)
    return { text: lang==="ar"
      ? "ما لقيت مخاطر تستدعي القلق في هذا العقد — كل البنود ضمن المعتاد."
      : "I found no risks worth worrying about in this one — every clause sits within the norm." };
  const body = risky.map((c,i)=>{
    const n = pointNum(i);
    const tag = c.s==="red" ? t("act_red") : t("act_amber");
    return `${n}. ${c.t[lang]} (${tag})\n   ${c.p[lang]}\n   ${c.a ? c.a[lang] : ""}`;
  }).join("\n\n");
  return { text: body, draft: true };
}

function answerLaws(){
  if (!current) return { text:t("as_nocontract") };
  const map = { doc_emp:["فترة التجربة","الإشعار","عدم المنافسة"], doc_clean:["فترة التجربة","الإجازة","عمل إضافي"],
                doc_rent:["إيجار"], doc_free:["عمل حر","شرط جزائي"], doc_pasted:["الإشعار"] };
  const keys = map[current.doc] || [];
  const hits = KB.filter(e=>forTrack(e) && keys.some(k=>e.k.test(k)));
  const text = lang==="ar"
    ? `بالنسبة لـ${t(current.doc)}، الأنظمة التي تهمك:` : `For your ${t(current.doc).toLowerCase()}, the provisions that matter:`;
  return { text, refs: hits.map(h=>h.r).filter(Boolean), extra: hits.map(h=>"• "+h.a[lang]).join("\n\n") };
}

function answer(q){
  const low = q.toLowerCase();
  if (/(لخّص|لخص|ملخص|summar)/i.test(low)) return answerSummary();
  if (/(مخاطر|خطر|risk)/i.test(low))       return answerRisks();
  if (/(أنظمة|نظام ينطبق|which law|relevant law|applicable)/i.test(low)) return answerLaws();
  if (/(اكتب|صياغة|مستند|خطاب|draft|write|letter)/i.test(low))
    return { text: lang==="ar"
      ? "أقدر أصيغ لك خطاب تفاوض مبني على بنود عقدك، أو خطاب استقالة، أو إشعار عدم تجديد. الأشهر هو خطاب التفاوض:"
      : "I can draft a negotiation letter built from your contract's clauses, a resignation letter, or a non-renewal notice. The negotiation letter is the common one:", draft:true };
  const hit = KB.find(e=>forTrack(e) && e.k.test(q));
  if (hit) return { text: hit.a[lang], refs: hit.r ? [hit.r] : [] };
  return { text: lang==="ar"
    ? "ما فهمت السؤال تمامًا. جرّب تسأل عن بند معيّن — مثل «فترة التجربة» أو «مدة الإشعار» أو «مكافأة نهاية الخدمة» — أو اطلب مني ألخّص عقدك."
    : "I didn't quite catch that. Try asking about a specific topic — probation, notice period, end-of-service pay — or ask me to summarize your contract." };
}

/* ----------------------------------------------------- file intake ----
   Real PDF text extraction, no library and no server: locate the content
   streams, inflate them with DecompressionStream, then read the text-showing
   operators. Many Arabic PDFs embed subset fonts whose bytes are glyph
   indices rather than Unicode — when that happens the output fails the
   legibility check below and we say we could not read it, which is the
   honest outcome rather than analysing gibberish. */
const MAX_FILE = 8 * 1024 * 1024;
/* Longest contract text we will hold. Comfortably above a long employment
   contract, and low enough that the rule pass stays instant. */
const MAX_TEXT = 500 * 1000;

async function inflate(bytes){
  /* PDF streams carry EOL padding after the compressed data, so the stream
     decodes fine and then throws "junk after end". Read incrementally and
     keep whatever was decoded before the complaint. */
  for (const fmt of ["deflate", "deflate-raw"]){
    try {
      const ds = new DecompressionStream(fmt);
      const w = ds.writable.getWriter();
      w.write(bytes).catch(()=>{});
      w.close().catch(()=>{});
      const reader = ds.readable.getReader();
      const chunks = []; let total = 0;
      try {
        for(;;){
          const { value, done } = await reader.read();
          if (done) break;
          chunks.push(value); total += value.length;
        }
      } catch(e){ /* keep the decoded prefix */ }
      if (total){
        const out = new Uint8Array(total); let off = 0;
        for (const c of chunks){ out.set(c, off); off += c.length; }
        return out;
      }
    } catch(e){ /* try the next format */ }
  }
  return null;
}

function latin(bytes){ let o=""; for (let i=0;i<bytes.length;i++) o+=String.fromCharCode(bytes[i]); return o; }

/* Pull the strings out of BT…ET blocks: (str) Tj, [(a) -2 (b)] TJ, ' and " */
function textFromContent(src){
  let out = "";
  const re = /\((?:\\.|[^\\()])*\)\s*(?:Tj|TJ|'|")|\[(?:[^\[\]]|\\.)*\]\s*TJ/g;
  let m;
  while ((m = re.exec(src))){
    const chunk = m[0];
    const strs = chunk.match(/\((?:\\.|[^\\()])*\)/g) || [];
    for (const raw of strs){
      out += raw.slice(1,-1)
        .replace(/\\([nrtbf])/g, (x,c)=>({n:"\n",r:"",t:"\t",b:"",f:""}[c]))
        .replace(/\\([0-7]{1,3})/g, (x,o)=>String.fromCharCode(parseInt(o,8)))
        .replace(/\\(.)/g, "$1");
    }
    out += /T\*|'|"/.test(chunk) ? "\n" : " ";
  }
  return out;
}

async function extractPdf(buf){
  const bytes = new Uint8Array(buf), src = latin(bytes);
  let text = "";
  const re = /stream\r?\n?/g;
  let m;
  while ((m = re.exec(src))){
    const start = m.index + m[0].length;
    const end = src.indexOf("endstream", start);
    if (end < 0) continue;
    const head = src.slice(Math.max(0, m.index - 400), m.index);
    let stop = end;
    while (stop > start && (bytes[stop-1] === 10 || bytes[stop-1] === 13)) stop--;
    let raw = bytes.subarray(start, stop);
    let data = /FlateDecode/.test(head) ? await inflate(raw) : raw;
    if (!data) continue;
    const content = latin(data);
    if (/BT|Tj|TJ/.test(content)) text += textFromContent(content) + "\n";
  }
  return text.replace(/[ \t]+/g, " ").replace(/\n{3,}/g, "\n\n").trim();
}

/* Enough real letters to be worth analysing? Guards against glyph-index soup. */
function legible(txt){
  if (!txt || txt.length < 40) return false;
  const good = (txt.match(/[A-Za-z؀-ۿ]/g) || []).length;
  return good / txt.length > 0.45;
}

async function handleFile(file){
  const notice = document.getElementById("offlineNotice");
  const fail = msg => { notice.textContent = msg; notice.hidden = false; };
  notice.hidden = true;
  if (!file) return;
  if (file.size > MAX_FILE) return fail(t("err_big"));
  const isPdf = /pdf$/i.test(file.type) || /\.pdf$/i.test(file.name);
  const isTxt = /^text\//i.test(file.type) || /\.(txt|md)$/i.test(file.name);
  if (!isPdf && !isTxt) return fail(t("err_type"));

  document.getElementById("upMain").classList.add("busy");
  let text = "";
  try {
    text = isPdf ? await extractPdf(await file.arrayBuffer()) : await file.text();
    /* An 8 MB PDF can decode to far more text than any contract contains.
       Cap it so the regex pass and the textarea stay bounded. */
    if (text.length > MAX_TEXT) text = text.slice(0, MAX_TEXT);
  } catch(e){ text = ""; }
  document.getElementById("upMain").classList.remove("busy");

  if (!legible(text)){ current = null; runLoading(()=>{ buzz(12); show("noread"); }); return; }
  document.getElementById("pasteBox").value = text;
  pasteChanged();
  analyze("pasted");
}

let intakeBound = false, gesturesBound = false;
function initIntake(){
  if (intakeBound) return; intakeBound = true;
  const input = document.getElementById("fileInput");
  input.onchange = e => { handleFile(e.target.files[0]); input.value = ""; };
  const app = document.querySelector(".app");
  ["dragenter","dragover"].forEach(ev=>app.addEventListener(ev, e=>{
    e.preventDefault(); document.getElementById("intake").classList.add("over");
  }));
  ["dragleave","drop"].forEach(ev=>app.addEventListener(ev, e=>{
    e.preventDefault(); document.getElementById("intake").classList.remove("over");
  }));
  app.addEventListener("drop", e=>{
    const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) handleFile(f);
  });
}

/* ------------------------------------------------------ motion layer ----
   Everything below is additive: it changes how existing state arrives on
   screen, never what that state is. Each piece is guarded so the app behaves
   identically with motion disabled. */
const REDUCED = window.matchMedia("(prefers-reduced-motion: reduce)");
const COARSE  = window.matchMedia("(pointer: coarse)");

/* Numbers arrive by counting, the way the score already does. */
function rollTo(el, value, fmt){
  if (!el) return;
  const done = () => { el.textContent = fmt(value); };
  if (REDUCED.matches || !value) return done();
  const t0 = performance.now(), dur = 700;
  (function tick(now){
    const k = Math.min(1, (now - t0) / dur);
    el.textContent = fmt(Math.round(value * (1 - Math.pow(1 - k, 3))));
    if (k < 1) requestAnimationFrame(tick); else done();
  })(t0);
}

/* Reveal-on-scroll. Elements start visible in markup; JS opts them in, so a
   failure here can never hide content. */
let revealObserver = null;
function armReveals(root){
  if (REDUCED.matches || !("IntersectionObserver" in window)) return;
  if (!revealObserver){
    revealObserver = new IntersectionObserver(es=>es.forEach(e=>{
      if (e.isIntersecting){ e.target.classList.add("in"); revealObserver.unobserve(e.target); }
    }), { threshold:.12, rootMargin:"0px 0px -6% 0px" });
  }
  const sel = ".clause, .pcard, .brow, .src, .tl-item, .acc-sec, .doc";
  (root || document).querySelectorAll(sel).forEach(el=>{
    if (el.dataset.rv) return;
    el.dataset.rv = "1";
    const box = el.getBoundingClientRect();
    if (box.top < window.innerHeight * 0.92){ el.classList.add("rv","in"); return; }
    el.classList.add("rv");
    revealObserver.observe(el);
  });
}

/* The tab pill slides between siblings rather than blinking. */
function moveTabIndicator(){
  const bar = document.getElementById("tabbar");
  if (!bar || bar.hidden) return;
  let ind = bar.querySelector(".tab-ind");
  const on = bar.querySelector(".tab.on");
  if (!on) return;
  if (!ind){ ind = document.createElement("span"); ind.className = "tab-ind"; bar.appendChild(ind); }
  ind.style.width = on.offsetWidth + "px";
  ind.style.transform = "translateX(" + on.offsetLeft + "px)";
}

/* Header condenses, score card drifts. Decorative, capped, opt-out honoured. */
function onScroll(){
  const bar = document.querySelector(".bar");
  if (bar) bar.classList.toggle("tight", window.scrollY > 40);
  if (REDUCED.matches) return;
  const card = document.querySelector("#screen-result.active .score-card");
  if (card){
    const d = Math.max(-6, Math.min(6, window.scrollY * -0.08));
    const mark = card.querySelector(".share-mark"), ring = card.querySelector(".ring");
    if (mark) mark.style.transform = "translateY(" + d + "px)";
    if (ring) ring.style.transform = "translateY(" + (d * 0.6) + "px)";
  }

/* Gesture navigation. Commits through the screens' own back actions, so it
   introduces no navigation path that did not already exist. */
const BACK_OF = {
  result:()=>show("home",1), clauses:()=>show("result",1), letter:()=>show("result",1),
  paywall:()=>show(pwMode==="case"?"case":pwMode==="term"?"termev":"result",1),
  eos:()=>goTab("rights"),

  case:()=>show("eos",1), casedoc:()=>show("case",1), plans:()=>show(planBack,1),
  biz:()=>show("plans",1), assist:()=>assistBack(), noread:()=>retryPaste(),
  photo:()=>show("home",1), timeline:()=>tlBack()
};
function initGestures(){
  if (gesturesBound) return; gesturesBound = true;
  if (!COARSE.matches) return;
  const app = document.querySelector(".app");
  let sx=0, sy=0, dragging=false, cur=null, rtl=false, id=null;
  const blocked = t => t.closest("textarea,input,.chat,.caps,.tabbar,.viewfinder");

  app.addEventListener("pointerdown", e=>{
    if (e.pointerType === "mouse" || blocked(e.target)) return;
    cur = document.querySelector(".screen.active");
    if (!cur) return;
    sx = e.clientX; sy = e.clientY; dragging = false; id = e.pointerId;
    rtl = document.documentElement.dir === "rtl";
  }, { passive:true });

  app.addEventListener("pointermove", e=>{
    if (!cur || e.pointerId !== id) return;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if (!dragging){
      if (Math.abs(dx) < 12 || Math.abs(dx) < Math.abs(dy) * 1.4) return;
      dragging = true; cur.classList.add("dragging");
    }
    const name = cur.id.replace("screen-","");
    const inward = rtl ? dx < 0 : dx > 0;           /* toward the back edge */
    if (BACK_OF[name] && inward && !REDUCED.matches)
      cur.style.transform = "translateX(" + (dx * 0.55) + "px)";
  }, { passive:true });

  const release = e=>{
    if (!cur || (id !== null && e.pointerId !== id)) return;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    const scr = cur, name = scr.id.replace("screen-","");
    scr.classList.remove("dragging");
    scr.classList.add("settling");
    scr.style.transform = "";
    setTimeout(()=>scr.classList.remove("settling"), 260);
    const horizontal = Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.4;
    if (horizontal && dragging){
      const inward = rtl ? dx < 0 : dx > 0;
      if (BACK_OF[name] && inward){ buzz(8); BACK_OF[name](); }
      else if (ROOTS.includes(name)){
        const i = ROOTS.indexOf(name);
        const next = (rtl ? dx > 0 : dx < 0) ? i + 1 : i - 1;
        if (next >= 0 && next < ROOTS.length){ buzz(8); goTab(ROOTS[next]); }
      }
    }
    cur = null; dragging = false; id = null;
  };
  app.addEventListener("pointerup", release, { passive:true });
  app.addEventListener("pointercancel", release, { passive:true });
}

/* ------------------------------------------------- saved contracts ----
   A tool you use once needs no memory; a companion does. */
const STORE = "wodouh.v1";
let myContracts = [];

function saveState(){
  try {
    localStorage.setItem(STORE, JSON.stringify({
      nat,
      timelyOff,
      usedCodes,
      term,
      contracts: myContracts.slice(0,8),
      tracked: TRACKED.map(x=>({ doc:x.doc, events:x.events.map(e=>({ ...e })) }))
    }));
  } catch(e){}
}
/* Anything read back from localStorage is untrusted: it survives across
   versions and can be edited by hand. Validate rather than assume shape, and
   replace TRACKED in place instead of appending so a second call is a no-op. */
function loadState(){
  try {
    const raw = localStorage.getItem(STORE);
    if (!raw) return;
    const d = JSON.parse(raw);

    /* Anything that isn't one of the two known tracks — including the absent
       field in payloads written by earlier versions — means "not chosen yet",
       so the reader is asked rather than assumed. */
    nat = (d.nat === "sa" || d.nat === "nonsa") ? d.nat : null;
    timelyOff = d.timelyOff === true;
    usedCodes = Array.isArray(d.usedCodes)
      ? d.usedCodes.filter(x => typeof x === "string").slice(0, 200) : [];

    /* A stored answer set is untrusted like everything else here: it outlives
       versions and can be hand-edited. Rebuild it field by field onto a blank
       shape so a payload missing half its keys cannot reach the money. */
    term = null;
    if (d.term && typeof d.term === "object"){
      const b = blankTerm(), src = d.term;
      const str = k => typeof src[k] === "string" ? src[k].slice(0, 200) : b[k];
      const num = (k, max) => (typeof src[k] === "number" && isFinite(src[k]) && src[k] > 0)
        ? Math.min(src[k], max) : b[k];
      const tri = k => src[k] === true || src[k] === false ? src[k] : null;
      b.how = TERM_HOW.some(x => x.id === src.how) ? src.how : null;
      b.start = str("start"); b.end = str("end"); b.termEnd = str("termEnd");
      b.reason = str("reason");
      b.ctype = (src.ctype === "fixed" || src.ctype === "indef") ? src.ctype : null;
      b.wage = num("wage", 1e7); b.basic = num("basic", 1e7);
      b.noticeDue = num("noticeDue", 365); b.noticeGiven = num("noticeGiven", 365);
      b.unpaidMonths = num("unpaidMonths", 60); b.leaveDays = num("leaveDays", 365);
      b.otherAmt = num("otherAmt", 1e7);
      b.probation = tri("probation"); b.gotSettle = tri("gotSettle"); b.gotEos = tri("gotEos");
      b.docs = Array.isArray(src.docs)
        ? src.docs.filter(x => TERM_DOCS.indexOf(x) !== -1).slice(0, TERM_DOCS.length) : [];
      if (b.how) term = b;
    }

    myContracts = (Array.isArray(d.contracts) ? d.contracts : [])
      .filter(c => c && typeof c === "object"
                && Object.prototype.hasOwnProperty.call(T, c.doc)
                && Number.isFinite(+c.score) && Number.isFinite(+c.at))
      .map(c => ({ doc:c.doc, score:Math.max(0, Math.min(100, +c.score)),
                   at:+c.at, signed:!!c.signed }))
      .slice(0, 8);

    const tracked = (Array.isArray(d.tracked) ? d.tracked : [])
      .filter(x => x && typeof x === "object"
                && Object.prototype.hasOwnProperty.call(T, x.doc)
                && Array.isArray(x.events))
      .map(x => ({ doc:x.doc, events:x.events.filter(e => e && typeof e === "object")
                                             .map(e => ({ ...e })) }));
    TRACKED.length = 0;
    tracked.forEach(x => TRACKED.push(x));
  } catch(e){
    /* Corrupt or foreign payload: start clean rather than render partial state. */
    myContracts = []; TRACKED.length = 0; nat = null; timelyOff = false; usedCodes = [];
  }
}

/* ------------------------------------------------- calendar export
   Apple Calendar, Outlook and the stock Android calendar all import RFC 5545
   .ics files, so one generated file covers them without asking for calendar
   permission, an entitlement, or a backend. Google Calendar has no bulk
   import URL: a single event opens its prefilled template, several fall back
   to the same .ics, which Google imports from settings.

   Because we never request calendar access there is no permission to be
   denied. What can fail is the download itself, so both paths report back
   and the UI says so rather than appearing to do nothing. */

/* RFC 5545 §3.3.11 */
function icsEsc(s){
  return String(s == null ? "" : s)
    .replace(/\\/g, "\\\\").replace(/;/g, "\\;")
    .replace(/,/g, "\\,").replace(/\r?\n/g, "\\n");
}
function icsPad(n){ return n < 10 ? "0" + n : String(n); }
function icsUTC(d){
  return d.getUTCFullYear() + icsPad(d.getUTCMonth()+1) + icsPad(d.getUTCDate()) +
    "T" + icsPad(d.getUTCHours()) + icsPad(d.getUTCMinutes()) + icsPad(d.getUTCSeconds()) + "Z";
}
function icsDay(d){ return d.getFullYear() + icsPad(d.getMonth()+1) + icsPad(d.getDate()); }

/* §3.1 limits a line to 75 octets. Arabic is multi-byte, so fold on encoded
   length and never split a surrogate pair. */
function icsFold(line){
  let out = "", cur = "", len = 0;
  for (let i = 0; i < line.length; i++){
    let ch = line[i];
    if (ch >= "\uD800" && ch <= "\uDBFF" && i + 1 < line.length) ch += line[++i];
    const w = unescape(encodeURIComponent(ch)).length;
    if (len + w > 74){ out += cur + "\r\n "; cur = ""; len = 1; }
    cur += ch; len += w;
  }
  return out + cur;
}

/* The reminders, as calendar events. All-day, because these are dates the
   user acts on, not appointments. */
function reminderEvents(){
  return TRACKED.flatMap(c => c.events.map(e => ({
    start: e.when,
    title: (e.t && e.t[lang]) || t(c.doc),
    description: ((e.n && e.n[lang]) || "") + "\n\n" + t(c.doc) + " — Wodouh"
  }))).filter(e => Number.isFinite(+e.start)).sort((a,b) => a.start - b.start);
}

function buildICS(events){
  let lines = ["BEGIN:VCALENDAR","VERSION:2.0",
    "PRODID:-//Wodouh//Contract reminders//EN","CALSCALE:GREGORIAN","METHOD:PUBLISH",
    "X-WR-CALNAME:" + icsEsc(t("tl_title"))];
  let n = 0;
  events.forEach((ev, i) => {
    const start = new Date(ev.start);
    if (isNaN(start.getTime())) return;
    lines = lines.concat([
      "BEGIN:VEVENT",
      "UID:wodouh-" + i + "-" + Math.random().toString(36).slice(2,10) + "@wodouh.app",
      "DTSTAMP:" + icsUTC(new Date()),
      "DTSTART;VALUE=DATE:" + icsDay(start),
      "DTEND;VALUE=DATE:" + icsDay(new Date(start.getTime() + 86400000)),
      "SUMMARY:" + icsEsc(ev.title),
      "DESCRIPTION:" + icsEsc(ev.description),
      /* Matches the two-weeks-and-one-day promise in tl_note. */
      "BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:" + icsEsc(ev.title),
      "TRIGGER:-P14D","END:VALARM",
      "BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:" + icsEsc(ev.title),
      "TRIGGER:-P1D","END:VALARM",
      "END:VEVENT"
    ]);
    n++;
  });
  lines.push("END:VCALENDAR");
  return n ? lines.map(icsFold).join("\r\n") + "\r\n" : null;
}

function downloadICS(events){
  const ics = buildICS(events);
  if (!ics) return false;
  try {
    const url = URL.createObjectURL(new Blob([ics], { type:"text/calendar;charset=utf-8" }));
    const a = document.createElement("a");
    a.href = url; a.download = "wodouh-reminders.ics"; a.rel = "noopener";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 30000);
    return true;
  } catch(e){ return false; }
}

function googleCalUrl(ev){
  const start = new Date(ev.start);
  if (isNaN(start.getTime())) return null;
  return "https://calendar.google.com/calendar/render?action=TEMPLATE" +
    "&text=" + encodeURIComponent(ev.title) +
    "&dates=" + icsDay(start) + "/" + icsDay(new Date(start.getTime() + 86400000)) +
    "&details=" + encodeURIComponent(ev.description);
}

function exportReminders(target){
  const events = reminderEvents();
  if (!events.length) return;
  buzz(8);
  if (target === "google" && events.length === 1){
    const url = googleCalUrl(events[0]);
    if (url && window.open(url, "_blank", "noopener,noreferrer")) return;
  }
  toast(t(downloadICS(events) ? "cal_done" : "cal_fail"));
}

}

/* -------------------------------------------------- letter builder ----
   Wodouh's signature: the negotiation letter is assembled while you read,
   not generated after the fact. Each negotiable clause can be added as you
   go, and the letter contains exactly what you chose — in contract order. */
let letterSet = new Set();
/* Already-signed mode keeps the same analysis but changes the question from
   "should I sign this?" to "what can I still do about it?" */
let signedMode = false;

/* Which body of rules applies to this reader. "sa" | "nonsa" | null.
   Deliberately has no default: under Article 37 a non-Saudi's contract is
   always fixed-term, which changes the notice rules and the Article 77
   compensation formula outright. Guessing would mean quietly showing someone
   the wrong law, which is the defect this exists to fix. */
let nat = null;
function isNonSaudi(){ return nat === "nonsa"; }

function adviceFor(c){ return signedMode && c.r ? c.r : c.a; }

/* Show a riyal figure only when the arithmetic is real and we actually know a
   wage. An invented number here would be worse than no number at all. */
function costLine(c){
  if (!c.cost || !eosData || !eosData.wage) return "";
  const v = money(eosData.wage * c.cost.months) + " " + t("eos_sar");
  return `<div class="cost-line">${t("cost_note").replace("{m}", t("cost_months2")).replace("{v}", v)}</div>`;
}
function actionLabel(sv){
  if (sv === "green") return t("act_green");
  if (signedMode) return t(sv === "red" ? "act_red_signed" : "act_amber_signed");
  return t(sv === "red" ? "act_red" : "act_amber");
}

function selected(){

/* ------------------------------------- negotiation letter + paywall */
let pwPlan = 0, pwPaid = false;
/* Consumers sign contracts episodically, so a monthly plan fights the usage
   pattern. The middle option is sold at the life event instead, and sits
   between an anchor above and a bare minimum below. */
const PLANS = [
  { name:"plan_letter", desc:"plan_letter_d", price:{ar:"٦٥ ر.س",en:"65 SAR"}, pop:false },
  { name:"plan_pack",   desc:"plan_pack_d",   price:{ar:"١٣٠ ر.س",en:"130 SAR"}, pop:true, tag:"plan_best" },
  { name:"plan_lawyer", desc:"plan_lawyer_d", price:{ar:"١٩٥ ر.س",en:"195 SAR"}, pop:false }
];
/* A claim has money on the table, so the file prices well above the letter. */
const PLANS_CASE = [
  { name:"plan_case", desc:"plan_case_d", price:{ar:"٣٢٥ ر.س",en:"325 SAR"}, pop:false },
  { name:"plan_case_lawyer", desc:"plan_case_lawyer_d", price:{ar:"٥٢٠ ر.س",en:"520 SAR"}, pop:true }
];
/* The termination assessment is priced on its own: it is the only paid thing
   in the app that gates a result rather than a document. */
const PLANS_TERM = [
  { name:"plan_term", desc:"plan_term_d", price:{ar:"١٤٥ ر.س",en:"145 SAR"}, pop:false },
  { name:"plan_term_full", desc:"plan_term_full_d", price:{ar:"٢٩٥ ر.س",en:"295 SAR"}, pop:true }
];
function activePlans(){
  return pwMode === "case" ? PLANS_CASE : pwMode === "term" ? PLANS_TERM : PLANS;
}
const LETTER_TO = {
  doc_emp:{ar:"إلى: قسم الموارد البشرية",en:"To: The HR department"},
  doc_rent:{ar:"إلى: المؤجّر الكريم",en:"To: The landlord"},
  doc_free:{ar:"إلى: العميل الكريم",en:"To: The client"},
  doc_pasted:{ar:"إلى: الطرف الآخر",en:"To: The other party"}
};
/* Point numbering for the letter and the risk summary. This was a nine-slot
   table of Arabic-Indic numerals, and it was two rules away from printing
   "undefined." where a point number belonged: the rule set grew from 10 to 17
   this session, and the ceiling on numbered points grew with it — 7 today on
   the Saudi track. Converting is total, so it cannot run out. */
function pointNum(i){
  const n = String(i + 1);
  return lang === "ar" ? n.replace(/[0-9]/g, d => "٠١٢٣٤٥٦٧٨٩"[+d]) : n;
}

function negotiables(){ return current ? current.clauses.filter(c=>c.a) : []; }

function buildLetter(){
  const items = selected();
  const list = items.map((c,i)=>{
    const n = pointNum(i);
    return `${n}. ${c.t[lang]}: ${adviceFor(c)[lang]}`;
  }).join("\n");
  if (lang==="ar"){
    const open = signedMode
      ? `بالإشارة إلى ${t(current.doc)} الموقّع بيننا، أود طرح النقاط التالية:`
      : `اطلعت على ${t(current.doc)} المعروض، وأشكركم على الثقة. قبل التوقيع، أتمنى مناقشة النقاط التالية:`;
    return `السلام عليكم ورحمة الله،\n\n${open}\n\n${list}\n\nواثق أننا نصل لصيغة عادلة للطرفين، وحاضر لأي نقاش.\n\nمع خالص التحية،\n[اسمك]`;
  }
  const openEn = signedMode
    ? `Regarding the ${t(current.doc).toLowerCase()} signed between us, I would like to raise the following points:`
    : `Thank you for sending the ${t(current.doc).toLowerCase()}. Before signing, I would like to discuss the following points:`;
  return `Dear Sir or Madam,\n\n${openEn}\n\n${list}\n\nI'm confident we can reach wording that is fair to both sides, and I'm happy to talk any of this through.\n\nBest regards,\n[Your name]`;
}

function openPaywall(){
  pwMode = "letter";
  if (!pwPaid) pwPlan = 1;   /* the pack is the intended choice */
  if (pwPaid){ renderLetter(); show("letter"); return; }
  renderPaywall(); show("paywall");
}

function renderPaywall(){
  /* Only the revealed portion is rendered; the withheld points never enter
     the DOM before payment. */
  const isCase = pwMode === "case", isTerm = pwMode === "term";
  /* The two modes have different plan lists — three for the letter, two for the
     case file — so an index carried across a mode switch can point past the end
     and leave the pay button reading "Pay undefined". Every entry point happens
     to reset it today; clamping here, above the guard, makes that a property of
     the paywall rather than of the callers remembering. */
  pwPlan = Math.max(0, Math.min(pwPlan, activePlans().length - 1));
  if (isTerm ? !term : isCase ? !eosData : (!current || !selected().length)) return;
  const titleKey = isTerm ? "pw_term_title" : isCase ? "pw_case_title" : "pw_title";
  const freeKey  = isTerm ? "pw_term_free"  : isCase ? "pw_case_free"  : "pw_free_note";
  document.querySelector('#screen-paywall [data-t="pw_title"]').textContent = t(titleKey);
  document.querySelector('#screen-paywall [data-t="pw_free_note"]').textContent = t(freeKey);
  /* Show one complete point rather than blurring everything: concealment reads
     as evasion, while real withheld value reads as value. It also means no
     unpaid text is sitting in the DOM behind a CSS filter. */
  const full = isTerm ? buildTermPreview() : isCase ? buildCaseDoc() : buildLetter();
  const lines = full.split("\n");
  document.getElementById("pwPreviewHead").textContent =
    isTerm ? t("tm_r_title") : isCase ? t("cf_title") : LETTER_TO[current.doc][lang];
  let shown, rest;
  if (isTerm){
    /* The facts they gave us are theirs to see. Not one riyal figure and not
       one assessment reaches the DOM before payment. */
    shown = lines.join("\n");
    rest = t("pw_term_more");
  } else if (isCase){
    shown = lines.slice(0, 5).join("\n");
    rest = t("pw_more_case");
  } else {
    const firstPoint = lines.findIndex(l=>/^\s*[١٢٣٤٥1-5]\./.test(l));
    const cut = firstPoint >= 0 ? firstPoint + 1 : 4;
    shown = lines.slice(0, cut).join("\n");
    /* With a single point chosen there is no "+0 more" to promise; the value
       withheld is the finished document itself. */
    const remaining = Math.max(0, selected().length - 1);
    rest = remaining === 0 ? t("pw_more0")
         : remaining === 1 ? t("pw_more1")
         : t("pw_more").replace("{n}", fmtNum(remaining));
  }
  document.getElementById("pwPreviewIntro").textContent = shown;
  document.getElementById("pwLockLine").textContent = rest;
  const wrap = document.getElementById("plans");
  wrap.innerHTML = "";
  activePlans().forEach((pl,i)=>{
    const b = document.createElement("button");
    b.className = "plan" + (i===pwPlan ? " sel" : "");
    b.innerHTML =
      `<span class="radio"></span>
       <span style="flex:1"><b>${t(pl.name)}${pl.pop?`<span class="badge">${t(pl.tag||"plan_pop")}</span>`:""}</b><span>${t(pl.desc)}</span></span>
       <span class="price">${pl.price[lang]}</span>`;
    b.onclick = ()=>{ pwPlan = i; renderPaywall(); };
    wrap.appendChild(b);
  });
  renderRedeem();
  const pay = document.getElementById("payBtn");
  pay.disabled = false;
  pay.textContent = `${t("pw_pay")} ${activePlans()[pwPlan].price[lang]}`;
}

/* ---------------------------------------------- redemption codes
   A bridge for selling through Zid without a backend: the buyer pays on Zid,
   receives a code, and enters it here.

   WHAT THIS IS NOT: security. Every check below happens in the reader's own
   browser, so anyone willing to open the developer tools can set pwPaid
   themselves and skip the paywall entirely. Storing hashes rather than
   plaintext only means the page does not simply list working codes; it does
   not make the gate hold. That is an acceptable trade for a test of tens of
   buyers and unacceptable as a launch mechanism — see
   docs/zid-test-runbook.md.

   Ships EMPTY on purpose. The feature stays invisible and inert until real
   hashes are pasted in from test/make-codes.mjs, so no placeholder code can
   ever unlock anything. */
const REDEEM_HASHES = [];

let usedCodes = [];

function redeemArmed(){ return REDEEM_HASHES.length > 0; }

function normaliseCode(v){
  return String(v || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
}

async function hashCode(norm){
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(norm));
  return Array.from(new Uint8Array(buf))
    .map(b => b.toString(16).padStart(2, "0")).join("").slice(0, 16);
}

function renderRedeem(){
  const box = document.getElementById("redeem");
  if (!box) return;
  box.hidden = !redeemArmed() || pwPaid;
  const open = document.getElementById("rdOpen");
  if (open) open.textContent = t("rd_have");
}

function toggleRedeem(){
  const f = document.getElementById("rdForm");
  f.hidden = !f.hidden;
  if (!f.hidden) document.getElementById("rdCode").focus();
}

function rdSay(key, ok){
  const m = document.getElementById("rdMsg");
  m.hidden = false;
  m.textContent = t(key);
  m.classList.toggle("bad", !ok);
}

async function redeem(){
  const raw = document.getElementById("rdCode").value;
  const norm = normaliseCode(raw);
  if (norm.length < 6) return rdSay("rd_bad", false);

  let h;
  try { h = await hashCode(norm); }
  catch(e){ return rdSay("rd_bad", false); }

  if (REDEEM_HASHES.indexOf(h) === -1) return rdSay("rd_bad", false);
  /* One redemption per code on this device. It cannot stop the same code being
     used on another phone — that needs a server. */
  if (usedCodes.indexOf(h) !== -1) return rdSay("rd_used", false);

  usedCodes.push(h);
  saveState();
  rdSay("rd_ok", true);
  buzz([12,50,20]);
  /* Land in exactly the same place a payment does, so there is one route to
     the paid state rather than two that can drift apart. */
  setTimeout(()=>{
    if (pwMode === "term"){ termPaid = true; renderTermResult(); show("termres"); return; }
    if (pwMode === "case"){ casePaid = true; renderCaseDoc(); show("casedoc"); return; }
    pwPaid = true;
    renderLetter();
    show("letter");
  }, 600);
}

function pwPay(){
  const pay = document.getElementById("payBtn");
  pay.disabled = true;
  pay.textContent = t("pw_paying");
  setTimeout(()=>{
    buzz([12,50,20]);
    if (pwMode === "term"){ termPaid = true; renderTermResult(); show("termres"); return; }
    if (pwMode === "case"){ casePaid = true; renderCaseDoc(); show("casedoc"); return; }
    pwPaid = true;
    renderLetter();
    show("letter");
  }, 900);
}

function renderLetter(){
  if (!current || !selected().length) return;
  document.getElementById("letterBody").textContent =
    LETTER_TO[current.doc][lang] + "\n\n" + buildLetter();
  document.getElementById("copyBtn").textContent = t("copy_btn");
  document.getElementById("letterFoot").textContent = t("lt_foot");
}

function copyLetter(){
  const btn = document.getElementById("copyBtn");
  const done = ()=>{ btn.textContent = t("copied"); toast(t("copied")); setTimeout(()=>{ btn.textContent = t("copy_btn"); }, 1600); };
  if (navigator.clipboard) navigator.clipboard.writeText(document.getElementById("letterBody").textContent).then(done, done);
  else done();
}

/* ------------------------------------------------------------ feedback */
let fbState = "ask";           /* ask | comment | done */
const FEEDBACK = [];

function renderFeedback(){
  const el = document.getElementById("feedback");
  const prevText = document.getElementById("fbText") ? document.getElementById("fbText").value : "";
  if (fbState === "done"){
    el.innerHTML =
      `<div class="fb-thanks">
         <span class="tick"><svg class="draw" viewBox="0 0 14 14" fill="none"><path d="M3.2 7.4l2.6 2.6 5-5.6" stroke="var(--on-teal)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
         <span>${t("fb_thanks")}</span>
       </div>`;
    return;
  }
  const comment = fbState === "comment"
    ? `<div class="fb-comment">
         <textarea id="fbText" placeholder="${t("fb_comment_ph")}"></textarea>
         <button class="primary" onclick="fbSend()">${t("fb_send")}</button>
       </div>`
    : "";
  el.innerHTML =
    `<div class="fb-q">${t("fb_q")}</div>
     <div class="fb-btns">
       <button aria-label="${t("fb_up")}" title="${t("fb_up")}" onclick="fbVote(true)">
         <svg viewBox="0 0 24 24" fill="none" stroke="var(--teal)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 11v9M7 11l4-7c1.4 0 2.5 1.1 2.5 2.5V9H19a1.8 1.8 0 0 1 1.8 2.1l-1.2 7A1.8 1.8 0 0 1 17.8 20H7"/></svg>
       </button>
       <button aria-label="${t("fb_down")}" title="${t("fb_down")}" onclick="fbVote(false)">
         <svg viewBox="0 0 24 24" fill="none" stroke="var(--red)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 13V4M17 13l-4 7c-1.4 0-2.5-1.1-2.5-2.5V15H5a1.8 1.8 0 0 1-1.8-2.1l1.2-7A1.8 1.8 0 0 1 6.2 4H17"/></svg>
       </button>
     </div>${comment}`;
  if (fbState === "comment" && prevText) document.getElementById("fbText").value = prevText;
}

/* A stable identifier for a heuristic. Derived from the English title, which
   is what the rule is, rather than its position in the array — so reordering
   RULES never silently re-points historical feedback at the wrong rule.
   Matches the rule_ids column in supabase/migrations/0001_init.sql. */
function ruleId(c){
  return String((c.t && c.t.en) || "unknown")
    .toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
}

/* "This was wrong" is only actionable if we know what "this" was. Recording
   the rules that fired, the decision they produced, and the confidence we
   claimed makes an inaccurate verdict traceable to the specific heuristic
   behind it — which is what turns feedback into an accuracy record instead
   of a sentiment score. */
function fbRecord(vote, comment){
  const entry = {
    at: Date.now(),
    doc: current ? current.doc : null,
    score: current ? current.score : null,
    decision: current ? decide(current) : null,
    confidence: current ? confidence(current).level : null,
    ruleIds: current ? current.clauses.map(ruleId) : [],
    signedMode,
    lang,
    vote,
    comment: comment || ""
  };
  FEEDBACK.push(entry);
  console.log("wodouh feedback:", entry);
}

function fbVote(up){
  buzz(8);
  if (up){ fbRecord("up"); fbState = "done"; }
  else fbState = "comment";
  renderFeedback();
}

function fbSend(){
  fbRecord("down", document.getElementById("fbText").value.trim());
  fbState = "done";
  renderFeedback();
}

function renderClauses(){
  const wrap = document.getElementById("clauseList");
  wrap.innerHTML = "";
  current.clauses.forEach((c,i)=>{
    const div = document.createElement("div");
    div.className = "clause " + c.s;
    const q = lang==="ar" ? ["«","»"] : ["\u201C","\u201D"];
    const quote = c.q ? `<div class="quote">${q[0]}${c.q[lang]}${q[1]}</div>` : "";
    const act = actionLabel(c.s);
    const adv = adviceFor(c);
    const advice = adv ? ` ${adv[lang]}` : "";
    div.innerHTML =
      `<div class="head"><span class="stripe"></span><h4>${c.t[lang]}</h4></div>
       ${quote}
       <div class="plain">${c.p[lang]}${advice}</div>
       <span class="act">${act}</span>
       ${srcOf(c)}
       ${c.a ? addBtnHtml(i) : ""}`;
    wrap.appendChild(div);
  });
}

loadState();
applyLang();
initIntake();
initGestures();
window.addEventListener("scroll", onScroll, { passive:true });
window.addEventListener("resize", moveTabIndicator, { passive:true });
requestAnimationFrame(()=>{ armReveals(); moveTabIndicator(); });
</script>
</body>
</html>
