/* A record with no `nat` applies to everyone; one that names a track applies
   only there. Used identically by the analyzer, the assistant and the
   library, so the three can never disagree about who sees what. */
function forTrack(x){ return !x.nat || x.nat === nat; }

/* ---------------------------------------------- Arabic, as people write it
 *
 * THE BUG THIS EXISTS TO FIX, IN ONE EXAMPLE.
 *
 * A real contract says "الإجازة السنوية إحدى وعشرون يوماً". The rule looks for
 * /إجازة\s*سنوية/. It does not match — because the definite article ال is
 * attached to the FRONT of the second word, so after "إجازة" the text reads
 * "السنوية" and the pattern expects "سنوية". The clause is right there, in the
 * contract, written normally, and we walked straight past it.
 *
 * That is not a gap in one rule. Arabic attaches ال, and the conjunctions و ف
 * ب ك ل, as prefixes rather than separate words, so EVERY multi-word Arabic
 * pattern in the rule set had the same hole. A realistic contract matched 2 of
 * 17 rules, and one of the 15 it missed was written verbatim in the text.
 *
 * So rather than patch seventeen regexes and hope the next one remembers, the
 * TEXT is normalised for matching: tashkeel and tatweel removed, alef and ya
 * forms unified, and the ال prefix stripped from the front of words. Matching
 * runs against both the original and the normalised form, so a rule written
 * either way still fires and nothing that matched before can stop matching.
 *
 * This normalisation is for MATCHING ONLY. Nothing the reader sees passes
 * through it — their contract is displayed exactly as they wrote it.
 */
function normAr(text){
  return String(text)
    /* Tashkeel (harakat) and tatweel: decoration that changes no word. */
    .replace(/[ً-ْٰـ]/g, "")
    /* أ إ آ ٱ are all alef in practice, and contracts mix them freely. */
    .replace(/[أإآٱ]/g, "ا")
    .replace(/ى/g, "ي")          /* ى -> ي */
    .replace(/ة/g, "ه")          /* ة -> ه */
    /* The definite article, with or without a leading conjunction/preposition.
       Only stripped when at least three letters follow, so short words that
       merely begin with those letters are left alone. */
    .replace(/(^|[\s(«"'،.:;-])(?:[وفبكل])?ال(?=[ء-ي]{3,})/g, "$1");
}

/* ------------------------------------------- is this a contract at all?
 *
 * THE BUG THIS EXISTS TO CLOSE, AND WHO CAUSED IT.
 *
 * Paste "أنا أحب القطط والقهوة… راتبي الشهري ثمانية آلاف ريال والعمل الإضافي
 * والإجازة السنوية وفترة التجربة كلها كلمات موجودة هنا لكن بلا سياق عقدي" and
 * the app returned 84/100 with four flagged clauses — probation, annual leave,
 * overtime, salary. Not one of them exists in that text. The reader is told
 * their contract scored 84 when they pasted a paragraph about cats.
 *
 * The matcher was asking "does this text MENTION probation?" when the only
 * question that matters is "does this document IMPOSE a probation term?" A
 * topic word is not a clause. That gap was always there and the rule
 * broadening in the previous change widened it: more vocabulary meant more
 * ways for ordinary prose to trip a rule, and the test that was supposed to
 * catch it used an English string with no contract vocabulary in it, so it
 * proved nothing about this case at all.
 *
 * THE FIX IS A GATE, NOT MORE PATTERNS. Before any clause rule runs, the text
 * has to look like a legal instrument: named parties, numbered clauses,
 * obligation language, a document title. These are STRUCTURE, and structure is
 * what prose about a contract does not have, however many of its words it
 * borrows. Measured across real contracts and adversarial prose, the two
 * separate cleanly — a formal contract shows all four signals, a plainly
 * worded one shows three, a single pasted clause shows two, and prose that
 * merely talks about work shows none. The bar is two.
 *
 * Note that the adversarial text contains the words "عقد" and "بند". That is
 * why the signals require them in STRUCTURAL position — "البند الأول",
 * "عقد عمل" — rather than anywhere at all.
 */
const DOC_SIGNALS = {
  /* Named parties. A contract has sides; a paragraph does not. */
  parties: /الطرف\s*(?:ال)?(?:أول|اول|ثاني|ثانى)|(?:أحد|احد|كلا|لأي\s*من|أي\s*من)\s*(?:ال)?طرفين|(?:ال)?طرفين\b|صاحب\s*(?:ال)?عمل|رب\s*(?:ال)?عمل|first\s*party|second\s*party|the\s*employer|the\s*employee|either\s*party|both\s*parties/i,
  /* Numbered clauses, in either language. */
  structure: /(?:البند|المادة|بند|مادة)\s*(?:ال)?(?:أول|اول|ثاني|ثالث|رابع|خامس|سادس|سابع|ثامن|تاسع|عاشر|\d+)|(?:^|\n)\s*\d+\s*[.)\-–]\s*\S|clause\s*\d+|article\s*\d+|section\s*\d+/i,
  /* Obligation language: the verbs that create duties rather than describe. */
  /* Obligation and contract-body language: the verbs that CREATE a duty or
     state a term, rather than describe one. "بوظيفة" and "يتقاضى" earn their
     place because a contract assigns a position and a wage, while prose about
     a job talks around them — measured against the adversarial and chatty
     samples, neither trips any of these. */
  obligation: /يلتزم|يتعهد|يحق\s*ل|يستحق|تنص|اتفق\s*الطرفان|أبرم|ابرم|بموجب\s*هذا|يعمل\s*(?:ال)?طرف|بوظيفة|يتقاضى|تبدأ\s*مدة|مدة\s*(?:ال)?عقد|shall\b|agrees?\s+to\b|undertakes?\b|hereby\b|position\s*of\b/i,
  /* The document naming itself. */
  title: /عقد\s*(?:عمل|توظيف|العمل)|اتفاقي(?:ة|ه)\s*(?:عمل|توظيف)|employment\s*(?:contract|agreement)|offer\s*letter|contract\s*of\s*employment/i,
};

/* Two of four. Deliberately low: the cost of turning away a real contract is
   far higher than the cost of analysing an unusual one, and the measured gap
   between a real contract (3-4) and prose about work (0) is wide enough that
   two is not a close call. Both the raw text and the normalised form are
   tested, for the same reason the clause rules are. */
function looksLikeContract(text){
  const raw = String(text || ""), alt = normAr(raw);
  const hit = Object.keys(DOC_SIGNALS).filter(k =>
    DOC_SIGNALS[k].test(raw) || DOC_SIGNALS[k].test(alt));
  return { ok: hit.length >= 2, signals: hit };
}

/* The same rule, compiled against normalised Arabic. Built once per rule and
   cached on the rule itself, because rebuilding seventeen RegExps on every
   analysis is work with a known answer. */
function ruleN(rule){
  if (!rule._reN) rule._reN = new RegExp(normAr(rule.re.source), rule.re.flags);
  return rule._reN;
}

/* Global variants, so every match can be walked rather than only the first.
   Built once per rule and cached, like the normalised patterns. */
function withG(re){ return new RegExp(re.source, re.flags.includes("g") ? re.flags : re.flags + "g"); }
function ruleG(rule){  if (!rule._reG)  rule._reG  = withG(rule.re);        return rule._reG; }
function ruleGN(rule){ if (!rule._reGN) rule._reGN = withG(ruleN(rule));    return rule._reGN; }

/* The disqualifier, in the form matching the text being scanned. */
function ruleUnlessN(rule, normalised){
  if (!rule.unless) return null;
  if (!normalised) return rule.unless;
  if (!rule._unN) rule._unN = new RegExp(normAr(rule.unless.source), rule.unless.flags);
  return rule._unN;
}

/* A rule fires when its pattern matches AND its disqualifier does not appear
   NEAR the match.
 *
 * The window matters. Checking `unless` against the whole document would let
 * one mutual clause anywhere silence a genuinely one-sided clause elsewhere;
 * checking only the matched span would miss the qualifier sitting three words
 * to the left, which is exactly where "لأي من الطرفين" sits. 160 characters
 * either side is about one clause in a Saudi contract.
 *
 * WHY THIS EXISTS. A contract read "فترة التجربة تسعون يوماً، يجوز خلالها لأي
 * من الطرفين إنهاء العقد دون إشعار أو مكافأة" — an ordinary, lawful, EXPLICITLY
 * MUTUAL probation clause. The app raised a red flag saying one party appeared
 * able to end the contract unilaterally, cited Article 80 at it, scored the
 * contract 44/100, told the reader to see a lawyer, and offered to sell them a
 * letter demanding the clause be changed. The pattern had matched "إنهاء … دون"
 * and could not see the four words in front of it.
 *
 * A false red flag is the most expensive thing this product can produce. It
 * frightens someone about a term that is fine, and it does it in the same
 * breath as asking for money. */
/* Only used when a clause boundary cannot be found — see clauseAround(). */
const GUARD_WINDOW = 160;

/* The text of the CLAUSE the match sits in, bounded by the nearest sentence or
   line break on each side.
 *
 * A fixed character window was the first attempt and it was wrong in a way
 * that mattered: 160 characters reaches comfortably into the previous clause,
 * so a contract reading "clause 3: either party may terminate on notice /
 * clause 9: however the Company may terminate at any time without cause" let
 * clause 3's mutuality excuse clause 9 — hiding the single worst term in the
 * document. A qualifier governs the sentence it is in. */
function clauseAround(src, at, end){
  /* A full stop between two digits is a decimal point, not the end of a
     sentence. Without this, "الراتب 10.500 ريال" gets cut in half and the
     quote we show the reader starts mid-number — which reads as a bug in the
     one place the product is asking to be trusted. */
  const isBreak = (i) => {
    const ch = src[i];
    if (ch === "\n" || ch === "؟" || ch === "!" || ch === "؛") return true;
    if (ch !== ".") return false;
    return !(/\d/.test(src[i-1] || "") && /\d/.test(src[i+1] || ""));
  };
  let from = 0;
  for (let i = at - 1; i >= 0 && at - i <= 600; i--){
    if (isBreak(i)){ from = i + 1; break; }
  }
  let to = src.length;
  for (let i = end; i < src.length && i - end <= 600; i++){
    if (isBreak(i)){ to = i; break; }
  }
  /* One unbroken run of text with no punctuation at all: fall back to the
     fixed window rather than handing the guard the whole document. */
  if (to - from > 900){
    from = Math.max(0, at - GUARD_WINDOW);
    to = Math.min(src.length, end + GUARD_WINDOW);
  }
  return src.slice(from, to);
}

function ruleFires(rule, text, alt){
  /* The guard is normalised for the normalised pass, for exactly the reason
     the pattern is: "لأي" becomes "لاي" once the alef forms are unified, so a
     guard written in un-normalised Arabic silently never matches there. That
     is the same asymmetry that broke the clause patterns, and it costs more
     here — a guard that quietly fails does not miss a clause, it raises a
     false alarm.

     EVERY match is examined, not just the first. A contract can say "either
     party may terminate on notice" in clause 3 and "the Company may terminate
     at any time without cause" in clause 9. Stopping at the first match let
     the mutual clause vouch for the one-sided one, which is a worse failure
     than the false positive this guard was written to fix: it hides the
     clause the reader most needs to see. */
  /* The RAW text is scanned first and its clause is the one quoted back, so the
     reader sees their own words rather than the normalised form — which has had
     its hamzas flattened and its ال stripped and would look like a typo. */
  const pairs = [[text, ruleG(rule), rule.unless ? ruleUnlessN(rule, false) : null, true],
                 [alt,  ruleGN(rule), rule.unless ? ruleUnlessN(rule, true)  : null, false]];
  for (const [src, pat, guard, verbatim] of pairs){
    pat.lastIndex = 0;
    let m;
    while ((m = pat.exec(src))){
      const clause = clauseAround(src, m.index, m.index + m[0].length);
      if (!guard || !guard.test(clause)){
        /* Only the un-normalised pass can be quoted. A match found only in the
           normalised text still fires the rule — it is the same clause — but
           quoting the mangled form would look like we misread the contract. */
        return { hit: true, quote: verbatim ? clause : null };
      }
      /* A zero-length match would spin forever. */
      if (m.index === pat.lastIndex) pat.lastIndex++;
    }
  }
  return { hit: false, quote: null };
}

/* THE SENTENCE FROM THEIR OWN CONTRACT, TIDIED FOR DISPLAY.
 *
 * Wodouh's whole proposition is "never take our word for it", and the result
 * screen was the one place a reader could not check: every flag on a pasted
 * contract showed a generic paragraph, and the matched text was shown only for
 * the built-in samples. That is also how a red flag came to fire on a clause
 * that said the opposite of what the flag claimed — shown the sentence, a
 * reader would have said "but it says either party".
 *
 * Capped rather than truncated mid-word, because a quote that ends in the
 * middle of a word reads as a rendering bug and undermines the thing it is
 * there to establish. */
const QUOTE_MAX = 260;

/* Samples carry an authored {ar,en} quote; a pasted contract carries the
   reader's own sentence as a plain string. Both render the same way, and BOTH
   are escaped — the pasted one is text out of a document, and a document is
   not something this app gets to hand to innerHTML. */
function quoteHtml(c){
  const raw = typeof c.q === "string" ? c.q : (c.q && c.q[lang]);
  if (!raw) return "";
  const m = lang === "ar" ? ["\u00AB","\u00BB"] : ["\u201C","\u201D"];
  /* Marked when it is the reader's own text, so "from your contract" can be
     said rather than implied. */
  const own = typeof c.q === "string" ? ` data-own="1" data-label="${esc(t("q_own"))}"` : "";
  return `<div class="quote"${own}>${m[0]}${esc(raw)}${m[1]}</div>`;
}

function tidyQuote(sc){
  let q = String(sc || "").replace(/\s+/g, " ").trim();
  /* Drop a leading clause label — "البند الخامس:" — which is scaffolding
     rather than the term itself. */
  q = q.replace(/^(?:ال)?(?:بند|مادة)\s*(?:ال)?\S+\s*[:\-–]\s*/i, "")
       .replace(/^(?:clause|article|section)\s*\d+\s*[:.\-–]\s*/i, "");
  if (q.length <= QUOTE_MAX) return q;
  const cut = q.slice(0, QUOTE_MAX);
  const sp = cut.lastIndexOf(" ");
  return (sp > QUOTE_MAX * 0.6 ? cut.slice(0, sp) : cut).trim() + "…";
}

function analyzePasted(text){
  const clauses = [];
  /* Carry the whole rule through, minus its matcher. Copying a hand-picked
     subset silently dropped `src` (so pasted contracts cited nothing) and
     `r` (so signed-mode readers got negotiation advice instead of their
     rights). A rule gaining a field should not need an edit here. */
  /* THE GATE. Before a single clause rule runs: is this a legal instrument at
     all? Keyword matching on prose that merely talks about work is how a
     paragraph about cats scored 84/100. */
  if (!looksLikeContract(text).ok) return null;

  /* Normalised once, not per rule: seventeen regexes over a 40 KB contract is
     already the hot path here. BOTH sides go through the same transform —
     normalising the text alone was the first attempt and it made things worse,
     because the patterns are written in un-normalised Arabic and stopped
     meeting the text they were built to match. */
  const alt = normAr(text);
  for (const rule of RULES){
    if (!forTrack(rule)) continue;
    const fired = ruleFires(rule, text, alt);
    if (!fired.hit) continue;
    const { re, unless, _reN, _reG, _reGN, _unN, ...rest } = rule;
    /* A plain string, not the bilingual {ar,en} the samples carry: this is the
       reader's own sentence and it exists in exactly one language — theirs. */
    const q = fired.quote ? tidyQuote(fired.quote) : null;
    clauses.push({ ...rest, q: q || null });
  }
  /* Nothing recognised means we cannot honestly score this text. Returning null
     routes to the "couldn't read" screen instead of inventing a verdict. */
  if (!clauses.length) return null;
  clauses.sort((x,y)=>({red:0,amber:1,green:2}[x.s]-{red:0,amber:1,green:2}[y.s]));
  let score = 100;
  for (const c of clauses) score -= c.s==="red" ? 16 : c.s==="amber" ? 8 : 0;
  score = Math.max(25, Math.min(95, score));
  const reds = clauses.filter(c=>c.s==="red").length, ambers = clauses.filter(c=>c.s==="amber").length;
  let verdict;
  if (reds) verdict = {ar:"فيه بنود تحتاج وقفة قبل التوقيع — اقرأ التنبيهات الحمراء أولًا.",
                       en:"Some clauses need a pause before signing — read the red flags first."};
  else if (ambers) verdict = {ar:"لا يوجد ما يقلق — لكن فيه نقاط تستاهل التفاوض.",
                              en:"Nothing alarming — but a few points are worth negotiating."};
  else verdict = {ar:"ما وجدنا مؤشرات خطر في النص المرسل.",en:"We found no risk signals in the submitted text."};
  const vsigned = reds
    ? {ar:"فيه بنود تستحق الاعتراض — ابدأ بالتنبيهات الحمراء.",en:"Some clauses are worth contesting — start with the red flags."}
    : ambers
      ? {ar:"لا يوجد ما يقلق — لكن فيه نقاط تستحق المتابعة.",en:"Nothing alarming — but a few points are worth following up."}
      : {ar:"ما وجدنا مؤشرات خطر في النص المرسل.",en:"We found no risk signals in the submitted text."};
  return { score, doc:"doc_pasted", verdict, vs:vsigned, clauses };
}

/* --------------------------------------------------------------- state */
let lang = "ar";
let current = null;

/* An unknown key used to throw, which took a whole screen down with it.
   Fail visibly but harmlessly instead. */
function t(k){ const e = T[k]; return e ? e[lang] : ""; }

/* For the few places where a dynamic value is interpolated into markup. */
/* DIGITS STAY LATIN, IN BOTH LANGUAGES.
 *
 * Arabic renders numerals as ٠١٢٣ by default, and the app used to follow that
 * — except the score ring, which stayed Latin, so the largest number on the
 * result screen was the one thing that did not match its own page. The product
 * owner's call is Latin everywhere: readers here move between Arabic contracts,
 * bank apps and government portals that mostly use Latin digits, and a figure
 * you have to re-read is a figure you do not trust.
 *
 * The -u-nu-latn extension keeps everything else Arabic — month names, ordering,
 * the grouping separator — and changes only the digits. Swapping wholesale to
 * an English locale would have turned "١٩ فبراير" into "19 February" inside an
 * Arabic sentence. */
const AR_NUM  = "ar-SA-u-nu-latn";
const AR_DATE = "ar-SA-u-ca-gregory-nu-latn";

function esc(s){
  return String(s).replace(/[&<>"']/g, c =>
    ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
}

function applyLang(){
  document.documentElement.lang = lang;
  document.documentElement.dir = lang==="ar" ? "rtl" : "ltr";
  document.title = lang==="ar" ? "وضوح — Wodouh" : "Wodouh — وضوح";
  document.getElementById("langToggle").textContent = lang==="ar" ? "English" : "عربي";
  document.querySelectorAll("[data-t]").forEach(el=>{ el.textContent = t(el.dataset.t); });
  document.getElementById("pasteBox").placeholder = t("paste_ph");
  const h = new Date().getHours();
  document.getElementById("greet").textContent =
    t(h < 12 ? "greet_m" : h < 17 ? "greet_a" : "greet_e");
  document.documentElement.style.setProperty("--dir", lang==="ar" ? "-1" : "1");
  renderNoread();
  document.getElementById("offlineNotice").textContent = t("offline");
  document.getElementById("deskTitle").textContent = t("desk_title");
  document.getElementById("deskSub").textContent = t("desk_sub");
  document.getElementById("deskMeta").textContent = t("desk_meta");
  renderOnboard();
  renderMode();
  renderHomeReminders();
  renderTabs(); renderMyContracts(); renderLib(); renderNat(); renderTimely();
  renderFuture();
  renderPrivacyCopy();
  renderSigninCopy();
  /* The "coming soon" badges are built in code rather than carried on a
     [data-t] node, so applyLang() would leave them in the previous language.
     Same reason renderSigninCopy() is called here. */
  renderAppleAuth(); renderPhoneAuth();
  const auFree = document.getElementById("auFree");
  if (auFree) auFree.textContent = t("au_free");
  if (document.getElementById("accPlan")) renderAccount();
  if (chat.length) renderAssist();
  renderPlans(); renderBiz();
  renderEos(); if (document.getElementById("eosOut").innerHTML) calcEos();
  if (eosData){ renderCase(); renderCaseDoc(); }
  /* Unconditional: the paywall serves three flows, and two of them have no
     `current` contract. It guards its own missing state. */
  renderPaywall();
  renderDesk(); renderLawyerTease();
  renderInstallHintThenTimely();
  /* Language is a pure re-render, so every live termination screen redraws
     from the same state rather than keeping stale strings. */
  if (term){
    renderTermHow(); renderTermQ(); renderTermEv(); renderAiPanel();
    if (has("case") && aiRvState !== "working"){ renderTermResult(); renderTermDoc(); renderTermLtr(); }
  }
  if (current){
    renderResult(false); renderClauses(); renderFeedback();
    renderLetter(); renderTimeline();
    syncAddButtons(); renderBuilder();
  }
}
/* Language is a pure re-render. It must never re-run boot: doing so re-read
   localStorage into TRACKED and re-bound the scroll, drag-drop and pointer
   listeners once per toggle. */
function toggleLang(){ lang = lang==="ar" ? "en" : "ar"; applyLang(); }

function show(name, back){
  /* A SCREEN BUILT FROM AN ANALYSIS CANNOT RENDER WITHOUT ONE.
     `current` is deliberately not persisted — the contract never survives a
     reload — so any route back to the result after state is lost dereferences
     null and throws, which blanks the screen and leaves no way out of it.
     Six entry points did this: show("result"), the swipe-back from clauses and
     from letter, tlBack() on its default origin, and the two renderers.
     Sending the reader home is the honest outcome: there is genuinely nothing
     to show them, and home is where they can start again. */
  if ((name === "result" || name === "clauses") && !current) name = "home";
  /* THE DOOR — see authAllow() for what this is and why it is here rather than
     in the navigation wrappers. Before any DOM is touched, so a gated screen
     never flashes on its way to being replaced. */
  if (obDone && !authAllow(name)){ authRedirect(name, back); return; }
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active","back","lateral","dragging","settling","gesture"));
  const el = document.getElementById("screen-"+name);
  el.classList.add("active");
  if (back) el.classList.add("back");
  if (lateralNav) el.classList.add("lateral");
  /* Arriving by gesture: the reader has already moved the screen themselves,
     so a directional entry animation would contradict what their thumb did.
     Cross-fade instead, and shorter — the motion already happened. */
  if (gestureNav) el.classList.add("gesture");
  el.style.transform = "";
  window.scrollTo(0,0);
  const h = el.querySelector("h1,h2");
  if (h){ h.setAttribute("tabindex","-1"); h.focus({ preventScroll:true }); }
  if (name==="result") animateRing();
  if (typeof renderBuilder === "function") renderBuilder();
  if (typeof renderTabs === "function") renderTabs();
  if (typeof renderAskEntry === "function") renderAskEntry();
  if (typeof renderSituations === "function") renderSituations();
  if (typeof armReveals === "function") requestAnimationFrame(()=>armReveals(el));
}

/* Haptics where a real device would buzz: a decision landed, not every tap. */
function buzz(ms){ if (navigator.vibrate) try { navigator.vibrate(ms); } catch(e){} }

/* ---------------------------------------------------------- onboarding */
let obIndex = 0;
/* The two tracks, as onboarding choices. Rendered into the card rather than
   bolted beside it so the dots, the art and the advance button keep working
   exactly as they did for the three cards that came before. */
/* The nationality question is only meaningful at the moment it changes an
   answer. Asked at the front door it is a toll; asked here it is obviously
   the reason we can be specific.

   Anything that would produce a divergent answer routes through this first,
   so the original guarantee holds in a stronger form: we never render law
   for an unknown track, and the question arrives with its consequence
   visible rather than in the abstract. */
let pendingAfterTrack = null;

function needsTrack(resume){
  if (nat) return false;
  pendingAfterTrack = resume || null;
  obIndex = OB.findIndex(o => o.pick);
  natGate = true;
  renderOnboard();
  show("onboard");
  return true;
}

function resumeAfterTrack(){
  natGate = false;
  const go = pendingAfterTrack;
  pendingAfterTrack = null;
  if (typeof go === "function") go(); else show("home");
}

let natGate = false;

/* Has the tour been completed once? Persisted, so it is not re-run. */
let obDone = false;

function renderObPick(slide){
  const box = document.getElementById("obPick");
  const next = document.getElementById("obNext");
  if (!slide.pick){
    box.hidden = true;
    next.disabled = false;
    return;
  }
  box.hidden = false;
  box.innerHTML = "";
  [["sa","nat_sa","nat_sa_d"],["nonsa","nat_nonsa","nat_nonsa_d"]].forEach(([id,label,desc])=>{
    const b = document.createElement("button");
    b.type = "button";
    b.className = "ob-choice" + (nat === id ? " on" : "");
    b.setAttribute("aria-pressed", nat === id ? "true" : "false");
    b.innerHTML = `<b></b><span></span>`;
    b.querySelector("b").textContent = t(label);
    b.querySelector("span").textContent = t(desc);
    b.onclick = ()=>{
      /* First choice, so assign directly — setNat() is for changing one. */
      nat = id; buzz(8); saveState();
      renderNat(); renderLib();
      if (natGate){ resumeAfterTrack(); return; }
      renderOnboard();
    };
    box.appendChild(b);
  });
  /* Answering here is welcome but not required. The guarantee that nobody is
     shown the wrong law is enforced where the law actually diverges — see
     needsTrack() — not by blocking the front door before anyone has seen
     what Wodouh does. */
  next.disabled = false;
}

function renderOnboard(){
  const s = OB[obIndex];
  document.getElementById("obArt").innerHTML = s.art;
  document.getElementById("obTitle").textContent = s.title[lang];
  document.getElementById("obSub").textContent = s.sub[lang];
  document.getElementById("obSkip").textContent = t("ob_skip");
  document.getElementById("obNext").textContent = obIndex === OB.length-1 ? t("ob_start") : t("ob_next");
  document.getElementById("obSkip").style.visibility = obIndex === OB.length-1 ? "hidden" : "visible";
  /* Only on the last card, and never on the nationality gate, where there is
     no sign-in screen coming next and the note would be answering a question
     nobody asked. */
  const note = document.getElementById("obNote");
  note.hidden = natGate || obIndex !== OB.length-1;
  note.textContent = t("ob_note_auth");
  /* Reached as a gate rather than as a tour: the dots and the advance button
     would both be lying about where the reader is, so neither appears. The
     only way on is to answer, which is the whole point of being here. */
  document.getElementById("obDots").hidden = natGate;
  document.getElementById("obNext").hidden = natGate;
  if (natGate){
    document.getElementById("obTitle").textContent = t("nat_gate_h");
    document.getElementById("obSub").textContent = t("nat_gate_b");
  }
  renderObPick(s);
  const dots = document.getElementById("obDots");
  dots.innerHTML = "";
  OB.forEach((_,i)=>{
    const d = document.createElement("button");
    if (i===obIndex) d.className = "on";
    d.setAttribute("aria-label", (i+1)+" / "+OB.length);
    d.onclick = ()=>{ obIndex = i; renderOnboard(); };
    dots.appendChild(d);
  });
}
/* Reaching the end of the tour finishes it, and finishing is REMEMBERED.
   The carousel used to replay on every single launch: screen-onboard is the
   markup's active screen and nothing recorded that it had been seen, so a
   returning reader — including one who had already answered the nationality
   question — was walked through four slides again before reaching their own
   contracts. */
function obNext(){
  if (obIndex < OB.length-1){ obIndex++; renderOnboard(); }
  else obFinish();
}

function obFinish(){
  obDone = true; saveState();
  show("home");
}

/* Skipping the tour is fine; skipping the question is not, because the answer
   decides which law we show. Skip therefore jumps to the choice. */
function obSkip(){ obFinish(); }

function pasteChanged(){
  /* The button stays live; if the text is too short we say so rather than
     greying out and leaving the user to guess. */
  const short = document.getElementById("pasteBox").value.trim().length < 40;
  document.getElementById("analyzeBtn").classList.toggle("soft", short);
}

/* ------------------------------------------------------------- analyze */
function analyze(kind){
  /* Before anything is read. See scanGate(). */
  if (!scanGate(kind)) return;
  /* Which rules apply depends on the track, so ask before reading rather
     than after, and come straight back here with the same contract. */
  if (needsTrack(()=>analyze(kind))) return;
  const notice = document.getElementById("offlineNotice");
  if (navigator.onLine === false){ notice.hidden = false; return; }
  notice.hidden = true;
  if (kind === "pasted" && document.getElementById("pasteBox").value.trim().length < 40){
    const hint = document.querySelector("#screen-home .paste-hint");
    hint.classList.remove("nudge"); void hint.offsetWidth; hint.classList.add("nudge");
    document.getElementById("pasteBox").focus();
    return;
  }
  const pastedText = kind==="pasted" ? document.getElementById("pasteBox").value : null;
  const result = kind==="pasted" ? analyzePasted(pastedText) : SAMPLES[kind];
  if (!result){                      /* nothing recognised — never fake a score */
    current = null;
    runLoading(()=>{ buzz(12); show("noread"); });
    return;
  }
  current = result;
  /* Only a pasted contract can be re-analysed: a sample's clauses are
     authored, not matched, so switching track must not rewrite them. */
  current.srcText = pastedText;
  fbState = "ask";
  /* A new contract is a new letter and a new review, so the single-contract
     tiers are spent. The pack and the business plan survive, because covering
     further contracts is exactly what they were sold as. */
  owned.letter = null;
  if (owned.review === "plan_review") owned.review = null;
  else if (packLive()) packLeft -= 1;
  /* The free scan is counted here, where a contract is actually read, rather
     than when the result screen renders — that would charge a reader for
     scrolling back to something they already paid for. */
  if (!reviewUnlocked()) useScan();
  pwPlan = 0;
  letterSet = new Set();
  runLoading(()=>{
    renderResult(true); renderClauses(); renderFeedback();
    recordContract(); renderMyContracts();
    buzz(negotiables().length ? 12 : [10,60,18]);   /* lighter double-tap when all clear */
    show("result");
  });
}

function runLoading(done){
  const sk = document.getElementById("skel");
  if (sk){ sk.classList.remove("fading"); sk.hidden = false; }
  show("loading");
  const steps = T.load_steps[lang].slice();
  if (current) steps.splice(1, 0, t("load_" + current.doc.replace("doc_","")));
  let i = 0;
  const el = document.getElementById("loadStep"), fill = document.getElementById("loadFill");
  el.textContent = steps[0];
  fill.style.width = "0%";
  requestAnimationFrame(()=>{ fill.style.width = (100/steps.length) + "%"; });
  const iv = setInterval(()=>{
    i++;
    fill.style.width = Math.min(100, ((i+1)/steps.length)*100) + "%";
    if (i < steps.length) el.textContent = steps[i];
    else {
      clearInterval(iv);
      const sk2 = document.getElementById("skel");
      if (sk2 && !REDUCED.matches){ sk2.classList.add("fading"); }
      done();
    }
  }, 380);
}

function retryPaste(){
  show("intake", 1);
  const box = document.getElementById("pasteBox");
  box.value = ""; pasteChanged(); box.focus();
}

/* -------------------------------------------------------------- render */
const ICONS = {
  red:'<svg viewBox="0 0 14 14" fill="none"><path d="M7 3v5M7 10.6v.4" stroke="var(--on-teal)" stroke-width="2.2" stroke-linecap="round"/></svg>',
  amber:'<svg viewBox="0 0 14 14" fill="none"><path d="M7 3v4.5M7 10.6v.4" stroke="var(--on-teal)" stroke-width="2.2" stroke-linecap="round"/></svg>',
  green:'<svg viewBox="0 0 14 14" fill="none"><path d="M3.2 7.4l2.6 2.6 5-5.6" stroke="var(--on-teal)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>'
};

/* Escalation is graded by what we actually found: a red flag means this can
   become a dispute, and saying so plainly matters more than any disclaimer. */
function renderEscalate(target){
  const el = document.getElementById(target === "case" ? "caseEscalate" : "escalate");
  if (!el) return;
  const reds = target === "case" ? 1 : (current ? current.clauses.filter(c=>c.s==="red").length : 0);
  el.hidden = !reds;
  if (!reds) return;
  el.innerHTML =
    `<span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="var(--on-teal)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3 19c.9-3 3.2-4.4 6-4.4S14.1 16 15 19"/><path d="M17 8h5M19.5 5.5v5"/></svg></span>
     <div><b>${t("esc_head")}</b><p>${t("esc_body")}</p>
       <button class="esc-cta" onclick="openAssist('${target === "case" ? "case" : "result"}')">${t("esc_cta")}</button>
     </div>`;
}

/* Nothing is shown without saying where it came from. Two kinds, and the
   difference is deliberate and visible: a legal claim cites the article, and
   only articles verified in docs/legal-sources.md are ever cited that way.
   Everything else is Wodouh's own reading and says so, rather than borrowing
   authority it does not have. */
function srcOf(c){
  return c.src
    ? `<div class="src-line law">${t("govern_by")}: ${esc(c.src[lang])}</div>`
    : `<div class="src-line method">${t("src_method")}</div>`;
}

function scoreBand(n){ return n>=80 ? "great" : n>=60 ? "good" : n>=40 ? "fair" : "poor"; }

/* People do not open a contract wanting a number — they want to know whether
   they can sign. The decision is what the card leads with; the score stays
   directly beneath it as the supporting detail.

   Nothing new is computed here. The three states are read off the same
   clause data the flags already render, and the "lawyer" threshold matches
   renderEscalate, so the band and the existing escalation CTA can never
   disagree. */
function decide(a){
  const reds = a.clauses.filter(c=>c.s==="red").length;
  const ambers = a.clauses.filter(c=>c.s==="amber").length;
  if (reds >= 2 || (reds === 1 && a.score < 50)) return "lawyer";
  if (reds || ambers) return "negotiate";
  return "safe";
}

/* Confidence is about how much of the document we actually recognised, and
   it is never a fabricated percentage. A curated sample is a known quantity.
   Pasted text is only as trustworthy as the number of clauses matched, so we
   say what we matched and let the reader judge. */
function confidence(a){
  if (a.doc !== "doc_pasted") return { level:"high", n:a.clauses.length };
  const n = a.clauses.length;
  return { level: n >= 4 ? "med" : "low", n:n };
}

/* Picks the right inflected form for a counted noun. English collapses to a
   single plural, so the same four keys serve both languages. */
/* A service duration, with both nouns inflected. Zero months is dropped
   entirely — "6 سنوات و0 شهر" says nothing that "6 سنوات" does not. */
function svcText(y, m){
  const yr = countNoun("eos_y", y);
  if (!m) return yr;
  return t("eos_yrs_join").replace("{y}", yr).replace("{m}", countNoun("eos_m", m));
}

function countNoun(stem, n){
  const form = n === 1 ? "_1" : n === 2 ? "_2" : n <= 10 ? "_p" : "_m";
  return t(stem + form).replace("{n}", fmtNum(n));
}

const DC_ICON = {
  safe:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg>',
  negotiate:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 7v6M12 16.5v.2"/><circle cx="12" cy="12" r="9"/></svg>',
  lawyer:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 16H3z"/><path d="M12 10v4M12 17v.2"/></svg>'
};

function renderDecision(){
  const d = decide(current);
  const reds = current.clauses.filter(c=>c.s==="red").length;
  const ambers = current.clauses.filter(c=>c.s==="amber").length;
  const box = document.getElementById("decision");
  box.dataset.state = d;
  document.querySelector(".score-card").dataset.decision = d;
  /* Also on the screen, so blocks outside the card (the escalation panel)
     can pick up the same palette. */
  document.getElementById("screen-result").dataset.decision = d;
  document.getElementById("dcIcon").innerHTML = DC_ICON[d];
  /* Already-signed users are not deciding whether to sign, so the same
     finding is framed as what they can still act on. */
  document.getElementById("dcLabel").textContent = t(signedMode ? "dc_"+d+"_s" : "dc_"+d);

  /* NO COUNT ON THE FREE SCAN, and this was found by looking at the screen
     rather than by any test. The lock panel below deliberately withholds a
     number — "the rest of your clauses", never "4 more problems" — because
     the moment a bigger number is worth more money, the score stops meaning
     anything. This line was printing "1 red and 3 amber" directly above it,
     which announced the count the panel was carefully not stating.

     Paid, the breakdown is exactly what a reader wants: they have the clauses
     it refers to. Free, they have one, so a tally of the others is a sales
     figure wearing a finding's clothes. */
  let why;
  if (d === "safe") why = t("dc_why_none");
  else if (!reviewUnlocked()) why = t("dc_why_scan");
  else {
    const parts = [];
    if (reds) parts.push(countNoun("dc_red", reds));
    if (ambers) parts.push(countNoun("dc_amber", ambers));
    why = parts.join(t("dc_join"));
  }
  document.getElementById("dcWhy").textContent = why;

  /* The level drives the styling, so "we barely read this" cannot be styled as
     a footnote by a later CSS edit — the class is data, not decoration. */
  const c = confidence(current);
  const conf = document.getElementById("dcConf");
  conf.dataset.level = c.level;
  conf.textContent = "";
  if (c.level === "low"){
    /* An icon, because at a glance the shape of a warning reads before its
       words do — and this is the line a reader is least likely to stop for. */
    const ic = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    ic.setAttribute("viewBox", "0 0 24 24");
    ic.setAttribute("fill", "none");
    ic.setAttribute("stroke", "currentColor");
    ic.setAttribute("stroke-width", "2.2");
    ic.setAttribute("stroke-linecap", "round");
    ic.setAttribute("aria-hidden", "true");
    ic.innerHTML = '<path d="M12 8v5M12 16.5v.2"/><circle cx="12" cy="12" r="9"/>';
    conf.appendChild(ic);
    const sp = document.createElement("span");
    sp.textContent = t("dc_conf_low").replace("{n}", countNoun("dc_cl", c.n));
    conf.appendChild(sp);
  } else {
    conf.textContent = t("dc_conf_" + c.level).replace("{n}", countNoun("dc_cl", c.n));
  }
}

/* Which single action we recommend, given the decision. Everything else
   stays exactly where it is and stays clickable — this decides emphasis, not
   availability. Leading with a decision is hollow if five next steps then
   compete for it. */
const NEXT_OF = { safe:"trackTease", negotiate:"letterTease", lawyer:"escalate" };

function applyNextStep(d){
  const want = NEXT_OF[d];
  ["letterTease","trackTease","assistTease","escalate"].forEach(id=>{
    const el = document.getElementById(id);
    if (!el) return;
    /* A block that is not on screen is neither promoted nor dimmed — marking
       it either way would leave stale classes for the next render. */
    const shown = !el.hidden && el.style.display !== "none";
    const isNext = shown && id === want;
    el.classList.toggle("is-next", isNext);
    el.classList.toggle("demoted", shown && !!want && !isNext);
  });
  const chip = document.getElementById("nextChip");
  const host = document.querySelector(".is-next");
  if (chip){
    chip.remove();
  }
  if (host){
    const c = document.createElement("span");
    c.className = "next-chip";
    c.id = "nextChip";
    c.textContent = t("next_step");
    host.appendChild(c);
  }
}

function renderResult(reset){
  /* Called directly in a few places as well as through show(). Same reason. */
  if (!current){ show("home"); return; }
  document.querySelector(".score-card").dataset.band = scoreBand(current.score);
  renderDecision();
  document.getElementById("verdict").textContent =
    (signedMode && current.vs ? current.vs : current.verdict)[lang];
  document.getElementById("docLabel").textContent = t(current.doc);
  if (reset){
    document.getElementById("scoreNum").textContent = "0";
    document.getElementById("ringVal").style.strokeDashoffset = "326.7";
  } else {
    setRing(current.score);
  }
  const clear = negotiables().length === 0;
  document.getElementById("letterTease").style.display = clear ? "none" : "flex";
  const ac = document.getElementById("allClear");
  ac.hidden = !clear;
  if (clear){
    document.getElementById("acTitle").textContent = t("ac_title");
    document.getElementById("acBody").textContent = t("ac_body");
  }
  /* With nothing to negotiate, reminders become the one clear next step. */
  document.getElementById("trackTease").classList.toggle("solo", clear);
  renderTrackTease();
  if (!clear) renderTease();
  renderEscalate("result");
  applyNextStep(decide(current));
  const wrap = document.getElementById("flags");
  wrap.innerHTML = "";
  /* THE SCAN / REVIEW BOUNDARY.
     Unlocked, every clause renders as it always has. Locked, exactly ONE
     renders — in full, with its advice and its source, indistinguishable from
     what a paying reader sees. It is the most severe finding, not the least:
     a teaser that leads with the mildest thing it found would be selling by
     omission.

     What is NOT shown is a number. No "4 more problems", no count in the
     locked panel below. The moment a bigger number is worth more money, the
     score stops meaning anything, and the score is the entire product. */
  const full = reviewUnlocked();
  const SEV = { bad:0, warn:1, ok:2 };
  /* Carry the TRUE index alongside each clause. letterSet and addBtnHtml are
     keyed by position in current.clauses, so handing the loop a sorted array's
     position would have added a different clause to the letter than the one
     the reader tapped. Sorting a list whose index is a key is exactly where
     that goes wrong. */
  const ordered = (full
    ? current.clauses.map((c, i) => ({ c, i }))
    : current.clauses.map((c, i) => ({ c, i }))
        .sort((a, b) => (SEV[a.c.s] ?? 9) - (SEV[b.c.s] ?? 9))
        .slice(0, 1));
  ordered.forEach(({ c, i: idx }, pos)=>{
    const div = document.createElement("div");
    div.className = "flag " + c.s;
    const adv = adviceFor(c);
    const srcLine = srcOf(c) + costLine(c);
    const tip = adv
      ? `<div class="tip"><b>${t(signedMode ? "rights_label" : "what_to_do")}:</b> ${adv[lang]}</div>${srcLine}${addBtnHtml(idx)}`
      : srcLine;
    /* SEVERITY IN WORDS, NOT ONLY IN COLOUR.
       The dot and the tint carried the whole meaning of a row: a reader with
       any red-green colour difficulty — around 1 in 12 men — saw a list of
       clause names with no severity at all, and so did anyone reading in
       bright sun. actionLabel() is the same wording the legend above already
       uses, so nothing new is invented and the two cannot drift. */
    div.innerHTML =
      `<button aria-expanded="false" onclick="toggleFlag(this)">
         <span class="dot">${ICONS[c.s]}</span>
         <span class="ttl"><h4>${c.t[lang]}</h4><span class="sev-label">${esc(actionLabel(c.s))}</span></span>
         <span class="chev" aria-hidden="true">
           <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2"
                stroke-linecap="round" stroke-linejoin="round"><path d="M5 3l6 5-6 5"/></svg>
         </span>
       </button>
       <div class="advice">${quoteHtml(c)}<p>${c.p[lang]}</p>${tip}</div>`;
    div.style.setProperty("--d", Math.min(pos,6)*40 + "ms");
    wrap.appendChild(div);
  });
  /* What the scan withholds, said plainly and WITHOUT A NUMBER. The reader is
     told the shape of what is missing — the rest of the clauses, each with
     its source — not how many problems were found. See reviewUnlocked(). */
  if (!full){
    const lock = document.createElement("div");
    lock.className = "scan-lock";
    const left = scansLeft();
    lock.innerHTML =
      `<b>${esc(t("scan_lock_t"))}</b>` +
      `<p>${esc(t("scan_lock_b"))}</p>` +
      `<p class="scan-left">${esc(left > 0 ? t("scan_left1") : t("scan_left0"))}</p>` +
      `<button class="cta" id="scanBuy">${esc(t("scan_cta"))} ${esc(priceLabel(PLANS_REVIEW[0].amt))}</button>`;
    wrap.appendChild(lock);
    const buy = document.getElementById("scanBuy");
    if (buy) buy.onclick = () => {
      pwMode = "review"; pwOrigin = "review"; pwPlan = 0;
      pwUpgrade = null; pwUpBack = null;
      if (renderPaywall()) show("paywall");
    };
  }
  /* THE DOOR THE UPGRADE NEVER HAD.
     openUpgrade() existed, was covered by commerce.test.js, and was called from
     nowhere in the product — so pwUpgrade could never be set, and every branch
     downstream of it was unreachable: the pw_up_title and pw_pay_up copy in
     both languages, activePlans()'s `up` branch, grantAndGo()'s return path,
     and upgradeCost() itself. That is how upgradeCost() came to price the
     bundle at 0 in all three modes without anyone noticing.

     Here is where it belongs, and the copy says so: pw_up_title reads "Add the
     case file and letter", which is the bundle offered to someone who has just
     paid for the review and holds neither of the other two. They are shown the
     difference, not 549 a second time.

     Guarded on the PRICE, not on the tiers held — upgradeCost() returning 0
     means unpriceable or already covered, and neither is a thing to sell.
     activePlans() carries the same guard, so a mistake here cannot give the
     catalogue away either. */
  if (full && sellable(BUNDLE) && !has("letter") && !has("case")){
    const diff = upgradeCost("review", "plan_bundle");
    if (diff > 0){
      const up = document.createElement("button");
      up.className = "letter-tease";
      up.id = "bundleUp";
      up.innerHTML =
        `<span class="lock" aria-hidden="true">` +
          `<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" ` +
               `stroke-linecap="round" stroke-linejoin="round">` +
            `<path d="M4 7h16v13H4z"/><path d="M9 7V5a3 3 0 0 1 6 0v2"/></svg></span>` +
        /* The sub-line takes the BUNDLE'S OWN description, not pw_pay_up.
           pw_pay_up is the button label on the paywall and in Arabic it is
           the same six words as pw_up_title — so using both here printed
           "أضف الملف والخطابأضف الملف والخطاب", the title twice in a row.
           Caught by reading the rendered text, not the source. */
        `<span><b>${esc(t("pw_up_title"))}</b>` +
        `<span>${esc(t("plan_bundle_d"))} · ${esc(priceLabel(diff))}</span></span>` +
        `<span class="go" aria-hidden="true">` +
          `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" ` +
               `stroke-linecap="round" stroke-linejoin="round"><path d="M5 3l6 5-6 5"/></svg></span>`;
      wrap.appendChild(up);
      up.onclick = () => openUpgrade("review", "plan_bundle", "result");
    }
  }
  /* Red flags are the reason the user opened the app — they stay open by
     default; everything else collapses so the verdict reads at a glance. */
  wrap.querySelectorAll(".flag.red").forEach(f=>{
    f.classList.add("open");
    const btn = f.querySelector("button"), panel = f.querySelector(".advice");
    btn.setAttribute("aria-expanded","true");
    panel.style.maxHeight = "none";
  });
}

document.addEventListener("click", e=>{
  const b = e.target.closest("[data-add]");
  if (b) toggleLetterItem(+b.dataset.add);
});

function toggleFlag(btn){
  const item = btn.parentNode, open = item.classList.toggle("open");
  btn.setAttribute("aria-expanded", String(open));
  const panel = item.querySelector(".advice");
  panel.style.maxHeight = open ? panel.scrollHeight + "px" : "0px";
}

function setRing(score){
  const C = 326.7;
  document.getElementById("ringVal").style.strokeDashoffset = String(C * (1 - score/100));
  document.getElementById("scoreNum").textContent = String(score);
}

function animateRing(){
  const target = current.score;
  /* Under reduced motion the number arrives at once; the value is identical. */
  if (REDUCED.matches){ setRing(target); return; }
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    setRing(target);
    const numEl = document.getElementById("scoreNum");
    const t0 = performance.now();
    (function tick(now){
      const k = Math.min(1,(now-t0)/1100);
      numEl.textContent = String(Math.round(target * (1-Math.pow(1-k,3))));
      if (k<1) requestAnimationFrame(tick);
    })(t0);
  }));
}

/* --------------------------------------- end of service + termination ----
   Deterministic arithmetic, not inference: the award follows the standard
   formula (half a month per year for the first five years, a full month per
   year thereafter, on the last wage), then a resignation factor. Every step
   is shown so the user can check the maths rather than trust a black box.
   Figures must be verified against the current statutory text before use. */
let eosHow = "term", triage = { reason:null, notice:null, probation:null }, claimAdded = false;

/* Article 87, on the calculator side. The termination assessment has asked
   this since the assessment was built (term.exc87 / exc87Applies); the
   standalone calculator never did, so the same reader got the reduced figure
   here and the correct one there depending only on which door they came
   through. null and "none" both mean no exception, so the default can only
   ever understate — never overstate — and only an affirmative answer moves
   the figure, always upward. */
let eosExc87 = null;
function eosExc87Applies(){
  return eosExc87 === "force" || eosExc87 === "marriage" || eosExc87 === "birth";
}

/* ================================================================= future
 *
 * The roadmap screen. Built from these three lists rather than from markup so
 * that a card cannot exist in one language and not the other, and so the
 * "coming soon" badge is attached by the data rather than remembered by hand.
 *
 * textContent everywhere, like the rest of this file. These strings are ours
 * rather than a reader's, but the rule that no copy reaches innerHTML is worth
 * more than the one line it saves here.
 */
const FU_ARC = [
  ["fu_a1", "fu_a1d", true],
  ["fu_a2", "fu_a2d", false],
  ["fu_a3", "fu_a3d", false],
  ["fu_a4", "fu_a4d", false]
];
const FU_CARDS = [
  ["🗂️", "fu_vault",  "fu_vault_d"],
  ["🧠", "fu_ask",    "fu_ask_d"],
  ["🔔", "fu_alert",  "fu_alert_d"],
  ["🔄", "fu_diff",   "fu_diff_d"],
  ["⚖️", "fu_rights", "fu_rights_d"],
  ["📅", "fu_time",   "fu_time_d"],
  ["🚨", "fu_watch",  "fu_watch_d"],
  ["🤝", "fu_nego",   "fu_nego_d"],
  ["✍️", "fu_docs",   "fu_docs_d"],
  ["🏦", "fu_loan",   "fu_loan_d"]
];
/* `true` means it works TODAY and must never carry a "soon" badge. The four
   that do are the reason this list is here: a roadmap that leaves a reader
   unsure which parts are real has cost them more than it told them. */
const FU_CATS = [
  ["fu_cat_emp",  "fu_cat_emp_d",  true],
  ["fu_cat_rent", "fu_cat_rent_d", true],
  ["fu_cat_free", "fu_cat_free_d", true],
  ["fu_cat_supp", "fu_cat_supp_d", false],

function renderFuture(){
  const arc = document.getElementById("fuArc");
  const grid = document.getElementById("fuGrid");
  const cats = document.getElementById("fuCats");
  if (!arc || !grid || !cats) return;

  const head = (host, key) => {

    host.appendChild(h);
  };
  const badge = (host, key, cls) => {
    const b = document.createElement("span");

  };

  arc.innerHTML = "";
  head(arc, "fu_arc_h");
  FU_ARC.forEach(([k, d, now], i) => {
    const step = document.createElement("div");
    step.className = "fu-step" + (now ? " now" : "");
    const dot = document.createElement("div");
    dot.className = "fu-dot";
    dot.textContent = String(i + 1);
    dot.setAttribute("aria-hidden", "true");
    const body = document.createElement("div");
    const b = document.createElement("b");
    b.textContent = t(k);
    body.appendChild(b);
    if (now) badge(body, "fu_now", "now");
    const p = document.createElement("span");
    p.textContent = t(d);
    body.appendChild(p);
    step.appendChild(dot); step.appendChild(body);
    arc.appendChild(step);
  });

  grid.innerHTML = "";
  head(grid, "fu_grid_h");
  FU_CARDS.forEach(([icon, k, d]) => {
    const card = document.createElement("div");
    card.className = "fu-card";
    const ic = document.createElement("div");
    ic.className = "fu-ic";
    ic.textContent = icon;
    ic.setAttribute("aria-hidden", "true");
    const body = document.createElement("div");
    const b = document.createElement("b");
    b.textContent = t(k);
    body.appendChild(b);
    badge(body, "fu_soon");
    const p = document.createElement("span");
    p.textContent = t(d);
    body.appendChild(p);
    card.appendChild(ic); card.appendChild(body);
    grid.appendChild(card);
  });

  cats.innerHTML = "";
  head(cats, "fu_cats_h");
  FU_CATS.forEach(([k, d, now]) => {
    const row = document.createElement("div");
    row.className = "fu-cat" + (now ? " now" : "");
    const b = document.createElement("b");
    b.textContent = t(k);
    row.appendChild(b);
    badge(row, now ? "fu_cat_now" : "fu_cat_next", now ? "now" : "");
    const p = document.createElement("span");
    p.textContent = t(d);
    row.appendChild(p);
    cats.appendChild(row);
  });
}

function renderLib(){

      sum.textContent = it.q[lang];
      d.appendChild(sum);

      const body = document.createElement("div");
      body.className = "lib-a";
      const para = document.createElement("p");
      para.textContent = it.a[lang];
      body.appendChild(para);

      /* Same rule as the rest of the app: an origin, always. */
      const src = document.createElement("div");
      src.className = "src-line " + (it.src ? "law" : "method");
      src.textContent = it.src ? t("govern_by") + ": " + it.src[lang] : t("src_method");
      body.appendChild(src);

      if (it.go && LIB_GO[it.go]){

        b.type = "button";

        b.onclick = LIB_GO[it.go];

/* Calculating first is deliberate — the file is built from the figure. But
   once that figure exists, the file itself is the right destination. */
function openRightsCase(){ if (eosData) openCase(); else openEos(); }

/* ============================================================ accounts
 *
 * WHERE SIGN-IN IS REQUIRED, WHICH IS NOW EVERYWHERE.
 *
 * THIS SECTION USED TO SAY THE OPPOSITE, and the reversal is recorded rather
 * than overwritten. Sign-in was offered only where an account bought something
 * — saving work, changing phone, paying — and was explicitly never a gate. The
 * founder has since decided that every screen past the tour requires an
 * account, the calculator included, so that a reader who uses the tool can
 * actually be reached and supported afterwards. What that costs is real and is
 * written down in docs/pricing.md next to the argument it overturned; this is
 * not a decision that was made by forgetting the other side of it.
 *
 * The gate itself is authAllow()/authRedirect() below, applied inside show().
 *
 * ACCOUNTS ARE ABSENT, NOT DISABLED, WHEN UNCONFIGURED. Same pattern as the AI
 * and the paywall: no Supabase project means no entry point renders and no
 * request is made — and, since there would be no account to be had, no gate
 * either. That is the single exception, and it exists so a local checkout is
 * not a locked box.
 */
let authUser = null, authBack = "account";

function authOn(){ return typeof WodouhAuth !== "undefined" && WodouhAuth.configured(); }
function signedIn(){ return !!authUser; }

/* ==================================================== THE DOOR
 *
 * ONCE THE TOUR IS DONE, AN ACCOUNT IS REQUIRED — WITH TWO THINGS LEFT OPEN.
 *
 * The reason for the door is reachability: someone who used Wodouh and left no
 * way to be contacted cannot be supported or followed up with. The reasoning on
 * both sides is in docs/pricing.md rather than lost.
 *
 * THE CALCULATOR AND THE RIGHTS LIBRARY STAY OPEN, and that is a deliberate
 * exception rather than an oversight. They are the two surfaces that give
 * something away before asking for anything: a real end-of-service figure with
 * the arithmetic shown, and the law itself. They are what makes the free
 * proposition true rather than merely claimed, and they are what someone
 * arriving from a search result is looking for. Asking for an account first
 * would be asking to be trusted before having done anything to earn it.
 *
 * Reading a contract, the reminders, the assistant and everything that writes
 * or spends still need an account.
 *
 * The roadmap screen is open for a different reason: it holds nothing about
 * anyone, asks for nothing, and does nothing. Requiring an account to read
 * what a product intends to build one day would be hard to say out loud.
 *
 * AN ALLOWLIST, NOT A LIST OF GATED SCREENS. Five names get through. A screen
 * added next year is gated because it is new, not because someone remembered
 * to add it to a list — the failure mode of the other shape is a hole nobody
 * notices until it is found.
 *
 * GATED IN show() ITSELF, not in the wrappers. openEos(), goTab() and the rest
 * are not the only routes to a screen: the test suites reach several by calling
 * show() directly, and anything in this file can. A gate in the wrappers would
 * be a gate around the front door of a building with open windows.
 */
const AUTH_FREE = ["onboard", "signin", "eos", "rights", "future"];
function authAllow(name){
  /* AN UNCONFIGURED BUILD IS NOT GATED, and this is the one exception to "no
     exceptions". With no Supabase project there is no account to be had, so
     gating would lock every reader out of a product that cannot let them in.
     This is a local-development and misconfiguration fallback, not a way to
     opt out: the shipped build is configured, so this returns false there. */
  if (!authOn()) return true;
  if (signedIn()) return true;
  return AUTH_FREE.indexOf(name) >= 0;
}

/* WHAT THEY WERE TRYING TO DO WHEN THE DOOR STOPPED THEM.
 *
 * One slot, two shapes: a screen they were navigating to, or a scan they were
 * about to run. It replaces the old `pendingScan`, which held only the second
 * — and once every screen can send someone to sign-in, "what were they doing"
 * has more than one answer. Kept as one variable rather than two so it is
 * impossible for both to be set and for the wrong one to win.
 */
let pendingNav = null;

/* Remember where they were going, so signing in delivers them there rather
   than to a generic home screen that makes them start the journey again. */
function authRedirect(name, back){
  pendingNav = { kind: "screen", payload: name };
  authWant = "nav";
  openSignin(back || "home");
}

/* Put them back where they were interrupted. Falls through to authBack on
   anything unrecognised rather than trapping the reader on the sign-in screen
   they have just successfully passed. */
function resumeAfterAuth(){
  const p = pendingNav; pendingNav = null;
  if (p && p.kind === "scan"){ analyze(p.payload); return; }
  if (p && p.kind === "screen"){ show(p.payload); return; }
  show(authBack, 1);
}

function openSignin(back){
  if (!authOn()) return;
  authBack = back || "account";
  /* Only where the reader is actually stuck. Opening sign-in from inside the
     app leaves the back chevron and the tab bar behind it; the link is for the
     post-tour case, where this screen is the whole world. */
  const free = document.getElementById("auFree");
  if (free){
    free.hidden = !obDone || signedIn();
    free.textContent = t("au_free");
  }
  renderAppleAuth();
  const err = document.getElementById("auErr");
  if (err) err.hidden = true;
  const none = document.getElementById("auNone");
  if (none) none.hidden = true;
  /* Fresh every time: an address left in the box from a previous attempt, or
     a code step still showing for a code that has since expired, are both
     ways to start someone in a state they did not choose. */
  auMail = "";
  const eb = document.getElementById("auEmail");
  if (eb) eb.value = "";
  renderMailAuth();
  auPhoneNum = "";
  const pb = document.getElementById("auPhone");
  if (pb) pb.value = "";
  renderPhoneAuth();
  /* THE BACK CHEVRON IS REMOVED ONCE THE TOUR IS DONE, because at that point
     there is nowhere behind this screen to go: every destination is gated, so
     tapping back would route straight through the gate and land here again.
     A control that does nothing is worse than no control. During the tour it
     stays — returning to the tour is a real destination. */
  const bk = document.querySelector("#screen-signin .back");
  if (bk) bk.hidden = obDone;
  renderSigninCopy();
  show("signin");
  renderProviders();
}

/* WHY THIS IS A FUNCTION AND NOT data-t ON THE ELEMENTS.
   applyLang() rewrites every [data-t] node from its key, so leaving the key on
   these two would mean the correct headline appeared, and then reverted to
   "Save your work" the moment the reader tapped عربي — on the one screen where
   the wrong headline costs a conversion. The copy depends on WHY the door
   opened, which is state, not a static key. Called from openSignin() and from
   applyLang() so both paths agree. */
function renderSigninCopy(){
  const scanDoor = authWant === "scan";
  const ttl = document.getElementById("auTitle"), sb = document.getElementById("auSub");
  if (ttl) ttl.textContent = t(scanDoor ? "au_title_scan" : "au_title");
  if (sb)  sb.textContent  = t(scanDoor ? "au_sub_scan"   : "au_sub");
}

/* APPLE, WHICH IS ANNOUNCED RATHER THAN HIDDEN WHILE IT IS COMING.
 *
 * THIS FILE USED TO ARGUE THE OPPOSITE — "a dead sign-in button is worse than
 * one fewer option" — and hid Apple entirely wherever it was not configured.
 * That reasoning was about a button that LOOKS live and then fails, which is a
 * different thing from one that is visibly inert and labelled. The founder's
 * call is to name what is coming, so a reader who signs in with Apple
 * everywhere else can see it is on the way instead of concluding this app is
 * not for them. The button is `disabled`, so the failure the old rule was
 * protecting against cannot happen: it cannot be pressed at all.
 *
 * Only where accounts exist. On an unconfigured build the whole screen is
 * unreachable, and announcing a provider there would be announcing something
 * twice removed from working. */
/* Same fail-open as mailOn: true until /auth/v1/settings says otherwise, so a
   check that has not come back is not a reason to demote a working button. */
let appleOn = true;
function renderAppleAuth(){
  const ap = document.getElementById("auApple");
  if (!ap) return;
  const live = authOn() && appleOn && WodouhAuth.appleAvailable();
  ap.hidden = !authOn();
  ap.disabled = !live;
  ap.classList.toggle("soon", !live);
  ap.classList.toggle("apple", live);
  const lab = ap.querySelector("[data-t='au_apple']");
  if (lab) lab.textContent = t("au_apple");
  let badge = ap.querySelector(".badge");
  if (!live && !badge){
    badge = document.createElement("span");
    badge.className = "badge";
    ap.appendChild(document.createTextNode(" "));   /* see renderPhoneAuth() */
    ap.appendChild(badge);
  }
  if (badge){ badge.textContent = t("au_soon"); badge.hidden = live; }
}

/* Hide a provider the project has not enabled, rather than let the reader
   discover it by landing on Supabase's raw JSON error. Renders the buttons
   first and corrects them when the answer arrives, so nobody waits on the
   network to see a screen — and if the answer never arrives, what is on
   screen is exactly what shipped before this existed. */
function renderProviders(){
  if (!authOn() || !WodouhAuth.providers) return;
  WodouhAuth.providers().then(ext => {
    if (!ext) return;                       /* unknown: leave it as it was */
    const g = document.getElementById("auGoogle");
    const ap = document.getElementById("auApple");
    const none = document.getElementById("auNone");
    const gOn = ext.google !== false;
    const aOn = ext.apple !== false && WodouhAuth.appleAvailable();
    /* Email is a provider too, and forgetting it here would print "no sign-in
       method is enabled" on a screen with a working email form on it. */
    const eOn = ext.email !== false;
    /* Phone is the one provider asked about POSITIVELY (=== true, not
       !== false). The others fail open because showing a button that might not
       work beats hiding one that does; an SMS form that cannot send is not the
       same bargain, and it must also clear the local config switch. */
    const pOn = ext.phone === true &&
                !!(WodouhAuth.phoneAvailable && WodouhAuth.phoneAvailable());
    if (g) g.hidden = !gOn;
    mailOn = eOn;
    renderMailAuth();
    phoneOn = pOn;
    renderPhoneAuth();
    /* Apple is re-rendered rather than hidden here: the project reporting it
       disabled is one of the ways it is "coming", not a reason to erase it. */
    appleOn = aOn;
    renderAppleAuth();
    if (none){
      /* COUNTS ONLY DOORS THAT OPEN. A "coming soon" button is not a way in,
         so it must not suppress the notice that says there is no way in — that
         would leave a reader staring at two greyed-out buttons with nothing
         telling them the fault is ours. */
      none.hidden = gOn || aOn || eOn || pOn;
      none.textContent = t("au_none");
    }
  }).catch(()=>{});
}
function closeSignin(){ show(authBack, 1); }

/* ------------------------------------------------------- EMAIL SIGN-IN
   Two steps, one screen. The code box does not exist until a code has
   actually been sent, so the screen never asks for something nobody has. */
let auMail = "";
/* Starts true so the form is there before /auth/v1/settings answers — the
   same fail-open the Google button uses. A check that has not come back is
   not a reason to hide a working door. */
let mailOn = true;
function renderMailAuth(){
  const on = !!(authOn() && WodouhAuth.sendEmailCode && mailOn);
  const sep = document.getElementById("auSep");
  const f1 = document.getElementById("auMailForm");
  const f2 = document.getElementById("auCodeForm");
  if (!sep || !f1 || !f2) return;
  sep.hidden = !on;
  f1.hidden = !on || !!auMail;
  f2.hidden = !on || !auMail;
  if (auMail){
    document.getElementById("auCodeLab").textContent =
      t("au_code_lab").replace("{e}", auMail);
  }
}

function mailErr(key){
  const err = document.getElementById("auErr");
  if (!err) return;
  err.textContent = t(key);
  err.hidden = false;
}

function sendMailCode(){
  const box = document.getElementById("auEmail");
  const btn = document.getElementById("auMailGo");
  const err = document.getElementById("auErr");
  if (err) err.hidden = true;
  if (!box || !btn) return;
  btn.disabled = true; btn.textContent = t("au_sending");
  WodouhAuth.sendEmailCode(box.value)
    .then(addr => {
      auMail = addr;
      renderMailAuth();
      const c = document.getElementById("auCode");
      if (c){ c.value = ""; c.focus(); }
    })
    .catch(e => {
      /* A malformed address and a mail server that would not take it are
         different problems with different fixes, so they are told apart
         rather than sharing one shrug. */
      mailErr(String(e && e.message) === "bad_email" ? "au_bad_email" : "au_mail_err");
    })
    .then(() => { btn.disabled = false; btn.textContent = t("au_email_go"); });
}

function verifyMailCode(){
  const box = document.getElementById("auCode");
  const btn = document.getElementById("auCodeGo");
  const err = document.getElementById("auErr");
  if (err) err.hidden = true;
  if (!box || !btn) return;
  btn.disabled = true; btn.textContent = t("au_checking");
  WodouhAuth.verifyEmailCode(auMail, box.value)
    .then(() => { auMail = ""; renderMailAuth(); afterSignIn(); })
    .catch(() => mailErr("au_bad_code"))
    .then(() => { btn.disabled = false; btn.textContent = t("au_code_go"); });
}

/* ------------------------------------------------------- PHONE SIGN-IN
   The same two-step shape as email, deliberately: one state machine to read,
   one to get wrong. `auPhoneNum` holds the NORMALISED number that a code was
   actually sent to, not what was typed — verifying against the typed form
   would fail for anyone who wrote 05… where +966… was sent. */
let auPhoneNum = "";
/* Unlike mailOn, this starts FALSE. Email fails open because it costs nothing
   to show a form that turns out to be unavailable; every SMS costs money and a
   phone form that cannot deliver is a dead end at the only door into the app.
   It opens only on two positive answers: the config switch and the project. */
let phoneOn = false;
function renderPhoneAuth(){
  const on = !!(authOn() && WodouhAuth.sendPhoneCode &&
                WodouhAuth.phoneAvailable && WodouhAuth.phoneAvailable() && phoneOn);
  const f1 = document.getElementById("auPhoneForm");
  const f2 = document.getElementById("auPhoneCodeForm");

     exactly the case the form does not, and only where accounts exist at all —
     promising a sign-in method on a build that has no backend would be
     announcing something twice removed from working. */
  const soon = document.getElementById("auPhoneSoon");
  if (soon){
    soon.hidden = on || !authOn();

       them visually, but a screen reader concatenates text nodes — without it
       this announces as "mobile numberNot yet available". */
    soon.innerHTML = `<span>${t("au_phone_soon")}</span> <span class="badge">${t("au_soon")}</span>`;

  f2.hidden = !on || !auPhoneNum;

      t("au_code_lab").replace("{e}", auPhoneNum);

}

/* Where a reader lands once they are in. Coming from the scan gate they get
   what they came for; from anywhere else, back where they were. */
let authWant = null;
function afterSignIn(){
  authWant = null;
  /* The count is per account, so it has to be read before the resumed scan
     decides whether it is free. resumeAfterAuth() reads the pending intent
     itself, so there is no second copy of "what were they doing" here to fall
     out of step with the first. */
  loadScanCount().then(resumeAfterAuth);
}

/* ASK BEFORE NAVIGATING. Supabase answers a disabled provider with 400 JSON
   rather than a redirect, so going straight there lands the reader on
   {"code":400,...,"msg":"Unsupported provider: provider is not enabled"} —
   raw text on a Supabase URL, no styling, no way back to this app. That
   happened on the console, repeatedly, and this screen had the same hole.

   The pre-flight resolves "go" on anything it cannot read, so a blocked or
   slow network still attempts sign-in. Only an explicit refusal stops it. */
function doSignIn(provider){
  if (!authOn()) return;
  const err = document.getElementById("auErr");
  const btn = document.getElementById(provider === "apple" ? "auApple" : "auGoogle");
  const fail = key => { if (err){ err.textContent = t(key); err.hidden = false; } };
  if (btn) btn.disabled = true;
  const ask = WodouhAuth.preflight ? WodouhAuth.preflight(provider) : Promise.resolve(null);
  ask.catch(() => null).then(refused => {
    if (btn) btn.disabled = false;
    if (refused){ fail("au_off"); return; }
    const go = provider === "apple" ? WodouhAuth.signInWithApple() : WodouhAuth.signInWithGoogle();
    go.catch(() => fail("au_err"));
  });
}

/* Asked once, after the account exists, and only if the reader has never been
   asked before. phone_prompted_at is what makes "once" true across devices —
   asking again on every visit is how an optional question starts to feel
   mandatory. */
function maybeAskPhone(profile){
  if (!profile || profile.phone_prompted_at || profile.phone_number) return false;
  show("phone");
  return true;
}

function savePhone(){

  const err = document.getElementById("phErr");

  WodouhAuth.savePhone(num, !!(box && box.checked), t("ph_consent"))
    .then(() => show(authBack, 1))
    .catch(e => {

        err.hidden = false;

    });

function skipPhone(){
  /* Skip is a real answer and is recorded as one, so the question does not
     come back. It must never be read as consent to anything. */
  WodouhAuth.skipPhone().catch(() => {}).then(() => show(authBack, 1));
}

function signOutNow(){

/* Local work moving to a server is asked about, never assumed. The prompt only
   appears when there is something to move. */
function localWorkExists(){
  return (myContracts && myContracts.length > 0) ||
         (TRACKED && TRACKED.length > 0) ||
         !!(term && term.start);
}

/* ------------------------------------------------------------------ sync
 *
 * THE ONE MOMENT THE PRIVACY PROMISE IS AT RISK.
 *
 * Everything else in this app keeps the contract on the phone because it never
 * had anywhere else to put it. Here there IS somewhere else, so the promise
 * stops being a property of the architecture and becomes a decision — which is
 * why it is asked, why the screen lists what leaves and what never does, and
 * why WodouhAuth.shape() rebuilds the payload from named fields rather than
 * serialising local state. A field added to saveState() does not become a field
 * that gets uploaded.
 *
 * ASKED ONCE PER DEVICE, and `migAsked` is why. The question is about the work
 * on THIS phone, so the answer belongs beside it in localStorage, not on the
 * profile: a second device has its own work and deserves its own question.
 *
 * NOTHING IS DELETED LOCALLY EITHER WAY. Push is a copy, not a move — the
 * signed-out app keeps working against exactly the same localStorage it always
 * did, which is rule 1 of auth.js and the reason a failed upload is a shrug
 * rather than a loss.
 */
let migAsked = false, migProfile = null;

function openMigrate(profile){
  if (!authOn() || !signedIn()) return false;
  if (migAsked || !localWorkExists()) return false;
  migProfile = profile || null;
  const err = document.getElementById("migErr");
  if (err) err.hidden = true;
  const yes = document.getElementById("migYes");
  if (yes){ yes.disabled = false; yes.textContent = t("au_mig_yes"); }
  show("migrate");
  return true;
}

/* Asked and answered, whichever way. Recorded before the network is touched,
   so a failed upload does not re-ask on every launch. */
function migrateDone(){
  migAsked = true; saveState();
  const p = migProfile; migProfile = null;
  if (!maybeAskPhone(p)) show(authBack, 1);
}

function migrateYes(){
  const yes = document.getElementById("migYes");
  const err = document.getElementById("migErr");
  if (yes){ yes.disabled = true; yes.textContent = t("au_mig_busy"); }
  WodouhAuth.pushLocal({ contracts: myContracts, tracked: TRACKED, term })
    .then(r => {
      /* A partial push is reported as a failure, not quietly as success. The
         reader is choosing whether to rely on this, and "some of it arrived"
         is not something they can act on. */
      if (r && r.failed > 0) throw new Error("partial");
      migrateDone();
    })
    .catch(() => {
      migAsked = true; saveState();
      if (yes){ yes.disabled = false; yes.textContent = t("au_mig_yes"); }
      if (err){ err.textContent = t("au_mig_fail"); err.hidden = false; }
    });
}

function migrateNo(){ migrateDone(); }

/* Resolves once WHO THE READER IS is known — not once everything that follows
   from knowing has finished. Boot routing waits on this and nothing else,
   because the profile work below takes the screen itself and would otherwise
   be undone by the route it was waiting for. Starts resolved so an
   unconfigured build boots without waiting for a session it will never have. */
let authReady = Promise.resolve();

function initAuth(){
  if (!authOn()) return;
  WodouhAuth.onChange(u => { authUser = u; loadScanCount().then(renderAccount); });
  const who = WodouhAuth.init().then(u => {
    authUser = u;
    renderAccount();
    return u;
  }, () => { authUser = null; return null; });
  authReady = who.then(() => {}, () => {});
  who.then(u => {
    if (!u) return;
    return WodouhAuth.getProfile().then(p => {
      /* Their existing work comes BEFORE the phone question: it is data they
         already have and could lose, and the phone is a favour to us. If there
         is nothing to move, the phone question happens immediately as before —
         openMigrate() reports whether it took the screen. */
      if (!openMigrate(p)) maybeAskPhone(p);
    }).catch(() => {});
  });
}

/* ---------------------------------------------------- situation routing
 *
 * Six moments, five destinations that already existed. The chooser adds no new
 * capability — it adds doors to capability that was already there and only
 * reachable by someone who knew to look for it.
 *
 * `journey` records which door was used. Nothing reads it yet. It is recorded
 * because the question "which situation do people actually arrive in" is the
 * one measurement that would change what gets built next, and the answer is
 * unrecoverable if it is not captured at the moment it happens.
 */
let journey = null;

function pickSituation(which){
  journey = which;
  const sit = document.getElementById("sitUnsure");
  if (sit) sit.hidden = which !== "unsure";

  switch (which){
    /* "Received a contract" NAVIGATES. It used to scroll to an intake block
       that was already on the same screen, which is why the chooser read as
       decoration: the door and its destination were visible at once. */
    case "contract":
      setSigned(false);
      openIntake();
      break;
    /* Thinking about resigning is a PLANNING question, not a termination one —
       the job has not ended. What that reader needs is the number Article 85
       reduces, which is exactly what the calculator produces. Both of these
       readers are already under a contract they signed, so the door answers
       the signed question on their behalf. */
    case "resign":
    case "owed":
      setSigned(true);
      openEos();
      break;
    case "term":
      setSigned(true);
      openTerm();
      break;
    case "ask":
      openAsk();
      break;
    case "unsure":
      /* Deliberately no destination. A reader who cannot categorise their own
         situation is not helped by a menu — that is the thing they already
         could not choose from. One question, asked in place. */
      if (sit) sit.scrollIntoView({ behavior:"smooth", block:"center" });
      break;
  }
}

/* The question card only exists in a build that can answer, exactly like its
   twin on the Rights screen. */
function renderSituations(){
  const a = document.getElementById("sitAsk");
  if (a) a.hidden = !(typeof askAvailable === "function" && askAvailable());
}

/* The gate in show() would catch this anyway. Checking first is not
   redundancy for its own sake: renderEos() reads and writes state and the
   render is wasted work for someone who is about to be sent to sign-in. Same
   argument at goTab(), which calls ensureFlags() — a network request. */
function openEos(){
