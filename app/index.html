<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="theme-color" content="#1E6E64"/>
<title>Wodouh — وضوح</title>
<style>
  :root{
    --teal:#1E6E64; --teal-ink:#134B44; --teal-soft:#DCE9E6;
    --sand:#F7F1E6; --card:#FDFAF3;
    --amber:#C9922E; --amber-bg:#F6EAD2;
    --red:#B4544A; --red-bg:#F3DFDC;
    --green:#4E8F5B; --green-bg:#E2EEE2;
    --ink:#2B3230; --ink-2:#6B7370;
    --line:#E8DFCE;
    --en:'Nunito','Avenir Next Rounded','Segoe UI',-apple-system,'Trebuchet MS',sans-serif;
    --ar:'Noto Naskh Arabic','Geeza Pro','Amiri','Traditional Arabic',serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html[lang="ar"] body{font-family:var(--ar)}
  html[lang="en"] body{font-family:var(--en)}
  body{background:var(--sand);color:var(--ink);line-height:1.7;-webkit-font-smoothing:antialiased;min-height:100vh}
  .app{max-width:440px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding:0 18px 28px}
  button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}

  /* top bar */
  .bar{display:flex;align-items:center;justify-content:space-between;padding:18px 2px 10px}
  .brand{display:flex;align-items:center;gap:10px}
  .brand svg{width:34px;height:34px}
  .brand .name-ar{font-family:var(--ar);font-size:22px;color:var(--teal-ink);line-height:1}
  .brand .name-en{font-family:var(--en);font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--teal);text-transform:uppercase}
  .lang-toggle{font-family:var(--en);font-size:13px;font-weight:700;color:var(--teal);background:var(--teal-soft);border-radius:999px;padding:7px 14px}
  html[lang="en"] .lang-toggle{font-family:var(--ar);font-size:15px;padding:5px 14px}

  .screen{display:none;flex:1;flex-direction:column}
  .screen.active{display:flex}

  /* home */
  .hello{margin:18px 2px 6px;font-size:24px;color:var(--teal-ink);line-height:1.5}
  .sub{color:var(--ink-2);font-size:15px;margin:0 2px 22px}
  .samples{display:grid;gap:10px}
  .sample{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;text-align:start;transition:border-color .15s}
  .sample:hover{border-color:var(--teal)}
  .sample .ic{flex:none;width:42px;height:42px;border-radius:12px;background:var(--teal-soft);display:flex;align-items:center;justify-content:center}
  .sample .ic svg{width:22px;height:22px}
  .sample b{display:block;font-size:15.5px;color:var(--ink)}
  .sample span{font-size:12.5px;color:var(--ink-2)}
  .sample .go{margin-inline-start:auto;color:var(--teal);font-size:18px}
  .or{display:flex;align-items:center;gap:12px;color:var(--ink-2);font-size:13px;margin:20px 0 12px}
  .or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
  textarea{width:100%;min-height:120px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;font:inherit;font-size:14px;color:var(--ink);resize:vertical;line-height:1.8}
  textarea:focus{outline:2px solid var(--teal);outline-offset:0;border-color:transparent}
  textarea::placeholder{color:#A9AFA9}
  .primary{margin-top:14px;width:100%;background:var(--teal);color:#F7F1E6;font-weight:700;font-size:16px;border-radius:16px;padding:15px;transition:opacity .15s}
  .primary:disabled{opacity:.45;cursor:default}
  .disclaimer{margin-top:auto;padding-top:26px;text-align:center;font-size:12px;color:var(--ink-2)}

  /* onboarding */
  #screen-onboard{justify-content:flex-end;min-height:calc(100vh - 90px)}
  .ob-skip{align-self:flex-end;color:var(--ink-2);font-size:13.5px;font-weight:700;padding:8px 4px}
  html[lang="ar"] .ob-skip{font-size:15px;font-weight:400}
  .ob-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10px 8px}
  .ob-art{width:190px;height:190px;margin-bottom:26px}
  .ob-title{font-size:24px;color:var(--teal-ink);line-height:1.5;max-width:320px}
  .ob-sub{font-size:15px;color:var(--ink-2);margin-top:10px;max-width:320px}
  .dots{display:flex;justify-content:center;gap:8px;margin:18px 0 16px}
  .dots button{width:8px;height:8px;border-radius:99px;background:var(--line);padding:0;transition:all .25s}
  .dots button.on{width:22px;background:var(--teal)}

  /* loading */
  #screen-loading{align-items:center;justify-content:center;text-align:center}
  .lens-anim{width:84px;height:84px;margin-bottom:22px;animation:sway 1.6s ease-in-out infinite}
  @keyframes sway{0%,100%{transform:translateX(-9px) rotate(-4deg)}50%{transform:translateX(9px) rotate(4deg)}}
  .load-step{font-size:17px;color:var(--teal-ink);min-height:1.8em}
  .load-sub{font-size:13px;color:var(--ink-2);margin-top:6px}

  /* result */
  .back{display:flex;align-items:center;gap:6px;color:var(--teal);font-size:14px;font-weight:700;padding:8px 2px;align-self:flex-start}
  .score-card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:24px 20px;text-align:center;box-shadow:0 1px 3px rgba(43,50,48,.05)}
  .ring{width:120px;height:120px;margin:0 auto 10px;position:relative}
  .ring svg{transform:rotate(-90deg)}
  .ring circle.track{stroke:#E8DFCE}
  .ring circle.val{transition:stroke-dashoffset 1.1s cubic-bezier(.4,0,.2,1)}
  .ring .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .ring .num b{font-family:var(--en);font-size:32px;color:var(--teal-ink);line-height:1}
  .ring .num i{font-style:normal;font-size:11px;color:var(--ink-2);direction:ltr}
  .verdict{font-size:18px;color:var(--ink);line-height:1.8}
  .doc-label{display:inline-block;margin-top:10px;font-size:12.5px;color:var(--teal);background:var(--teal-soft);border-radius:999px;padding:4px 14px;font-weight:700}
  .legend{display:flex;justify-content:center;gap:14px;margin-top:14px;font-size:11.5px;color:var(--ink-2);flex-wrap:wrap}
  .legend i{font-style:normal;display:inline-block;width:9px;height:9px;border-radius:99px;margin-inline-end:5px}
  .flags{margin-top:16px;display:grid;gap:10px}
  .flag{border-radius:16px;padding:0;text-align:start;overflow:hidden}
  .flag>button{display:flex;gap:12px;align-items:flex-start;width:100%;padding:13px 15px;text-align:start}
  .flag .dot{flex:none;width:26px;height:26px;border-radius:999px;display:flex;align-items:center;justify-content:center;margin-top:3px}
  .flag .dot svg{width:13px;height:13px}
  .flag h4{font-size:15px;color:var(--ink);line-height:1.5}
  .flag p{font-size:13px;color:var(--ink-2);line-height:1.65;margin-top:2px}
  .flag .chev{margin-inline-start:auto;color:var(--ink-2);transition:transform .2s;margin-top:6px}
  .flag.open .chev{transform:rotate(90deg)}
  .flag .advice{display:none;padding:0 15px 14px;padding-inline-start:53px}
  .flag.open .advice{display:block}
  .advice .tip{background:rgba(253,250,243,.75);border-radius:12px;padding:10px 13px;font-size:13px;color:var(--ink);line-height:1.7}
  .advice .tip b{color:var(--teal-ink)}
  .flag.red{background:var(--red-bg)} .flag.red .dot{background:var(--red)}
  .flag.amber{background:var(--amber-bg)} .flag.amber .dot{background:var(--amber)}
  .flag.green{background:var(--green-bg)} .flag.green .dot{background:var(--green)}

  /* negotiation letter upsell + paywall */
  .letter-tease{display:flex;align-items:center;gap:12px;width:100%;background:var(--amber-bg);border:1px solid #EAD9B4;border-radius:16px;padding:13px 15px;margin-top:12px;text-align:start}
  .letter-tease .lock{flex:none;width:38px;height:38px;border-radius:12px;background:var(--amber);display:flex;align-items:center;justify-content:center}
  .letter-tease .lock svg{width:19px;height:19px}
  .letter-tease b{display:block;font-size:14.5px;color:var(--ink)}
  .letter-tease span{font-size:12.5px;color:var(--ink-2)}
  .letter-tease .go{margin-inline-start:auto;color:#8A6114;font-size:18px}

  .pw-note{text-align:center;font-size:12.5px;color:var(--green);font-weight:700;margin:2px 0 12px}
  html[lang="ar"] .pw-note{font-weight:400;font-size:14px}
  .preview{position:relative;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;overflow:hidden}
  .preview .ltr-head{font-size:13px;color:var(--ink-2);margin-bottom:10px}
  .preview .body{font-size:14px;line-height:1.9;color:var(--ink)}
  .preview .fog{filter:blur(5px);user-select:none;pointer-events:none}
  .preview .veil{position:absolute;inset:0;background:linear-gradient(to bottom,transparent 18%,var(--card) 82%)}
  .preview .veil-lock{position:absolute;inset-inline:0;bottom:18px;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--ink-2);font-size:13px}
  .preview .veil-lock .lk{width:40px;height:40px;border-radius:999px;background:var(--teal);display:flex;align-items:center;justify-content:center}
  .preview .veil-lock .lk svg{width:19px;height:19px}
  .plans{display:grid;gap:10px;margin-top:14px}
  .plan{display:flex;align-items:center;gap:12px;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:13px 15px;text-align:start;transition:border-color .15s}
  .plan.sel{border-color:var(--teal);background:#F4F8F6}
  .plan .radio{flex:none;width:20px;height:20px;border-radius:99px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center}
  .plan.sel .radio{border-color:var(--teal)}
  .plan.sel .radio::after{content:"";width:10px;height:10px;border-radius:99px;background:var(--teal)}
  .plan b{display:block;font-size:14.5px;color:var(--ink)}
  .plan span{font-size:12px;color:var(--ink-2);line-height:1.5;display:block}
  .plan .price{margin-inline-start:auto;font-family:var(--en);font-weight:800;font-size:16px;color:var(--teal-ink);white-space:nowrap}
  .plan .badge{display:inline-block;font-size:10.5px;font-weight:700;color:#8A6114;background:var(--amber-bg);border-radius:99px;padding:1px 8px;margin-inline-start:6px;vertical-align:middle}
  .pay-methods{display:flex;justify-content:center;gap:8px;margin-top:10px;font-size:11.5px;color:var(--ink-2)}
  .pay-methods i{font-style:normal;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:2px 10px;font-family:var(--en);font-weight:700}
  .demo-tag{text-align:center;font-size:11.5px;color:var(--ink-2);margin-top:8px}

  /* unlocked letter */
  .letter{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 20px}
  .letter .body{font-size:14.5px;line-height:2;color:var(--ink);white-space:pre-line}
  .letter-actions{display:flex;gap:10px;margin-top:14px}
  .letter-actions .primary{margin-top:0;flex:1}
  .ghost{flex:1;border:2px solid var(--teal);color:var(--teal);border-radius:16px;padding:13px;font-weight:700;font-size:15px}

  /* feedback */
  .feedback{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px 20px;margin-top:14px;text-align:center}
  .fb-q{font-size:15.5px;color:var(--ink)}
  .fb-btns{display:flex;justify-content:center;gap:14px;margin-top:12px}
  .fb-btns button{width:46px;height:46px;border-radius:999px;background:var(--sand);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;transition:border-color .15s,background .15s}
  .fb-btns button:hover{border-color:var(--teal)}
  .fb-btns svg{width:22px;height:22px}
  .fb-comment{margin-top:14px}
  .fb-comment textarea{min-height:72px;font-size:13.5px}
  .fb-comment .primary{margin-top:10px;padding:12px;font-size:14.5px}
  .fb-thanks{display:flex;align-items:center;justify-content:center;gap:10px;color:var(--ink);font-size:15px;padding:6px 0}
  .fb-thanks .tick{flex:none;width:28px;height:28px;border-radius:999px;background:var(--green);display:flex;align-items:center;justify-content:center}
  .fb-thanks .tick svg{width:14px;height:14px}

  /* clauses */
  .clause{background:var(--card);border:1px solid var(--line);border-radius:18px;margin-bottom:12px;overflow:hidden}
  .clause .head{display:flex;align-items:center;gap:10px;padding:13px 16px}
  .clause .stripe{flex:none;width:10px;height:10px;border-radius:99px}
  .clause h4{font-size:15px;color:var(--ink);flex:1}
  .clause .quote{margin:0 16px;padding:10px 14px;background:var(--sand);border-inline-start:3px solid var(--line);border-radius:8px;font-size:12.5px;color:var(--ink-2);line-height:1.7;font-style:italic}
  .clause .plain{padding:10px 16px 4px;font-size:14px;color:var(--ink);line-height:1.75}
  .clause .act{margin:8px 16px 14px;display:inline-block;font-size:12.5px;font-weight:700;border-radius:999px;padding:4px 12px}
  .clause.red .stripe{background:var(--red)} .clause.red .act{background:var(--red-bg);color:var(--red)}
  .clause.amber .stripe{background:var(--amber)} .clause.amber .act{background:var(--amber-bg);color:#8A6114}
  .clause.green .stripe{background:var(--green)} .clause.green .act{background:var(--green-bg);color:#33663D}
  .section-title{font-size:19px;color:var(--teal-ink);margin:6px 2px 14px}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <g id="mark-lens" fill="none">
    <circle cx="27.5" cy="27.5" r="17.5" stroke-width="5.5"/>
    <path d="M19.5 28.5l6 6 11-12.5" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M41 41l11.5 11.5" stroke-width="6.5" stroke-linecap="round"/>
  </g>
  <g id="ic-doc" fill="none" stroke="#1E6E64">
    <rect x="14" y="6" width="36" height="52" rx="8" stroke-width="5"/>
    <path d="M24 20h16M24 30h16M24 40h10" stroke-width="4.5" stroke-linecap="round"/>
  </g>
  <g id="ic-home" fill="none" stroke="#1E6E64">
    <path d="M10 30L32 12l22 18" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M16 28v24h32V28" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g id="ic-pen" fill="none" stroke="#1E6E64">
    <path d="M40 10l14 14L26 52H12V38L40 10z" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</defs></svg>

<div class="app">
  <header class="bar">
    <div class="brand">
      <svg viewBox="0 0 64 64" stroke="#134B44"><use href="#mark-lens"/></svg>
      <div><div class="name-ar">وضوح</div><div class="name-en">Wodouh</div></div>
    </div>
    <button class="lang-toggle" id="langToggle" onclick="toggleLang()">English</button>
  </header>

  <!-- ONBOARDING -->
  <section class="screen active" id="screen-onboard">
    <button class="ob-skip" id="obSkip" onclick="show('home')"></button>
    <div class="ob-body">
      <div class="ob-art" id="obArt"></div>
      <div class="ob-title" id="obTitle"></div>
      <div class="ob-sub" id="obSub"></div>
    </div>
    <div class="dots" id="obDots"></div>
    <button class="primary" id="obNext" onclick="obNext()" style="margin-top:0"></button>
  </section>

  <!-- HOME -->
  <section class="screen" id="screen-home">
    <h1 class="hello" data-t="hello"></h1>
    <p class="sub" data-t="sub"></p>
    <div class="samples">
      <button class="sample" onclick="analyze('employment')">
        <span class="ic"><svg viewBox="0 0 64 64"><use href="#ic-doc"/></svg></span>
        <span><b data-t="s_emp"></b><span data-t="s_emp_d"></span></span>
        <span class="go">‹</span>
      </button>
      <button class="sample" onclick="analyze('rental')">
        <span class="ic"><svg viewBox="0 0 64 64"><use href="#ic-home"/></svg></span>
        <span><b data-t="s_rent"></b><span data-t="s_rent_d"></span></span>
        <span class="go">‹</span>
      </button>
      <button class="sample" onclick="analyze('freelance')">
        <span class="ic"><svg viewBox="0 0 64 64"><use href="#ic-pen"/></svg></span>
        <span><b data-t="s_free"></b><span data-t="s_free_d"></span></span>
        <span class="go">‹</span>
      </button>
    </div>
    <div class="or" data-t="or"></div>
    <textarea id="pasteBox" oninput="pasteChanged()"></textarea>
    <button class="primary" id="analyzeBtn" disabled onclick="analyze('pasted')" data-t="analyze"></button>
    <p class="disclaimer" data-t="disclaimer"></p>
  </section>

  <!-- LOADING -->
  <section class="screen" id="screen-loading">
    <svg class="lens-anim" viewBox="0 0 64 64" stroke="#1E6E64"><use href="#mark-lens"/></svg>
    <div class="load-step" id="loadStep"></div>
    <div class="load-sub" data-t="load_sub"></div>
  </section>

  <!-- RESULT -->
  <section class="screen" id="screen-result">
    <button class="back" onclick="show('home')"><span>‹</span><span data-t="back_home"></span></button>
    <div class="score-card">
      <div class="ring">
        <svg width="120" height="120" viewBox="0 0 120 120">
          <circle class="track" cx="60" cy="60" r="52" stroke-width="9" fill="none"/>
          <circle class="val" id="ringVal" cx="60" cy="60" r="52" stroke="#1E6E64" stroke-width="9" fill="none"
                  stroke-linecap="round" stroke-dasharray="326.7" stroke-dashoffset="326.7"/>
        </svg>
        <div class="num"><b id="scoreNum">0</b><i>/ 100</i></div>
      </div>
      <div class="verdict" id="verdict"></div>
      <span class="doc-label" id="docLabel"></span>
      <div class="legend">
        <span><i style="background:var(--red)"></i><span data-t="lg_red"></span></span>
        <span><i style="background:var(--amber)"></i><span data-t="lg_amber"></span></span>
        <span><i style="background:var(--green)"></i><span data-t="lg_green"></span></span>
      </div>
      <div class="flags" id="flags"></div>
      <button class="primary" onclick="show('clauses')" data-t="cta_clauses"></button>
      <button class="letter-tease" id="letterTease" onclick="openPaywall()">
        <span class="lock"><svg viewBox="0 0 24 24" fill="none" stroke="#FDFAF3" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></span>
        <span><b data-t="lt_title"></b><span data-t="lt_sub"></span></span>
        <span class="go">‹</span>
      </button>
    </div>
    <div class="feedback" id="feedback"></div>
    <p class="disclaimer" data-t="disclaimer"></p>
  </section>

  <!-- PAYWALL -->
  <section class="screen" id="screen-paywall">
    <button class="back" onclick="show('result')"><span>‹</span><span data-t="back_score"></span></button>
    <h2 class="section-title" data-t="pw_title"></h2>
    <p class="pw-note" data-t="pw_free_note"></p>
    <div class="preview">
      <div class="ltr-head" id="pwPreviewHead"></div>
      <div class="body" id="pwPreviewIntro"></div>
      <div class="body fog" id="pwPreviewFog" aria-hidden="true"></div>
      <div class="veil"></div>
      <div class="veil-lock">
        <span class="lk"><svg viewBox="0 0 24 24" fill="none" stroke="#F7F1E6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></span>
        <span id="pwLockLine"></span>
      </div>
    </div>
    <div class="plans" id="plans"></div>
    <button class="primary" id="payBtn" onclick="pwPay()"></button>
    <div class="pay-methods"><i>mada</i><i>Apple&nbsp;Pay</i><i>STC&nbsp;Pay</i></div>
    <p class="demo-tag" data-t="pw_demo"></p>
    <p class="disclaimer" data-t="disclaimer"></p>
  </section>

  <!-- UNLOCKED LETTER -->
  <section class="screen" id="screen-letter">
    <button class="back" onclick="show('result')"><span>‹</span><span data-t="back_score"></span></button>
    <h2 class="section-title" data-t="lt_ready"></h2>
    <div class="letter"><div class="body" id="letterBody"></div></div>
    <div class="letter-actions">
      <button class="ghost" id="copyBtn" onclick="copyLetter()"></button>
      <button class="primary" onclick="show('clauses')" data-t="cta_clauses"></button>
    </div>
    <p class="disclaimer" data-t="disclaimer"></p>
  </section>

  <!-- CLAUSES -->
  <section class="screen" id="screen-clauses">
    <button class="back" onclick="show('result')"><span>‹</span><span data-t="back_score"></span></button>
    <h2 class="section-title" data-t="clauses_title"></h2>
    <div id="clauseList"></div>
    <p class="disclaimer" data-t="disclaimer"></p>
  </section>
</div>

<script>
/* ------------------------------------------------------------------ i18n */
const T = {
  ob_skip:{ar:"تخطّي",en:"Skip"},

  { re:/(notice\s*period|(?:60|٦٠|sixty|ستين|ستون)\s*(?:يوم|day))/i, s:"amber",
    t:{ar:"مدة الإشعار",en:"Notice period"},
    p:{ar:"انتبه لمدة الإشعار المطلوبة قبل إنهاء العقد — المدد الطويلة تقيّد حركتك.",
       en:"Watch the required notice period — long ones limit your flexibility."},
    a:{ar:"الشائع ٣٠ يومًا؛ فاوض إن كانت أطول.",en:"Thirty days is common; negotiate if it's longer."} },
  { re:/(auto[- ]?renew|تجديد\s*تلقائي)/i, s:"amber",
    t:{ar:"التجديد التلقائي",en:"Auto-renewal"},
    p:{ar:"العقد يتجدد تلقائيًا. لا بأس بذلك إذا كانت مهلة الاعتراض واضحة ومعقولة.",
       en:"The contract auto-renews. That's fine if the opt-out window is clear and reasonable."},
    a:{ar:"سجّل موعد الاعتراض في تقويمك واطلب تذكيرًا كتابيًا قبله.",
       en:"Note the opt-out date and ask for a written reminder before it."} },
  { re:/(intellectual\s*property|ملكية\s*فكرية|جميع\s*(الأعمال|الحقوق))/i, s:"amber",
    t:{ar:"الملكية الفكرية",en:"Intellectual property"},
    p:{ar:"يوجد بند ملكية فكرية. تأكد أنه محصور في مخرجات هذا الاتفاق ولا يشمل أعمالك السابقة.",
       en:"There's an IP clause. Make sure it's limited to this agreement's deliverables, not your past work."},
    a:{ar:"احصر النقل في مخرجات المشروع فقط.",en:"Limit the transfer to project deliverables only."} },
  { re:/(probation|فترة\s*التجربة)/i, s:"green",
    t:{ar:"فترة التجربة",en:"Probation period"},
    p:{ar:"فترة تجربة موثقة — أمر طبيعي. تأكد فقط ألا تتجاوز المدد المعتادة.",
       en:"A documented probation period — normal. Just check it doesn't exceed the usual limits."}, a:null },
  { re:/(annual\s*leave|إجازة\s*سنوية)/i, s:"green",
    t:{ar:"الإجازة السنوية",en:"Annual leave"},
    p:{ar:"العقد ينص على إجازة سنوية — تأكد من عدد الأيام وأنها مدفوعة.",
       en:"The contract covers annual leave — check the day count and that it's paid."}, a:null },
  { re:/(salary|راتب|أجر\s*شهري)/i, s:"green",
    t:{ar:"الراتب",en:"Salary"},
    p:{ar:"الراتب مذكور. تأكد أن المبلغ والبدلات ومواعيد الدفع كلها مكتوبة بأرقام.",
       en:"Salary is mentioned. Confirm the amount, allowances, and payment dates are all in numbers."}, a:null }
];

function analyzePasted(text){
  const clauses = [];
  for (const r of RULES) if (r.re.test(text)) clauses.push({ s:r.s, t:r.t, p:r.p, a:r.a, q:null });
  if (!clauses.length){
    clauses.push({ s:"amber", q:null,
      t:{ar:"ما قدرنا نتعرف على بنود مألوفة",en:"We couldn't recognize familiar clauses"},
      p:{ar:"النص قصير أو صيغته غير معتادة. جرّب لصق العقد كاملًا، أو ابدأ بعقد تجريبي لتشوف كيف يشتغل وضوح.",
         en:"The text is short or unusual in form. Try pasting the full contract, or start with a sample to see how Wodouh works."},
      a:{ar:"الصق نص العقد كاملًا بما فيه العناوين.",en:"Paste the full contract text, headings included."} });
  }
  clauses.sort((x,y)=>({red:0,amber:1,green:2}[x.s]-{red:0,amber:1,green:2}[y.s]));
  let score = 100;
  for (const c of clauses) score -= c.s==="red" ? 16 : c.s==="amber" ? 8 : 0;
  score = Math.max(25, Math.min(95, score));
  const reds = clauses.filter(c=>c.s==="red").length, ambers = clauses.filter(c=>c.s==="amber").length;
  let verdict;
  if (reds) verdict = {ar:"فيه بنود تحتاج وقفة قبل التوقيع — اقرأ التنبيهات الحمراء أولًا.",
                       en:"Some clauses need a pause before signing — read the red flags first."};
  else if (ambers) verdict = {ar:"لا يوجد ما يقلق — لكن فيه نقاط تستاهل التفاوض.",
                              en:"Nothing alarming — but a few points are worth negotiating."};
  else verdict = {ar:"ما وجدنا مؤشرات خطر في النص المرسل.",en:"We found no risk signals in the submitted text."};
  return { score, doc:"doc_pasted", verdict, clauses };
}

/* --------------------------------------------------------------- state */
let lang = "ar";
let current = null;

function t(k){ return T[k][lang]; }

function applyLang(){
  document.documentElement.lang = lang;
  document.documentElement.dir = lang==="ar" ? "rtl" : "ltr";
  document.title = lang==="ar" ? "وضوح — Wodouh" : "Wodouh — وضوح";
  document.getElementById("langToggle").textContent = lang==="ar" ? "English" : "عربي";
  document.querySelectorAll("[data-t]").forEach(el=>{ el.textContent = t(el.dataset.t); });
  document.getElementById("pasteBox").placeholder = t("paste_ph");
  renderOnboard();
  if (current){
    renderResult(false); renderClauses(); renderFeedback();
    renderPaywall(); renderLetter();
  }
}
function toggleLang(){ lang = lang==="ar" ? "en" : "ar"; applyLang(); }

function show(name){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  document.getElementById("screen-"+name).classList.add("active");
  window.scrollTo(0,0);
  if (name==="result") animateRing();
}

/* ---------------------------------------------------------- onboarding */
let obIndex = 0;
function renderOnboard(){
  const s = OB[obIndex];
  document.getElementById("obArt").innerHTML = s.art;
  document.getElementById("obTitle").textContent = s.title[lang];
  document.getElementById("obSub").textContent = s.sub[lang];
  document.getElementById("obSkip").textContent = t("ob_skip");
  document.getElementById("obNext").textContent = obIndex === OB.length-1 ? t("ob_start") : t("ob_next");
  document.getElementById("obSkip").style.visibility = obIndex === OB.length-1 ? "hidden" : "visible";
  const dots = document.getElementById("obDots");
  dots.innerHTML = "";
  OB.forEach((_,i)=>{
    const d = document.createElement("button");
    if (i===obIndex) d.className = "on";
    d.setAttribute("aria-label", (i+1)+" / "+OB.length);
    d.onclick = ()=>{ obIndex = i; renderOnboard(); };
    dots.appendChild(d);
  });
}
function obNext(){
  if (obIndex < OB.length-1){ obIndex++; renderOnboard(); }
  else show("home");
}

function pasteChanged(){
  document.getElementById("analyzeBtn").disabled =
    document.getElementById("pasteBox").value.trim().length < 40;
}

/* ------------------------------------------------------------- analyze */
function analyze(kind){
  current = kind==="pasted"
    ? analyzePasted(document.getElementById("pasteBox").value)
    : SAMPLES[kind];
  fbState = "ask";
  pwPaid = false; pwPlan = 0;
  show("loading");
  const steps = T.load_steps[lang]; let i = 0;
  const el = document.getElementById("loadStep");
  el.textContent = steps[0];
  const iv = setInterval(()=>{
    i++;
    if (i < steps.length) el.textContent = steps[i];
    else { clearInterval(iv); renderResult(true); renderClauses(); renderFeedback(); show("result"); }
  }, 650);
}

/* -------------------------------------------------------------- render */
const ICONS = {
  red:'<svg viewBox="0 0 14 14" fill="none"><path d="M7 3v5M7 10.6v.4" stroke="#F7F1E6" stroke-width="2.2" stroke-linecap="round"/></svg>',
  amber:'<svg viewBox="0 0 14 14" fill="none"><path d="M7 3v4.5M7 10.6v.4" stroke="#FDFAF3" stroke-width="2.2" stroke-linecap="round"/></svg>',
  green:'<svg viewBox="0 0 14 14" fill="none"><path d="M3.2 7.4l2.6 2.6 5-5.6" stroke="#FDFAF3" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>'
};

function renderResult(reset){
  document.getElementById("verdict").textContent = current.verdict[lang];
  document.getElementById("docLabel").textContent = t(current.doc);
  if (reset){
    document.getElementById("scoreNum").textContent = "0";
    document.getElementById("ringVal").style.strokeDashoffset = "326.7";
  } else {
    setRing(current.score);
  }
  document.getElementById("letterTease").style.display = negotiables().length ? "flex" : "none";
  const wrap = document.getElementById("flags");
  wrap.innerHTML = "";
  current.clauses.forEach(c=>{
    const div = document.createElement("div");
    div.className = "flag " + c.s;
    const advice = c.a ? `<div class="advice"><div class="tip"><b>${t("what_to_do")}:</b> ${c.a[lang]}</div></div>` : "";
    div.innerHTML =
      `<button onclick="this.parentNode.classList.toggle('open')" ${c.a?"":"disabled style='cursor:default'"}>
         <span class="dot">${ICONS[c.s]}</span>
         <span style="flex:1"><h4>${c.t[lang]}</h4><p>${c.p[lang]}</p></span>
         ${c.a ? '<span class="chev">‹</span>' : ''}
       </button>${advice}`;
    wrap.appendChild(div);
  });
}

function setRing(score){
  const C = 326.7;
  document.getElementById("ringVal").style.strokeDashoffset = String(C * (1 - score/100));
  document.getElementById("scoreNum").textContent = String(score);
}

function animateRing(){
  const target = current.score;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    setRing(target);
    const numEl = document.getElementById("scoreNum");
    const t0 = performance.now();
    (function tick(now){
      const k = Math.min(1,(now-t0)/1100);
      numEl.textContent = String(Math.round(target * (1-Math.pow(1-k,3))));
      if (k<1) requestAnimationFrame(tick);
    })(t0);
  }));
}

/* ------------------------------------- negotiation letter + paywall */
let pwPlan = 0, pwPaid = false;
const PLANS = [
  { name:"plan_letter", desc:"plan_letter_d", price:{ar:"٢٩ ر.س",en:"29 SAR"}, pop:false },
  { name:"plan_lawyer", desc:"plan_lawyer_d", price:{ar:"١٤٩ ر.س",en:"149 SAR"}, pop:true }
];
const LETTER_TO = {
  doc_emp:{ar:"إلى: قسم الموارد البشرية",en:"To: The HR department"},
  doc_rent:{ar:"إلى: المؤجّر الكريم",en:"To: The landlord"},
  doc_free:{ar:"إلى: العميل الكريم",en:"To: The client"},
  doc_pasted:{ar:"إلى: الطرف الآخر",en:"To: The other party"}
};
const AR_NUM = ["١","٢","٣","٤","٥","٦","٧","٨","٩"];

function negotiables(){ return current ? current.clauses.filter(c=>c.a) : []; }

function buildLetter(){
  const items = negotiables();
  const list = items.map((c,i)=>{
    const n = lang==="ar" ? AR_NUM[i] : String(i+1);
    return `${n}. ${c.t[lang]}: ${c.a[lang]}`;
  }).join("\n");
  if (lang==="ar")
    return `السلام عليكم ورحمة الله،\n\nاطلعت على ${t(current.doc)} المعروض، وأشكركم على الثقة. قبل التوقيع، أتمنى مناقشة النقاط التالية:\n\n${list}\n\nواثق أننا نصل لصيغة عادلة للطرفين، وحاضر لأي نقاش.\n\nمع خالص التحية،\n[اسمك]`;
  return `Dear Sir or Madam,\n\nThank you for sending the ${t(current.doc).toLowerCase()}. Before signing, I would like to discuss the following points:\n\n${list}\n\nI'm confident we can reach wording that is fair to both sides, and I'm happy to talk any of this through.\n\nBest regards,\n[Your name]`;
}

function openPaywall(){
  if (pwPaid){ renderLetter(); show("letter"); return; }
  renderPaywall(); show("paywall");
}

function renderPaywall(){
  if (!current || !negotiables().length) return;
  const full = buildLetter();
  const lines = full.split("\n");
  document.getElementById("pwPreviewHead").textContent = LETTER_TO[current.doc][lang];
  document.getElementById("pwPreviewIntro").textContent = lines.slice(0,3).join("\n");
  document.getElementById("pwPreviewFog").textContent = lines.slice(3).join("\n");
  document.getElementById("pwLockLine").textContent = t("pw_lock");
  const wrap = document.getElementById("plans");
  wrap.innerHTML = "";
  PLANS.forEach((pl,i)=>{
    const b = document.createElement("button");
    b.className = "plan" + (i===pwPlan ? " sel" : "");
    b.innerHTML =
      `<span class="radio"></span>
       <span style="flex:1"><b>${t(pl.name)}${pl.pop?`<span class="badge">${t("plan_pop")}</span>`:""}</b><span>${t(pl.desc)}</span></span>
       <span class="price">${pl.price[lang]}</span>`;
    b.onclick = ()=>{ pwPlan = i; renderPaywall(); };
    wrap.appendChild(b);
  });
  const pay = document.getElementById("payBtn");
  pay.disabled = false;
  pay.textContent = `${t("pw_pay")} ${PLANS[pwPlan].price[lang]}`;
}

function pwPay(){
  const pay = document.getElementById("payBtn");
  pay.disabled = true;
  pay.textContent = t("pw_paying");
  setTimeout(()=>{
    pwPaid = true;
    renderLetter();
    show("letter");
  }, 900);
}

function renderLetter(){
  if (!current || !negotiables().length) return;
  document.getElementById("letterBody").textContent =
    LETTER_TO[current.doc][lang] + "\n\n" + buildLetter();
  document.getElementById("copyBtn").textContent = t("copy_btn");
}

function copyLetter(){
  const btn = document.getElementById("copyBtn");
  const done = ()=>{ btn.textContent = t("copied"); setTimeout(()=>{ btn.textContent = t("copy_btn"); }, 1600); };
  if (navigator.clipboard) navigator.clipboard.writeText(document.getElementById("letterBody").textContent).then(done, done);
  else done();
}

/* ------------------------------------------------------------ feedback */
let fbState = "ask";           /* ask | comment | done */
const FEEDBACK = [];

function renderFeedback(){
  const el = document.getElementById("feedback");
  const prevText = document.getElementById("fbText") ? document.getElementById("fbText").value : "";
  if (fbState === "done"){
    el.innerHTML =
      `<div class="fb-thanks">
         <span class="tick"><svg viewBox="0 0 14 14" fill="none"><path d="M3.2 7.4l2.6 2.6 5-5.6" stroke="#FDFAF3" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
         <span>${t("fb_thanks")}</span>
       </div>`;
    return;
  }
  const comment = fbState === "comment"
    ? `<div class="fb-comment">
         <textarea id="fbText" placeholder="${t("fb_comment_ph")}"></textarea>
         <button class="primary" onclick="fbSend()">${t("fb_send")}</button>
       </div>`
    : "";
  el.innerHTML =
    `<div class="fb-q">${t("fb_q")}</div>
     <div class="fb-btns">
       <button aria-label="${t("fb_up")}" title="${t("fb_up")}" onclick="fbVote(true)">
         <svg viewBox="0 0 24 24" fill="none" stroke="#1E6E64" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 11v9M7 11l4-7c1.4 0 2.5 1.1 2.5 2.5V9H19a1.8 1.8 0 0 1 1.8 2.1l-1.2 7A1.8 1.8 0 0 1 17.8 20H7"/></svg>
       </button>
       <button aria-label="${t("fb_down")}" title="${t("fb_down")}" onclick="fbVote(false)">
         <svg viewBox="0 0 24 24" fill="none" stroke="#B4544A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 13V4M17 13l-4 7c-1.4 0-2.5-1.1-2.5-2.5V15H5a1.8 1.8 0 0 1-1.8-2.1l1.2-7A1.8 1.8 0 0 1 6.2 4H17"/></svg>
       </button>
     </div>${comment}`;
  if (fbState === "comment" && prevText) document.getElementById("fbText").value = prevText;
}

function fbRecord(vote, comment){
  FEEDBACK.push({ doc: current ? current.doc : null, score: current ? current.score : null, vote, comment: comment || "" });
  console.log("wodouh feedback:", FEEDBACK[FEEDBACK.length-1]);
}

function fbVote(up){
  if (up){ fbRecord("up"); fbState = "done"; }
  else fbState = "comment";
  renderFeedback();
}

function fbSend(){
  fbRecord("down", document.getElementById("fbText").value.trim());
  fbState = "done";
  renderFeedback();
}

function renderClauses(){
  const wrap = document.getElementById("clauseList");
  wrap.innerHTML = "";
  current.clauses.forEach(c=>{
    const div = document.createElement("div");
    div.className = "clause " + c.s;
    const quote = c.q ? `<div class="quote">«${c.q[lang]}»</div>` : "";
    const act = t(c.s==="red"?"act_red":c.s==="amber"?"act_amber":"act_green");
    const advice = c.a ? ` ${c.a[lang]}` : "";
    div.innerHTML =
      `<div class="head"><span class="stripe"></span><h4>${c.t[lang]}</h4></div>
       ${quote}
       <div class="plain">${c.p[lang]}${advice}</div>
       <span class="act">${act}</span>`;
    wrap.appendChild(div);
  });
}

applyLang();
</script>
