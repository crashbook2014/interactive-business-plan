    /* textContent, never innerHTML: this string came from a model that read an
       attacker-supplied document. */
    host.querySelector(".ai-summary").textContent = aiFindings.summary || "";
    host.querySelectorAll(".ai-find").forEach((el, i) => {
      el.querySelector("b").textContent = aiFindings.findings[i].title;
      el.querySelector("p").textContent = aiFindings.findings[i].detail;
    });
    return;
  }
  if (aiError){
    host.innerHTML =
      `<div class="tm-sec"><b>${t("ai_title")}</b><p>${t(aiError)}</p>
         <button class="ghost wide" onclick="aiRun()">${t("ai_retry")}</button></div>`;
    return;
  }

  host.innerHTML =
    `<div class="tm-sec">
       <div class="hd"><b>${t("ai_title")}</b></div>
       <p>${t("ai_offer")}</p>
       <p><b>${t("ai_consent_h")}</b></p>
       <p>${t("ai_consent_b")}</p>
       <label class="ai-agree"><input type="checkbox" id="aiAgree"${aiConsent ? " checked" : ""}/>
         <span>${t("ai_agree")}</span></label>
       <button class="ghost wide" id="aiGo" disabled>${t("ai_go")}</button>
       <p class="tq-skip">${t("ai_decline")}</p>
     </div>` + aiReviewConsentHtml();
  const box = document.getElementById("aiAgree"), go = document.getElementById("aiGo");
  go.disabled = !box.checked;
  box.onchange = () => { aiConsent = box.checked; go.disabled = !box.checked; };
  go.onclick = aiRun;
  bindReviewConsent();
}

/* ============================================================ ask
 *
 * A question box, which is the most dangerous thing in this app.
 *
 * Everything else here answers from rules a human verified, or refuses. This
 * answers open questions, and the honest position is that most of them fall
 * outside what we have verified. Two decisions follow from that, and they are
 * the whole design:
 *
 *   1. AN UNVERIFIED ANSWER IS STILL OFFERED. "We can't help you" is worse
 *      for someone who has just lost their income than a clearly labelled
 *      best effort. But it is labelled by the SERVER, on the evidence of what
 *      the answer actually cited — never by the model's own say-so, and never
 *      by this file, which cannot check anything.
 *
 *   2. THE LABEL IS THE PRODUCT. A verified answer carries the register rows
 *      it stands on, in the same .src-line.law style every other legal claim
 *      in Wodouh uses. An unverified answer gets a visually distinct block
 *      that says, in the reader's own language, that we have not checked it
 *      and it carries no article number. If those two ever start looking
 *      alike, this feature has become the thing the rest of the app exists to
 *      avoid.
 *
 * The daily cap is per device and lives with the rest of the saved state. It
 * exists because this costs real money per question, and because a reader who
 * asks forty questions in an evening is not being helped by the fortieth.
 */
const ASK_PER_DAY = 5;
let askUsed = { day:"", n:0 };
let askConsent = false, askCtxConsent = false;
let askBusy = false, askAnswer = null, askError = null, askText = "";

function askAvailable(){ return aiAvailable(); }
function askToday(){ return new Date().toISOString().slice(0,10); }
function askLeft(){
  if (askUsed.day !== askToday()) return ASK_PER_DAY;
  return Math.max(0, ASK_PER_DAY - askUsed.n);
}
function askSpend(){
  const d = askToday();
  askUsed = askUsed.day === d ? { day:d, n:askUsed.n + 1 } : { day:d, n:1 };
  saveState();
}

/* The entry only exists in a build that can actually answer. */
function renderAskEntry(){
  const b = document.getElementById("askEntry");
  if (b) b.hidden = !askAvailable();
}

function openAsk(){
  /* Unreachable rather than merely unadvertised, the same rule openSignin()
     follows. Both doors are already hidden when there is no endpoint; this
     closes the case where something calls it anyway, so a screen that cannot
     answer can never be reached. */
  if (!askAvailable()) return;
  askAnswer = null; askError = null; renderAsk(); show("ask");
}

/* What we would send if the reader ticks the second box — and the same object
   is what the panel describes, so the copy cannot drift from the payload. */
/* Article numbers in the reader's own digits. Any non-numeric part of the
   citation — "Implementing Regulations, art. 6" — is left exactly as the
   register wrote it; only the digits move. */
function artNum(a){
  return String(a).replace(/\d+/g, d => fmtNum(Number(d)));
}

function askCtx(){
  if (!term) return null;
  const h = termHow();
  const out = {
    track: nat, how: term.how, contract: term.ctype,
    start: term.start, end: term.end,
    wage: term.wage, basic: term.basic
  };
  if (h && h.award === "resign") out.article87 = term.exc87;
  return Object.keys(out).some(k => out[k] !== null && out[k] !== undefined && out[k] !== "")
    ? out : null;
}

function renderAsk(){
  const host = document.getElementById("askBody");
  if (!host) return;
  const left = askLeft(), ctx = askCtx();

  if (askBusy){
    host.innerHTML = `<div class="tm-sec"><p>${t("ask_busy")}</p></div>`;
    return;
  }

  let out = "";

  if (askAnswer) out += askAnswerHtml(askAnswer);
  if (askError) out += `<div class="tm-sec"><p>${t(askError)}</p>
       ${askError === "ask_empty" ? "" : `<p class="tq-skip">${t("ask_spent")}</p>`}</div>`;

  if (left <= 0){
    out += `<div class="tm-sec"><p>${t("ask_none_left")}</p></div>`;
    host.innerHTML = out;
    return;
  }

  out +=
    `<div class="tm-sec">
       <textarea id="askQ" class="ask-q" rows="3" placeholder="${esc(t("ask_ph"))}">${esc(askText)}</textarea>
       <p><b>${t("ask_consent_h")}</b></p>
       <p>${t("ask_consent_b")}</p>
       <label class="ai-agree"><input type="checkbox" id="askAgree"${askConsent ? " checked" : ""}/>
         <span>${t("ask_agree")}</span></label>
       <div class="ask-ctx">
         <p><b>${t("ask_ctx_h")}</b></p>
         ${ctx
           ? `<p>${t("ask_ctx_b")}</p>
              <label class="ai-agree"><input type="checkbox" id="askCtxAgree"${askCtxConsent ? " checked" : ""}/>
                <span>${t("ask_ctx_agree")}</span></label>`
           : `<p class="tq-skip">${t("ask_ctx_none")}</p>`}
       </div>
       <button class="ghost wide" id="askGo" disabled>${askAnswer ? t("ask_again") : t("ask_go")}</button>
       <p class="tq-skip">${left === 1 ? t("ask_left_one")
          : left === 2 ? t("ask_left_two")
          : t("ask_left_n").replace("{n}", fmtNum(left))}</p>
     </div>`;

  host.innerHTML = out;

  const box = document.getElementById("askAgree"), go = document.getElementById("askGo"),
        q = document.getElementById("askQ"), ctxBox = document.getElementById("askCtxAgree");
  const sync = () => { go.disabled = !(box.checked && q.value.trim()); };
  box.onchange = () => { askConsent = box.checked; sync(); };
  q.oninput = () => { askText = q.value; sync(); };
  if (ctxBox) ctxBox.onchange = () => { askCtxConsent = ctxBox.checked; };
  go.onclick = askRun;
  sync();
}

/* Every field rendered with textContent-equivalent escaping. The answer is
   model output and the claims are our own file, but both go through esc()
   because the day one of them doesn't is the day this stops being true. */
function askAnswerHtml(a){
  if (a.tier === "refused"){
    const why = a.reason === "citation" ? "ask_ref_citation"
              : a.reason === "money" ? "ask_ref_money" : "ask_ref";
    return `<div class="tm-sec ask-ref"><p>${t(why)}</p></div>`;
  }
  if (a.tier === "verified"){
    return `<div class="tm-sec ask-ans verified">
       <div class="hd"><b>${t("ask_tier_v")}</b></div>
       <p class="ask-body">${esc(a.answer)}</p>
       <p class="ask-src-h">${t("ask_src_h")}</p>
       ${a.cites.map(c => `<div class="src-line law">${c.article ? esc(artNum(c.article)) + " — " : ""}${esc(c.claim)}</div>`).join("")}
     </div>`;
  }
  return `<div class="tm-sec ask-ans unverified">
     <div class="hd"><b>${t("ask_tier_u")}</b></div>
     <p class="ask-body">${esc(a.answer)}</p>
     <p class="ask-unv">${t("ask_unv_b")}</p>
   </div>`;
}

async function askRun(){
  const url = analyzeUrl();
  const q = (document.getElementById("askQ") || {}).value || "";
  if (!url || !askConsent) return;
  if (!q.trim()){ askError = "ask_empty"; renderAsk(); return; }
  if (askLeft() <= 0){ renderAsk(); return; }

  /* The question is KEPT until we actually have an answer. Clearing it up
     front meant a failed send cost the reader their allowance and their typing
     at the same time, and left them retyping from memory. */
  askText = q; askBusy = true; askError = null; askAnswer = null; renderAsk();
  /* Spent on the attempt, not on the answer. A cap that only counts successes
     is a cap a retry loop walks straight through. */
  askSpend();

  try {
    const body = { kind:"ask", q: q.trim().slice(0, 600), lang };
    /* Sent only on an explicit, separate tick — and read fresh here rather
       than trusted from a flag set earlier in the session. */
    if (askCtxConsent && askCtx()) body.ctx = askCtx();
    const res = await fetch(url, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify(body)
    });
    const d = await res.json().catch(() => null);
    if (!res.ok || !d || typeof d.tier !== "string"){
      askError = res.status === 429 ? "ai_busy" : "ask_err";
    } else {
      /* Coerced again on this side. The server already graded it; this guards
         the one class of bug that would put unlabelled text on screen — a
         tier we do not recognise must never render as the verified one. */
      const tier = d.tier === "verified" || d.tier === "refused" ? d.tier : "unverified";
      askAnswer = {
        tier,
        reason: typeof d.reason === "string" ? d.reason : null,
        answer: String(d.answer || "").slice(0, 1500),
        cites: tier === "verified" && Array.isArray(d.cites)
          ? d.cites.slice(0, 6).map(c => ({
              article: c && c.article ? String(c.article).slice(0, 60) : null,
              claim: String(c && c.claim || "").slice(0, 600)
            })).filter(c => c.claim)
          : []
      };
      /* A verified answer with nothing under it is not a verified answer.
         The server enforces this too; disagreeing with it here means
         something is wrong, and the safe reading is the weaker one. */
      if (askAnswer.tier === "verified" && !askAnswer.cites.length) askAnswer.tier = "unverified";
      askText = "";   /* answered — now the box can empty */
    }
  } catch(e){
    askError = "ask_offline";
  }
  askBusy = false;
  renderAsk();
}

/* A separate opt-in, because it sends something different. Folding it into the
   contract-read consent would make that consent's own promise — "not your
   figures, your answers" — a lie. */
function aiReviewConsentHtml(){
  if (!aiAvailable()) return "";
  return `<div class="tm-sec">
       <div class="hd"><b>${t("airv_title")}</b><span class="tm-tag review">${t("ai_tag")}</span></div>
       <p>${t("airv_offer")}</p>
       <p><b>${t("ai_consent_h")}</b></p>
       <p>${t("airv_consent_b")}</p>
       <p class="airv-reason">${t("airv_reason_warn")}</p>
       <label class="ai-agree"><input type="checkbox" id="aiRvAgree"${aiRvConsent ? " checked" : ""}/>
         <span>${t("airv_agree")}</span></label>
       <p class="tq-skip">${t("airv_decline")}</p>
     </div>`;
}

function bindReviewConsent(){
  const box = document.getElementById("aiRvAgree");
  if (box) box.onchange = () => { aiRvConsent = box.checked; };
}

/* The document text comes from whatever the reader already pasted into the
   contract review. We never reach for anything they did not hand us. */
function aiSourceText(){
  const box = document.getElementById("pasteBox");
  const v = box ? box.value.trim() : "";
  return v.length >= 200 ? v : "";
}

async function aiRun(){
  const url = analyzeUrl();
  if (!url || !aiConsent) return;
  const text = aiSourceText();
  if (!text){ aiError = "ai_notext"; renderAiPanel(); return; }

  aiBusy = true; aiError = null; renderAiPanel();
  try {
    const res = await fetch(url, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ kind: "contract", text: text.slice(0, 40000) })
    });
    const data = await res.json().catch(() => null);
    if (!res.ok || !data || !Array.isArray(data.findings)){
      aiError = res.status === 429 ? "ai_busy" : "ai_failed";
    } else {
      /* Cap and coerce again on this side. The server already did, and doing
         it twice costs nothing against the one class of bug that would put
         attacker text on screen. */
      aiFindings = {
        summary: String(data.summary || "").slice(0, 600),
        findings: data.findings.slice(0, 8).map(f => ({
          title: String(f && f.title || "").slice(0, 120),
          detail: String(f && f.detail || "").slice(0, 800),
          severity: f && (f.severity === "attention" || f.severity === "review")
            ? f.severity : "info"
        })).filter(f => f.title && f.detail)
      };
    }
  } catch(e){
    aiError = "ai_offline";
  }
  aiBusy = false;
  renderAiPanel();
}

/* ================================== pre-signing contract review
 *
 * The fifth analyze mode, and the only one aimed at a contract nobody has
 * signed yet — which is the moment a person still has leverage, and the only
 * moment advice can prevent a problem instead of describing one.
 *
 * WHAT IS DIFFERENT ABOUT CITATIONS HERE, SAID PLAINLY.
 *
 * Everywhere else in Wodouh an article number appears only when a human
 * verified it in the register. For this mode the product owner chose the
 * model's own judgement instead: cite when confident, nothing when not. That
 * is implemented as chosen. What the app does NOT do is let the two look the
 * same — the server marks every citation verified or not, and this renders the
 * unverified ones in the amber tier the Ask feature already uses, with the
 * warning attached. The reader is told which numbers a human checked rather
 * than left to assume.
 *
 * Everything the server refused — invented money, flat legal rulings — never
 * arrives here. This function is display; the guarantees are upstream in
 * review-contract.mjs and are not re-litigated on a device the reader controls.
 */
let crBusy = false, crResult = null, crError = null;

/* [payload key, label key, how to render it]. Days and hours carry their unit
   in the reader's own language rather than arriving as a bare number, because
   "180" alone is the kind of thing a worried reader misreads as months. */
const CR_KEYS = [
  ["position", "cr_k_pos", "bilingual"],
  ["salary_amount", "cr_k_salary", "money"],
  ["contract_duration", "cr_k_dur", "text"],
  ["probation_period_days", "cr_k_prob", "days"],
  ["notice_period_days", "cr_k_notice", "days"],
  ["working_hours_per_week", "cr_k_hours", "hours"],
];

/* Every value the model produced, rendered. Numbers go through fmtNum so an
   Arabic reader sees Arabic-Indic digits like everywhere else in the app. */
function crTermValue(kt, key, how){
  if (how === "bilingual"){
    const v = lang === "ar" ? kt[key + "_ar"] : kt[key + "_en"];
    return v || null;
  }
  if (how === "text") return kt[key] || null;
  const n = kt[key];
  if (typeof n !== "number" || !isFinite(n)) return null;
  if (how === "money") return fmtNum(n) + " " + (kt.salary_currency || "SAR");
  return t(how === "days" ? "cr_days" : "cr_hours").replace("{n}", fmtNum(n));
}

async function crRun(){
  const url = analyzeUrl();
  if (!url || !aiConsent) return;
  const text = aiSourceText();
  if (!text){ crError = "ai_notext"; renderCrPanel(); return; }

  crBusy = true; crError = null; crResult = null; renderCrPanel();
  try {
    const res = await fetch(url, {
      method: "POST",
      headers: { "content-type": "application/json" },
      /* The track the reader chose, sent as context. A resident and a Saudi
         get different findings on the same contract — passport retention,
         Iqama fees, sponsorship transfer and return airfare only apply to
         one of them, and raising them for the other is noise. */
      body: JSON.stringify({ kind: "contract_review", text: text.slice(0, 40000),
                             nat: nat === "nonsa" ? "nonsa" : "sa" })
    });
    const data = await res.json().catch(() => null);
    if (!res.ok || !data || typeof data !== "object" || !Array.isArray(data.red_flags)){
      crError = res.status === 429 ? "ai_busy" : "ai_failed";
    } else {
      crResult = data;
    }
  } catch(e){
    crError = "ai_offline";
  }
  crBusy = false;
  renderCrPanel();
}

/* One finding. Built as elements rather than a template string because every
   piece of text here originated in a document a third party wrote, and
   textContent is the only assignment that cannot become markup. */
function crFindingEl(f){
  const el = document.createElement("div");
  el.className = "ai-find " + (f.severity === "high" ? "attention" : "review");

  /* The clause first, quoted, so the reader can find it in their own document
     — then what is wrong with it, or what to ask for instead. A finding that
     names no clause is an opinion; one that quotes the clause is a pointer. */
  const clause = (lang === "ar" ? f.clause_ar : f.clause_en) || "";
  if (clause){
    const q = document.createElement("b");
    q.className = "cr-clause";
    q.textContent = clause;
    el.appendChild(q);
  }
  const body = (lang === "ar" ? (f.issue_ar || f.suggestion_ar)
                              : (f.issue_en || f.suggestion_en)) || "";
  const p = document.createElement("p");
  p.textContent = body;
  el.appendChild(p);

  const ref = f.law_reference;
  if (ref && ref.ref){
    const cite = document.createElement("p");
    /* The tier is a class, not a sentence, so it survives translation and
       cannot be lost in a copy edit. */
    cite.className = "cr-cite " + (ref.verified ? "verified" : "unverified");
    const num = document.createElement("b");
    num.textContent = ref.ref;
    const tag = document.createElement("span");
    tag.textContent = t(ref.verified ? "cr_v" : "cr_u");
    cite.appendChild(num); cite.appendChild(tag);
    el.appendChild(cite);
  }
  return el;
}

function renderCrPanel(){
  const host = document.getElementById("crPanel");
  if (!host) return;
  /* Unconfigured: nothing renders. Same shipped-inert rule as every other AI
     surface — an invisible feature cannot mislead anyone about where their
     contract goes. */
  if (!aiAvailable()){ host.hidden = true; host.innerHTML = ""; return; }
  host.hidden = false;
  host.innerHTML = "";

  const sec = document.createElement("div");
  sec.className = "tm-sec";
  const hd = document.createElement("div");
  hd.className = "hd";
  const hb = document.createElement("b"); hb.textContent = t("cr_title");
  hd.appendChild(hb); sec.appendChild(hd);
  host.appendChild(sec);

  if (crBusy){ const p = document.createElement("p"); p.textContent = t("ai_working"); sec.appendChild(p); return; }
  if (crError){
    const p = document.createElement("p"); p.textContent = t(crError); sec.appendChild(p);
    const b = document.createElement("button");
    b.className = "ghost wide"; b.textContent = t("ai_retry"); b.onclick = crRun;
    sec.appendChild(b);
    return;
  }
  if (!crResult) return;

  const meta = crResult.contract_meta || {};

  /* Which reading this is. A resident and a Saudi see different findings on
     the same contract, so say which one this is rather than leaving the reader
     to wonder why a colleague saw something they did not. */
  const tr = document.createElement("p");
  tr.className = "src-line method";
  tr.textContent = t(crResult.track === "Resident" ? "cr_track_nonsa" : "cr_track_sa");
  sec.appendChild(tr);

  /* Rule 6 of the brief, honoured on screen: a document we could not read
     shows the reason and NOTHING extracted from it. This is the path the
     "I like cats and coffee" acceptance test walks. */
  if (meta.extraction_confidence === "low"){
    const p = document.createElement("p"); p.textContent = t("cr_low");
    sec.appendChild(p);
    const why = (lang === "ar" ? meta.extraction_notes_ar : meta.extraction_notes_en) || "";
    if (why){ const w = document.createElement("p"); w.className = "caveat"; w.textContent = why; sec.appendChild(w); }
    return;
  }

  const summary = (lang === "ar" ? crResult.summary_ar : crResult.summary_en) || "";
  if (summary){
    const sp = document.createElement("p");
    sp.className = "ai-summary";
    sp.textContent = summary;
    sec.appendChild(sp);
  }

  /* The terms table. A reader who learns their probation is 180 days has been
     served even if every finding below is empty. */
  const kt = crResult.key_terms || {};
  const rows = [];
  const ctype = lang === "ar" ? meta.contract_type_ar : meta.contract_type_en;
  if (ctype) rows.push([t("cr_type"), ctype]);
  for (const [key, label, how] of CR_KEYS){
    const v = crTermValue(kt, key, how);
    if (v) rows.push([t(label), v]);
  }
  if (rows.length){
    const h = document.createElement("p"); h.className = "lib-h"; h.textContent = t("cr_terms");
    sec.appendChild(h);
    const tbl = document.createElement("div"); tbl.className = "cr-terms";
    for (const [label, value] of rows){
      const row = document.createElement("div");
      const dt = document.createElement("span"); dt.textContent = label;
      const dd = document.createElement("b"); dd.textContent = value;
      row.appendChild(dt); row.appendChild(dd); tbl.appendChild(row);
    }
    sec.appendChild(tbl);
  }

  const lists = [["cr_red", crResult.red_flags], ["cr_neg", crResult.negotiation_points]];
  let any = 0;
  for (const [label, list] of lists){
    if (!Array.isArray(list) || !list.length) continue;
    any += list.length;
    const h = document.createElement("p"); h.className = "lib-h"; h.textContent = t(label);
    sec.appendChild(h);
    list.forEach(f => sec.appendChild(crFindingEl(f)));
  }
  if (!any){ const p = document.createElement("p"); p.textContent = t("cr_none"); sec.appendChild(p); }

  /* Reported, not hidden. A build that silently filtered half the findings
     looks exactly like a contract with nothing wrong in it. */
  const dropped = crResult.dropped && crResult.dropped.findings;
  if (dropped > 0){
    const d = document.createElement("p"); d.className = "caveat";
    d.textContent = t("cr_dropped").replace("{n}", fmtNum(dropped));
    sec.appendChild(d);
  }

  const disc = document.createElement("p");
  disc.className = "disclaimer";
  disc.textContent = lang === "ar" ? crResult.disclaimer_ar : crResult.disclaimer_en;
  sec.appendChild(disc);
}

/* ========================================= AI second-pass review
   A critical reviewer of the assessment, when configured and consented. The
   deterministic reviewer above still runs first and still runs offline; this
   adds the judgement it cannot have — whether a rule is being applied where it
   does not reach, whether the reason was read sensibly, whether the picture is
   overstated.

   THE RULE THAT GOVERNS ALL OF IT: the model cannot move money.

   Every riyal is computed here and stays computed here. A returned concern can
   do exactly two things:

     1. trigger a deterministic re-check we already own. If reviewAssessment()
        agrees, our correction applies — the model only pointed at it.
     2. appear as a visible concern, labelled as raised but unconfirmed.

   It can never write an amount, drop a line, or change a certainty level. The
   closed code enum is what makes that enforceable: a code we do not recognise
   cannot reach a re-check, so a hijacked completion has nothing to steer. */

const AI_REVIEW_CODES = [
  "date_mismatch", "wrong_contract_type", "rule_misapplied", "scope_error",
  "double_counted", "estimate_as_entitlement", "overstated_strength",
  "evidence_gap", "missing_info", "arithmetic_doubt"
];

/* Which of our own checks a concern is allowed to re-run. Codes absent from
   this map are display-only: the reviewer may raise them, and we show them,
   but nothing in the assessment moves. */
const AI_RECHECK = {
  date_mismatch:      () => reviewAssessment().filter(i =>
                              ["rv_reversed","rv_end_future","rv_start_future",
                               "rv_start_ancient","rv_term_far"].indexOf(i.key) !== -1),
  wrong_contract_type:() => reviewAssessment().filter(i => i.key === "rv_ctype_conflict"),
  double_counted:     () => reviewAssessment().filter(i =>
                              i.key === "rv_duplicate" || i.key === "rv_eos_paid_but_claimed"),
  scope_error:        () => reviewAssessment().filter(i =>
                              i.key === "rv_notice_scope" || i.key === "rv_comp_wrong_path"),
  overstated_strength:() => reviewAssessment().filter(i => i.key === "rv_strength_thin"),
  missing_info:       () => termUnassessed().map(g => ({ sev:"info", key:"rv_uncertain_lines" }))
};

let aiRvConsent = false, aiRvState = "idle", aiRvResult = null;
const AI_REVIEW_TIMEOUT_MS = 15000;

function aiReviewOn(){ return aiAvailable() && aiRvConsent; }

/* Exactly what leaves the device, built explicitly rather than by serialising
   `term` — so that adding a field to the state cannot silently widen what is
   sent. The consent copy names this list, and a test asserts it matches. */
function reviewPayload(){
  const p = termParts();
  return {
    track: isNonSaudi() ? "non_saudi" : "saudi",
    contract_type: termCtype(),
    how_it_ended: term.how,
    start_date: term.start,
    end_date: term.end,
    contract_due_to_end: term.termEnd || null,
    service: { years: p.y, months: p.m },
    monthly_wage: termWage(),
    basic_wage: term.basic || null,
    notice_days_due: term.noticeDue,
    notice_days_given: term.noticeGiven,
    received_final_settlement: term.gotSettle,
    received_end_of_service: term.gotEos,
    unused_leave_days: term.leaveDays,
    unpaid_months: term.unpaidMonths,
    other_amount: term.otherAmt,
    article_87_exception: term.exc87,
    reason_given: String(term.reason || "").slice(0, 500),
    amounts: termLines().map(l => ({ item: l.key, amount: Math.round(l.amt),
                                     basis: l.src, kind: l.kind })),
    total: Math.round(termTotal()),
    sections: termSections().map(s => ({ item: s.k, state: s.state })),
    certainty: termLines().map(l => ({ item: l.key, level: certaintyFor(l.key).level })),
    could_not_assess: termUnassessed().map(g => g.key),
    evidence_held: term.docs.slice(),
    our_own_notes: reviewAssessment().map(i => i.key),
    overall_strength: termStrength().cls
  };
}

async function aiReview(){
  if (!aiReviewOn() || !term) return;
  aiRvState = "working"; aiRvResult = null;

  const ctrl = new AbortController();
  /* The reader must never be stuck behind a network call to see their own
     assessment. On timeout we render exactly what we would have rendered
     offline, and say the pass did not finish. */
  const timer = setTimeout(() => ctrl.abort(), AI_REVIEW_TIMEOUT_MS);
  try {
    const res = await fetch(analyzeUrl(), {
      method: "POST",
      headers: { "content-type": "application/json" },
      signal: ctrl.signal,
      body: JSON.stringify({ kind: "review", assessment: reviewPayload() })
    });
    const data = await res.json().catch(() => null);
    if (!res.ok || !data || !Array.isArray(data.concerns)){
      aiRvState = res.status === 429 ? "busy" : "failed";
    } else {
      /* Coerce again on this side. The server already dropped unknown codes;
         doing it twice costs nothing against the one class of bug that would
         let model output steer the app. */
      aiRvResult = {
        verdict: ["sound","check","problem"].indexOf(data.verdict) !== -1 ? data.verdict : "sound",
        concerns: data.concerns.slice(0, 6).map(c => ({
          code: String(c && c.code || ""),
          severity: c && (c.severity === "block" || c.severity === "review") ? c.severity : "info",
          detail: String(c && c.detail || "").slice(0, 500)
        })).filter(c => c.detail && AI_REVIEW_CODES.indexOf(c.code) !== -1)
      };
      aiRvState = "done";
    }
  } catch(e){
    aiRvState = e && e.name === "AbortError" ? "timeout" : "offline";
  }
  clearTimeout(timer);
}

/* What a concern is actually allowed to do. Returns the concern annotated with
   whether OUR OWN checks agree with it — which is the only thing that can
   change what the reader sees. */
function aiReviewConcerns(){
  if (!aiRvResult) return [];
  return aiRvResult.concerns.map(c => {
    const recheck = AI_RECHECK[c.code];
    const confirmed = recheck ? recheck() : [];
    return { ...c, confirmed: confirmed.length > 0, ourKeys: confirmed.map(x => x.key) };
  });
}

/* The second opinion, kept visually and rhetorically separate from our own
   checks. A concern our own re-check confirms is marked as confirmed; one it
   does not is marked as raised-but-unverified, which is the honest label for
   something a model noticed and we could not reproduce. */
function aiReviewHtml(){
  if (!aiAvailable() || !aiRvConsent) return "";
  if (aiRvState === "idle") return "";

  if (aiRvState !== "done"){
    const key = { working:"airv_working", timeout:"airv_timeout", busy:"airv_busy",
                  failed:"airv_failed", offline:"airv_offline" }[aiRvState] || "airv_failed";
    return `<div class="tm-sec">
        <div class="hd"><b>${t("airv_title")}</b><span class="tm-tag review">${t("airv_incomplete")}</span></div>
        <p>${t(key)}</p><p>${t("airv_unaffected")}</p></div>`;
  }

  const cs = aiReviewConcerns();
  const vk = { sound:"airv_v_sound", check:"airv_v_check", problem:"airv_v_problem" }[aiRvResult.verdict];
  const cls = aiRvResult.verdict === "problem" ? "issue"
            : aiRvResult.verdict === "check" ? "review" : "ok";
  return `<div class="tm-sec">
      <div class="hd"><b>${t("airv_title")}</b><span class="tm-tag ${cls}">${t(vk)}</span></div>
      <p>${t("airv_sub")}</p>
      ${cs.length ? cs.map(c =>
        `<div class="airv-c">
           <div class="hd"><b>${t("airvc_" + c.code)}</b>
             <span class="tm-tag ${c.confirmed ? "issue" : "review"}">${
               t(c.confirmed ? "airv_confirmed" : "airv_unconfirmed")}</span></div>
           <p class="airv-detail"></p>
           <p class="airv-note">${t(c.confirmed ? "airv_confirmed_b" : "airv_unconfirmed_b")}</p>
         </div>`).join("")
        : `<p>${t("airv_none")}</p>`}
      <p class="src-line method">${t("src_method")} — ${t("airv_src")}</p>
    </div>`;
}

/* ------------------------------------------------------- the documents
   Both are factual and neutral on purpose. A case file that reads as an
   accusation is worth less to the person carrying it into a settlement
   meeting, not more. */

function termFacts(){
  const cur = t("eos_sar"), p = termParts();
  const d = v => v ? fmtDate(new Date(v).getTime()) : t("tm_d_unknown");
  return [
    `${t("tm_d_start")}: ${d(term.start)}`,
    `${t("tm_d_end")}: ${d(term.end)}`,
    `${t("tm_d_service")}: ${svcText(p.y, p.m)}`,
    `${t("tm_d_wage")}: ${termWage() ? money(termWage()) + " " + cur : t("tm_d_unknown")}`,
    `${t("tm_d_how")}: ${t(termHow() ? termHow().label : "th_other")}`,
    `${t("tm_d_ctype")}: ${t(termCtype() === "fixed" ? "tm_f_fixed" : termCtype() === "indef" ? "tm_f_indef" : "tm_d_unknown")}`,
    `${t("tm_d_reason")}: ${term.reason || t("tm_d_none_given")}`
  ];
}

function buildTermDoc(){
  const cur = t("eos_sar"), lines = termLines();
  const have = TERM_DOCS.filter(d => term.docs.indexOf(d) !== -1).map(d => "• " + t(d));
  const missing = TERM_DOCS.filter(d => term.docs.indexOf(d) === -1).map(d => "• " + t(d));
  const secs = termSections()
    .filter(s => s.state !== "ok")
    .map(s => `• ${t(s.k)} — ${t("tm_st_" + s.state)}: ${t(s.why)}`);
  const money$ = lines.map(l => `• ${t(l.key)}: ${money(l.amt)} ${cur}`);

  return [
    t("tm_doc_title"),
    "",
    t("tm_d_h_facts"),
    ...termFacts(),
    "",
    t("tm_d_h_issues"),
    ...(secs.length ? secs : [t("tm_d_none")]),
    "",
    t("tm_d_h_money"),
    ...(money$.length ? money$ : [t("tm_d_none")]),
    ...(money$.length ? [`• ${t("tm_m_total")}: ${money(termTotal())} ${cur}`] : []),
    /* The screen is where the honesty lives; this document is what actually
       goes to the employer, the lawyer and the friendly-settlement filing. It
       was carrying the understated total with no mention that an unanswered
       question could raise it — the fix that moved this sentence to where the
       money is on screen stopped one surface short of where the money goes. */
    ...(money$.length ? termCouldRise().map(k => `⚠ ${t(k)}`) : []),
    t("tm_m_caveat"),
    "",
    t("tm_d_h_have"),
    ...(have.length ? have : [t("tm_d_none")]),
    "",
    t("tm_d_h_missing"),
    ...(missing.length ? missing : [t("tm_d_none")]),
    "",
    t("tm_d_h_questions"),
    t("tm_d_questions_b"),
    "",
    t("tm_d_h_next"),
    t("tm_d_next_b")
  ].join("\n");
}

/* What the paywall may show: the reader's own answers back to them, and
   nothing computed. No amount, no section state, no strength rating. */
function buildTermPreview(){
  return [t("tm_d_h_facts"), ...termFacts()].join("\n");
}

function renderTermDoc(){
  /* Entitlement is checked at the renderer as well as at the button, so a
     route added later cannot quietly hand out a tier that was not bought. */
  if (!term || !has("term", "plan_term_full")) return;
  document.getElementById("termDocBody").textContent = buildTermDoc();

}
function copyTermDoc(){ copyInto("termDocCopy", "termDocBody", "cf_copy"); }
function copyTermLtr(){ copyInto("termLtrCopy", "termLtrBody", "copy_btn"); }

/* One clipboard path for both, so the "copied" feedback cannot drift. */
function copyInto(btnId, bodyId, restoreKey){
  const btn = document.getElementById(btnId);
  const done = () => {
    btn.textContent = t("copied"); toast(t("copied"));
    setTimeout(() => { btn.textContent = t(restoreKey); }, 1600);
  };
  const text = document.getElementById(bodyId).textContent;
  if (navigator.clipboard) navigator.clipboard.writeText(text).then(done, done);
  else done();
}

/* Four registers of the same letter. Only the framing moves — the facts, the
   amounts and the citations are identical in all four, and none of them
   threatens anything. A letter that makes a threat the reader cannot back is
   worse than no letter. */
const TERM_TONES = ["friendly","professional","firm","formal"];

function renderTermTone(){
  const wrap = document.getElementById("termTone");
  wrap.innerHTML = "";
  TERM_TONES.forEach(id => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = termTone === id ? "on" : "";
    b.textContent = t("tm_tone_" + id);
    b.onclick = () => { termTone = id; renderTermLtr(); };
    wrap.appendChild(b);
  });

function buildTermLtr(){
  const cur = t("eos_sar"), lines = termLines();
  const items = lines.map((l, i) => `${pointNum(i)}. ${t(l.key)}: ${money(l.amt)} ${cur}`);
  const body = [
    t("tm_l_open_" + termTone),
    "",
    ...termFacts(),
    "",
    items.length ? t("tm_l_items") : t("tm_l_noitems"),
    ...items,
    ...(items.length ? [`${t("tm_m_total")}: ${money(termTotal())} ${cur}`] : []),
    "",
    t("tm_l_ask_" + termTone),
    "",
    t("tm_l_close_" + termTone),
    t("tm_l_sign")
  ];
  return body.join("\n");
}

function renderTermLtr(){
  if (!term || !has("term", "plan_term_full")) return;
  renderTermTone();
  document.getElementById("termLtrBody").textContent =
    t("tm_l_to") + "\n\n" + buildTermLtr();
  document.getElementById("termLtrFoot").textContent = t("lt_foot");
  document.getElementById("termLtrCopy").textContent = t("copy_btn");
}

function assistBack(){
  /* The library is a tab root, so returning there is a tab move, not a pop. */
  if (asOrigin === "rights") return goTab("rights");
  show(["result","case","casedoc"].includes(asOrigin) ? (asOrigin==="case"?"case":"result") : "home", 1);
}

function renderCaps(){
  const wrap = document.getElementById("caps");
  wrap.innerHTML = "";
  CAPS.forEach(c=>{
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = t(c.label);
    b.onclick = ()=>ask(CAP_Q[c.id][lang]);
    wrap.appendChild(b);
  });
}

function renderAssist(){
  document.getElementById("asBackLabel").textContent = t(asOrigin==="result" ? "back_score" : "back_home");
  document.getElementById("askInput").placeholder = t("as_ph");
  renderCaps();
  const box = document.getElementById("chat");
  box.innerHTML = "";
  chat.forEach(m=>box.appendChild(msgEl(m)));
  renderQuota();
  box.scrollTop = box.scrollHeight;
}

function msgEl(m){
  const d = document.createElement("div");
  d.className = "msg " + m.who;
  if (m.typing){ d.innerHTML = '<span class="typing"><i></i><i></i><i></i></span>'; return d; }
  d.textContent = m.text;
  if (m.extra){ d.textContent += "\n\n" + m.extra; }
  if (m.refs && m.refs.length){
    const r = document.createElement("div");
    r.className = "refs";
    m.refs.forEach(x=>{
      const c = document.createElement("span");
      c.className = "ref";
      c.textContent = t("as_refs") + ": " + x[lang];
      r.appendChild(c);
    });
    d.appendChild(r);
  }
  if (m.draft){
    const b = document.createElement("button");
    b.className = "inline-cta";
    b.textContent = t("as_draft_cta");
    b.onclick = ()=>{ if (current && negotiables().length) openLetterFlow(); else show("home",1); };
    d.appendChild(b);
  }
  return d;
}

function renderQuota(){
  const q = document.getElementById("quota");
  const bar = document.getElementById("askBar");
  const left = FREE_QUESTIONS - asked;
  if (left > 0){
    q.className = "quota";
    q.textContent = left === 1 ? t("as_left1") : t("as_left").replace("{n}", fmtNum(left));
    document.getElementById("askInput").disabled = false;
    document.getElementById("askSend").disabled = false;
    bar.style.display = "flex";
    return;
  }
  /* The gate is the product's first honest paywall moment: the score and the
     flags stay free, but open-ended legal Q&A is metered. */
  q.className = "quota gate";
  q.innerHTML = "";
  const b = document.createElement("b"); b.textContent = t("as_quota_t");
  const p = document.createElement("span");
  p.textContent = t(SUBSCRIPTIONS_LIVE ? "as_quota_b" : "as_quota_b_dark");
  q.append(b, p);
  /* No "Subscribe — 50 SAR/month" while there is nothing to subscribe to. The
     free questions still end here; the reader is simply not sold a way out
     that does not exist. */
  if (SUBSCRIPTIONS_LIVE){
    const cta = document.createElement("button");
    cta.textContent = t("as_quota_cta");
    cta.onclick = ()=>{ buzz(10); openPlans("assist"); };
    q.append(cta);
  } else {
    /* The copy names the rights library, so the panel offers it. Without this
       the reader is left on a screen with the input hidden and no forward
       action at all — a handoff that names a destination and does not offer it
       is a dead end wearing a signpost. */
    const go = document.createElement("button");
    go.textContent = t("tab_rights");
    go.onclick = ()=>{ buzz(10); goTab("rights"); };
    q.append(go);
  }
  bar.style.display = "none";
}

function submitAsk(e){
  e.preventDefault();
  const el = document.getElementById("askInput");
  const v = el.value.trim();
  if (!v) return;
  el.value = "";
  ask(v);
}

function ask(text){
  if (asked >= FREE_QUESTIONS) return;
  asked++;
  chat.push({ who:"user", text });
  const box = document.getElementById("chat");
  box.appendChild(msgEl({ who:"user", text }));
  const typing = msgEl({ who:"bot", typing:true });
  box.appendChild(typing);
  box.scrollTop = box.scrollHeight;
  document.getElementById("askInput").disabled = true;
  setTimeout(()=>{
    const a = answer(text);
    typing.remove();
    const m = { who:"bot", ...a };
    chat.push(m);
    box.appendChild(msgEl(m));
    buzz(6);
    document.getElementById("askInput").disabled = false;
    renderQuota();
    box.scrollTop = box.scrollHeight;
  }, 700);
}

/* Contract-aware answers: summarize, risks, and applicable laws all read the
   analysis already in `current` rather than inventing new content. */
function answerSummary(){
  if (!current) return { text:t("as_nocontract") };
  const red = current.clauses.filter(c=>c.s==="red").length;
  const amb = current.clauses.filter(c=>c.s==="amber").length;
  const grn = current.clauses.filter(c=>c.s==="green").length;
  const head = lang==="ar"
    ? `${t(current.doc)} — التقييم ${fmtNum(current.score)} من 100.\n${(signedMode&&current.vs?current.vs:current.verdict).ar}\n\nراجعت ${fmtNum(current.clauses.length)} بنود: ${fmtNum(red)} تحتاج وقفة، ${fmtNum(amb)} تستاهل التفاوض، ${fmtNum(grn)} مطمئنة.`
    : `${t(current.doc)} — scored ${current.score} out of 100.\n${(signedMode&&current.vs?current.vs:current.verdict).en}\n\nI read ${current.clauses.length} clauses: ${red} need a pause, ${amb} are worth negotiating, ${grn} are fine.`;
  const lines = current.clauses.map(c=>`• ${c.t[lang]} — ${c.p[lang]}`).join("\n");
  return { text: head + "\n\n" + lines };
}

function answerRisks(){
  if (!current) return { text:t("as_nocontract") };
  const risky = current.clauses.filter(c=>c.s!=="green");
  if (!risky.length)
    return { text: lang==="ar"
      ? "ما لقيت مخاطر تستدعي القلق في هذا العقد — كل البنود ضمن المعتاد."
      : "I found no risks worth worrying about in this one — every clause sits within the norm." };
  const body = risky.map((c,i)=>{
    const n = pointNum(i);
    const tag = c.s==="red" ? t("act_red") : t("act_amber");
    return `${n}. ${c.t[lang]} (${tag})\n   ${c.p[lang]}\n   ${c.a ? c.a[lang] : ""}`;
  }).join("\n\n");
  return { text: body, draft: true };
}

function answerLaws(){
  if (!current) return { text:t("as_nocontract") };
  const map = { doc_emp:["فترة التجربة","الإشعار","عدم المنافسة"], doc_clean:["فترة التجربة","الإجازة","عمل إضافي"],
                doc_rent:["إيجار"], doc_free:["عمل حر","شرط جزائي"], doc_pasted:["الإشعار"] };
  const keys = map[current.doc] || [];
  const hits = KB.filter(e=>forTrack(e) && keys.some(k=>e.k.test(k)));
  const text = lang==="ar"
    ? `بالنسبة لـ${t(current.doc)}، الأنظمة التي تهمك:` : `For your ${t(current.doc).toLowerCase()}, the provisions that matter:`;
  return { text, refs: hits.map(h=>h.r).filter(Boolean), extra: hits.map(h=>"• "+h.a[lang]).join("\n\n") };
}

function answer(q){
  const low = q.toLowerCase();
  if (/(لخّص|لخص|ملخص|summar)/i.test(low)) return answerSummary();
  if (/(مخاطر|خطر|risk)/i.test(low))       return answerRisks();
  if (/(أنظمة|نظام ينطبق|which law|relevant law|applicable)/i.test(low)) return answerLaws();
  if (/(اكتب|صياغة|مستند|خطاب|draft|write|letter)/i.test(low))
    return { text: lang==="ar"
      ? "أقدر أصيغ لك خطاب تفاوض مبني على بنود عقدك، أو خطاب استقالة، أو إشعار عدم تجديد. الأشهر هو خطاب التفاوض:"
      : "I can draft a negotiation letter built from your contract's clauses, a resignation letter, or a non-renewal notice. The negotiation letter is the common one:", draft:true };
  const hit = KB.find(e=>forTrack(e) && e.k.test(q));
  if (hit) return { text: hit.a[lang], refs: hit.r ? [hit.r] : [] };
  return { text: lang==="ar"
    ? "ما فهمت السؤال تمامًا. جرّب تسأل عن بند معيّن — مثل «فترة التجربة» أو «مدة الإشعار» أو «مكافأة نهاية الخدمة» — أو اطلب مني ألخّص عقدك."
    : "I didn't quite catch that. Try asking about a specific topic — probation, notice period, end-of-service pay — or ask me to summarize your contract." };
}

/* ----------------------------------------------------- file intake ----
   Real PDF text extraction, no library and no server: locate the content
   streams, inflate them with DecompressionStream, then read the text-showing
   operators. Many Arabic PDFs embed subset fonts whose bytes are glyph
   indices rather than Unicode — when that happens the output fails the
   legibility check below and we say we could not read it, which is the
   honest outcome rather than analysing gibberish. */
const MAX_FILE = 8 * 1024 * 1024;
/* Longest contract text we will hold. Comfortably above a long employment
   contract, and low enough that the rule pass stays instant. */
const MAX_TEXT = 500 * 1000;

async function inflate(bytes){
  /* PDF streams carry EOL padding after the compressed data, so the stream
     decodes fine and then throws "junk after end". Read incrementally and
     keep whatever was decoded before the complaint. */
  for (const fmt of ["deflate", "deflate-raw"]){
    try {
      const ds = new DecompressionStream(fmt);
      const w = ds.writable.getWriter();
      w.write(bytes).catch(()=>{});
      w.close().catch(()=>{});
      const reader = ds.readable.getReader();
      const chunks = []; let total = 0;
      try {
        for(;;){
          const { value, done } = await reader.read();
          if (done) break;
          chunks.push(value); total += value.length;
        }
      } catch(e){ /* keep the decoded prefix */ }
      if (total){
        const out = new Uint8Array(total); let off = 0;
        for (const c of chunks){ out.set(c, off); off += c.length; }
        return out;
      }
    } catch(e){ /* try the next format */ }
  }
  return null;
}

function latin(bytes){ let o=""; for (let i=0;i<bytes.length;i++) o+=String.fromCharCode(bytes[i]); return o; }

/* ---------------------------------------------------- ToUnicode CMaps
 *
 * WHY THIS EXISTS, IN ONE PARAGRAPH.
 *
 * Word exports Arabic with embedded SUBSET fonts using Identity-H encoding.
 * The bytes inside a text-showing operator are then not letters and not
 * Unicode — they are two-byte indices into that one font's private glyph
 * table. Reading them as characters produces soup, which legible() correctly
 * refused, which is why a real Saudi employment contract came back as "we
 * couldn't read this". The document itself carries the answer: a /ToUnicode
 * CMap mapping those indices back to Unicode, which is what lets a desktop
 * reader copy Arabic out of the same file. We parse the map the PDF already
 * ships rather than guessing.
 *
 * Latin text from the same exporter usually arrives as literal (…) strings in
 * WinAnsi and needs none of this — which is exactly why an English contract
 * worked and an Arabic one did not.
 */

/* A CMap is a code → string table. `two` records the code width, taken from
   the width the file itself declares, because Identity-H is 2-byte and simple
   8-bit encodings are 1-byte and misreading that shifts every character. */
const CMAP_MAX = 65536;   /* a malformed bfrange must not be able to hang the tab */

function hexUnits(h){
  const clean = h.replace(/[^0-9a-fA-F]/g, "");
  const out = [];
  for (let i = 0; i + 3 < clean.length; i += 4) out.push(parseInt(clean.slice(i, i+4), 16));
  /* A trailing pair means an odd 1-byte tail; keep it rather than dropping a
     character at the end of a run. */
  if (clean.length % 4 === 2) out.push(parseInt(clean.slice(-2), 16));
  return out;
}

/* The destination of a bfchar/bfrange is UTF-16BE. fromCharCode over the code
   units reassembles surrogate pairs on its own. */
function hexStr(h){
  const u = hexUnits(h);
  return u.length ? String.fromCharCode.apply(null, u) : "";
}

function parseCMap(src){
  const map = new Map();
  let two = false, saw = 0;

  /* Code width, in order of trust: the declared codespace, then the width the
     bfchar entries actually use. */
  const cs = /begincodespacerange([\s\S]*?)endcodespacerange/.exec(src);
  if (cs){
    const first = /<([0-9a-fA-F\s]+)>/.exec(cs[1]);
    if (first && first[1].replace(/\s/g, "").length >= 4) two = true;
  }

  const chars = /beginbfchar([\s\S]*?)endbfchar/g;
  let blk;
  while ((blk = chars.exec(src))){
    const pair = /<([0-9a-fA-F\s]+)>\s*<([0-9a-fA-F\s]+)>/g;
    let m;
    while ((m = pair.exec(blk[1]))){
      const code = m[1].replace(/\s/g, "");
      if (code.length >= 4) two = true;
      map.set(parseInt(code, 16), hexStr(m[2]));
      if (++saw > CMAP_MAX) return { map, two };
    }
  }

  const ranges = /beginbfrange([\s\S]*?)endbfrange/g;
  while ((blk = ranges.exec(src))){
    /* Two legal forms: <lo> <hi> <dstStart>, and <lo> <hi> [<d1> <d2> …]. */
    const re = /<([0-9a-fA-F\s]+)>\s*<([0-9a-fA-F\s]+)>\s*(?:<([0-9a-fA-F\s]+)>|\[([\s\S]*?)\])/g;
    let m;
    while ((m = re.exec(blk[1]))){
      const loHex = m[1].replace(/\s/g, "");
      if (loHex.length >= 4) two = true;
      const lo = parseInt(loHex, 16), hi = parseInt(m[2].replace(/\s/g, ""), 16);
      if (!Number.isFinite(lo) || !Number.isFinite(hi) || hi < lo) continue;
      const span = Math.min(hi - lo, CMAP_MAX - saw);
      if (span < 0) return { map, two };
      if (m[4] != null){
        const items = m[4].match(/<([0-9a-fA-F\s]+)>/g) || [];
        for (let i = 0; i <= span && i < items.length; i++){
          map.set(lo + i, hexStr(items[i].slice(1, -1)));
          saw++;
        }
      } else {
        /* Incrementing destination: only the LAST code unit advances, which is
           what keeps a range crossing a surrogate boundary from corrupting. */
        const base = hexUnits(m[3]);
        if (!base.length) continue;
        for (let i = 0; i <= span; i++){
          const u = base.slice();
          u[u.length - 1] = u[u.length - 1] + i;
          map.set(lo + i, String.fromCharCode.apply(null, u));
          saw++;
        }
      }
      if (saw > CMAP_MAX) return { map, two };
    }
  }
  return { map, two };
}

/* Resource name (/F3) → CMap. The content stream names fonts by resource, the
   ToUnicode lives on the font object, so this walks /Font << /F3 12 0 R >>
   dictionaries and follows the reference. One map for the document rather than
   one per page: resource names are consistent across pages in every exporter
   that matters here, and a per-page model buys nothing for the cost. */
async function fontMaps(src, bytes, objAt){
  const maps = new Map();
  const dicts = /\/Font\s*<<([\s\S]*?)>>/g;
  let d;
  while ((d = dicts.exec(src))){
    const refs = /\/([A-Za-z0-9#+.-]+)\s+(\d+)\s+(\d+)\s+R/g;
    let r;
    while ((r = refs.exec(d[1]))){
      const name = r[1];
      if (maps.has(name)) continue;
      const fontObj = objAt(+r[2]);
      if (!fontObj) continue;
      const tu = /\/ToUnicode\s+(\d+)\s+(\d+)\s+R/.exec(fontObj);
      if (!tu) continue;
      const cm = await streamOf(src, bytes, objAt, +tu[1]);
      if (cm) maps.set(name, parseCMap(cm));
    }
  }
  return maps;
}

/* Index every `N 0 obj … endobj` once, so a /ToUnicode reference is a lookup
   rather than a scan of the whole file per font. */
function objectIndex(src){
  const at = new Map();
  const re = /(\d+)\s+\d+\s+obj\b/g;
  let m;
  while ((m = re.exec(src))){
    const end = src.indexOf("endobj", m.index);
    at.set(+m[1], src.slice(m.index, end < 0 ? m.index + 4000 : end));
  }
  return n => at.get(n);
}

/* The decoded stream belonging to object N, or null. */
async function streamOf(src, bytes, objAt, num){
  const body = objAt(num);
  if (!body) return null;
  const abs = src.indexOf(body);
  if (abs < 0) return null;
  const sm = /stream\r?\n?/.exec(body);
  if (!sm) return null;
  const start = abs + sm.index + sm[0].length;
  const end = src.indexOf("endstream", start);
  if (end < 0) return null;
  let stop = end;
  while (stop > start && (bytes[stop-1] === 10 || bytes[stop-1] === 13)) stop--;
  const raw = bytes.subarray(start, stop);
  const data = /FlateDecode/.test(body.slice(0, sm.index)) ? await inflate(raw) : raw;
  return data ? latin(data) : null;
}

/* ------------------------------------------------------ text operators */

/* A literal (…) string, unescaped into raw BYTE values. Kept as bytes rather
   than characters because a 2-byte CID has to be paired up afterwards, and
   pairing characters that have already been mangled is not recoverable. */
function litBytes(raw){
  const s = raw.slice(1, -1);
  const out = [];
  for (let i = 0; i < s.length; i++){
    if (s[i] !== "\\"){ out.push(s.charCodeAt(i) & 0xff); continue; }
    const c = s[++i];
    if (c === undefined) break;
    if (c >= "0" && c <= "7"){
      let oct = c;
      while (oct.length < 3 && s[i+1] >= "0" && s[i+1] <= "7") oct += s[++i];
      out.push(parseInt(oct, 8) & 0xff);
    } else if (c === "n") out.push(10);
    else if (c === "t") out.push(9);
    else if (c === "r") { /* dropped, as before */ }
    else if (c === "b" || c === "f") { /* dropped, as before */ }
    else if (c === "\n") { /* line continuation */ }
    else out.push(c.charCodeAt(0) & 0xff);
  }
  return out;
}

function decodeCodes(codes, cmap){
  if (!cmap || !cmap.map.size) return String.fromCharCode.apply(null, codes);
  let out = "";
  if (cmap.two){
    for (let i = 0; i + 1 < codes.length; i += 2){
      const cid = (codes[i] << 8) | codes[i+1];
      const u = cmap.map.get(cid);
      /* An unmapped CID contributes nothing. Emitting a placeholder would push
         the text back below the legibility threshold and lose the whole
         document over a handful of glyphs. */
      if (u !== undefined) out += u;
    }
  } else {
    for (const c of codes){
      const u = cmap.map.get(c);
      out += u !== undefined ? u : String.fromCharCode(c);
    }
  }
  return out;
}

/* Pull text out of a content stream, tracking which font is active so each run
   is decoded through its own map. Returns { text, ops } — ops counts the
   text-showing operators seen, which is how a scanned page (no operators at
   all) is told apart from a page whose glyphs we simply could not name. */
function textFromContent(src, maps){
  let out = "", font = null, ops = 0;
  const re = /\/([A-Za-z0-9#+.-]+)\s+[\d.]+\s+Tf|\((?:\\.|[^\\()])*\)\s*(?:Tj|'|")|<[0-9a-fA-F\s]*>\s*Tj|\[(?:[^\[\]\\]|\\.)*\]\s*TJ/g;
  let m;
  while ((m = re.exec(src))){
    const chunk = m[0];
    if (m[1] !== undefined){ font = m[1]; continue; }
    ops++;
    const cmap = font && maps ? maps.get(font) : null;
    const parts = chunk.match(/\((?:\\.|[^\\()])*\)|<[0-9a-fA-F\s]*>/g) || [];
    for (const raw of parts){
      if (raw[0] === "<"){
        const hex = raw.slice(1, -1).replace(/[^0-9a-fA-F]/g, "");
        const codes = [];
        for (let i = 0; i + 1 < hex.length; i += 2) codes.push(parseInt(hex.slice(i, i+2), 16));
        out += decodeCodes(codes, cmap);
      } else {
        out += decodeCodes(litBytes(raw), cmap);
      }
    }
    out += /'|"/.test(chunk[chunk.length-1] || "") ? "\n" : " ";
  }
  return { text: out, ops };
}

/* Returns { text, ops } so the caller can distinguish "there was nothing to
   read" from "we read it and it made no sense" — two different problems with
   two different answers for the reader. */
async function extractPdf(buf){
  const bytes = new Uint8Array(buf), src = latin(bytes);
  const objAt = objectIndex(src);
  let maps = new Map();
  try { maps = await fontMaps(src, bytes, objAt); } catch(e){ /* decode without */ }

  let text = "", ops = 0;
  const re = /stream\r?\n?/g;
  let m;
  while ((m = re.exec(src))){
    const start = m.index + m[0].length;
    const end = src.indexOf("endstream", start);
    if (end < 0) continue;
    const head = src.slice(Math.max(0, m.index - 400), m.index);
    let stop = end;
    while (stop > start && (bytes[stop-1] === 10 || bytes[stop-1] === 13)) stop--;
    let raw = bytes.subarray(start, stop);
    let data = /FlateDecode/.test(head) ? await inflate(raw) : raw;
    if (!data) continue;
    const content = latin(data);
    if (/BT|Tj|TJ/.test(content)){
      const got = textFromContent(content, maps);
      text += got.text + "\n";
      ops += got.ops;
    }
  }
  return { text: text.replace(/[ \t]+/g, " ").replace(/\n{3,}/g, "\n\n").trim(), ops };
}

/* Which of the two read failures we hit, so the screen can say something the
   reader can act on. Set before show("noread"), read by renderNoread(), and
   re-read on every language toggle. */
let noreadReason = "glyphs";

function renderNoread(){
  const scan = noreadReason === "scan";
  const p = scan ? "nrs_" : "nr_";
  document.getElementById("nrTitle").textContent = t(p + "title");
  document.getElementById("nrBody").textContent = t(p + "body");
  document.getElementById("nrRetry").textContent = t("nr_retry");
  document.getElementById("nrSample").textContent = t("nr_sample");
  document.getElementById("nrTips").innerHTML =
    T[p + "tips"][lang].map(x=>`<li>${esc(x)}</li>`).join("");
}

/* Enough real letters to be worth analysing? Guards against glyph-index soup. */
function legible(txt){
  if (!txt || txt.length < 40) return false;
  const good = (txt.match(/[A-Za-z؀-ۿ]/g) || []).length;
  return good / txt.length > 0.45;
}

async function handleFile(file){
  const notice = document.getElementById("offlineNotice");
  const fail = msg => { notice.textContent = msg; notice.hidden = false; };
  notice.hidden = true;
  if (!file) return;
  if (file.size > MAX_FILE) return fail(t("err_big"));
  const isPdf = /pdf$/i.test(file.type) || /\.pdf$/i.test(file.name);
  const isTxt = /^text\//i.test(file.type) || /\.(txt|md)$/i.test(file.name);
  if (!isPdf && !isTxt) return fail(t("err_type"));

  document.getElementById("upMain").classList.add("busy");
  let text = "", ops = 0;
  try {
    if (isPdf){
      const got = await extractPdf(await file.arrayBuffer());
      text = got.text; ops = got.ops;
    } else {
      text = await file.text(); ops = 1;
    }
    /* An 8 MB PDF can decode to far more text than any contract contains.
       Cap it so the regex pass and the textarea stay bounded. */
    if (text.length > MAX_TEXT) text = text.slice(0, MAX_TEXT);
  } catch(e){ text = ""; ops = 0; }
  document.getElementById("upMain").classList.remove("busy");

  /* TWO FAILURES, TWO ANSWERS. A page with no text-showing operators at all is
     a scan or a photograph — there is no text layer to find, no retry will
     help, and saying "paste it instead" is the only useful thing we can offer.
     A page WITH operators whose output we could not turn into letters is a
     font problem, where re-exporting genuinely does fix it. Telling both
     readers the same thing sends one of them round a loop that cannot end. */
  if (!legible(text)){
    noreadReason = (isPdf && ops === 0) ? "scan" : "glyphs";
    current = null;
    runLoading(()=>{ buzz(12); renderNoread(); show("noread"); });
    return;
  }
  noreadReason = "glyphs";
  document.getElementById("pasteBox").value = text;
  pasteChanged();
  analyze("pasted");
}

/* ------------------------------------------------------ motion layer ----
   Everything below is additive: it changes how existing state arrives on
   screen, never what that state is. Each piece is guarded so the app behaves
   identically with motion disabled. */
const REDUCED = window.matchMedia("(prefers-reduced-motion: reduce)");
const COARSE  = window.matchMedia("(pointer: coarse)");

/* Numbers arrive by counting, the way the score already does. */
function rollTo(el, value, fmt){
  if (!el) return;
  const done = () => { el.textContent = fmt(value); };
  if (REDUCED.matches || !value) return done();
  const t0 = performance.now(), dur = 700;
  (function tick(now){
    const k = Math.min(1, (now - t0) / dur);
    el.textContent = fmt(Math.round(value * (1 - Math.pow(1 - k, 3))));
    if (k < 1) requestAnimationFrame(tick); else done();
  })(t0);
}

/* Reveal-on-scroll. Elements start visible in markup; JS opts them in, so a
   failure here can never hide content. */
let revealObserver = null;
function armReveals(root){
  if (REDUCED.matches || !("IntersectionObserver" in window)) return;
  if (!revealObserver){
    revealObserver = new IntersectionObserver(es=>es.forEach(e=>{
      if (e.isIntersecting){ e.target.classList.add("in"); revealObserver.unobserve(e.target); }
    }), { threshold:.12, rootMargin:"0px 0px -6% 0px" });
  }
  const sel = ".clause, .pcard, .brow, .src, .tl-item, .acc-sec, .doc";
  (root || document).querySelectorAll(sel).forEach(el=>{
    if (el.dataset.rv) return;
    el.dataset.rv = "1";
    const box = el.getBoundingClientRect();
    if (box.top < window.innerHeight * 0.92){ el.classList.add("rv","in"); return; }
    el.classList.add("rv");
    revealObserver.observe(el);
  });
}

/* Gesture navigation. Commits through the screens' own back actions, so it
   introduces no navigation path that did not already exist. */
const BACK_OF = {
  result:()=>show("home",1), clauses:()=>show("result",1), letter:()=>show("result",1),
  paywall:()=>show(pwBack(),1),
  eos:()=>goTab("rights"),
  term:()=>show("home",1), termq:()=>termQBack(), termev:()=>show("termq",1),
  termres:()=>show("termev",1), termnext:()=>show("termres",1),
  termdoc:()=>show("termnext",1), termltr:()=>show("termnext",1),
  case:()=>show("eos",1), casedoc:()=>show("case",1), plans:()=>show(planBack,1),
  lawyerdesk:()=>show(deskBack,1),
  biz:()=>show("plans",1), assist:()=>assistBack(), noread:()=>retryPaste(),
  photo:()=>show("home",1), timeline:()=>tlBack()
};
function initGestures(){
  if (gesturesBound) return; gesturesBound = true;
  if (!COARSE.matches) return;
  const app = document.querySelector(".app");
  let sx=0, sy=0, dragging=false, cur=null, rtl=false, id=null;
  const blocked = t => t.closest("textarea,input,.chat,.caps,.tabbar,.viewfinder");

  app.addEventListener("pointerdown", e=>{
    if (e.pointerType === "mouse" || blocked(e.target)) return;
    cur = document.querySelector(".screen.active");
    if (!cur) return;
    sx = e.clientX; sy = e.clientY; dragging = false; id = e.pointerId;
    rtl = document.documentElement.dir === "rtl";
  }, { passive:true });

  app.addEventListener("pointermove", e=>{
    if (!cur || e.pointerId !== id) return;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if (!dragging){
      if (Math.abs(dx) < 12 || Math.abs(dx) < Math.abs(dy) * 1.4) return;
      dragging = true; cur.classList.add("dragging");
    }
    const name = cur.id.replace("screen-","");
    const inward = rtl ? dx < 0 : dx > 0;           /* toward the back edge */
    if (BACK_OF[name] && inward && !REDUCED.matches)
      cur.style.transform = "translateX(" + (dx * 0.55) + "px)";
  }, { passive:true });

  const release = e=>{
    if (!cur || (id !== null && e.pointerId !== id)) return;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    const scr = cur, name = scr.id.replace("screen-","");
    scr.classList.remove("dragging");
    scr.classList.add("settling");
    scr.style.transform = "";
    setTimeout(()=>scr.classList.remove("settling"), 260);
    const horizontal = Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.4;
    if (horizontal && dragging){
      const inward = rtl ? dx < 0 : dx > 0;
      if (BACK_OF[name] && inward){ buzz(8); BACK_OF[name](); }
      else if (ROOTS.includes(name)){
        const i = ROOTS.indexOf(name);
        const next = (rtl ? dx > 0 : dx < 0) ? i + 1 : i - 1;
        if (next >= 0 && next < ROOTS.length){ buzz(8); goTab(ROOTS[next]); }
      }
    }
    cur = null; dragging = false; id = null;
  };
  app.addEventListener("pointerup", release, { passive:true });
  app.addEventListener("pointercancel", release, { passive:true });
}

/* ------------------------------------------------- saved contracts ----
   A tool you use once needs no memory; a companion does. */
const STORE = "wodouh.v1";
let myContracts = [];

function saveState(){
  try {
    localStorage.setItem(STORE, JSON.stringify({
      nat,
      timelyOff, installOff,
      migAsked,
      usedCodes,
      owned, packUntil,
      askUsed,
      term,
      contracts: myContracts.slice(0,8),
      tracked: TRACKED.map(x=>({ doc:x.doc, events:x.events.map(e=>({ ...e })) }))
    }));
  } catch(e){}
}
/* Anything read back from localStorage is untrusted: it survives across
   versions and can be edited by hand. Validate rather than assume shape, and
   replace TRACKED in place instead of appending so a second call is a no-op. */
function loadState(){
  try {
    const raw = localStorage.getItem(STORE);
    if (!raw) return;
    const d = JSON.parse(raw);

    /* Anything that isn't one of the two known tracks — including the absent
       field in payloads written by earlier versions — means "not chosen yet",
       so the reader is asked rather than assumed. */
    nat = (d.nat === "sa" || d.nat === "nonsa") ? d.nat : null;
    timelyOff = d.timelyOff === true;
    installOff = d.installOff === true;
    /* Only an explicit true suppresses the sync question. Anything else —
       missing, corrupt, written by an older version — means "not asked yet",
       so the failure mode is being asked once more rather than silently never
       being offered the thing an account is for. */
    migAsked = d.migAsked === true;
    usedCodes = Array.isArray(d.usedCodes)
      ? d.usedCodes.filter(x => typeof x === "string").slice(0, 200) : [];

    /* The daily question cap. Rebuilt with the same suspicion as everything
       else read back from storage — a hand-edited count is the obvious way to
       walk through it, and a NaN would make askLeft() return NaN and disable
       the button forever, which is a worse failure than a free question. */
    askUsed = { day:"", n:0 };
    if (d.askUsed && typeof d.askUsed === "object"){
      const day = typeof d.askUsed.day === "string" && /^\d{4}-\d{2}-\d{2}$/.test(d.askUsed.day)
        ? d.askUsed.day : "";
      const n = Number(d.askUsed.n);
      if (day) askUsed = { day, n: Number.isFinite(n) ? Math.min(Math.max(0, Math.floor(n)), 999) : 0 };
    }

    /* Entitlement read back from storage is untrusted like everything else
       here. A value survives only if it names a plan that exists in that
       flow's own list, so a hand-edited payload cannot mint a tier the code
       has never heard of. It can still grant itself a real one — that is the
       documented client-side limitation, unchanged by this. */
    owned = { letter:null, case:null, term:null };
    if (d.owned && typeof d.owned === "object"){
      Object.keys(owned).forEach(mode => {
        const id = d.owned[mode];
        if (typeof id === "string" && planIndex(mode, id) >= 0) owned[mode] = id;
      });
    }
    packUntil = (typeof d.packUntil === "number" && isFinite(d.packUntil) && d.packUntil > 0)
      ? Math.min(d.packUntil, Date.now() + PACK_DAYS * 86400000) : 0;

    /* A stored answer set is untrusted like everything else here: it outlives
       versions and can be hand-edited. Rebuild it field by field onto a blank
       shape so a payload missing half its keys cannot reach the money. */
    term = null;
    if (d.term && typeof d.term === "object"){
      const b = blankTerm(), src = d.term;
      const str = k => typeof src[k] === "string" ? src[k].slice(0, 200) : b[k];
      const num = (k, max) => (typeof src[k] === "number" && isFinite(src[k]) && src[k] > 0)
        ? Math.min(src[k], max) : b[k];
      const tri = k => src[k] === true || src[k] === false ? src[k] : null;
      b.how = TERM_HOW.some(x => x.id === src.how) ? src.how : null;
      b.start = str("start"); b.end = str("end"); b.termEnd = str("termEnd");
      b.reason = str("reason");
      b.ctype = (src.ctype === "fixed" || src.ctype === "indef") ? src.ctype : null;
      b.wage = num("wage", 1e7); b.basic = num("basic", 1e7);
      b.noticeDue = num("noticeDue", 365); b.noticeGiven = num("noticeGiven", 365);
      b.unpaidMonths = num("unpaidMonths", 60); b.leaveDays = num("leaveDays", 365);
      b.otherAmt = num("otherAmt", 1e7);
      b.probation = tri("probation"); b.gotSettle = tri("gotSettle"); b.gotEos = tri("gotEos");
      /* exc87 was saved and then dropped on the way back in — every other field
         is rebuilt here and this one was missed when it became a required
         input. A woman who answered "within three months of giving birth" saw
         55,000 SAR, reopened the app, and was shown 36,667 and told she had
         never answered. Reload, PWA relaunch and tab eviction all reach it.
         Whitelisted rather than string-copied: an unrecognised value would read
         as answered and restore the false confidence this input exists to end. */
      b.exc87 = ["none","force","marriage","birth"].indexOf(src.exc87) >= 0 ? src.exc87 : null;
      b.docs = Array.isArray(src.docs)
        ? src.docs.filter(x => TERM_DOCS.indexOf(x) !== -1).slice(0, TERM_DOCS.length) : [];
      if (b.how) term = b;
    }

    myContracts = (Array.isArray(d.contracts) ? d.contracts : [])
      .filter(c => c && typeof c === "object"
                && Object.prototype.hasOwnProperty.call(T, c.doc)
                && Number.isFinite(+c.score) && Number.isFinite(+c.at))
      .map(c => ({ doc:c.doc, score:Math.max(0, Math.min(100, +c.score)),
                   at:+c.at, signed:!!c.signed }))
      .slice(0, 8);

    const tracked = (Array.isArray(d.tracked) ? d.tracked : [])
      .filter(x => x && typeof x === "object"
                && Object.prototype.hasOwnProperty.call(T, x.doc)
                && Array.isArray(x.events))
      /* Events are rebuilt field by field like every other stored value, rather
         than spread wholesale. They were the one exception, and it showed in
         two ways: HTML written into e.t/e.n rendered as live markup through
         renderTimeline's innerHTML, and an event missing those fields threw and
         blanked the reminder screen with no way back. Note that
         reminderEvents() already defends the same array — `(e.t && e.t[lang])`
         — so the two readers of it disagreed about whether it could be
         trusted. Now neither has to. */
      .map(x => ({ doc:x.doc, events:x.events
        .filter(e => e && typeof e === "object")
        .map(e => {
          const str = v => typeof v === "string" ? v.slice(0, 200) : "";
          const pair = o => (o && typeof o === "object")
            ? { ar: str(o.ar), en: str(o.en) } : { ar:"", en:"" };
          return { when: (typeof e.when === "number" && isFinite(e.when)) ? e.when : 0,
                   d: (typeof e.d === "number" && isFinite(e.d)) ? e.d : 0,
                   k: str(e.k), t: pair(e.t), n: pair(e.n) };
        })
        .slice(0, 40) }));
    TRACKED.length = 0;
    tracked.forEach(x => TRACKED.push(x));
  } catch(e){
    /* Corrupt or foreign payload: start clean rather than render partial state. */
    myContracts = []; TRACKED.length = 0; nat = null; timelyOff = false; installOff = false; usedCodes = [];
  }
}
function recordContract(){
  if (!current) return;
  myContracts.unshift({ doc:current.doc, score:current.score, at:Date.now(), signed:signedMode });
  myContracts = myContracts.slice(0,8);
  saveState();
}

/* ------------------------------------------------- calendar export
   Apple Calendar, Outlook and the stock Android calendar all import RFC 5545
   .ics files, so one generated file covers them without asking for calendar
   permission, an entitlement, or a backend. Google Calendar has no bulk
   import URL: a single event opens its prefilled template, several fall back
   to the same .ics, which Google imports from settings.

   Because we never request calendar access there is no permission to be
   denied. What can fail is the download itself, so both paths report back
   and the UI says so rather than appearing to do nothing. */

/* RFC 5545 §3.3.11 */
function icsEsc(s){
  return String(s == null ? "" : s)
    .replace(/\\/g, "\\\\").replace(/;/g, "\\;")
    .replace(/,/g, "\\,").replace(/\r?\n/g, "\\n");
}
function icsPad(n){ return n < 10 ? "0" + n : String(n); }
function icsUTC(d){
  return d.getUTCFullYear() + icsPad(d.getUTCMonth()+1) + icsPad(d.getUTCDate()) +
    "T" + icsPad(d.getUTCHours()) + icsPad(d.getUTCMinutes()) + icsPad(d.getUTCSeconds()) + "Z";
}
function icsDay(d){ return d.getFullYear() + icsPad(d.getMonth()+1) + icsPad(d.getDate()); }

/* §3.1 limits a line to 75 octets. Arabic is multi-byte, so fold on encoded
   length and never split a surrogate pair. */
function icsFold(line){
  let out = "", cur = "", len = 0;
  for (let i = 0; i < line.length; i++){
    let ch = line[i];
    if (ch >= "\uD800" && ch <= "\uDBFF" && i + 1 < line.length) ch += line[++i];
    const w = unescape(encodeURIComponent(ch)).length;
    if (len + w > 74){ out += cur + "\r\n "; cur = ""; len = 1; }
    cur += ch; len += w;
  }
  return out + cur;
}

/* The reminders, as calendar events. All-day, because these are dates the
   user acts on, not appointments. */
function reminderEvents(){
  return TRACKED.flatMap(c => c.events.map(e => ({
    start: e.when,
    title: (e.t && e.t[lang]) || t(c.doc),
    description: ((e.n && e.n[lang]) || "") + "\n\n" + t(c.doc) + " — Wodouh"
  }))).filter(e => Number.isFinite(+e.start)).sort((a,b) => a.start - b.start);
}

function buildICS(events){
  let lines = ["BEGIN:VCALENDAR","VERSION:2.0",
    "PRODID:-//Wodouh//Contract reminders//EN","CALSCALE:GREGORIAN","METHOD:PUBLISH",
    "X-WR-CALNAME:" + icsEsc(t("tl_title"))];
  let n = 0;
  events.forEach((ev, i) => {
    const start = new Date(ev.start);
    if (isNaN(start.getTime())) return;
    lines = lines.concat([
      "BEGIN:VEVENT",
      "UID:wodouh-" + i + "-" + Math.random().toString(36).slice(2,10) + "@wodouh.app",
      "DTSTAMP:" + icsUTC(new Date()),
      "DTSTART;VALUE=DATE:" + icsDay(start),
      "DTEND;VALUE=DATE:" + icsDay(new Date(start.getTime() + 86400000)),
      "SUMMARY:" + icsEsc(ev.title),
      "DESCRIPTION:" + icsEsc(ev.description),
      /* Matches the two-weeks-and-one-day promise in tl_note. */
      "BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:" + icsEsc(ev.title),
      "TRIGGER:-P14D","END:VALARM",
      "BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:" + icsEsc(ev.title),
      "TRIGGER:-P1D","END:VALARM",
      "END:VEVENT"
    ]);
    n++;
  });
  lines.push("END:VCALENDAR");
  return n ? lines.map(icsFold).join("\r\n") + "\r\n" : null;
}

function downloadICS(events){
  const ics = buildICS(events);
  if (!ics) return false;
  try {
    const url = URL.createObjectURL(new Blob([ics], { type:"text/calendar;charset=utf-8" }));
    const a = document.createElement("a");
    a.href = url; a.download = "wodouh-reminders.ics"; a.rel = "noopener";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 30000);
    return true;
  } catch(e){ return false; }
}

function googleCalUrl(ev){
  const start = new Date(ev.start);
  if (isNaN(start.getTime())) return null;
  return "https://calendar.google.com/calendar/render?action=TEMPLATE" +
    "&text=" + encodeURIComponent(ev.title) +
    "&dates=" + icsDay(start) + "/" + icsDay(new Date(start.getTime() + 86400000)) +
    "&details=" + encodeURIComponent(ev.description);
}

function exportReminders(target){

/* -------------------------------------------------- letter builder ----
   Wodouh's signature: the negotiation letter is assembled while you read,
   not generated after the fact. Each negotiable clause can be added as you
   go, and the letter contains exactly what you chose — in contract order. */
let letterSet = new Set();
/* Already-signed mode keeps the same analysis but changes the question from
   "should I sign this?" to "what can I still do about it?" */
let signedMode = false;

/* Which body of rules applies to this reader. "sa" | "nonsa" | null.
   Deliberately has no default: under Article 37 a non-Saudi's contract is
   always fixed-term, which changes the notice rules and the Article 77
   compensation formula outright. Guessing would mean quietly showing someone
   the wrong law, which is the defect this exists to fix. */
let nat = null;
function isNonSaudi(){ return nat === "nonsa"; }

/* NATIONALITY IS NOT CONTRACT TYPE, AND TREATING IT AS ONE MOVED MONEY.
 *
 * compEstimate() used to read `isNonSaudi() ? "fixed" : "indef"`. Half of that
 * is sound: Article 37 requires a non-Saudi's contract to be fixed-term, so
 * inferring it there saves a question and cannot be wrong. The other half is
 * simply false — a Saudi may hold either kind — and it sent every Saudi whose
 * FIXED-TERM contract was ended early down the indefinite branch of Article 77,
 * which pays 15 days per year of service instead of the wage for the remaining
 * term. Those are different numbers, and for a long remaining term the wrong
 * one is much smaller.
 *
 * The app already conceded the point and then ignored it: "انتهاء مدة العقد"
 * is offered to Saudis as a way the job ended, which only a fixed-term contract
 * can do. So it accepted that a Saudi can hold one, and still refused to ask.
 *
 * Now it asks. Unset is a real state and is treated as unknown rather than
 * guessed — compFor() already returns the two-month floor and says so when the
 * remaining term is unknown, which is the honest answer while the question is
 * unanswered. */
let eosCtype = null;

function contractIsFixed(){
  if (isNonSaudi()) return true;          /* Article 37 */
  return eosCtype === "fixed";
}

/* Only a Saudi is asked: for a non-Saudi the answer is settled by law, and a
   question with one possible answer is friction, not rigour. */
function eosNeedsCtype(){ return !isNonSaudi() && eosHow === "term"; }

   wage. An invented number here would be worse than no number at all. */
